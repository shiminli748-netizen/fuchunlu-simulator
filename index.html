\n省里客人第二天走时握着你的手说，你们这边风气正。这话被传到市里，成了一条隐形的评语。\n你失去了一次\"拉近关系\"的机会，却在半年后的干部考察里，被写进了一句\"生活作风严谨\"。\n","effects":{"money":-20,"risk":-4,"merit":3,"boss":4,"net":0,"stress":6,"clean":5},"flag":"honest_path"}]},{"id":"gn_013","title":"空降的那个人","text":"\n单位要来一位副职，消息传了半个月，最后落地的是省里下来的邵勋，三十九岁，据说是某位领导的前秘书。\n你手上三个项目正推到关键处，原本这个位置十有八九是你的。组织部长找你谈话，说你还年轻，机会多的是，要正确对待。\n邵勋到任第一天，把你在推的两个项目全部叫停\"重新论证\"，只留了一个最不起眼的。他说话客气，笑容标准，办公桌上的杯子是自带的。\n底下人开始观望。以前天天给你送材料的两个科长，这一周忽然都很忙。\n","city":"通用","min_rank":3,"max_rank":7,"weight":4,"once":true,"need":{},"tags":["人事","上级"],"options":[{"label":"配合，把项目做成他的","text":"\n你把三个项目的全部资料整理成册交给邵勋，说您是行家，请您把关，我在后面配合。他抬头看了你一眼，眼里多了点东西。\n半年后那两个被叫停的项目重新上马，署名顺序里你排第二。有人替你不值，你说项目落地比名字重要。\n邵勋走的时候推荐了你。官场里最稳的梯子，往往是别人踩过你之后递下来的那只手。\n","effects":{"money":0,"risk":-1,"merit":6,"boss":6,"net":3,"stress":8,"clean":2}},{"label":"消极配合，暗中使绊","text":"\n你没明着对抗，只是\"按程序办\"——每个环节都卡满法定时限，每份材料都要求补正三次。邵勋推不动，会上被点了两次名。\n他很快查出了门道，也查出了你在三个项目里的几个\"老关系\"。这些材料被整理成一份说明，送到了纪检组。\n你赢了两个月的痛快，输掉了一年的清白账。\n","effects":{"money":0,"risk":16,"merit":-6,"boss":-8,"net":-4,"stress":14,"clean":-6,"probe":12}},{"label":"找老领导去省里活动","text":"\n你连夜去了省城，找到当年提携你的老领导。老领导泡了壶茶，说了一句：位置是死的，人是活的，你把手上的活干漂亮，比什么都强。\n他没帮你说话，但替你介绍认识了省里管项目的两个处长。半年后，你的项目成了全省典型，邵勋的\"重新论证\"反倒显得多余。\n你没争到那个位子，但全市都知道项目是谁干出来的。\n","effects":{"money":-20,"risk":2,"merit":9,"pop":4,"boss":3,"net":6,"stress":7,"clean":1}},{"label":"直接申请平调","text":"\n你递了份申请，说想去任务更重的口子锻炼。三个月后你调去了信访任务最重的老城区，天天坐在接访室里听人哭。\n离开那天，邵勋破例送到楼下，说了句\"佩服\"。\n老城那两年你瘦了十四斤，但也攒下了全市最扎实的一批基层口碑。而这些口碑，在你后来最关键的一次考察里，救了你。\n","effects":{"money":0,"risk":0,"merit":5,"pop":10,"net":2,"boss":-2,"health":-3,"stress":12,"clean":4},"flag":"grassroots"}]},{"id":"gn_014","title":"民主推荐会","text":"\n会议室里坐着三十七个有推荐资格的人，每人一张表，两个名字。这是决定一个正处岗位的关键一步。\n你排在候选名单第二位，第一位是办公室的栾大军，资历比你老两年，跟分管副市长打球打了六年。\n会前，有人在洗手间塞给你一张纸条，上面写着\"推荐栾大军，后面有安排\"，落款没有名字。也有人发来消息，问你\"要不要一起坐坐聊聊\"。\n你握着笔，看着前面那个人的后脑勺。三十七张表，每张只有两个空格，而这间屋子里有三十七种算计。\n","city":"通用","min_rank":3,"max_rank":6,"weight":3,"once":true,"need":{},"tags":["人事","同僚"],"options":[{"label":"只写自己，不拉票","text":"\n你在第一格写下自己的名字，第二格空着，交了表。唱票结果：栾大军十九票，你十一票。\n会后有人说你\"不会做人\"，也有人在走廊里对你点头。三个月后，另一个岗位空缺，组织部门点名要\"敢讲真话、不搞小动作\"的干部。\n那一票你输了，但这个评语赢了很多年。\n","effects":{"money":0,"risk":-2,"merit":2,"net":-2,"boss":2,"stress":6,"clean":4}},{"label":"逐个打电话拉票","text":"\n会前三天，你见了二十一个人，喝了十四场茶，许了七个\"以后再说\"。票数出来，你二十二票，栾大军十八票。\n你赢了。上任第一个月，那七个\"以后再说\"里有三个上门来兑现，还带着各自的亲戚。\n每一次拉票都是一张欠条，只是你当时没看清还款日期。\n","effects":{"money":0,"risk":12,"merit":4,"net":7,"boss":-2,"stress":14,"clean":-9,"probe":4}},{"label":"投给栾大军，换个人情","text":"\n你把票投给了栾大军，还当着几个人的面说\"老栾该上了\"。栾大军上任第一件事，是把一个副处职数留给了你的心腹。\n你用一个名分换了一个实缺，账面上看很划算。\n只是从此以后，全市都知道你\"让过一次\"，于是下一次、再下一次，大家都等着你让。\n","effects":{"money":0,"risk":3,"merit":3,"net":8,"boss":3,"stress":7,"clean":-2}}]},{"id":"gn_015","title":"老领导的一个电话","text":"\n晚上九点，座机响了。是退居二线六年的老领导寇长河。寒暄了七分钟天气、血压和孙子的成绩，第八分钟他终于切入正题：农机公司的劳一鸣，是他老伴的远房侄女婿，公司有个补贴资格卡在你们处里。\n寇长河没说让办，只说老劳这人实在，就是不会走程序，你有空帮着看看材料缺什么。\n你放下电话，翻出那份材料：缺的不只是程序，还有三年的完税证明和一份检测报告，都是补不上的那种。\n第二天上午，劳一鸣本人出现在你办公室门口，手里拎着两盒茶，笑得局促又笃定，像是已经知道结果了。\n","city":"通用","min_rank":2,"max_rank":6,"weight":4,"once":true,"need":{},"tags":["人事","上级","农业"],"options":[{"label":"当面说清缺什么","text":"\n你把老领导请到办公室，摊开材料，一条一条讲缺在哪、为什么补不上，还帮他问了另一条更合适的政策路径。寇长河听完沉默一会儿，说了句应该的。\n劳一鸣后来走正规渠道重新申报，拿到了一个小额补贴。老领导过年时寄了张贺卡，只有八个字：公私分明，后生可畏。\n那张贺卡你一直压在办公桌玻璃板下面。\n","effects":{"money":0,"risk":-2,"merit":3,"net":3,"boss":3,"stress":4,"clean":4},"flag":"honest_path"},{"label":"看老领导面子想办法","text":"\n你让经办科长灵活处理：把检测报告用同行业的替代，完税证明按承诺补交处理。两百万补贴顺利下达。\n劳一鸣送来四十万，说是给老领导的心意，让你转交。你转交了二十万，自己留了二十万。\n寇长河后来问过一句：这事合规吗？你说合规。他没再问，你也再没提。师徒之间那点东西，从这天起就掺了假。\n","effects":{"money":200,"risk":15,"net":5,"boss":5,"stress":10,"clean":-15,"probe":7}},{"label":"拖着，等政策生变","text":"\n你收下材料，说研究研究，然后一压就是四个月。寇长河又打来一次电话，你说还在走流程。\n第五个月，农机补贴政策调整，那个资格自动作废了。劳一鸣骂了句脏话，从此不来往。\n老领导那边，你送了两盒好茶去拜年，绝口不提公事。人情上留了个疤，账上却干干净净。\n","effects":{"money":-5,"risk":-1,"net":-2,"boss":-1,"stress":5,"clean":1}}]},{"id":"gn_016","title":"材料被人改了","text":"\n明天上午的常务会要审议你们处报的《老城更新三年行动方案》。你熬了三个通宵，稿子改到第十一版，昨晚十一点亲手交给办公室统一印制。\n今早八点拿到会本，你随手一翻，第三页的拆迁补偿标准从「按评估价上浮百分之十五」变成了「按评估价上浮百分之四十」，第四页还多了一句「授权项目指挥部一事一议」。\n这两处都不是你写的。而会本已经发给所有参会领导了。\n办公室副主任姜松端着杯子路过你桌边，笑说昨晚加班辛苦。他去年竞争副处输给你，之后一直很客气，客气得过分。\n","city":"通用","min_rank":3,"max_rank":7,"weight":3,"once":true,"need":{},"tags":["人事","同僚","城建"],"options":[{"label":"会前举手更正","text":"\n开会前你找到秘书长，说会本有两处与报批稿不符，请更正，并当场拿出你留底的第十一版。秘书长脸色不太好，让人重新印。\n会上有人问起这两处，你如实说：不是我报的。姜松在角落里咳了一声。\n你当众揭了一次短，从此机关里没人再敢动你的稿子，也没人愿意跟你搭班子。\n","effects":{"money":0,"risk":-3,"merit":4,"net":-4,"boss":4,"stress":8,"clean":5}},{"label":"顺水推舟，就这么报","text":"\n你什么也没说。会上方案顺利通过，两条优惠条款全票通过，会后有五个开发商同时给你打电话。\n三个月后，老城第一批拆迁按上浮百分之四十执行，多支出财政补偿一亿两千万。审计组进场时，第一个被谈话的是你，因为字是你签的。\n你没改那两个字，那两个字改了你。\n","effects":{"money":800,"risk":20,"merit":6,"boss":2,"stress":14,"clean":-18,"probe":11}},{"label":"暗中查清谁动的手","text":"\n你调了文印室的门禁记录和电脑操作日志，锁定是姜松。你没声张，只把这份记录复印了两份，一份锁进抽屉，一份不小心落在他的办公桌上。\n从此姜松见你便笑，笑得很标准。半年后他主动申请调去了档案口。\n你手里多了个把柄，也多了个知道你会用把柄的人。\n","effects":{"money":0,"risk":4,"net":3,"stress":6,"clean":-3}}]},{"id":"gn_017","title":"一封匿名信","text":"\n写字台抽屉里多了一封信，没有落款，是从门缝塞进来的。信上列了六条：栾大军在城东有长期包间、他妻弟的公司拿过三个市政标段、他去年在省城买了一套三百平的房子，还附了一张模糊的照片。\n最后一行写着：材料还可以再补充，看您需要。\n下周就是正职人选的关键节点，你和栾大军各占一半。写这封信的人，可能是他那边的人，也可能是你这边等不及的人。\n抽屉里的信纸很轻，压在手上却有点沉。窗外有人在院子里喊着要开会了。\n","city":"通用","min_rank":3,"max_rank":7,"weight":3,"once":true,"need":{},"tags":["人事","同僚","审计"],"options":[{"label":"把信交给纪检组","text":"\n你把信原封不动交到机关纪检组，说明来源，不添一句自己的话。纪检组按规定登记核查，两个月后查实其中两条，栾大军被调离并立案。\n你没得到那个位置——组织认为时机敏感，另派了人。但你在纪检组那里留下了有问题走组织的印象。\n几年后你自己被核查时，这份印象替你挡下了第一波猜疑。\n","effects":{"money":0,"risk":-3,"merit":3,"net":-5,"boss":2,"stress":7,"clean":5,"probe":-2}},{"label":"匿名转寄出去","text":"\n你把信复印了三份，分别寄给纪检、信访和省里一家报社，信封戴着手套装，寄件地址写了外市。\n风暴比预想的大。栾大军倒了，可办案人员在追查信源时，顺藤摸出了你办公室那台打印机的编号。\n你赢了对手，也把自己送上了被怀疑的名单。写匿名信的人从来不署名，可纸张会说话。\n","effects":{"money":0,"risk":18,"net":-3,"boss":1,"stress":15,"clean":-10,"probe":12}},{"label":"烧掉，当没见过","text":"\n你在洗手间把信撕碎冲走，洗手时盯着镜子看了很久。第二天你照常和栾大军在食堂同桌吃饭，还给他递了瓣蒜。\n三个月后栾大军上任，第一件事就是把你的处室从主楼调到东配楼。\n你什么都没做，所以什么都没得到，也什么都没失去。只是从此以后，你每次开会都下意识看一眼桌上的纸杯。\n","effects":{"money":0,"risk":2,"net":0,"stress":6,"clean":0}},{"label":"拿信去跟他摊牌","text":"\n你把信摊在他面前，说这东西本来该寄到纪检组。栾大军看了很久，问你想要什么。你说我什么都不想要，我只要这个位置。\n他退出竞争，你顺利上位。一年后他因另案被查，交代了这封信的事，办案人员随即找你谈话：这算不算敲诈？\n那张信纸你烧了，可它烧不掉对方脑子里的那一页。\n","effects":{"money":0,"risk":22,"merit":4,"net":5,"boss":-4,"stress":18,"clean":-16,"probe":14}}]},{"id":"gn_018","title":"两个人的午宴","text":"\n同一天，两位副书记分别约你吃饭。上午的靳书记管人事，下午的费书记管财政，两人面和心不和，全市都知道。\n靳书记在机关食堂的小包间，一碗面吃到一半，忽然说：你那个处长的任命，我这关早就过了，就是有人觉得你还需要历练。\n费书记约在城郊的鱼庄，四个人一桌，另外两个是他的人。他给你夹了条鱼腹，说年轻人要懂钱从哪来，也要懂钱到哪去。\n两顿饭之间隔着四个小时。你可以用这四个小时想清楚：这局棋站哪边，或者装作没看懂。\n","city":"通用","min_rank":4,"max_rank":8,"weight":3,"once":true,"need":{},"tags":["人事","上级","换届"],"options":[{"label":"只干好分内事","text":"\n两顿饭你都去了，两顿饭你都只谈工作：靳书记那儿汇报三个项目进度，费书记那儿讲财政缺口和解决办法。谁的人情你都没接。\n半年后靳书记调走，费书记接任。你既没有被清算，也没有被提拔。\n新书记在会上说，这个人我观察很久了，不站队，也不掉链子。第二年，你被提到了一个谁都想要的实职上。\n","effects":{"money":0,"risk":0,"merit":7,"boss":5,"net":1,"stress":7,"clean":3}},{"label":"站靳书记","text":"\n你在几个关键场合替靳书记说了话，还替他挡了一次难堪。三个月后任命下来，你成了处长。\n半年后靳书记调走，费书记接任，第一件事是重新分工，你被分到最偏的口子，管档案和地方志。\n你在档案室待了两年，把全市三十年的旧账翻了个遍，也把自己翻进了抑郁。\n","effects":{"money":0,"risk":6,"merit":-4,"net":4,"boss":-6,"health":-5,"stress":16,"clean":0},"flag":"has_faction"},{"label":"两边都表态","text":"\n你对靳书记说费书记那边我去探探口风，对费书记说靳书记的意思我帮你转达。两边都当你自己人，两边也都留了个心眼。\n风声传到第三个人的耳朵里，只用了十九天。此后两位书记在你面前都笑，但再没跟你谈过一句真话。\n官场里最危险的位置不是站在哪一边，是站在中间还想两边都拿。\n","effects":{"money":0,"risk":10,"net":2,"boss":-5,"stress":13,"clean":-5}},{"label":"站费书记，交投名状","text":"\n你连夜整理了一份靳书记分口内三处违规的材料，第二天送进费书记办公室。三个月后你升了，靳书记那三处被查，牵出十一个人。\n费书记拍着你肩膀说年轻人有魄力。你在全市成了新贵，也成了没人敢深交的人。\n五年后费书记落马，交代材料里有一行：某某曾向我提供他人问题线索。你的名字，又一次出现在别人的卷宗里。\n","effects":{"money":300,"risk":24,"merit":5,"net":8,"boss":9,"stress":16,"clean":-20,"probe":13},"flag":"has_faction"}]},{"id":"gn_019","title":"轮岗通知","text":"\n周五下午四点，组织部的电话来了：下周一到市地方志办公室报到，级别不变，职务为副主任。\n地方志办在城南一栋灰楼的四层，全单位十一人，平均年龄五十一岁，今年的主要任务是修一部八十万字的市志。\n你手上正在推的四个项目全部移交，交接清单上你签了十四次名。办公室的人帮你搬东西时都不敢看你。\n妻子在电话里沉默了很久，问了一句：是不是得罪谁了？你想起了上个月在会上顶过分管副市长的一句话，那句话你说得并不响。\n","city":"通用","min_rank":3,"max_rank":7,"weight":3,"once":true,"need":{},"tags":["人事","上级"],"options":[{"label":"把地方志修成精品","text":"\n你去了，认了。三年里你带着十一个人跑遍全市九个区县，翻了三千多卷档案，出了一部被省里评为优秀的地方志。\n书出版那天，你在后记里写了一句话：有些年份是被删掉的，但纸会记住。\n三年后机构改革，新设的文旅口需要懂历史的人，你被点名调回，而且提了一级。冷板凳上坐得住的人不多。\n","effects":{"money":0,"risk":-2,"merit":8,"pop":5,"boss":4,"net":2,"health":-3,"stress":10,"clean":4},"flag":"grassroots"},{"label":"四处活动，想办法调回","text":"\n你跑了七趟省城，找了三个老领导，送出去六十万，请了十几场饭。第八个月，你调回了原系统，但去了二级单位当副职。\n钱花了，级别没降，面子却薄了。同事见你客气，客气里带着怜悯。\n更麻烦的是，那六十万的来源，有两个人知道。\n","effects":{"money":-600,"risk":14,"net":4,"boss":2,"stress":15,"family":-5,"clean":-12,"probe":8}},{"label":"借机躺平，另谋出路","text":"\n你每天准时上下班，修志之余开始给企业做顾问，一年下来有八十万咨询费。你在地方志办待了四年，成了全市最有空的处级干部。\n第五年，你下海去了当年帮过的一家上市公司，年薪两百万。你走得很体面，告别宴上来了二十个人。\n只是那四年里养成的习惯——每天下午三点喝一杯——跟了你很久。\n","effects":{"money":800,"risk":10,"merit":-6,"net":5,"health":-6,"stress":-8,"family":3,"clean":-8,"probe":4}}]},{"id":"gn_020","title":"会议室的第七排","text":"\n你发现自己被挪到了会议室第七排。这个变化发生得很安静：座位牌没换，只是你的名字被排在所有副职之后，紧挨着记录员。\n更明显的是其他信号——上个月的三个文件没再会签给你，你分管的科室被划走两个，办公室主任送文件时开始先敲门再等三秒。\n昨天在电梯里遇见分管副市长，他愣了一下，说：哦，你也在这栋楼。\n办公桌上那盆绿萝是三年前上任时买的，现在藤蔓已经爬满了整个书架，爬过了你的名字牌。\n","city":"通用","min_rank":4,"max_rank":8,"weight":3,"once":true,"need":{},"tags":["人事","上级"],"options":[{"label":"沉住气，把手头的活干透","text":"\n你没抱怨，反倒把剩下那个最不被看重的科室干出了名堂：全市第一个把审批时限从二十天压到五天，还上了省里的简报。\n半年后省委调研组来，问起这个改革是谁做的。分管副市长张了张嘴，说了你的名字。\n边缘化最狠的地方在于没人看见你；破解它的办法只有一个——做一件他们必须看见的事。\n","effects":{"money":0,"risk":0,"merit":9,"pop":6,"boss":6,"net":1,"stress":9,"clean":3}},{"label":"主动找领导谈心","text":"\n你约了分管副市长，谈了四十分钟，态度诚恳，只问一个问题：我哪里做得不好，您指出来。\n副市长说了句实话：不是你做得不好，是上面有人不放心。这话很轻，却是一记闷棍。\n你出来时腿有点软。此后你更加谨慎，也更加沉默。三年后那位不放心的人调走了，你才慢慢浮上来。\n","effects":{"money":0,"risk":-1,"net":3,"boss":4,"stress":11,"clean":1}},{"label":"破罐破摔，混日子","text":"\n你开始迟到早退，会议能推就推，材料能拖就拖。有人背后说你废了，你也懒得辩解。\n那两年你胖了十八斤，血压上去了，朋友少了。唯一的好消息是，因为你手上没权，这两年没人找你办事，也就没人给你送钱。\n后来清算的时候，你发现自己这两年居然是本系统唯一一个干净的。\n","effects":{"money":0,"risk":-6,"merit":-8,"boss":-8,"net":-3,"health":-8,"stress":12,"clean":2}},{"label":"借冷板凳做私活","text":"\n你利用剩下的那点审批权，替三家企业在冷门口子上开了绿灯，收了四百万。没人注意一个被边缘化的人，这恰恰是最安全的时候。\n两年半后，其中一家企业因涉黑被查，供出了每一个人，包括那个已经没什么权的你。\n办案人员看到金额时都很意外：一个坐第七排的人，居然收了这么多。\n","effects":{"money":4000,"risk":26,"stress":12,"clean":-22,"probe":16}}]},{"id":"gn_021","title":"考察组的第二个问题","text":"\n考察组在会议室里坐成一排，五个陌生人，面前摆着你的述职报告和一本打开的笔记本。\n第一个问题很常规：谈一谈你分管领域最大的短板。你答了十二分钟。\n第二个问题让屋里安静下来：有反映称，你在老城改造项目中与某家企业关系密切，请说明情况。\n你说到一半，考察组里年纪最大的那位抬手打断：不用复述过程，只回答——有没有。\n窗外的空调外机在响，你的手心出了汗。说没有，就要承担被查证后的全部后果；说有，就没有然后了。\n","city":"通用","min_rank":4,"max_rank":9,"weight":3,"once":true,"need":{"min_risk":15},"tags":["人事","审计","工程"],"options":[{"label":"有交往，但无输送","text":"\n你说：有过交往，也吃过饭，但没有利益输送；如果有，我愿意接受组织核查。十二个字，你说得很慢。\n考察组记了下来，随后调取三年的账目。结论是：未发现违纪问题，但存在交往不规范。\n提任推迟了八个月。那八个月里你把该退的礼全退了，还写了三千字的情况说明。八个月后任命下来了，纸面上干干净净。\n","effects":{"money":-100,"risk":-8,"merit":4,"boss":3,"net":-2,"stress":14,"clean":6,"probe":-5},"flag":"honest_path"},{"label":"一口否认","text":"\n你说：没有，可以查。声音很稳，稳得连你自己都佩服。\n考察组查了，暂时没查出什么，你顺利提任。\n两年后那家企业出事，老板在笔录里提到了你的名字和一间茶室。办案人员调出当年那份考察谈话记录，第一页就是你那句没有、可以查。\n否认不会让事情消失，只会让它换一天、换个更狠的方式出现。\n","effects":{"money":0,"risk":16,"merit":3,"boss":5,"stress":12,"clean":-14,"probe":12}},{"label":"承认一部分","text":"\n你说：确实收过一些土特产，价值不高，我已经退回。这个一些和不高，是你反复权衡后的数字。\n考察组按你给的数字核查，对上了，也就不深究了。你提了任，心里那笔没说的账，依旧锁在柜子里。\n你以为自己算得很准。你不知道的是，那家企业记的是另一本账，两本账迟早要碰头。\n","effects":{"money":-50,"risk":6,"merit":4,"boss":4,"stress":13,"clean":-10,"probe":5}}]},{"id":"gn_022","title":"破格的那个人","text":"\n你手下的科长岑禾，三十四岁，博士，写的材料你从来不改一个标点。老城更新最难缠的那一片，是他一户一户谈下来的，谈了四百二十户。\n组织部的意思是按部就班，先解决副处。可你手里的副处职数只剩一个，有资格的人有七个，其中两个是市里领导的亲戚。\n岑禾不知道这些，他只是把下周的攻坚方案放在你桌上，然后问了一句：主任，我还能干多久？\n他眼里的那种光你很熟——那是二十年前的你。桌上还压着一份举报信，说岑禾去年在农村老家盖了三层楼，钱的来源不明。\n","city":"通用","min_rank":4,"max_rank":8,"weight":3,"once":true,"need":{},"tags":["人事","城建"],"options":[{"label":"顶着压力推他","text":"\n你把那封举报信转给纪检组核查，同时把副处职数报给了岑禾。核查结果：那栋楼是他岳父的积蓄加银行贷款，没问题。\n七个有资格的人里，有三个从此不再跟你说话。市里的一位领导在会上说你用人唯亲。\n两年后岑禾成了全省最年轻的处级干部，也成了你此后十年里最锋利的一把刀——他从不替你送钱，但从不让你背锅。\n","effects":{"money":0,"risk":2,"merit":8,"pop":5,"net":2,"boss":-3,"stress":9,"clean":4},"flag":"has_talent"},{"label":"给领导亲戚，安慰岑禾","text":"\n你把职数给了市里那位领导的外甥，然后找岑禾谈了一个小时，许他明年一定解决，还额外给了他一个全省先进。\n岑禾点点头，说了声谢谢主任。第二年上半年，他调去了省城一家设计院。\n你后来再没写出过像样的材料，也没再遇到一个能在四百二十户门口站住的人。\n","effects":{"money":0,"risk":5,"merit":-2,"net":6,"boss":7,"stress":8,"clean":-3}},{"label":"让他自己懂","text":"\n你暗示他：职数只有一个，想进的人很多，你自己心里要有数。半个月后，岑禾的妻子送来一张卡，三十万，说是孝敬您多年的栽培。\n你把职数给了他。他上任那天喝了很多酒，散场后一个人坐在马路牙子上哭。\n十年后他落马，交代材料里第一笔就是这三十万。而那笔钱的来源，是他找包工头借的。\n","effects":{"money":300,"risk":18,"merit":2,"net":4,"stress":11,"clean":-18,"probe":10}}]},{"id":"gn_023","title":"明码标价的位置","text":"\n做矿石生意的老板贺崇山约你喝茶，茶室在城北一座旧厂房改的院子里，四下无人。\n他很直接：市里那个副主任的位置，前任进去之前也是这个位置，我打听过，行情是一百五十万。我出两百万，您帮我递句话。\n他说这话时手里的杯子稳得很，像是在报一个水泥标号。\n你算了算：两百万，相当于你十六年的工资。而贺崇山的矿，去年在环保督察中被点名两次，还压着一起瞒报的工伤事故。\n他补充说：钱不用您出面，我也不留记录，事成之后还有感谢。\n","city":"通用","min_rank":4,"max_rank":8,"weight":3,"once":true,"need":{"min_risk":10},"tags":["人事","矿","黑恶"],"options":[{"label":"当场翻脸走人","text":"\n你把杯子顿在桌上，说贺老板，你这是害我。起身就走，出了院子才发现手在抖。\n三个月后，贺崇山的矿因瞒报事故被查封，牵出他行贿买官的线索，涉及本市五名干部，办案人员还专门找你核实了那天茶室里的对话。\n他们问：你为什么没答应？你说：怕。这个字救了你。\n","effects":{"money":0,"risk":-6,"merit":4,"pop":4,"net":-3,"boss":3,"stress":10,"clean":7,"probe":-3},"flag":"honest_path"},{"label":"收钱，递话","text":"\n你收了两百万，在你分管的会议上顺便提了一句：贺崇山的矿整改得很到位。这句话在会上活了不到两分钟，但在会议纪要里活了很多年。\n半年后贺崇山没得到那个位置——钱不够，别人出得更多。他恼了，逢人便说某某收了我的钱不办事。\n买官的人从不觉得自己在行贿，他觉得自己在购物，没买到就投诉。\n","effects":{"money":2000,"risk":28,"net":3,"boss":-2,"stress":18,"clean":-24,"probe":18}},{"label":"不收钱，给他指条明路","text":"\n你把钱推回去，说这个位置你找错人了，但我可以告诉你正规渠道：你的矿要是真整改到位，就公开申请验收，我按程序办，办成了我替你说话。\n贺崇山半信半疑地走了，真去整改了，投了一千二百万做尾矿库加固。\n验收通过那天他来道谢，你没收一分钱。三年后他的矿成了全省示范，你的政绩簿上又添了一笔，这一笔不用藏。\n","effects":{"money":0,"risk":-3,"merit":8,"pop":6,"net":4,"boss":4,"stress":5,"clean":5}},{"label":"收钱，但不办事","text":"\n你收了两百万，什么也没做，只回了他一句在研究。你打算等风头过了再说。\n风头没过。四个月后，买官卖官的线索从另一条线炸开，贺崇山被控制，第一份笔录里就有你的名字和那间茶室。\n办案人员问你为什么不办事。你说还没来得及。他们说：钱已经收了，这就够了。\n","effects":{"money":2000,"risk":30,"stress":20,"clean":-25,"probe":20},"flag":"took_bribe_noact"}]},{"id":"gn_024","title":"十二分钟的演讲","text":"\n竞争性选拔的演讲台上，你只有十二分钟。台下坐着九个评委、两百名干部，还有一台正在直播的摄像机，画面会同步到全市机关内网。\n你的稿子写了四千二百字，是办公室集体打磨了九遍的：三年成绩、五个数据、四个排比句，结尾落在以实干回报组织。\n候场时，前面一位选手念到一半忘词，站在台上笑了笑说不好意思，台下反而鼓了掌。\n你忽然意识到，这台摄像机录下的不只是你的声音，还有你脸上的每一个迟疑。而你的稿子里，有五个数字经不起追问。\n","city":"通用","min_rank":3,"max_rank":6,"weight":3,"once":true,"need":{},"tags":["人事","媒体"],"options":[{"label":"照稿念完，求稳","text":"\n你一字不差地念完，计时器停在十一分五十八秒。掌声很整齐，评分第二。\n三个月后公示，有人举报你演讲中引用的三个数据不实，纪委核查半个月，最后认定表述不够准确，责令书面检查。\n那份检查你写了两千一百字，比演讲稿还长。\n","effects":{"money":0,"risk":4,"merit":4,"pop":2,"boss":3,"stress":9,"clean":-1}},{"label":"脱稿，只讲真话","text":"\n你把稿子扣在桌上，讲了三件事：一个没做完的项目、一次失败，还有一句——我分管的领域里还有两千户人住在漏雨的屋里，这是我的责任。\n台下安静得能听见空调声。评分第三，但直播回放的点播量是全场最高的，弹幕里有人说这个人不像演的。\n评委里的一位老厅长在评语栏写了六个字：敢讲，也许能干。半年后，他点名要你去省里。\n","effects":{"money":0,"risk":-2,"merit":6,"pop":9,"boss":5,"net":2,"stress":12,"clean":5},"flag":"honest_path"},{"label":"加塞承诺，许一大堆","text":"\n你临时加了五条承诺：两年内完成棚改、三年内打通断头路、每年新增三千个学位……每一条都换来一阵掌声，每一条都没有资金来源。\n你以第一名胜出。上任十八个月后，棚改完成百分之三十一，断头路通了半条，学位缺口反而扩大了。\n群众在市政府门口举着你的演讲截图。那张截图，是你自己递给他们的。\n","effects":{"money":0,"risk":10,"merit":7,"pop":-6,"boss":4,"stress":15,"clean":-3}}]},{"id":"sg_001","title":"常委名册上的第五行","text":"\n换届考察从十月就开始预热。十一月的最后一个周五，省委组织部部长邵鹤年把一沓材料送到你办公室，没坐，站着说了三句话：新一届班子十一个人，留任六个，新进五个；你的名字排在拟任名单第五行；这个排序是平衡的结果，不是最终的结果。他把材料留下就走了，茶几上那只杯子还剩小半杯茶，凉透了。夜里十一点，秘书魏允发来一条消息：另一位副省长桑稷今晚也进了洪书记住的那栋楼，待了四十分钟。你翻开名册，第五行的上一行是省城江百的老市委书记罗砚，下一行是比你小六岁的省纪委书记郗明章。窗外省城的灯密密匝匝，你忽然想起八年前第一次进省政府大楼时，门卫让你掏出身份证登记。\n","city":"省级","min_rank":6,"max_rank":9,"weight":5,"once":true,"need":{"min_money":0,"max_money":0,"min_risk":0,"min_probe":0,"min_year":7,"flag":null,"no_flag":null,"min_merit":0,"min_boss":0,"min_net":0,"min_pop":0},"tags":["人事","上级","换届"],"options":[{"label":"谁也不找，照程序走","text":"\n你把名册锁进抽屉，照常开会、照常下市县、照常在文件上批字。有人说你沉得住气，也有人说你没人。考察组谈话时你只讲三件事：江百的港口二期、河冬的厂子、胡悉的山路。一个月后名单没动你，也没动桑稷，第五行空着，等下一次常委会。洪书记在电梯里看了你一眼，什么也没说——那一眼比任何话都重，你后半夜还在想它到底是赏识还是提醒。\n","effects":{"money":0,"risk":-2,"merit":6,"pop":4,"boss":3,"net":1,"health":-1,"stress":6,"family":0,"probe":0,"clean":3,"offshore":0},"flag":"honest_path","unflag":null,"ending":null,"next":null},{"label":"给关键的人送心意","text":"\n你让魏允去了一趟省城宾馆，带了两只不起眼的纸箱，一只送到洪书记司机老段的车上，一只送到邵鹤年妻弟开的茶行。钱不算多，三百二十万，够表心意，不够留下把柄——你是这么安慰自己的。第七天，第五行的名字被提到第四行。你签的字从此多了一层意思：你不再只是你自己。老段后来每次见你都笑得很客气，那份客气里有一根细线，一头系在你的袖口上。\n","effects":{"money":-320,"risk":12,"merit":2,"pop":0,"boss":8,"net":6,"health":-2,"stress":12,"family":0,"probe":6,"clean":-12,"offshore":0},"flag":"took_first_bribe","unflag":null,"ending":null,"next":null},{"label":"只请老领导递一句话","text":"\n你提了两瓶酒去看望已经退到省人大的老领导孟广昶。老头儿听完，只说了八个字：都在锅里，别掀盖子。三天后他给洪书记打了个电话，据说只聊了七分钟。你没进第四行，也没掉出名单。老头儿第二天托人带话：我这一辈子帮过的人，一半进去了。你把那张纸条夹进笔记本，没敢再看第二遍。\n","effects":{"money":-80,"risk":4,"merit":3,"pop":1,"boss":5,"net":5,"health":-1,"stress":5,"family":0,"probe":1,"clean":-4,"offshore":0},"flag":"boss_backed","unflag":null,"ending":null,"next":null},{"label":"连夜上门，当面表忠","text":"\n你让司机把车停在省委一号院外的树影里，等了九十三分钟。洪书记回来时只让你进了书房，没让坐，站着听了你四分钟。你说的是江百港的事，其实是说自己。他最后说了句：班子要的是能扛事的人。你出来时后背全湿了。这件事当天夜里就有三个人知道了，第二天早上变成了三十个人知道。你在一些人眼里成了靶子，在另一些人眼里成了自己人。\n","effects":{"money":0,"risk":15,"merit":4,"pop":-2,"boss":9,"net":7,"health":-3,"stress":14,"family":-2,"probe":4,"clean":-6,"offshore":0},"flag":"has_faction","unflag":null,"ending":null,"next":null}]},{"id":"sg_002","title":"老领导退休前的下午","text":"\n孟广昶下个月正式办退休。这个下午他把你叫到省人大那间朝北的办公室，屋里没有暖气片，只有一台老式电暖器嗡嗡响。他从柜子里搬出十七本工作笔记，说跟我三十年了，你挑几本带走。你翻开发黄的一页，是他在某个县当书记时记的：今天拒了三笔，收了一笔，睡不着。他看你看到了那一行，笑了笑：那一笔是五千块，当时的五千块。后来那一笔没出事，出事的是四十岁那年的另一笔，两百万。他把茶倒上，茶是凉水泡的，茶叶漂着没沉。\n","city":"省级","min_rank":6,"max_rank":9,"weight":4,"once":true,"need":{"min_money":0,"max_money":0,"min_risk":0,"min_probe":0,"min_year":7,"flag":null,"no_flag":null,"min_merit":0,"min_boss":0,"min_net":0,"min_pop":0},"tags":["人事","上级","家属"],"options":[{"label":"只带走三本空白的","text":"\n你挑了三本最薄的、几乎没写字的。老孟愣了一下，随即哈哈大笑，笑得咳嗽起来，说你小子比我聪明。出了门你才发现那三本的扉页上各写着一行小字：不要在酒桌上签字、不要在夜里收钱、不要替人写条子。你在车里坐了十分钟没让司机发动。这三本后来一直放在你办公桌右手第二个抽屉，你每次伸手拿印章都会碰到它们。\n","effects":{"money":0,"risk":-4,"merit":4,"pop":2,"boss":3,"net":3,"health":0,"stress":-6,"family":3,"probe":-2,"clean":5,"offshore":0},"flag":"honest_path","unflag":null,"ending":null,"next":null},{"label":"全带走，也带走他的人","text":"\n十七本你全搬上了车，顺便把他身边那个跟了十二年的司机也要了过来——那人认识全省三分之一的老板。老孟没说话，只在门口挥了挥手。半年后这位司机替你办成了第一件事，也替你收下了第一笔钱，八十万，装在一个印着茶叶的纸袋里。老孟退休第三年住院，你去看了他一次，他已经认不清人，但抓着你的手说：本子还了没有。\n","effects":{"money":80,"risk":10,"merit":2,"pop":-1,"boss":4,"net":9,"health":-1,"stress":8,"family":0,"probe":5,"clean":-9,"offshore":0},"flag":"has_faction","unflag":null,"ending":null,"next":null},{"label":"请他出面牵一次线","text":"\n你没拿笔记，只请他替你引见了一位在北京部委当副部长的老同学。老孟打了个电话，只说这孩子还能用。线搭上了，你第一次走进那栋楼时手心全是汗。后来那笔部委专项下来了，四个亿。老孟收了两条烟，烟他一直没抽，摆在书架上落灰。你每年春节去看他一次，看一次少一次，第八次去的时候，书架上那两条烟还在。\n","effects":{"money":0,"risk":6,"merit":8,"pop":5,"boss":7,"net":8,"health":-1,"stress":6,"family":1,"probe":2,"clean":-3,"offshore":0},"flag":"boss_backed","unflag":null,"ending":null,"next":null},{"label":"劝他把手里的东西烧了","text":"\n你知道他手里有一份二十年前的材料，牵着三个现在已经很高的人。你劝他烧了。他看着你看了很久，问：你怕什么。你说怕您睡不好。三天后他打电话说烧了，可你不确定他烧的是那份还是别的什么。此后你每次听到某个名字从别人嘴里冒出来，心口都会紧一下。这份不确定，后来成了你身上最贵的一样东西。\n","effects":{"money":0,"risk":8,"merit":1,"pop":0,"boss":6,"net":6,"health":-2,"stress":18,"family":-1,"probe":6,"clean":-5,"offshore":0},"flag":null,"unflag":null,"ending":null,"next":null}]},{"id":"sg_003","title":"书记办公室的第三只杯子","text":"\n每周三的书记办公会，屋里有四个人，桌上却摆五只杯子。多出来的那只一直没人用，直到这个周三，洪叙白亲手把它推到你面前，说：以后你来，自己倒。这个动作在场的三个人都看见了——省长严士瞻低头翻材料，副书记秦望舒笑了笑，常务副省长娄敬亭端起杯子喝了一口，水面一点没动。会后娄敬亭在走廊上拍拍你的肩：年轻人，杯子烫手。你回办公室发现自己的手在抖，不是怕，是那种被人从人群里拎出来的眩晕。\n","city":"省级","min_rank":7,"max_rank":10,"weight":5,"once":true,"need":{"min_money":0,"max_money":0,"min_risk":0,"min_probe":0,"min_year":8,"flag":null,"no_flag":null,"min_merit":0,"min_boss":0,"min_net":0,"min_pop":0},"tags":["上级","同僚","人事"],"options":[{"label":"只喝茶，不谈交易","text":"\n你每次去都自己倒水，喝完把杯子洗干净放回原处，只谈工作，一句闲话不留。半年后你发现，那第五只杯子旁边多了第六只——给的是桑稷。你既不失落也不轻松，因为你清楚：在这间屋里，杯子是可以收回去的。你把这点写进了自己的行事准则：别把任何一个领导的亲近，当成自己的东西。\n","effects":{"money":0,"risk":-3,"merit":5,"pop":3,"boss":6,"net":2,"health":0,"stress":4,"family":0,"probe":0,"clean":3,"offshore":0},"flag":"boss_backed","unflag":null,"ending":null,"next":null},{"label":"接杯子，也接单子","text":"\n你接了杯子，也接了他递过来的一张便条：上面写着一个市、一个项目、一个名字。你办了，办得干净利落。三个月后省里的重大项目协调小组，你当了组长。与此同时，娄敬亭开始在各种会上不点名地说：现在有些人，路走得太快。你听得懂。你在两年里赚到了过去十年赚不到的东西，也攒下了过去十年攒不下的敌意。\n","effects":{"money":1200,"risk":16,"merit":6,"pop":-3,"boss":10,"net":5,"health":-2,"stress":14,"family":0,"probe":8,"clean":-14,"offshore":0},"flag":"has_faction","unflag":null,"ending":null,"next":null},{"label":"两边都不得罪","text":"\n你在洪书记面前倒水，也在娄敬亭面前赔笑；洪书记交办的你办七分，娄敬亭托的你办三分。两位都以为你偏自己。两年里你什么事都没耽误，也什么人都不算真正得罪。直到有一天两人在常委会上为一个项目当面顶起来，十几双眼睛同时转向你。你张了张嘴，只说出一句：我再研究研究。那一刻你明白，中庸不是长久之计，只是缓期。\n","effects":{"money":200,"risk":7,"merit":3,"pop":0,"boss":4,"net":6,"health":-2,"stress":12,"family":0,"probe":2,"clean":-5,"offshore":0},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"把便条交给廉署","text":"\n你没接那张便条，但把内容记了下来。一个月后廉政总署驻省纪检组约谈你，你把它当着两个人的面复述了一遍。对方记录在案，说谢谢你。此后你在省委大楼里迅速安静下来——没人请你吃饭，没人跟你走路，连司机都换了新车你不知道。两年后洪书记另有任用，你没被牵连，也没被重用。你成了那种谁都放心、谁都不想用的人。\n","effects":{"money":0,"risk":12,"merit":-4,"pop":6,"boss":-10,"net":-8,"health":-4,"stress":20,"family":-3,"probe":-12,"clean":6,"offshore":0},"flag":"reported","unflag":null,"ending":null,"next":null}]},{"id":"sg_004","title":"秘书帮的规矩","text":"\n你的秘书魏允跟了你八年，从市政府跟到省政府。这个月省委组织部派人来考察他，拟任某处处长。消息传出去的当天，三个老板的电话先后打到你的手机上，说的都是同一件事：魏处长以后多关照。第四个电话是魏允自己打来的，他说他表弟开了家咨询公司，想接一点省属企业的顾问业务，问你行不行。你看着通话记录里的四个号码，忽然发现这四个号码背后其实是同一件事——它们都在买同一样东西，而那样东西的产权证上写着你的名字。\n","city":"省级","min_rank":7,"max_rank":10,"weight":4,"once":true,"need":{"min_money":0,"max_money":0,"min_risk":0,"min_probe":0,"min_year":8,"flag":null,"no_flag":null,"min_merit":0,"min_boss":0,"min_net":0,"min_pop":0},"tags":["人事","同僚","工程"],"options":[{"label":"让他避嫌，调离岗位","text":"\n你把魏允叫进来，说了六个字：避嫌，去省社科院。他脸红了又白，最后敬了个礼。那家咨询公司没开成，三个老板的电话从此再没响过第二个。三年后魏允在社科院出了一本关于地方治理的书，扉页写着献给一位不肯收礼的人。你在书店看见它，站了很久，最后买下两本，一本送人，一本没送出去。\n","effects":{"money":0,"risk":-5,"merit":4,"pop":4,"boss":2,"net":-3,"health":0,"stress":-4,"family":2,"probe":-3,"clean":5,"offshore":0},"flag":"honest_path","unflag":null,"ending":null,"next":null},{"label":"默认他去做，不签字","text":"\n你没说行也没说不行，只在一次饭局上把祁姓老板介绍给了他。此后所有文件上都没有你的名字，所有饭局上都有你的传说。魏允的表弟两年内接了十一个顾问项目，收了九百多万。你一分钱没拿，但你的办公室、你的行程、你的脾气，都成了明码标价的商品。你安慰自己：我只是没管住身边的人。\n","effects":{"money":600,"risk":14,"merit":2,"pop":-2,"boss":3,"net":7,"health":-1,"stress":10,"family":0,"probe":9,"clean":-11,"offshore":0},"flag":"company_x","unflag":null,"ending":null,"next":null},{"label":"立三条规矩再放他走","text":"\n你同意他下派，但立了三条：不接省属企业的活，不代你收任何东西，不在外面提你的名字。他照做了两年，第三年破了一条——替一个老同学递了份材料给你。你当天就把他叫回来训了四十分钟，训完自己先红了眼眶。后来他再没破过规矩。他在你落难那年，是唯一一个还来看你的人。\n","effects":{"money":0,"risk":-1,"merit":5,"pop":2,"boss":4,"net":4,"health":-1,"stress":6,"family":1,"probe":-1,"clean":2,"offshore":0},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"把他推成你的前台","text":"\n你把他放到省属企业当副总，明面上的职务，暗地里的闸门。此后所有想找你的人先找他，所有钱先进他的公司，再以分红、顾问费、字画款的形式流回你指定的账户。第一年一千八百万，第三年六千万。你像经营一家企业一样经营这条管道，也像经营一家企业一样，开始担心审计。\n","effects":{"money":6000,"risk":22,"merit":3,"pop":-4,"boss":5,"net":10,"health":-3,"stress":18,"family":-2,"probe":14,"clean":-18,"offshore":0},"flag":"has_faction","unflag":null,"ending":null,"next":null}]},{"id":"sg_005","title":"中央党校的同学圈","text":"\n在中央党校的三个月，你的同班四十二人里，有六个省部级，二十个厅局级，其余来自军队、高校和央企。第三周的一个晚上，来自邻省的同学蔺望之敲开你的门，手里拎着一瓶酒和一份文件：他们省要修一条出省高速，接口在你这边，两省联手能多要两百亿专项。他说完把酒放下，没提文件。窗外是十一月的夜，操场上有人在跑步，一圈一圈，像在数自己的日子。\n","city":"省级","min_rank":7,"max_rank":10,"weight":4,"once":true,"need":{"min_money":0,"max_money":0,"min_risk":0,"min_probe":0,"min_year":8,"flag":null,"no_flag":null,"min_merit":0,"min_boss":0,"min_net":0,"min_pop":0},"tags":["上级","工程","交通","同僚"],"options":[{"label":"按程序报，不私下承诺","text":"\n你把文件收进公文包，第二天交给省发改委按程序论证。两省联席会开了四次，吵了半年，最后拿下一百四十亿，比预期少六十亿。蔺望之在结业那天跟你碰杯，说你这人无趣。三年后他从邻省任上调走，临行前给你寄了一箱当地产的橘子，附言只有一句：还好当年没让你签字。\n","effects":{"money":0,"risk":-3,"merit":7,"pop":6,"boss":4,"net":4,"health":0,"stress":5,"family":0,"probe":0,"clean":3,"offshore":0},"flag":"honest_path","unflag":null,"ending":null,"next":null},{"label":"联手做局，两省分肥","text":"\n两省各出一套班子，各自指定一家企业，招标文件里的技术参数写到第六稿时，只有那两家企业能过。两百亿的专项下来，工程的利润空间被设计成十三个点，你在境外接了三千二百万。结业那天你们在饭桌上结拜，说要互相照应一辈子。五年后蔺望之先出事，供出的名单里有十七个人，你排在第四。\n","effects":{"money":4200,"risk":20,"merit":6,"pop":-3,"boss":6,"net":11,"health":-2,"stress":16,"family":0,"probe":13,"clean":-16,"offshore":3000},"flag":"has_faction","unflag":null,"ending":null,"next":null},{"label":"只做朋友，不做生意","text":"\n你喝了酒，没收文件。此后十几年你们一直走动，逢年过节通个电话，谁也不找谁办事。二十年后他退休在家养兰花，你去看他，两个老头儿在阳台上坐了一下午，聊的都是当年谁胖了谁秃了。临走时他说：咱们班四十二个人，进去十一个。你在车里算了算，那十一人里有八个，是自己当年很羡慕的。\n","effects":{"money":0,"risk":-2,"merit":3,"pop":3,"boss":3,"net":6,"health":2,"stress":-8,"family":3,"probe":-2,"clean":4,"offshore":0},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"把同学会变成俱乐部","text":"\n你发起了一个同窗联谊会，每年在一座不同的城市聚一次，费用轮流做东，实际由几家固定的企业埋单。五年里这个小圈子办成了二十九件事：十一个项目、九次干部调整、九次危机公关。你成了圈子里的轴。你没意识到的是，要扳倒这样一个圈子，只需要从轴上敲下第一块——而轴是最难跑的。\n","effects":{"money":3000,"risk":21,"merit":5,"pop":-5,"boss":7,"net":12,"health":-3,"stress":17,"family":-2,"probe":16,"clean":-15,"offshore":1500},"flag":"has_faction","unflag":null,"ending":null,"next":null}]},{"id":"sg_006","title":"老乡会的第一排","text":"\n每年腊月二十六，省城宾馆三号楼有个不成席的席：川平籍在外任职的、经商的人聚一次，AA 制，每人三百。今年你被安排在第一排。组织者是从部委退下来的应寒山，七十三岁，据说还能打通三个省的电话。席间有人提议成立川平发展促进会，当场认捐，认捐簿传到第三排时已经写了两千万。传到第一排时，应寒山把笔递给你，笑着说：你如今是最大的一个。\n","city":"省级","min_rank":7,"max_rank":10,"weight":4,"once":true,"need":{"min_money":0,"max_money":0,"min_risk":0,"min_probe":0,"min_year":8,"flag":null,"no_flag":null,"min_merit":0,"min_boss":0,"min_net":0,"min_pop":0},"tags":["同僚","招商","上级"],"options":[{"label":"写三百，只出自己的","text":"\n你在认捐簿上写了三百，跟所有人一样。席上有人愣了一下，随即有人带头鼓掌，掌声稀稀拉拉。应寒山把簿子收起来，说这才像话。此后每年你都只出三百。二十年后这个会还在，第一排换了几茬人，认捐簿上没有你的名字超过三百。你在家乡的口碑，是另外一个数字。\n","effects":{"money":0,"risk":-4,"merit":4,"pop":7,"boss":1,"net":1,"health":0,"stress":3,"family":2,"probe":-3,"clean":5,"offshore":0},"flag":"honest_path","unflag":null,"ending":null,"next":null},{"label":"认捐五百万，挂个名","text":"\n你写下五百万，钱由省城一家地产商代出，你只出了个名。促进会成立那天你被推为名誉会长，照片上了本地内刊的头版。此后你每年替这家地产商解决两三个小问题：一个规划调整、一次验收通融、一个批文加快。你觉得这是人情往来。第七年，这家地产商的老板在里头写了四十七页交代材料，其中三页写的是你。\n","effects":{"money":1500,"risk":17,"merit":4,"pop":-2,"boss":5,"net":9,"health":-2,"stress":12,"family":0,"probe":11,"clean":-13,"offshore":0},"flag":"company_x","unflag":null,"ending":null,"next":null},{"label":"不出钱，只出政策","text":"\n你没捐钱，只承诺省里对返乡创业给同等政策。这句话比五百万值钱。第二年有三个厂子回来，解决了两千多人就业，市里给你送了面锦旗。锦旗你挂在办公室的柜子里，柜门常年关着。你自己知道，这面锦旗是你所有东西里最轻、也最不容易被收走的一件。\n","effects":{"money":0,"risk":0,"merit":9,"pop":9,"boss":4,"net":3,"health":0,"stress":4,"family":1,"probe":0,"clean":3,"offshore":0},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"反客为主，接手这个会","text":"\n你当场加码到两千万，并提议把促进会秘书处设在省里。三年后这个会成了你真正的组织：三十七个成员，覆盖六个省、两个部委、三家央企，能调动的资金超过百亿。你把应寒山供在会长的位置上，自己当秘书长。你终于有了自己的班底。也终于有了一份可以被整个端掉的名单——名单第一行就是你的名字。\n","effects":{"money":5000,"risk":23,"merit":7,"pop":-4,"boss":8,"net":12,"health":-3,"stress":19,"family":-2,"probe":17,"clean":-17,"offshore":2000},"flag":"has_faction","unflag":null,"ending":null,"next":null}]},{"id":"sg_007","title":"分工调整通知","text":"\n一纸省委文件，三行字：你不再分管工业和交通，改分管地方志、老龄工作、关心下一代。文件是邵鹤年亲自送来的，他放下的动作很轻，像放一件易碎品。同一天，你办公室门口那台内线电话安静了一整天，连打错的都没有。魏允把新名片送来，你看见职务后面那行字，忽然想笑。你在省政府的第十一年，第一次在下午五点半准时下班，路上没遇到一个熟人。\n","city":"省级","min_rank":7,"max_rank":10,"weight":4,"once":true,"need":{"min_money":0,"max_money":0,"min_risk":0,"min_probe":0,"min_year":8,"flag":null,"no_flag":null,"min_merit":0,"min_boss":0,"min_net":0,"min_pop":0},"tags":["人事","上级","同僚"],"options":[{"label":"把老龄工作做成实事","text":"\n你花了七个月跑遍全省的养老机构，写出一份三万字的报告，推动把农村高龄补贴从每月八十提到一百五。文件会签时七个部门，只有两个签字，你一家一家去磨。两年后补贴落地，你在胡悉的山路上被一个老太太拦住，她拉着你的手叫你\"好人\"。那年你六十岁，第一次觉得被边缘化也不是坏事。\n","effects":{"money":0,"risk":-6,"merit":8,"pop":12,"boss":-2,"net":0,"health":-3,"stress":8,"family":3,"probe":-5,"clean":6,"offshore":0},"flag":"honest_path","unflag":null,"ending":null,"next":null},{"label":"托人重新运作分工","text":"\n你连夜进京，见了那位副部长，也见了几位说得上话的人。花了六百万，换来一次和洪书记的单独见面。他听完只说：分工是集体的决定。你出来时外面下着雨，你在车里坐了四十分钟。三个月后你分管了旅游——比地方志强，比工业差得很远。你明白自己被记了一笔，那一笔不写在纸上，写在别人的心里。\n","effects":{"money":-600,"risk":13,"merit":1,"pop":-1,"boss":-6,"net":4,"health":-4,"stress":20,"family":-3,"probe":8,"clean":-8,"offshore":0},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"装病，等风头过去","text":"\n你递了张两周的病假条，住进省立医院干部病房。病房里每天来三拨人，第一拨送花，第二拨是真朋友，第三拨是你自己都不知道姓什么的人派来试探的。两周后你回去上班，发现桌上的文件少了三分之一，人心散出去得比权力快。你学会了等，也学会了在等的时候不说话。\n","effects":{"money":0,"risk":-2,"merit":-3,"pop":-2,"boss":-1,"net":-2,"health":3,"stress":10,"family":0,"probe":1,"clean":0,"offshore":0},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"借冷板凳办自己的事","text":"\n分工没了，时间就有了。你用这一年跑完了境外账户的最后一环，把该转的转了，该签的字签了，该见的人见了。省里没人注意一个分管老龄工作的副省长在干什么——这正是冷板凳最大的好处。你甚至在年底的述职报告里写了三千字的老龄工作，写得情真意切。第二年你又被起用了，起用你的理由其中之一就是：这一年他没惹事。\n","effects":{"money":2500,"risk":12,"merit":2,"pop":0,"boss":6,"net":5,"health":-2,"stress":13,"family":-1,"probe":7,"clean":-12,"offshore":2500},"flag":"offshore_ready","unflag":null,"ending":null,"next":null}]},{"id":"sg_008","title":"盟友出事的那个清晨","text":"\n早上六点四十，娄敬亭的电话打不通了。七点十分，省委办公厅的短信来了：今天上午九点，常委紧急会议，不得请假，不带手机。你在车上看了一眼办公楼，三楼东头的灯亮着，那间屋子的主人是省纪委书记郗明章。你想起了三个月前娄敬亭在酒桌上说过的话：我那个小舅子，是个祸害。当时你笑他多虑。现在你笑不出来了，因为你签过的字里，有四个和他有关。\n","city":"省级","min_rank":7,"max_rank":10,"weight":5,"once":true,"need":{"min_money":0,"max_money":0,"min_risk":0,"min_probe":0,"min_year":9,"flag":null,"no_flag":null,"min_merit":0,"min_boss":0,"min_net":0,"min_pop":0},"tags":["同僚","巡视","上级"],"options":[{"label":"如实说明，主动说清","text":"\n会议结束当天下午，你主动去了省纪委，把与娄敬亭有关的四笔往来一笔一笔讲清：两笔是正常的工作签批，一笔是你当时就反对的，还有一笔你确实签错了。你写了七页说明。郗明章看完说：主动讲清楚，跟被人查出来，是两个概念。这句话后来救了你，也让你在很多人眼里，成了\"那种人\"。\n","effects":{"money":0,"risk":6,"merit":-2,"pop":2,"boss":-3,"net":-5,"health":-3,"stress":16,"family":-2,"probe":-14,"clean":5,"offshore":0},"flag":"reformed","unflag":null,"ending":null,"next":null},{"label":"连夜改四份会议纪要","text":"\n你叫来魏允和两个笔杆子，在办公室改到凌晨三点四十。改的不是事实，是主语——把\"同意\"改成\"阅\"、把\"提议\"改成\"转来\"。四份纪要改完，你在卫生间吐了一次。第二天你照常开会，谁也没看出来。三年后娄敬亭在里头把那天的情形复述了一遍，他说：那份纪要我留了底。\n","effects":{"money":0,"risk":22,"merit":0,"pop":-4,"boss":2,"net":-2,"health":-6,"stress":24,"family":-1,"probe":20,"clean":-15,"offshore":0},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"公开表态，坚决拥护","text":"\n你在常委会上第一个发言，用了十六分钟，讲得义正词严，讲到一半自己都有点感动。会后洪书记留你说了句：你是明白人。此后半年你平安无事，但娄敬亭那条线上的人开始一个一个躲着你。有人送来一份材料，是关于另一个人的。你没有上交，也没有销毁，只是锁进了柜子最下面一层。\n","effects":{"money":0,"risk":4,"merit":2,"pop":-1,"boss":7,"net":-4,"health":-2,"stress":14,"family":0,"probe":-4,"clean":-4,"offshore":0},"flag":"boss_backed","unflag":null,"ending":null,"next":null},{"label":"反手检举，抢先划清","text":"\n你连夜整理了一份娄敬亭的材料，十二条，条条有据——都是这几年你替他处理善后时留下的。第二天一早你把它交给了省纪委。你被评价为\"立场坚定、敢于斗争\"。但那天下午，省委大楼里有七个人同时想到了同一件事：他手里是不是也有我们的材料。你活下来了，从此没有人再敢跟你交底。\n","effects":{"money":0,"risk":14,"merit":3,"pop":3,"boss":8,"net":-9,"health":-5,"stress":22,"family":-4,"probe":-18,"clean":2,"offshore":0},"flag":"reported","unflag":null,"ending":null,"next":null}]},{"id":"sg_009","title":"组织部的考察谈话","text":"\n邵鹤年亲自带队找你谈话，题目只有一个：你推荐谁。屋里三个人，一台录音笔，桌上放着一杯没人喝的水。他先读了纪律，然后说：随便谈，二十分钟。你脑子里闪过七张脸：江百的罗砚、河冬的施明焕、胡悉的佟大用，还有三个市的组织部长，以及你自己那个在省财政厅当副厅长的外甥邹勉的表哥。你说出第一个名字之前，有大概五秒钟的沉默。这五秒钟，会决定很多人的十年。\n","city":"省级","min_rank":7,"max_rank":10,"weight":4,"once":true,"need":{"min_money":0,"max_money":0,"min_risk":0,"min_probe":0,"min_year":8,"flag":null,"no_flag":null,"min_merit":0,"min_boss":0,"min_net":0,"min_pop":0},"tags":["人事","上级","同僚"],"options":[{"label":"只谈政绩，不谈人情","text":"\n你只推荐了胡悉的佟大用，理由是他把一个山区市的贫困发生率从百分之十九压到百分之四，代价是妻子跟他离了婚。说完你自己都觉得这理由有点怪。邵鹤年记下来，问：还有吗。你说没有了。半年后佟大用进了班子，你没跟任何人提过这件事。十年后佟大用出事，调查组问的第一个问题是：谁推荐的他。\n","effects":{"money":0,"risk":3,"merit":6,"pop":5,"boss":4,"net":1,"health":0,"stress":6,"family":0,"probe":0,"clean":3,"offshore":0},"flag":"honest_path","unflag":null,"ending":null,"next":null},{"label":"推荐自己人，暗中标价","text":"\n你推荐了三个人，其中两个是常年给你\"送温暖\"的市里主官，一个是某企业老板的堂兄。三句话，你在心里估了个价：八百万。六个月后三个人全部到位，八百万分四次到账，最厚的一次装在一个拉杆箱里，拉杆箱的轮子还沾着省城宾馆地下车库的灰。\n","effects":{"money":800,"risk":15,"merit":-2,"pop":-4,"boss":-2,"net":8,"health":-2,"stress":12,"family":0,"probe":10,"clean":-13,"offshore":0},"flag":"took_first_bribe","unflag":null,"ending":null,"next":null},{"label":"把烫手的名字推出去","text":"\n你推荐了一个所有人都知道有问题、但没人敢明说的人。你把他推上去，是想借组织程序把他摘出来，还是借组织程序把他送进去，你自己也说不清。结果是他卡在公示环节，举报信二十七封。你既没得罪他，也没帮成他。邵鹤年临走时看了你一眼，那一眼里有一点点失望，或者你多想了。\n","effects":{"money":0,"risk":8,"merit":-1,"pop":-2,"boss":-3,"net":2,"health":-1,"stress":11,"family":0,"probe":5,"clean":-5,"offshore":0},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"推荐政敌，买一份人情","text":"\n你在谈话里推荐了娄敬亭那条线上的人，一个一直跟你作对的中年干部。邵鹤年很意外，问为什么。你说：这个人能力强。半年后这个人成了你的副手，从此对你感激不尽。你花一个推荐名额，买断了一个反对派。这笔账，是你在省级机关里做的最漂亮的一笔——也是你最不愿意写在纸上的一笔。\n","effects":{"money":0,"risk":6,"merit":4,"pop":0,"boss":3,"net":10,"health":-1,"stress":7,"family":0,"probe":2,"clean":-4,"offshore":0},"flag":"has_faction","unflag":null,"ending":null,"next":null}]},{"id":"sg_010","title":"投名状","text":"\n洪书记的秘书打电话来，只说了时间地点：周六下午三点，省城宾馆六号楼。你到了才知道屋里不止他一个人，还有国资委主任扈维桢。洪叙白没有寒暄，直接说：川平重工要重组，有人想让一家外地企业进来，我不想。这件事你来办，办成办不成，我都记着。他说完起身走了，屋里的茶还是热的，你一口没喝。你明白这不是商量，是一份投名状——签了，你就姓洪；不签，你就谁也不是。\n","city":"省级","min_rank":7,"max_rank":10,"weight":5,"once":true,"need":{"min_money":0,"max_money":0,"min_risk":0,"min_probe":0,"min_year":9,"flag":null,"no_flag":null,"min_merit":0,"min_boss":0,"min_net":0,"min_pop":0},"tags":["上级","工程","金融","人事"],"options":[{"label":"依法否决，不留情面","text":"\n你在重组方案审议会上投了反对票，理由写成三条，条条站得住：资产评估偏低、职工安置方案缺位、收购方资金来源存疑。会后洪书记三天没接你的电话。第四天他打来，只说：你的意见我看了，有道理。那家企业没进来，川平重工后来引进了另一家，价格高出十一亿。你在他心里从此被标记为：能用，但不算自己人。\n","effects":{"money":0,"risk":8,"merit":9,"pop":6,"boss":-8,"net":-3,"health":-3,"stress":15,"family":-1,"probe":2,"clean":5,"offshore":0},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"照办，顺势拿一份","text":"\n你用三个月把那家外地企业挡在门外，顺手把重组的主导权交给了华泰置业的钱广白。作为回报，钱广白以\"财务顾问\"的名义给你安排了三千八百万，分五次，走的是境外一家咨询公司。签字那天你在办公室待到深夜，第二天早上照常去食堂吃了一碗面。你吃得很香，这让你自己都有点意外。\n","effects":{"money":3800,"risk":19,"merit":5,"pop":-3,"boss":11,"net":8,"health":-2,"stress":15,"family":0,"probe":12,"clean":-16,"offshore":2000},"flag":"has_faction","unflag":null,"ending":null,"next":null},{"label":"拖，拖到换届之后","text":"\n你以\"补充尽调\"为由把方案压了七个月，压过了考察、压过了公示、也压过了洪书记的一次追问。换届后他调离，新书记对这件事没有兴趣。那家外地企业最终还是没进来，因为它自己也出了问题。你既没签投名状，也没撕破脸，代价是在所有人眼里，你成了一个只会拖的人。\n","effects":{"money":0,"risk":5,"merit":3,"pop":0,"boss":-4,"net":0,"health":-2,"stress":13,"family":0,"probe":3,"clean":-2,"offshore":0},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"反过来卖这个消息","text":"\n你把\"省里不要这家企业\"的消息，卖给了那家企业的老板岑照，要价两千万，附赠一份改制路径的建议。岑照照做，绕道收购了川平重工旗下两家子公司，省里拦不住——因为拦的是母公司，不是子公司。两个月后你拿到了钱，也拿到了洪书记一个意味深长的眼神。他没证据，但他知道。有些人知道就够了。\n","effects":{"money":2000,"risk":24,"merit":4,"pop":-3,"boss":-6,"net":6,"health":-3,"stress":20,"family":-1,"probe":15,"clean":-18,"offshore":1000},"flag":null,"unflag":null,"ending":null,"next":null}]},{"id":"sg_011","title":"常务副省长的位子","text":"\n娄敬亭出事后的第四十天，常务副省长的位置空着。名义上要\"按程序\"，实际上全省的人都在算一笔账：谁来接。你的名字在第二梯队的第一位。财政厅长詹砺提着两瓶酒来过一次，坐了十一分钟，说了七句废话，最后一句是：省里现在缺一个能压得住阵的。同一天晚上，严省长在食堂端着盘子坐到了你对面，问了一句：你觉得詹砺这个人怎么样。\n","city":"省级","min_rank":7,"max_rank":9,"weight":5,"once":true,"need":{"min_money":0,"max_money":0,"min_risk":0,"min_probe":0,"min_year":9,"flag":null,"no_flag":null,"min_merit":0,"min_boss":0,"min_net":0,"min_pop":0},"tags":["人事","上级","同僚"],"options":[{"label":"不做工作，只做事情","text":"\n你把精力放在了压了三年的省属国企债务上，三个月清掉了二百七十亿的烂账。常务副省长给了别人。宣布那天你在胡悉看一个水库，手机信号断断续续，魏允打了六个电话才打通。你在大坝上站了一会儿，风很大，你忽然想到：位子是别人的，可这二百七十亿的债，从此跟谁都没关系了。\n","effects":{"money":0,"risk":-4,"merit":12,"pop":8,"boss":5,"net":2,"health":-3,"stress":9,"family":1,"probe":-3,"clean":5,"offshore":0},"flag":"honest_path","unflag":null,"ending":null,"next":null},{"label":"进京跑，把事做实","text":"\n你连跑四趟，见了十一个人，花了一千两百万，其中四百万是你自己攒的，八百万是三个老板\"借\"的。三个月后你成了常务副省长。上任第一天你在办公室坐了很久，然后把那三个老板的名字写在一张纸上，锁起来。你知道从这一刻起，你不是为自己工作了。\n","effects":{"money":800,"risk":18,"merit":5,"pop":-2,"boss":12,"net":9,"health":-3,"stress":17,"family":0,"probe":12,"clean":-15,"offshore":0},"flag":"boss_backed","unflag":null,"ending":null,"next":null},{"label":"推举詹砺，换他的支持","text":"\n你在几个关键场合说詹砺的好话，把他推了上去。他上任第一天，就把全省财政资金的调度权向你的分管领域倾斜了十一个亿。你没当常务，却拿到了比常务更实惠的东西。此后三年你俩互相需要，也互相捏着对方的把柄。有人说你聪明，也有人说你连野心都没有。\n","effects":{"money":300,"risk":9,"merit":6,"pop":0,"boss":6,"net":11,"health":-1,"stress":8,"family":0,"probe":4,"clean":-7,"offshore":0},"flag":"has_faction","unflag":null,"ending":null,"next":null},{"label":"赌一把，联合严省长","text":"\n你把筹码全押在了省长严士瞻身上，替他办了三件事：压下一份审计报告、调整一个市的班子、在常委会上投了一次关键的赞成票。半年后他在书记面前力荐你，但书记没点头。你成了严省长的人，也就成了洪书记眼里不能再用的人。常务之争你输了，而你输掉的东西，比这个位子贵得多。\n","effects":{"money":0,"risk":16,"merit":4,"pop":-2,"boss":-9,"net":7,"health":-4,"stress":19,"family":-1,"probe":8,"clean":-9,"offshore":0},"flag":"has_faction","unflag":null,"ending":null,"next":null}]},{"id":"sg_012","title":"民主推荐会上的三票","text":"\n民主推荐会在省城宾馆会议厅开，一百一十七人参加，无记名。唱票的时候你在隔壁房间等着。魏允每隔十分钟进来报一次：罗砚四十九、你四十三、桑稷三十八。每一次他都把声音压得很低，像是怕惊动什么。最后的结果是罗砚五十六，你四十一，桑稷三十九。你比预想的低，也比预想的高。走出会场时，走廊尽头有人在抽烟，是桑稷，他看了你一眼，把烟掐了。\n","city":"省级","min_rank":7,"max_rank":9,"weight":4,"once":true,"need":{"min_money":0,"max_money":0,"min_risk":0,"min_probe":0,"min_year":9,"flag":null,"no_flag":null,"min_merit":0,"min_boss":0,"min_net":0,"min_pop":0},"tags":["人事","换届","同僚"],"options":[{"label":"认账，回去干活","text":"\n你向组织表示完全服从，第二天照常下到河冬市看一个技改项目。工地的灰很大，你在车间里待了两个小时。回来后有人告诉你，这次投票里有三票是投给你的弃权票改的——改票的是三个你曾经帮过、也从没收过你一分钱的老资格。你没问是谁。这三票你记了一辈子。\n","effects":{"money":0,"risk":-3,"merit":7,"pop":6,"boss":4,"net":3,"health":-1,"stress":5,"family":2,"probe":-2,"clean":4,"offshore":0},"flag":"honest_path","unflag":null,"ending":null,"next":null},{"label":"查谁没投我","text":"\n你让魏允私下摸了一遍，摸出了十一张\"反常票\"的名字。此后两年，这十一个人里有七个被调整了岗位，两个被派到边远的县，剩下的两个是你动不了的。你在办公室画了张表格，表格越画越细。第七年，这张表格成了调查组手中的一份证据：一个省级干部，用两年的时间，记恨了十一个人。\n","effects":{"money":0,"risk":20,"merit":-3,"pop":-6,"boss":-7,"net":-6,"health":-4,"stress":21,"family":-2,"probe":16,"clean":-12,"offshore":0},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"主动找罗砚谈一次","text":"\n你在食堂端着盘子坐到了罗砚对面，开门见山：祝贺你，也请你多担待。他愣了一下，说你这个人真有意思。此后两年你们合作了三件大事：港口整合、开发区清理、信访积案化解。省里的人说你俩是一文一武。你没当上常委，但你干的活比常委多。这话你自己也信。\n","effects":{"money":0,"risk":-1,"merit":9,"pop":5,"boss":6,"net":8,"health":-1,"stress":4,"family":1,"probe":-1,"clean":2,"offshore":0},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"当场质疑票数有鬼","text":"\n你在会上要求核对票箱，声音不大，但全场都听见了。核对结果：无误。你道了歉，说是我多心。那天之后，一百一十七人里有九十多个开始躲着你。有人说你有骨气，也有人说你输不起。你在半年内调离了省政府，去了省人大。那间朝北的办公室，和当年老孟的一模一样。\n","effects":{"money":0,"risk":14,"merit":-5,"pop":2,"boss":-12,"net":-8,"health":-5,"stress":23,"family":-3,"probe":3,"clean":3,"offshore":0},"flag":null,"unflag":null,"ending":null,"next":null}]},{"id":"sg_013","title":"七百公里的那条线","text":"\n川平环线高速，七百一十二公里，总投资九百四十亿，跨七个市，是省里建国以来最大的单体工程。论证会上，交通厅长骆与舟把线路图铺满整张会议桌，两种方案：北线短六十公里、便宜四十亿，但要穿过胡悉的两个县；南线绕远，沿线全是江百的平原。你在图上看了很久。散会后，钱广白在停车场等了你四十分钟，只说了一句话：北线那两个县，我熟。\n","city":"省级","min_rank":7,"max_rank":10,"weight":5,"once":true,"need":{"min_money":0,"max_money":0,"min_risk":0,"min_probe":0,"min_year":9,"flag":null,"no_flag":null,"min_merit":0,"min_boss":0,"min_net":0,"min_pop":0},"tags":["工程","交通","招商"],"options":[{"label":"按论证结论走北线","text":"\n你采纳北线，公开理由是缩短里程、带动山区。北线修通后，胡悉两个县到省城的时间从七小时变成两小时二十分钟，第一年就落地了三家厂子。招标全程公开，钱广白的公司中了两个标段，是因为报价最低。通车那天你剪了彩，剪刀很钝，剪了三次才剪断。台下有人笑，也有人鼓掌。\n","effects":{"money":0,"risk":-2,"merit":13,"pop":11,"boss":5,"net":2,"health":-3,"stress":8,"family":0,"probe":1,"clean":4,"offshore":0},"flag":"honest_path","unflag":null,"ending":null,"next":null},{"label":"改南线，拿两个点","text":"\n你把北线的地质报告压了三天，改走南线。南线多出的四十亿，被分解到十一个标段、三十七家分包商，其中十九家和钱广白有关。你拿了九百四十亿的两个点，一亿八千八百万，分六年，走的是境外一家工程咨询公司。你从此不敢在夜里接陌生号码，也从此再没坐过那段路。\n","effects":{"money":8000,"risk":22,"merit":6,"pop":-6,"boss":6,"net":9,"health":-3,"stress":20,"family":-1,"probe":15,"clean":-18,"offshore":5000},"flag":"company_x","unflag":null,"ending":null,"next":null},{"label":"南北都修，一起上","text":"\n你拍板南北双线，理由是\"两个都不能落下\"。总投资追加到一千四百亿，省里财政吃紧，只能举债。你任期内打通了两条路，GDP 数据好看得不像话。你离任三年后，这笔债成了压在继任者身上的第一座山。省里开会研究化债，会议室里有人说了句：当年那人胆子真大。\n","effects":{"money":1200,"risk":11,"merit":11,"pop":3,"boss":3,"net":4,"health":-4,"stress":16,"family":0,"probe":6,"clean":-6,"offshore":0},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"把整条线切给一家","text":"\n你以\"减少协调成本\"为由，把全线打包成三个大标段，实际由一家企业联合体总包，联合体背后是唐厉。你在常委会上说服了所有人，用了二十分钟。四年后这条线提前半年通车，你站在主席台上讲了一刻钟。同一年，唐厉在境外成立了一家投资公司，股东名单里有一个你表弟的名字，用的是他的小名。\n","effects":{"money":6000,"risk":25,"merit":8,"pop":0,"boss":7,"net":11,"health":-4,"stress":22,"family":-3,"probe":19,"clean":-19,"offshore":3000},"flag":"has_faction","unflag":null,"ending":null,"next":null}]},{"id":"sg_014","title":"川平重工上市前夜","text":"\n川平重工要上市，这是省里等了六年的事。招股说明书的最后一稿放在你桌上，四百多页。财务总监私下告诉你一个数字：应收账款里有十七亿，账龄超过三年，来自六家关联公司，其中两家已经注销。他说完就走了，走的时候忘了带走他的打火机——一个印着某家高尔夫球场标志的打火机，一直在你桌上放了三天。\n","city":"省级","min_rank":7,"max_rank":10,"weight":5,"once":true,"need":{"min_money":0,"max_money":0,"min_risk":0,"min_probe":0,"min_year":9,"flag":null,"no_flag":null,"min_merit":0,"min_boss":0,"min_net":0,"min_pop":0},"tags":["金融","工程","审计"],"options":[{"label":"延期，先把账做实","text":"\n你顶着压力把申报材料撤了回来，要求重新审计、核销坏账。省内一片哗然，有人说你断送了省里的大好局面。一年半后川平重工二次申报，估值低了三成，但上市首日没有破发。庆功宴你没去。你在办公室看了一夜的审计报告，第二天早上把那个打火机扔进了垃圾桶。\n","effects":{"money":0,"risk":-5,"merit":10,"pop":7,"boss":-5,"net":-2,"health":-4,"stress":14,"family":0,"probe":-6,"clean":6,"offshore":0},"flag":"honest_path","unflag":null,"ending":null,"next":null},{"label":"原始股，代持","text":"\n你在上市前通过七层代持拿到了一千二百万股，成本三块二。上市首日收二十七块。你没卖，你等了三年，等到解禁，也等到股价跌回八块——账面上的三亿多缩到不足一亿。你依然比任何时候都富有，也依然每晚睡前要确认一遍那七层结构里，没有一层留下你的字。\n","effects":{"money":4500,"risk":21,"merit":6,"pop":-3,"boss":6,"net":9,"health":-3,"stress":19,"family":-1,"probe":14,"clean":-17,"offshore":2500},"flag":"company_x","unflag":null,"ending":null,"next":null},{"label":"睁一只眼，签字放行","text":"\n你把材料翻到第两百三十七页，看了三分钟，然后签了字。上市很成功，敲钟那天你穿了一身新衣服。此后三年，川平重工的应收账款涨到四十六亿，市值跌去六成，两万三千名职工的年金缩水。你退休后偶尔在电视上看到它的新闻，会换台。你换台的动作很快，快得像在躲什么。\n","effects":{"money":500,"risk":15,"merit":5,"pop":-5,"boss":7,"net":5,"health":-2,"stress":12,"family":0,"probe":10,"clean":-11,"offshore":0},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"借重组把国资腾挪一遍","text":"\n你设计了一个方案：川平重工把三家优质子公司剥离，注入一家省属投资平台，再把三家亏损厂留在上市公司里。优质资产被作价三十九亿，实际评估值六十二亿。差价去了哪里，只有四个人知道。这件事做得极其专业，专业到五年后调查组用了整整八个月，才把那四张纸的顺序理清。\n","effects":{"money":7000,"risk":24,"merit":4,"pop":-7,"boss":5,"net":10,"health":-4,"stress":22,"family":-2,"probe":18,"clean":-20,"offshore":4000},"flag":"has_faction","unflag":null,"ending":null,"next":null}]},{"id":"sg_015","title":"三千亩指标的去向","text":"\n国土厅报上来一份全省建设用地指标的分配方案，总量三万两千亩，你手里能调剂的机动指标是三千亩。方案上密密麻麻列着二十九个项目的名字。魏允把文件放下的同时，把这个月收到的请托列了一张清单，十七项，其中三项来自同一个县——胡悉的青弋县，一个目前还没有一条二级公路的山区县，也是钱广白老家。\n","city":"省级","min_rank":7,"max_rank":10,"weight":4,"once":true,"need":{"min_money":0,"max_money":0,"min_risk":0,"min_probe":0,"min_year":8,"flag":null,"no_flag":null,"min_merit":0,"min_boss":0,"min_net":0,"min_pop":0},"tags":["土地","城建","招商"],"options":[{"label":"打分排序，公示结果","text":"\n你定了一条规矩：按投资强度、就业带动、亩均税收打分，得分排序，结果在省报和网站上公示。公示第三天收到六封异议信，你逐封核了，改了两个。钱广白那个县一分没拿。半年后有两家企业因此转投邻省，有人骂你死脑筋。年底亩均税收提高了百分之十四，没人再提那两家走掉的企业。\n","effects":{"money":0,"risk":-4,"merit":9,"pop":8,"boss":3,"net":-2,"health":-2,"stress":7,"family":0,"probe":-4,"clean":5,"offshore":0},"flag":"honest_path","unflag":null,"ending":null,"next":null},{"label":"指标换现金，一亩一万","text":"\n你把三千亩分给了六个老板，价格是每亩一万二到两万不等，一共收了四千三百万。钱走的是\"咨询费\"和\"借款\"，借条你都留着，一张没撕。那些地后来一半闲置，长了八年的荒草。你在多年后路过其中一块，车停在路边，你摇下车窗看了很久，草比人高。\n","effects":{"money":4300,"risk":19,"merit":-3,"pop":-8,"boss":2,"net":8,"health":-2,"stress":15,"family":0,"probe":13,"clean":-16,"offshore":0},"flag":"took_first_bribe","unflag":null,"ending":null,"next":null},{"label":"一半给关系，一半给穷县","text":"\n你划出一千五百亩给七个贫困县的产业园，剩下的一千五百亩按老规矩分。你对自己说这是\"既要发展又要人情\"。十年后，那一千五百亩里长出三家像样的企业，也长出一个副厅级干部的家族产业。你后来才明白，一半的干净，等于全部都不干净，只是账难算一些。\n","effects":{"money":1500,"risk":12,"merit":6,"pop":2,"boss":3,"net":6,"health":-2,"stress":10,"family":0,"probe":7,"clean":-8,"offshore":0},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"把指标变成股份","text":"\n你不要现金，要干股。三千亩落地的六个项目里，你通过两家代持公司持有百分之八到十五不等的隐形股份。此后八年，这些项目陆续产生分红，一共一亿一千万。你成了全省最富的人之一，也是最不敢生病的人之一——因为你一旦住院，那些代持协议就会被人翻出来。\n","effects":{"money":3000,"risk":23,"merit":3,"pop":-6,"boss":2,"net":10,"health":-4,"stress":20,"family":-2,"probe":17,"clean":-18,"offshore":2000},"flag":"company_x","unflag":null,"ending":null,"next":null}]},{"id":"sg_016","title":"第七张金融牌照","text":"\n联邦里只发了六张民营银行牌照，川平一张没有。这一次，省里推荐两家：柏世钧的钧天资本牵头，另一家是本地一家做实业的集团。评审会在省城宾馆开两天，第一天柏世钧没来，第二天他来了，只讲了一件事：他准备把总部设在胡悉。全场安静了三秒——所有人都听懂了，那是全省最穷的地方，也是省里最想扶持的地方。\n","city":"省级","min_rank":7,"max_rank":10,"weight":4,"once":true,"need":{"min_money":0,"max_money":0,"min_risk":0,"min_probe":0,"min_year":9,"flag":null,"no_flag":null,"min_merit":0,"min_boss":0,"min_net":0,"min_pop":0},"tags":["金融","招商","上级"],"options":[{"label":"按评审得分推荐","text":"\n评审组给了实业集团八十二分，钧天七十六分，你照排推荐。柏世钧在走廊上笑着说了句：领导有原则。三年后这家银行在川平开了十九家支行，专门做小微，不良率百分之一点二，是全省最低。你在一次会上拿它举例讲了十分钟，讲完才发现，这是你任内唯一拿得出手的金融故事。\n","effects":{"money":0,"risk":-3,"merit":10,"pop":7,"boss":4,"net":1,"health":-1,"stress":6,"family":0,"probe":-2,"clean":4,"offshore":0},"flag":"honest_path","unflag":null,"ending":null,"next":null},{"label":"推荐钧天，拿两个点","text":"\n你在省里的推荐意见上签了字，理由写得漂亮：支持总部经济、支持贫困地区。钧天拿到牌照后，你以亲属名义持有一点九个点，账面价值四亿七千万。这家银行后来做了大量关联贷款，五年后不良率百分之十九，被接管。你那一点九个点，从四亿七千万变成了一个案卷里的一个数字。\n","effects":{"money":5200,"risk":22,"merit":4,"pop":-6,"boss":6,"net":9,"health":-3,"stress":18,"family":-2,"probe":16,"clean":-17,"offshore":3000},"flag":"company_x","unflag":null,"ending":null,"next":null},{"label":"两家都报，让上面定","text":"\n你把两份材料一起报了上去，附了一句\"均具备条件，请予审定\"。上面批了实业集团。柏世钧从此不再跟你来往，也没为难你——他只是不再来往。你在省里少了一条最重要的资金通道，也少了一个最危险的朋友。多年以后你回想，这可能是你一生中最划算的一次推卸。\n","effects":{"money":0,"risk":5,"merit":4,"pop":2,"boss":1,"net":-3,"health":-1,"stress":8,"family":0,"probe":2,"clean":-2,"offshore":0},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"先给牌照，再要回报","text":"\n你帮钧天拿下牌照，但当时一分钱不要。三年后，钧天银行给你儿子沈知远的境外公司批了一笔六亿的授信，抵押物是一块估值虚高三倍的商业用地。你觉得这是最安全的方式：钱不是我的，是银行借给公司的。你忘了问一句话——银行的每一笔授信，最后都要有人签字。\n","effects":{"money":2500,"risk":25,"merit":3,"pop":-5,"boss":4,"net":8,"health":-3,"stress":21,"family":-5,"probe":20,"clean":-19,"offshore":4000},"flag":"family_abroad","unflag":null,"ending":null,"next":null}]},{"id":"sg_017","title":"三十七亿专项的分配表","text":"\n部委下来一笔三十七亿的老工业基地改造专项，分配权在省里。你桌上摆着三份方案：发改委按项目成熟度排的、财政按财政困难程度排的、还有一份是严省长用铅笔在餐巾纸上写的七个市的名字。三份名单只有两个市重合。晚上九点，你在办公室，桌上是三张纸和一杯已经凉了的茶。魏允进来问要不要热一下，你说不用。\n","city":"省级","min_rank":7,"max_rank":10,"weight":5,"once":true,"need":{"min_money":0,"max_money":0,"min_risk":0,"min_probe":0,"min_year":9,"flag":null,"no_flag":null,"min_merit":0,"min_boss":0,"min_net":0,"min_pop":0},"tags":["工程","上级","审计","招商"],"options":[{"label":"交给专家评审定","text":"\n你把三份方案都收起来，交给由十九位专家组成的评审委员会，全程录像，结果公示。河冬拿了十一点四亿，胡悉九点二亿，江百因为制度严、项目实，反而拿得最多。省里有人骂你胳膊肘往外拐。三年后审计总署来查这笔钱，合格率百分之九十八点六，是全省历次专项里最高的。\n","effects":{"money":0,"risk":-5,"merit":11,"pop":9,"boss":-3,"net":-1,"health":-2,"stress":8,"family":0,"probe":-6,"clean":6,"offshore":0},"flag":"honest_path","unflag":null,"ending":null,"next":null},{"label":"按省长的名单办","text":"\n你照餐巾纸上的七个名字办了。三十七亿下去，六个市皆大欢喜，只有一个县拿了钱却迟迟不开工。你在两年后的审计整改会上被点了名，做了检讨。严省长拍拍你的肩说：担着点。那一刻你意识到，所谓自己人，就是出事时有人替你说一句\"担着点\"，然后让你一个人担着。\n","effects":{"money":800,"risk":14,"merit":5,"pop":-1,"boss":10,"net":6,"health":-2,"stress":13,"family":0,"probe":9,"clean":-10,"offshore":0},"flag":"boss_backed","unflag":null,"ending":null,"next":null},{"label":"留十个亿做机动","text":"\n你从三十七亿里留出十个亿作为\"后续奖励资金\"，不进分配表，由你和财政厅长双签。这十个亿后来救了四个烂尾项目，也养肥了三家公司。你的账本上，这十个亿一半记在公，一半记在私。人这一辈子最难的，是分不清哪一半是自己给自己找的借口。\n","effects":{"money":2600,"risk":16,"merit":7,"pop":1,"boss":4,"net":7,"health":-2,"stress":14,"family":0,"probe":10,"clean":-12,"offshore":0},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"把钱引到指定企业","text":"\n你在专项资金管理办法里加了一条：优先支持\"具备全产业链整合能力\"的企业。全省符合这一条的只有三家，其中两家和卓衡有关。二十九亿流了过去。你收了六千八百万，全部走境外，分十一笔。三年后这二十九亿形成的不良资产是十四个亿，而你要还的，不止十四个亿。\n","effects":{"money":6800,"risk":24,"merit":3,"pop":-7,"boss":3,"net":9,"health":-4,"stress":21,"family":-1,"probe":18,"clean":-20,"offshore":5000},"flag":"company_x","unflag":null,"ending":null,"next":null}]},{"id":"sg_018","title":"七个县书记的位子","text":"\n换届年，七个县的县委书记要动。你分管组织这一块的一个星期里，办公室的门被敲响过二十六次，桌上多了十九份材料，手机里多了三十四条拜年短信，其中四条发错了人。最让你在意的是胡悉青弋县：那个县连续三任书记出事，没人愿意去。组织部副部长说，实在不行，就从省里派。\n","city":"省级","min_rank":7,"max_rank":10,"weight":5,"once":true,"need":{"min_money":0,"max_money":0,"min_risk":0,"min_probe":0,"min_year":9,"flag":null,"no_flag":null,"min_merit":0,"min_boss":0,"min_net":0,"min_pop":0},"tags":["人事","换届","同僚"],"options":[{"label":"按考核结果配，公示","text":"\n你把七个位子全按近三年考核排，公示七天，收到九封举报，查实两件，撤了两个。青弋县来了个四十二岁的女干部，三年后那个县的贫困发生率从百分之十七降到百分之二。她给你写过一封信，信里没提谢字，只说县里通了自来水。你把信夹在笔记本里，夹了八年。\n","effects":{"money":0,"risk":-4,"merit":12,"pop":10,"boss":4,"net":1,"health":-2,"stress":9,"family":0,"probe":-5,"clean":6,"offshore":0},"flag":"honest_path","unflag":null,"ending":null,"next":null},{"label":"明码标价，按县论价","text":"\n七个位子，按县的肥瘦分成三档：两个富县三百万，三个中等县一百五十万，两个穷县八十万。一共一千一百六十万。你收得很小心，全用现金，全是中间人转交。五年后，这七个人里进去了四个，其中两个在交代材料里，把金额、时间、地点写得比你自己记得还清楚。\n","effects":{"money":1160,"risk":20,"merit":-4,"pop":-9,"boss":-4,"net":7,"health":-3,"stress":17,"family":0,"probe":15,"clean":-18,"offshore":0},"flag":"took_first_bribe","unflag":null,"ending":null,"next":null},{"label":"只安排自己人三个","text":"\n你把两个富县和一个关键的中等县留给跟了自己多年的人，其余四个按规矩办。你觉得自己克制。六年后，那三个\"自己人\"里有一个出事，供出你时说的第一句话是：他一直很照顾我。这句话被写进笔录，你看到时愣了很久——他说的是事实，可事实听起来比诬告还狠。\n","effects":{"money":900,"risk":15,"merit":4,"pop":-3,"boss":2,"net":9,"health":-2,"stress":12,"family":0,"probe":10,"clean":-12,"offshore":0},"flag":"has_faction","unflag":null,"ending":null,"next":null},{"label":"自己请缨去青弋","text":"\n你在常委会上说：青弋没人愿意去，我去兼。全场安静了大概七秒。洪书记说你不要冲动。你说这不叫冲动，这叫还账——三任书记出事，说明省里失职。你兼了一年零四个月，跑了全县一百四十七个村。你瘦了十九斤，也第一次知道一斤米在村里能换多少东西。这一年在你的履历上，是最不起眼的一行。\n","effects":{"money":0,"risk":-6,"merit":14,"pop":15,"boss":-2,"net":-2,"health":-8,"stress":12,"family":-4,"probe":-8,"clean":6,"offshore":0},"flag":"honest_path","unflag":null,"ending":null,"next":null}]},{"id":"sg_019","title":"表弟的公司","text":"\n表弟苟全从老家来，提着两只活鸡，说他在省城注册了一家公司，做建材贸易。他说得很朴素：哥，我不懂别的，我就是想把日子过好一点。你看着他手上那道年轻时留下的疤，想起小时候你俩在河里摸鱼。他走后，魏允把一份材料放在你桌上：这家公司成立二十天，已经拿到了两个省属项目的供应商资格。\n","city":"省级","min_rank":7,"max_rank":10,"weight":4,"once":true,"need":{"min_money":0,"max_money":0,"min_risk":0,"min_probe":0,"min_year":8,"flag":null,"no_flag":null,"min_merit":0,"min_boss":0,"min_net":0,"min_pop":0},"tags":["家属","工程","同僚"],"options":[{"label":"让他退出省属项目","text":"\n你当天晚上把苟全叫来，让他退出所有省属项目，去做他真正懂的建材零售。他不理解，你没解释，只给了他五万块钱，是你自己的工资。他后来在省城开了一家小店，卖瓷砖。你每次路过都绕着走。十年后你出事，全家族只有他一个人，在门口对记者说了句：我哥不是坏人。\n","effects":{"money":-5,"risk":-6,"merit":2,"pop":3,"boss":1,"net":-1,"health":0,"stress":-5,"family":5,"probe":-5,"clean":6,"offshore":0},"flag":"honest_path","unflag":null,"ending":null,"next":null},{"label":"默许，只定一条底线","text":"\n你只跟他说了一条：不许提我的名字。他做到了，做到了七年。七年里他的公司从三个人做到两百人，年营收七个亿，你拿了其中三成，一共一亿三千万。你不后悔帮他，你只是后悔那条底线定得太低——低到足以让人绕过去，低到你以为自己还有底线。\n","effects":{"money":5000,"risk":21,"merit":3,"pop":-4,"boss":3,"net":8,"health":-3,"stress":17,"family":3,"probe":14,"clean":-17,"offshore":2000},"flag":"company_x","unflag":null,"ending":null,"next":null},{"label":"让他做出资人，你做后台","text":"\n你出主意，他出面。此后五年，苟全成了全省最有名的\"不是老板的老板\"：他不参与经营，只在股权书上签字，签完就去打牌。你以为这样安全——一个傻乎乎的表弟，比一个精明的白手套可信。你忘了一条：傻子签的字，同样具有法律效力，而且更容易被吓哭。\n","effects":{"money":3600,"risk":22,"merit":2,"pop":-5,"boss":2,"net":7,"health":-3,"stress":18,"family":-3,"probe":16,"clean":-16,"offshore":1500},"flag":"company_x","unflag":null,"ending":null,"next":null},{"label":"把他送进核心管道","text":"\n你让他做的不只是建材。城建、环保、文旅、矿业，每一块都有他的一点股份，加起来十一家公司。你构建了一张全省最完整的白手套网络，也构建了一份全省最完整的证据链——十一家公司，十九本账，二十七个签字人。调查组后来只用了其中一家的账，就把整张网提了起来。\n","effects":{"money":7500,"risk":25,"merit":3,"pop":-6,"boss":4,"net":11,"health":-4,"stress":23,"family":-6,"probe":21,"clean":-20,"offshore":4000},"flag":"company_x","unflag":null,"ending":null,"next":null}]},{"id":"sg_020","title":"家族基金的第一笔","text":"\n柏世钧在省城宾馆请了一位境外律师，让你见一面。律师讲了两小时，PPT 一共七十四页，关键词是\"隔离\"\"代持\"\"不可撤销\"。柏世钧全程只说了一句话：领导，钱放在自己名下，是负担；放在结构里，是资产。散场时律师递给你一份意向书，第一页的空白处要填一个数字，最小一千万。窗外省城在下雨，你忽然想起父亲临终时说的那句：别让钱害了你。\n","city":"省级","min_rank":7,"max_rank":10,"weight":4,"once":true,"need":{"min_money":0,"max_money":0,"min_risk":0,"min_probe":0,"min_year":9,"flag":null,"no_flag":null,"min_merit":0,"min_boss":0,"min_net":0,"min_pop":0},"tags":["金融","出国","家属"],"options":[{"label":"送客，一分不进","text":"\n你把意向书推回去，说这个我不懂，也不想懂。柏世钧笑了笑，说理解。此后你依然用工资卡，依然自己交物业费。二十年后你的存款是七十三万，房子是当年分的。你在晚年最常做的一件事，是在阳台上给花浇水，浇完坐在那儿，看楼下的人来人往，一样也不欠。\n","effects":{"money":0,"risk":-7,"merit":2,"pop":4,"boss":0,"net":-3,"health":1,"stress":-12,"family":3,"probe":-7,"clean":6,"offshore":0},"flag":"honest_path","unflag":null,"ending":null,"next":null},{"label":"先放一千万试试","text":"\n你填了一千万。三年后这个数字变成四千七百万，利息、分红、股权增值，一层一层加进来。你每隔半年看一次报表，看的时候心跳会比平时快十下。你告诉自己这是理财。你不告诉自己的是：一个省级干部的合法收入，一辈子也攒不出四千七百万。\n","effects":{"money":1000,"risk":16,"merit":0,"pop":-1,"boss":2,"net":6,"health":-2,"stress":13,"family":1,"probe":11,"clean":-14,"offshore":4000},"flag":"offshore_ready","unflag":null,"ending":null,"next":null},{"label":"以子女名义设，不写自己","text":"\n你坚持不写自己的名字，只写儿子沈知远。律师说这样更安全。此后六年，这个结构里进了一亿两千万，你在法律上和它毫无关系。直到有一天，沈知远在电话里问你：爸，这钱我要是用了，会不会有事。你没答上来。你设计了全世界最复杂的结构，没算到一个二十三岁年轻人的一句提问。\n","effects":{"money":2000,"risk":19,"merit":0,"pop":-2,"boss":1,"net":7,"health":-3,"stress":17,"family":-6,"probe":14,"clean":-16,"offshore":6000},"flag":"family_abroad","unflag":null,"ending":null,"next":null},{"label":"全押，把家底搬过去","text":"\n你填了一个让律师都抬了抬眉毛的数字：八千万，几乎是你全部的暗财。此后你成了那套结构里最大的出资人，也成了它最脆弱的一环——因为一旦有人查，第一个被查的就是最大的那个。你每个月要看三次报表，看一次瘦一斤。五年里你瘦了十四斤，看起来精神极了。\n","effects":{"money":3000,"risk":26,"merit":0,"pop":-3,"boss":3,"net":9,"health":-5,"stress":24,"family":-4,"probe":22,"clean":-20,"offshore":8000},"flag":"offshore_ready","unflag":null,"ending":null,"next":null}]},{"id":"sg_021","title":"海外账户的七个签名","text":"\n境外那家私人银行寄来一份开户文件，厚厚的三十一页，需要七个签名。魏允把文件送到你手上时说了句：第七个签名要本人面签，地点在境外。你把文件翻到最后一页，看见受益人一栏写着一串你看不懂的字母组合。妻子甄淑筠推门进来送药，看了一眼封面，什么也没问，把药放下就出去了。门关上的声音很轻。\n","city":"省级","min_rank":7,"max_rank":10,"weight":4,"once":true,"need":{"min_money":2000,"max_money":0,"min_risk":0,"min_probe":0,"min_year":9,"flag":null,"no_flag":null,"min_merit":0,"min_boss":0,"min_net":0,"min_pop":0},"tags":["出国","金融","家属"],"options":[{"label":"撕掉，从头清账","text":"\n你把三十一页文件一张张撕了，撕得很慢，撕完装进垃圾袋，亲手拎下楼扔进垃圾桶。第二天你把这几年说不清的钱一笔笔列出来，能退的退，退不了的交给组织说明。你损失了一亿多，换来的是此后每一个夜晚都能睡着。你老婆说，你打呼噜的声音都变好听了。\n","effects":{"money":-3000,"risk":-16,"merit":0,"pop":2,"boss":-4,"net":-2,"health":4,"stress":-20,"family":6,"probe":-18,"clean":8,"offshore":0},"flag":"reformed","unflag":null,"ending":null,"next":null},{"label":"面签，一次到位","text":"\n你借一次出访的机会绕道过去，在一家没有招牌的写字楼里签了四十分钟。回来时你在飞机上睡了七个小时，是三年来睡得最沉的一次。此后五年，这个账户里进了一亿七千万。而你也开始在每一次出境时，都要提前三天查一查航班有没有变动。\n","effects":{"money":2500,"risk":20,"merit":0,"pop":-2,"boss":2,"net":7,"health":-3,"stress":18,"family":-2,"probe":15,"clean":-17,"offshore":7000},"flag":"offshore_ready","unflag":null,"ending":null,"next":null},{"label":"让妻子去签","text":"\n你没去，让甄淑筠在探亲的名义下去了。她回来那天没说话，只把护照放进抽屉，放得很深。此后这个账户的所有指令都由她发出。你把风险转嫁给了最亲近的人，也把恐惧转嫁给了她。三年后她开始整夜失眠，你给她买安神药，一买就是六年。\n","effects":{"money":1800,"risk":17,"merit":0,"pop":0,"boss":1,"net":5,"health":-2,"stress":15,"family":-8,"probe":12,"clean":-15,"offshore":5000},"flag":"family_abroad","unflag":null,"ending":null,"next":null},{"label":"让老板代持，不签自己","text":"\n你把账户的控制权交给钱广白，条件是\"我不签字，你保管\"。第一年一切正常，第三年他开始以你的名义在外面借钱，第五年他把这个账户里的一部分转走了。你不敢报案，也不敢追问。你终于理解了一个道理：把命交给别人保管的人，命就不是自己的了。\n","effects":{"money":-1500,"risk":24,"merit":0,"pop":0,"boss":0,"net":-4,"health":-5,"stress":25,"family":-3,"probe":19,"clean":-16,"offshore":1000},"flag":null,"unflag":null,"ending":null,"next":null}]},{"id":"sg_022","title":"矿业整合的最后一刀","text":"\n全省一千三百二十七座矿山要整合成一百八十座。这一步走完，唐厉的厉丰矿业将控制其中四十一座。反对意见来自胡悉：那边的矿养活着三万多人，整合后要裁掉一万二。你在会上听完两边的发言，看了看法条，又看了看窗外。楼下院子里停着三辆车，其中一辆是唐厉的，另外两辆你不认识。\n","city":"省级","min_rank":7,"max_rank":10,"weight":4,"once":true,"need":{"min_money":0,"max_money":0,"min_risk":0,"min_probe":0,"min_year":9,"flag":null,"no_flag":null,"min_merit":0,"min_boss":0,"min_net":0,"min_pop":0},"tags":["矿","工程","维稳","环保"],"options":[{"label":"加一条安置硬约束","text":"\n你在整合方案里加了一条：每关闭一座矿，必须配套一份职工安置方案和一个生态修复保证金，两项不落实，不许关。唐厉当场脸就变了。一年后整合完成，一万二千人里九千七百人转岗到复垦和物流，三千人拿补偿返乡。你在信访大厅坐过一整天，听完了四十七个人的抱怨，一个都没推。\n","effects":{"money":0,"risk":-3,"merit":12,"pop":12,"boss":2,"net":-2,"health":-4,"stress":13,"family":0,"probe":-3,"clean":5,"offshore":0},"flag":"honest_path","unflag":null,"ending":null,"next":null},{"label":"批给厉丰，收三千万","text":"\n你批了方案，也批了唐厉的三千万。此后两年，那些矿上的安全事故多了起来，一共死了十一个人。每一份事故报告送到你手上时，你都要签一个\"阅\"字。第十一个死者的名字你记不住，但你记得那张纸上有一处被水浸过的痕迹，不知是雨还是别的什么。\n","effects":{"money":3000,"risk":21,"merit":4,"pop":-10,"boss":4,"net":8,"health":-3,"stress":19,"family":0,"probe":15,"clean":-18,"offshore":1500},"flag":"accident","unflag":null,"ending":null,"next":null},{"label":"暂停整合，先做试点","text":"\n你以\"情况复杂\"为由把方案压了八个月，先在胡悉的两个县做试点。试点暴露出二十七个问题，方案改了四稿。整合最终完成，比原计划晚了两年，代价是多花了九亿财政资金。评审组说你保守。三年后邻省照抄川平原方案，出了一个四十七人的事故，你半夜在电视上看到新闻，坐了很久。\n","effects":{"money":0,"risk":-2,"merit":8,"pop":6,"boss":-2,"net":0,"health":-3,"stress":11,"family":0,"probe":-2,"clean":3,"offshore":0},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"借整合低价收矿","text":"\n你以整合为名压低评估价，让厉丰拿下四十一座矿中的二十八座，实际价值是评估价的三点七倍。差价里的十二个点，通过三级公司回到了你手里，一共一亿四千万。这件事做得天衣无缝，只在一个人心里留下了缝——那个替你做评估的年轻人，后来考上了审计总署。\n","effects":{"money":7800,"risk":25,"merit":5,"pop":-9,"boss":5,"net":10,"health":-4,"stress":22,"family":-2,"probe":20,"clean":-20,"offshore":5000},"flag":"company_x","unflag":null,"ending":null,"next":null}]},{"id":"sg_023","title":"国家级新区的申报","text":"\n川平要申报国家级新区，选址有两个：江百的临港片区、河冬的老工业区。部委来的专家组在省城待了十一天，走的时候带走四箱材料。临行前一晚，河冬市委书记施明焕在你办公室坐到十一点半，说的最后一句话是：河冬的工人已经等了二十年。第二天早上，江百的罗砚在食堂拦住你，说了六个字：领导，别感情用事。\n","city":"省级","min_rank":7,"max_rank":10,"weight":4,"once":true,"need":{"min_money":0,"max_money":0,"min_risk":0,"min_probe":0,"min_year":9,"flag":null,"no_flag":null,"min_merit":0,"min_boss":0,"min_net":0,"min_pop":0},"tags":["城建","招商","上级","工程"],"options":[{"label":"按专家组意见报临港","text":"\n你按专家组的评分报了临港。河冬那边你去了三趟，一趟看厂，一趟看人，一趟讲政策——三年后省里单独给河冬批了一个老工业区搬迁改造试点，钱比新区少，但够用。施明焕在你离任时送你一件厂里自己做的模型，底座上刻着一行小字：谢谢你还来过。\n","effects":{"money":0,"risk":-2,"merit":11,"pop":8,"boss":5,"net":2,"health":-2,"stress":8,"family":0,"probe":-1,"clean":4,"offshore":0},"flag":"honest_path","unflag":null,"ending":null,"next":null},{"label":"报河冬，收江百的补偿","text":"\n你报了河冬，理由写得非常动情。江百那边损失巨大，钱广白\"理解\"了你，作为补偿，你在临港的另一块地上给了他三个点的便利，价值四千二百万。两年后新区批下来，河冬的工人在广场上放鞭炮，你在主席台上讲话，讲到一个词——公平，自己停顿了半秒。\n","effects":{"money":4200,"risk":18,"merit":8,"pop":4,"boss":3,"net":6,"health":-2,"stress":14,"family":0,"probe":12,"clean":-14,"offshore":0},"flag":"company_x","unflag":null,"ending":null,"next":null},{"label":"两个都报，一并争取","text":"\n你把两个方案合并成一个\"一区两片\"的方案报上去，这在体制内是罕见的创意。上面研究了一年，批了，但只批了临港一片。你至少为河冬争到了一个国家级牌子下的配套政策。你在两个市都不得罪，也都不讨好。体制最擅长的事，就是让想两边讨好的人，两边都不讨好。\n","effects":{"money":0,"risk":4,"merit":7,"pop":3,"boss":2,"net":3,"health":-2,"stress":10,"family":0,"probe":1,"clean":0,"offshore":0},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"拿申报信息换钱","text":"\n部委内部传出一个消息：新区范围可能调整。你把这个消息提前四十八小时透露给了闻九皋，他在范围划定前夜突击拿下了三块地，一年后获利九亿。他给你一亿一千万。你只用四十八小时赚到了过去半辈子赚不到的钱，也用四十八小时，把自己变成了一个可以被一句话毁掉的人。\n","effects":{"money":8000,"risk":26,"merit":3,"pop":-8,"boss":2,"net":9,"health":-4,"stress":23,"family":-2,"probe":22,"clean":-20,"offshore":5000},"flag":"company_x","unflag":null,"ending":null,"next":null}]},{"id":"sg_024","title":"员工持股名册","text":"\n省属企业混改，允许管理层和核心技术骨干持股。方案送到你手上时，名册一共一百七十三人。你翻到第三页，看见了三个熟悉的名字：你外甥邹勉、钱广白的表侄、以及一个在省属企业挂名的年轻人——那年轻人的父亲，是部里一位能决定川平项目命运的司长。名册后面附着一行小字：以上人员须报省里审定。\n","city":"省级","min_rank":7,"max_rank":10,"weight":4,"once":true,"need":{"min_money":0,"max_money":0,"min_risk":0,"min_probe":0,"min_year":9,"flag":null,"no_flag":null,"min_merit":0,"min_boss":0,"min_net":0,"min_pop":0},"tags":["金融","人事","上级","工程"],"options":[{"label":"全打回，重新认定资格","text":"\n你把名册全打回去，要求按工龄、岗位、技术等级重新认定，并在内部公示。最终名单从一百七十三人变成四百二十九人，一线工人占了六成。那三个熟悉的名字一个都没留下。你在企业内部网上的留言里，第一次看见有人用粗话骂你，也第一次看见有人写：这次是真的。\n","effects":{"money":0,"risk":-4,"merit":10,"pop":9,"boss":-3,"net":-2,"health":-2,"stress":9,"family":-3,"probe":-5,"clean":6,"offshore":0},"flag":"honest_path","unflag":null,"ending":null,"next":null},{"label":"删掉两个，留一个","text":"\n你删掉了外甥和钱广白的表侄，留下了那位司长的儿子。你的算盘很清楚：得罪自己人容易，得罪上面难。两年后这家企业上市，那位年轻人账面身家三亿七千万。部里的专项也顺顺当当批了下来。你以为自己做了一次精准的取舍，其实只是给自己留了一根最结实的绳子。\n","effects":{"money":1500,"risk":17,"merit":6,"pop":-3,"boss":9,"net":8,"health":-2,"stress":14,"family":-4,"probe":12,"clean":-13,"offshore":0},"flag":"boss_backed","unflag":null,"ending":null,"next":null},{"label":"照单全收，加上自己人","text":"\n你照单全收，又添了九个名字，其中三个是你多年的老部下。一百八十二人持股，成了全省混改的样板，材料上报时得到了表扬。三年后这家企业出了事，调查组调取名册，第一个问题就是：多出来的那九个人，是谁加的。名册上有你的签名，而且是唯一一个。\n","effects":{"money":3800,"risk":23,"merit":5,"pop":-6,"boss":4,"net":9,"health":-3,"stress":19,"family":-3,"probe":18,"clean":-18,"offshore":2000},"flag":"has_faction","unflag":null,"ending":null,"next":null},{"label":"借名册做一次交易","text":"\n你把名册当成了筹码：把这个省属企业的持股资格，换成部里那位司长对另一个项目的放行。交易没有一句话，只有两通电话和一次饭局上的眼神。你什么也没拿，钱也没进你的口袋。可五年后，调查组把这件事定性得比收钱还重——他们说这叫利益输送，而且送的是公家的东西。\n","effects":{"money":0,"risk":22,"merit":7,"pop":-2,"boss":10,"net":11,"health":-3,"stress":20,"family":0,"probe":17,"clean":-15,"offshore":0},"flag":"has_faction","unflag":null,"ending":null,"next":null}]},{"id":"sg_025","title":"巡视组进驻的公告","text":"\n省报头版右下角，一块豆腐块大的公告：中央巡视组进驻川平，时间两个月，组长阚明夷，副组长慎修文，附两个电话号码和一个邮政信箱。公告见报当天，省政府大楼的电梯里没人说话。中午食堂的桌子比平时少了四张。你的手机上，有七个未接来电——都是同一个区号的，你一个都不认识。下午三点，魏允低声说：巡视组要的第一批材料清单下来了，九十项。\n","city":"省级","min_rank":7,"max_rank":10,"weight":5,"once":true,"need":{"min_money":0,"max_money":0,"min_risk":0,"min_probe":0,"min_year":9,"flag":null,"no_flag":null,"min_merit":0,"min_boss":0,"min_net":0,"min_pop":0},"tags":["巡视","上级","审计"],"options":[{"label":"如实提供，主动补报","text":"\n九十项材料，七天之内全部提供，一份不缺。你另外主动交了一份个人事项说明，把妻子名下的两家公司、儿子境外读书的费用来源，一笔笔写清。巡视组约谈你三次，每次你都说同样的话。巡视结束时，反馈意见里没有你的名字。你在两个月里瘦了十一斤，也第一次体会到：如实交代时，声音会很稳。\n","effects":{"money":0,"risk":-8,"merit":3,"pop":4,"boss":2,"net":-1,"health":-5,"stress":18,"family":4,"probe":-22,"clean":7,"offshore":0},"flag":"inspected","unflag":null,"ending":null,"next":null},{"label":"补材料，把漏洞糊上","text":"\n你组织了八个人连夜补了十九份会议纪要、补签了十一个日期、把三笔钱的来路改成了借款。巡视组的一位年轻人问了一个很简单的问题：这份纪要为什么用的是新纸。你答不上来。两个月后巡视组走了，反馈意见里有六个字：个别干部有问题。这六个字，像一根钉子，钉在那里三年没拔。\n","effects":{"money":0,"risk":20,"merit":0,"pop":-3,"boss":0,"net":2,"health":-6,"stress":25,"family":-2,"probe":24,"clean":-14,"offshore":0},"flag":"inspected","unflag":null,"ending":null,"next":null},{"label":"病休，躲过两个月","text":"\n你请了一个半月的病假，住进医院。巡视组两次派人来医院谈话，你都在输液。出院那天，巡视组还在，但已经进入收尾阶段。你躲过了大部分谈话，也躲不掉一件事：你不在的这些天，很多人替你说了话，那些话里有多少是真的，你永远不知道。\n","effects":{"money":0,"risk":6,"merit":-4,"pop":-2,"boss":-3,"net":-4,"health":2,"stress":16,"family":0,"probe":8,"clean":-3,"offshore":0},"flag":"inspected","unflag":null,"ending":null,"next":null},{"label":"主动约见组长谈一次","text":"\n你通过正常渠道约见阚明夷，谈了五十分钟，把该说的说了，不该说的也说了七分。他全程只说了三句话，其中一句是：你说的这些，我会记下来。两年后他被问起这次谈话，他说：那个人自己走过来了。这句话救了你，也让你在别人眼里，成了一个不可托付秘密的人。\n","effects":{"money":0,"risk":10,"merit":0,"pop":3,"boss":-6,"net":-7,"health":-4,"stress":22,"family":-2,"probe":-15,"clean":4,"offshore":0},"flag":"reformed","unflag":null,"ending":null,"next":null}]},{"id":"sg_026","title":"专项巡视：工程领域","text":"\n这一次不是全面巡视，是专项：只查工程。巡视组调取了近五年全省五千万元以上项目的全套资料，一共三千一百多卷，装了十一辆卡车。清单上第一个项目就是川平环线。你在办公室里把七年前的那次会议在脑子里过了三遍，怎么开的、谁说的、你签在哪一页。你忽然发现，你记不清自己当时签的是\"同意\"还是\"原则同意\"。这两个词之间，隔着很多年。\n","city":"省级","min_rank":7,"max_rank":10,"weight":5,"once":true,"need":{"min_money":0,"max_money":0,"min_risk":0,"min_probe":0,"min_year":10,"flag":null,"no_flag":null,"min_merit":0,"min_boss":0,"min_net":0,"min_pop":0},"tags":["巡视","工程","审计"],"options":[{"label":"配合，并主动说明疑点","text":"\n你不但配合，还主动交了一份《关于川平环线三个问题的说明》，把当年你签字的经过、你反对过的意见、以及你没有坚持的原因，全都写了。巡视组把它作为线索转给了省纪委。半年后，环线工程有九个人被处理，你不在其中，但你在全省干部大会上被点了名——不是表扬，是\"说明\"。\n","effects":{"money":0,"risk":-6,"merit":-2,"pop":5,"boss":-2,"net":-5,"health":-4,"stress":20,"family":2,"probe":-20,"clean":6,"offshore":0},"flag":"reformed","unflag":null,"ending":null,"next":null},{"label":"串供，统一口径","text":"\n你在省城宾馆开了一个会，到场九个人，只讲了一件事：怎么说。会议纪要没有，手机全部上交。三个月后，这九个人里有一个先扛不住了，他把那个没有纪要的会，讲得比有纪要还详细。你这才明白，串供最有效的产物不是统一口径，而是多一条罪。\n","effects":{"money":0,"risk":26,"merit":0,"pop":-6,"boss":-4,"net":-3,"health":-6,"stress":25,"family":-2,"probe":26,"clean":-18,"offshore":0},"flag":"inspected","unflag":null,"ending":null,"next":null},{"label":"找人递话，希望能缓一缓","text":"\n你通过三条线去找能说上话的人，花了一千六百万。最后得到的回答都一样：这次是专项，没法缓。钱花出去了，话没递到。更要命的是，这三条线本身成了新的线索——为了摆平一件事，你又制造了三件事。贪腐最像的东西是 weeds：你拔一根，根还在土里。\n","effects":{"money":-1600,"risk":24,"merit":0,"pop":-4,"boss":-5,"net":-6,"health":-5,"stress":24,"family":-2,"probe":25,"clean":-16,"offshore":0},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"把当年的反对证据翻出来","text":"\n你翻出了七年前的四份会议记录草稿和两封内部邮件，其中明确写着你反对南线。这些材料是真的——你当年确实反对过，后来确实妥协了。你把材料交上去，换来一句\"当时确有不同的意见\"。它没能洗清你，但让它从\"主导\"变成了\"附和\"。两个字之差，是六年和十一年的区别。\n","effects":{"money":0,"risk":-3,"merit":0,"pop":0,"boss":-1,"net":-2,"health":-3,"stress":14,"family":0,"probe":-12,"clean":2,"offshore":0},"flag":null,"unflag":null,"ending":null,"next":null}]},{"id":"sg_027","title":"回头看","text":"\n巡视\"回头看\"的通知比上次短，只有一页纸，落款的日期是你生日的后一天。上一次巡视的整改清单共有三十七条，其中你牵头的十一条。秘书把整改台账搬来，厚厚的三本。你随手翻开第一本，第一条的落实情况写着：已整改，长期坚持。你盯着\"长期坚持\"四个字看了很久——这四个字，是官场里最温柔的一句空话。\n","city":"省级","min_rank":7,"max_rank":10,"weight":5,"once":true,"need":{"min_money":0,"max_money":0,"min_risk":0,"min_probe":0,"min_year":10,"flag":"inspected","no_flag":null,"min_merit":0,"min_boss":0,"min_net":0,"min_pop":0},"tags":["巡视","上级","审计"],"options":[{"label":"逐条销号，真改","text":"\n你用四个月把十一条全部销号，其中三条动了真格：清退违规占用的公房十九套、追回被挪用的资金二点三亿、处理了十一名干部。有人到你办公室拍桌子，你让他拍完。回头看的反馈会上，川平被点名表扬了一次。那天晚上你吃了两碗饭，是半年来的第一次。\n","effects":{"money":0,"risk":-9,"merit":9,"pop":10,"boss":4,"net":-4,"health":-4,"stress":15,"family":2,"probe":-20,"clean":7,"offshore":0},"flag":"reformed","unflag":null,"ending":null,"next":null},{"label":"造台账，纸面整改","text":"\n三本台账做得漂漂亮亮，照片、签名、日期一应俱全，其中两张照片是五年前拍的。回头看组里有个年轻人翻了三遍，最后问：这张照片里为什么有一辆已经停产的车。全场鸦雀无声。你在三个月后被免职，免职文件上写的原因是：整改不力，弄虚作假。\n","effects":{"money":0,"risk":25,"merit":-8,"pop":-8,"boss":-12,"net":-5,"health":-6,"stress":25,"family":-3,"probe":26,"clean":-18,"offshore":0},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"把责任往下压","text":"\n整改清单上的每一条，你都找到了具体责任人，一共九个处级干部。他们签了字，也背了锅。回头看结束时，十一项全部\"完成\"。半年后，那九个人里有三个写了申诉信，信里附了当时的微信记录。你在他们的位置上待了二十年，最后学到的却是：怎么把人往下推。\n","effects":{"money":0,"risk":14,"merit":2,"pop":-5,"boss":3,"net":-8,"health":-3,"stress":17,"family":-1,"probe":13,"clean":-12,"offshore":0},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"借回头看整对手","text":"\n你在整改清单里，把两条与桑稷有关的问题单列出来，材料详实，措辞严厉。桑稷被诫勉谈话，仕途受挫。你借着整改的名义，砍了政敌一刀，还被评为\"敢于动真碰硬\"。两年后桑稷东山再起，第一件事就是把你当年列的这两条，重新翻了出来，一条一条地核。\n","effects":{"money":0,"risk":16,"merit":4,"pop":0,"boss":5,"net":-9,"health":-3,"stress":19,"family":0,"probe":12,"clean":-8,"offshore":0},"flag":null,"unflag":null,"ending":null,"next":null}]},{"id":"sg_028","title":"谈话函询的第九页","text":"\n省纪委送来一份函询通知书，薄薄的九页，最后一页要你签字。前八页列了四件事：一笔三百二十万的\"借款\"、一辆登记在妻弟名下的车、一次由企业支付的境外行程、以及你在某项目协调会上的一次发言。每一件的后面都留了空白，写着\"请说明情况\"。你握着笔，笔尖在纸上停了大概十秒。这十秒里，你想了很多，也想得很乱。\n","city":"省级","min_rank":7,"max_rank":10,"weight":5,"once":true,"need":{"min_money":0,"max_money":0,"min_risk":0,"min_probe":0,"min_year":9,"flag":null,"no_flag":null,"min_merit":0,"min_boss":0,"min_net":0,"min_pop":0},"tags":["巡视","上级","审计","家属"],"options":[{"label":"逐条如实说明并退钱","text":"\n四件事你一条条写清，该退的三百二十万连本带利退了，车过户回来，境外行程的费用自己补缴。你写了十九页说明，交上去那天手心是干的。三个月后，了结反馈只有一句话：予以了结。这四个字你看了三遍。它不漂亮，但它意味着：这件事，到此为止了。\n","effects":{"money":-400,"risk":-12,"merit":0,"pop":3,"boss":-2,"net":-3,"health":-2,"stress":16,"family":1,"probe":-24,"clean":8,"offshore":0},"flag":"reformed","unflag":null,"ending":null,"next":null},{"label":"全盘否认，咬死是借","text":"\n你在说明里咬定三百二十万是借款，还补了一份借条。纪委问了三个问题：借条为什么是现在写的、约定利息是多少、为什么不还。你答了三个\"记不清\"。半年后，这四件事里三件被认定为查无实据，一件转为初核。转初核的那件事，四年后成了你判决书上的第一项。\n","effects":{"money":0,"risk":18,"merit":0,"pop":-2,"boss":0,"net":0,"health":-4,"stress":22,"family":-1,"probe":18,"clean":-12,"offshore":0},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"认小不认大","text":"\n你认了车和那次境外行程，说是纪律意识淡薄；不认那三百二十万，说是正常的民间借贷。这个策略很老练，也很常见：用小错掩盖大错。纪委的同志看完你的说明，说了句：你倒是坦诚。半年后，小错被处理，大错被记住。记住，和查实，只差一个时机。\n","effects":{"money":-50,"risk":10,"merit":-1,"pop":-1,"boss":1,"net":-1,"health":-3,"stress":18,"family":0,"probe":-6,"clean":-6,"offshore":0},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"托人把函询压下来","text":"\n你找了郗明章的一位老上级，请他\"关心一下\"。这位老上级确实打了电话，也确实没说情，只说了一句：按规定办。电话打完的第二天，函询通知书变成了初核决定书。你花钱买来的不是摆平，是加速。这条路上最贵的东西，是那些帮倒忙的人情。\n","effects":{"money":-800,"risk":24,"merit":0,"pop":-3,"boss":-7,"net":-5,"health":-5,"stress":24,"family":-2,"probe":25,"clean":-15,"offshore":0},"flag":null,"unflag":null,"ending":null,"next":null}]},{"id":"sg_029","title":"同僚落马的第三天","text":"\n桑稷被带走的消息，是在一个周二下午四点传开的。当天晚上，你的手机里有二十九个未接来电和一百多条消息，你一个都没回。第三天，一封匿名信寄到你办公室，信封里只有一页纸，列了十一个名字和一串数字，最后一个名字是你，后面跟着一个问号。你把纸放在桌上，魏允进来送茶，看了一眼，脸色比你还白。\n","city":"省级","min_rank":7,"max_rank":10,"weight":5,"once":true,"need":{"min_money":0,"max_money":0,"min_risk":0,"min_probe":0,"min_year":10,"flag":null,"no_flag":null,"min_merit":0,"min_boss":0,"min_net":0,"min_pop":0},"tags":["同僚","巡视","上级"],"options":[{"label":"照常上班，什么都不做","text":"\n你把那页纸锁进柜子，第二天照常去了胡悉看一个水库除险工程，在工地上待了一整天，晚上在县城吃了碗面。回省城后你发现，什么都不做反而是最难做的——你要忍住不打听、不解释、不联系。三个月后风声过去，你在一场会上重新被点名发言，声音没抖。\n","effects":{"money":0,"risk":-2,"merit":4,"pop":2,"boss":3,"net":0,"health":-2,"stress":14,"family":0,"probe":-3,"clean":2,"offshore":0},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"连夜销毁往来记录","text":"\n你和妻子在家里烧了三个小时，烧掉的是四十七本笔记、两台旧手机、一沓沓的纸条。灰烬飘到阳台上，第二天早上保洁阿姨扫了很久。你以为烧掉的是证据，其实烧掉的是退路——因为从那天起，你就再没有任何一样东西能证明你曾经想做个好人。\n","effects":{"money":0,"risk":23,"merit":0,"pop":-4,"boss":0,"net":-2,"health":-6,"stress":25,"family":-5,"probe":24,"clean":-16,"offshore":0},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"主动向组织报告往来","text":"\n你把与桑稷有关的全部往来整理成一份十二页的材料，主动交了上去，包括那三次你替他打过招呼的事。组织上给了你一个\"主动说明\"的认定。从此你在省里被贴上一个隐形标签：这个人会交代。它让你失去了很多朋友，也让你在两年后的那场风暴里，只掉了半级。\n","effects":{"money":0,"risk":8,"merit":-1,"pop":2,"boss":-3,"net":-8,"health":-3,"stress":19,"family":-1,"probe":-20,"clean":5,"offshore":0},"flag":"reformed","unflag":null,"ending":null,"next":null},{"label":"抢先举报别人，转移视线","text":"\n你把那页纸复印了三份，寄给了三个不同的地方，署的是别人的笔迹。此后半年，省里有六个人被查，其中两个是你递的材料。你成功地把火引到了别处，也成功地让所有人在谈起你时，都要先压低声音。恐惧不是信任，但恐惧有时比信任更管用——管用一年。\n","effects":{"money":0,"risk":20,"merit":2,"pop":1,"boss":6,"net":-12,"health":-5,"stress":23,"family":-3,"probe":-10,"clean":-10,"offshore":0},"flag":"reported","unflag":null,"ending":null,"next":null}]},{"id":"sg_030","title":"拔出萝卜带出泥","text":"\n起因是一个科级干部：胡悉市一个区的交通局长，酒后在饭店跟人打架，被拍了视频上网。三十七天里，这条线往上牵出了市交通局长、副市长、市委书记佟大用，再往上，牵出了省交通厅的两个处长，以及骆与舟。今天上午，骆与舟在你办公室门口站了两分钟，最终没进来。他手里拿着一个牛皮纸袋，袋口卷了三折。\n","city":"省级","min_rank":7,"max_rank":10,"weight":5,"once":true,"need":{"min_money":0,"max_money":0,"min_risk":0,"min_probe":0,"min_year":10,"flag":null,"no_flag":null,"min_merit":0,"min_boss":0,"min_net":0,"min_pop":0},"tags":["同僚","巡视","工程","交通"],"options":[{"label":"支持深查，捅到底","text":"\n你在省委碰头会上表态：一查到底，不设上限，不涉及任何人例外。此后八个月，全省交通系统处理了一百四十七人，其中厅级四人。川平的公路造价当年下降了百分之十一。你在全省的形象变成了\"那个狠人\"，也变成了很多人饭桌上的忌讳。你查得越干净，朋友越少。\n","effects":{"money":0,"risk":5,"merit":13,"pop":14,"boss":6,"net":-9,"health":-5,"stress":18,"family":-2,"probe":-14,"clean":7,"offshore":0},"flag":"honest_path","unflag":null,"ending":null,"next":null},{"label":"保骆与舟，斩到市一级","text":"\n你做了大量工作，把线在市一级截断：副市长背了主要责任，骆与舟只受了诫勉。为了保他，你找了四个人，欠了四笔人情。三年后骆与舟再次出事，这一次没人再保他，也没有人再保你——因为所有人都知道，你是那个在会上替他说过话的人。\n","effects":{"money":0,"risk":19,"merit":1,"pop":-5,"boss":2,"net":4,"health":-4,"stress":20,"family":-1,"probe":17,"clean":-13,"offshore":0},"flag":"has_faction","unflag":null,"ending":null,"next":null},{"label":"装作不知，避嫌到底","text":"\n你请了三天假，去了中央党校参加一个短期班。回来时案子已经定性，牵到你这一层的两份材料被封存。你什么都没做，什么都没说，也什么都没留下。这是你在官场学到的最高明的姿势：不在场。只是从那天起，你每次照镜子都要多看两秒，确认自己还是自己。\n","effects":{"money":0,"risk":7,"merit":0,"pop":-2,"boss":-1,"net":-1,"health":-1,"stress":15,"family":0,"probe":5,"clean":-3,"offshore":0},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"反手把骆与舟交出去","text":"\n你把骆与舟这三年托你办过的六件事，整理成一份详细的材料，在关键时刻交了出去。他被查，你被表扬。保住自己的代价，是让一个跟你共事十一年的人进去了。他进去那年四十九岁，女儿正要高考。你把这件事记在心里，也把那六件事里属于自己的那两件，永远没敢跟任何人提。\n","effects":{"money":0,"risk":15,"merit":6,"pop":4,"boss":9,"net":-10,"health":-5,"stress":22,"family":-3,"probe":-16,"clean":1,"offshore":0},"flag":"reported","unflag":null,"ending":null,"next":null}]},{"id":"sg_031","title":"岑照跑路了","text":"\n凌晨三点四十，钱广白打来电话，只说了六个字：岑照昨天出境。你坐在床上，手机贴在耳朵上，一句话都说不出来。岑照手里有三样东西：环线工程十一个标段的资金流水、你儿子那家境外公司的股权代持协议、以及一张你签过字的收据照片。窗外的省城很安静，安静得能听见冰箱在响。\n","city":"省级","min_rank":7,"max_rank":10,"weight":5,"once":true,"need":{"min_money":0,"max_money":0,"min_risk":0,"min_probe":0,"min_year":10,"flag":null,"no_flag":null,"min_merit":0,"min_boss":0,"min_net":0,"min_pop":0},"tags":["出国","工程","巡视"],"options":[{"label":"立刻报告组织","text":"\n早上六点你就去了省纪委，把与岑照的全部往来一五一十说了，包括那张收据。你说完，对方问：你还有多少没说。你说：还会有，但我想先说这些。当天你被停职配合调查，八个月后结论：有违纪行为，主动交代，从宽处理。你降了两级，保住了一个还算体面的晚年。\n","effects":{"money":-2000,"risk":4,"merit":-6,"pop":5,"boss":-8,"net":-6,"health":-6,"stress":24,"family":3,"probe":-22,"clean":6,"offshore":0},"flag":"reformed","unflag":null,"ending":null,"next":null},{"label":"派人去境外找他","text":"\n你花了两千四百万，托了三拨人去找岑照，希望能把东西买回来。人没找到，钱花了，还多了一个知道你在找他的人。第四个月，一个自称中间人的人联系你，开价八千万。你付了，收到一个空文件袋。你不敢报案，只能在办公室里坐了一夜。\n","effects":{"money":-10400,"risk":25,"merit":0,"pop":-3,"boss":-4,"net":-4,"health":-7,"stress":25,"family":-3,"probe":26,"clean":-16,"offshore":0},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"什么都别做，等","text":"\n你把手机关机三天，照常开会、照常下基层，只是在每次讲话前都要先喝一口水。岑照在外面待了两年零七个月，回来投案了。他交代了很多人，包括你。你等来的不是安全，是更详细的材料——因为他这两年多，把每一笔都记了下来，一笔都没落下。\n","effects":{"money":0,"risk":20,"merit":0,"pop":0,"boss":0,"net":-2,"health":-5,"stress":25,"family":-2,"probe":22,"clean":-10,"offshore":0},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"反制：把他置于死地","text":"\n你动用一切关系，把岑照在国内的资产冻结、公司查封、家人摸排一遍。你要让他知道，跑了也没用。三个月后，他的母亲在老家病逝，他没能回来。第四个月，他向境外一家媒体寄出了全套材料。你逼出了他最狠的一手，也逼出了自己最怕的结局。\n","effects":{"money":0,"risk":27,"merit":0,"pop":-6,"boss":-5,"net":-7,"health":-7,"stress":25,"family":-5,"probe":28,"clean":-20,"offshore":0},"flag":null,"unflag":null,"ending":null,"next":null}]},{"id":"sg_032","title":"保护伞塌了","text":"\n鞠万堂被抓的消息，是从胡悉传来的：三十七辆车、一百二十九人、一个从九十年代末算起的账本。审讯进行到第十九天，他开始交代\"关系\"。省公安厅长蔚长风连夜给你打电话，只说了一句：他口供里有三段话，跟你有关。你问哪三段。他说：我不知道内容，我只知道有人已经在整理了。\n","city":"省级","min_rank":7,"max_rank":10,"weight":5,"once":true,"need":{"min_money":0,"max_money":0,"min_risk":0,"min_probe":0,"min_year":10,"flag":null,"no_flag":null,"min_merit":0,"min_boss":0,"min_net":0,"min_pop":0},"tags":["黑恶","巡视","维稳","同僚"],"options":[{"label":"主动说明与鞠某的接触","text":"\n你把与鞠万堂仅有的四次接触全部说了：两次是公开场合、一次是他托人递了张字条你没回、还有一次是你在不知情的情况下，出席过他捐建的一所小学的落成仪式。你连这所小学都报了。三个月后，核查结论：不构成包庇。这四个字，你等了整整一百天。\n","effects":{"money":0,"risk":2,"merit":0,"pop":4,"boss":1,"net":-2,"health":-4,"stress":20,"family":2,"probe":-18,"clean":5,"offshore":0},"flag":"reformed","unflag":null,"ending":null,"next":null},{"label":"找蔚长风抹掉那三段","text":"\n你给了蔚长风八百万，也给了他一句承诺：以后你就是省里的自己人。他确实做了，三段话在卷宗里变成了两段半。半年后蔚长风落马，交代的第一件事就是这个。你以为买通的是一个环节，实际上买通的是一条线——线上的人，一个倒，全都倒。\n","effects":{"money":-800,"risk":26,"merit":0,"pop":-5,"boss":0,"net":3,"health":-5,"stress":25,"family":-2,"probe":27,"clean":-18,"offshore":0},"flag":"has_faction","unflag":null,"ending":null,"next":null},{"label":"抢先部署扫黑，立功","text":"\n你在鞠万堂交代之前，抢先在全省部署了一轮专项行动，打掉了十一个团伙，其中就包括鞠的几个骨干。你成了全省扫黑的表率，材料上了省报头版。鞠万堂后来在法庭上说了一句：我要是早三个月被抓，那个人就是英雄。这句话上了网，也进了卷宗。\n","effects":{"money":0,"risk":-4,"merit":12,"pop":13,"boss":7,"net":1,"health":-4,"stress":16,"family":1,"probe":-12,"clean":4,"offshore":0},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"除掉知情的中间人","text":"\n你安排人把那个递字条的中间人送出了境，给了他一笔封口费，还在境外替他租了房子。你觉得这是最干净的处理方式。三个月后，那个人因为赌债被人打断了腿，在医院里把所有事情告诉了当地警方。你精心设计的每一步，最后都输给了人性里最不可控的那部分。\n","effects":{"money":-1500,"risk":28,"merit":0,"pop":-4,"boss":-3,"net":-5,"health":-6,"stress":25,"family":-3,"probe":28,"clean":-20,"offshore":0},"flag":null,"unflag":null,"ending":null,"next":null}]},{"id":"sg_033","title":"纪委书记请你喝茶","text":"\n郗明章亲自打电话：老哥，有空来我这儿坐坐，喝杯茶。他的办公室在四楼，朝南，阳光很好。茶是普通的绿茶，倒在一个带缺口的杯子里。他先聊了十分钟天气、孩子和血压，然后从一个文件夹里抽出一张纸，推到你面前。纸上是一张转账记录的复印件，金额三百二十万，日期是七年前的冬至。\n","city":"省级","min_rank":7,"max_rank":10,"weight":5,"once":true,"need":{"min_money":0,"max_money":0,"min_risk":0,"min_probe":0,"min_year":10,"flag":null,"no_flag":null,"min_merit":0,"min_boss":0,"min_net":0,"min_pop":0},"tags":["巡视","上级","同僚"],"options":[{"label":"当场说清，请求处理","text":"\n你把那笔钱的来龙去脉说了四十分钟，包括是谁送的、为什么送、你为什么收、以及后来你为什么一直没退。说完你问：我还能工作多久。郗明章说：这要看你自己。三个月后你受到严重警告，降了一级，但没进去。你在处分宣布那天，第一次睡了个整觉。\n","effects":{"money":-320,"risk":-10,"merit":-5,"pop":4,"boss":-6,"net":-4,"health":-3,"stress":18,"family":3,"probe":-25,"clean":7,"offshore":0},"flag":"reformed","unflag":null,"ending":null,"next":null},{"label":"不认，等他拿出更多","text":"\n你说记不清了，需要回去查。他点点头，把纸收了回去，说：那你去查。你走出那栋楼时，阳光晃得眼睛疼。此后的三个月，你每天都在等第二张纸。它来了，一共三十七张，装订成册。你这才明白，\"回去查\"这三个字，是给自己的最后一次机会，而你错过了。\n","effects":{"money":0,"risk":22,"merit":0,"pop":-3,"boss":-4,"net":-3,"health":-5,"stress":25,"family":-2,"probe":23,"clean":-14,"offshore":0},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"反问：就这一笔？","text":"\n你说：如果就这一笔，我认；如果还有别的，请你一起拿出来。郗明章笑了，说你这话问得聪明。他把文件夹合上，说：今天就到这儿。此后两年，再没人找你谈过话。你凭这一句话，把一次谈话变成了僵局。僵局也是一种结果，只是它随时可以被打破。\n","effects":{"money":0,"risk":12,"merit":0,"pop":0,"boss":-2,"net":0,"health":-3,"stress":21,"family":-1,"probe":10,"clean":-5,"offshore":0},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"暗示可以帮他办一件事","text":"\n你在茶喝到第三杯时说：你儿子那个事，我听说了，可以协调。郗明章把茶杯放下，放得很轻，说：老哥，你今天不该来。第二天，你被列为初核对象。这个世界上有些门，敲错了就回不了头；而纪委书记的门，是其中最不该敲的一扇。\n","effects":{"money":0,"risk":28,"merit":0,"pop":-5,"boss":-14,"net":-8,"health":-6,"stress":25,"family":-4,"probe":28,"clean":-18,"offshore":0},"flag":null,"unflag":null,"ending":null,"next":null}]},{"id":"sg_034","title":"秘书被叫走了","text":"\n上午十点，魏允被两个人从办公室带走，说是\"配合了解情况\"。他走的时候没拿外套，外套还挂在椅背上。下午，司机老段被通知不用再来上班，理由是车辆统一调度。晚上七点，你在食堂吃饭，平时坐你对面的三个人，今天都换了位置。你一个人吃完了一碗面，面汤上浮着一层凉了的油。\n","city":"省级","min_rank":7,"max_rank":10,"weight":5,"once":true,"need":{"min_money":0,"max_money":0,"min_risk":0,"min_probe":0,"min_year":10,"flag":null,"no_flag":null,"min_merit":0,"min_boss":0,"min_net":0,"min_pop":0},"tags":["巡视","同僚","人事"],"options":[{"label":"不动，一切照常","text":"\n你没有去找人，没有打电话，也没有换秘书。你每天七点四十到办公室，把该批的文件批完，把该开的会开完。第九天，魏允回来了，瘦了一圈，什么都没说，把外套穿上继续干活。从那天起你不再让他经手任何钱的事。有些信任，一旦被拷问过，就再也回不到从前。\n","effects":{"money":0,"risk":3,"merit":2,"pop":1,"boss":2,"net":1,"health":-3,"stress":20,"family":0,"probe":6,"clean":1,"offshore":0},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"让魏允把所有事扛下来","text":"\n你托人给他带了一句话：就说是你自作主张。他回了一句话：好。此后两年，魏允一个人扛了七件事，判了六年。你去监狱看过他一次，他隔着玻璃问：领导，我妈那边您能去看一眼吗。你点了头，也没去。你用一个人的六年，买了自己两年的安稳。\n","effects":{"money":0,"risk":20,"merit":0,"pop":-4,"boss":2,"net":-6,"health":-5,"stress":25,"family":-4,"probe":14,"clean":-18,"offshore":0},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"安排老段出境躲一阵","text":"\n你给老段三十万，让他先去境外待半年，等风声过了再说。他走了，走到第三个月，钱花完了，他在那边给别人开车。第五个月他被找到，问什么答什么，答得比谁都快。你以为送走的是个隐患，其实是送走了一个随时会开口的人证。\n","effects":{"money":-30,"risk":24,"merit":0,"pop":-2,"boss":-2,"net":-4,"health":-4,"stress":24,"family":-2,"probe":22,"clean":-15,"offshore":0},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"当天去省纪委自述","text":"\n当天下午四点，你主动去了省纪委，把魏允经手过的所有事，一件件说清，并明确表示：责任在我，不在他。你写了二十四页材料。魏允在第七天被放了出来，判了个免予刑事处罚。你被判了十一年。探监时他隔着玻璃哭，说：领导，您不该这样。你说：该。\n","effects":{"money":-1000,"risk":5,"merit":-8,"pop":8,"boss":-10,"net":-6,"health":-8,"stress":10,"family":5,"probe":-28,"clean":8,"offshore":0},"flag":"reformed","unflag":null,"ending":null,"next":null}]},{"id":"sg_035","title":"一百三十七封举报信","text":"\n省纪委转来一批举报，涉及你的共一百三十七封，署名十一封。整理材料里最厚的一封，是胡悉青弋县一个退休教师写的，十九页，字迹工整，附了三十七张照片和一份手绘的表格。表格的第一行写着日期，第二行是金额，第三行是\"中间人\"。你看到第三行的第七个格子时，手停住了——那里写着一个你以为只有四个人知道的名字。\n","city":"省级","min_rank":7,"max_rank":10,"weight":5,"once":true,"need":{"min_money":0,"max_money":0,"min_risk":0,"min_probe":0,"min_year":10,"flag":null,"no_flag":null,"min_merit":0,"min_boss":0,"min_net":0,"min_pop":0},"tags":["信访","巡视","维稳"],"options":[{"label":"逐封核查，公开回应","text":"\n你要求对一百三十七封逐件核查，能公开的公开，涉及隐私的按程序办。核查下来，属实九件、部分属实十七件、不实一百一十一件。属实的九件你全部整改，并在县里开了一场通报会。那位退休教师坐在第一排，会后他走到你面前，说了句：我信了。这三个字，比任何表彰都重。\n","effects":{"money":0,"risk":-7,"merit":8
