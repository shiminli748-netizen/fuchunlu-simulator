,"pop":12,"boss":3,"net":-1,"health":-3,"stress":15,"family":2,"probe":-20,"clean":7,"offshore":0},"flag":"reported","unflag":null,"ending":null,"next":null},{"label":"查那个退休教师是谁","text":"\n你让人去查这位退休教师的底：教了三十二年书，儿子在广东打工，老伴瘫痪，两年前因为一笔补助款被村里卡住。你没去报复，你让人把那笔补助补发了，还多给了两千。三个月后他又写了一封信，这次是感谢信。你把两封信放在一起，看了很久，最后都烧了。\n","effects":{"money":0,"risk":9,"merit":3,"pop":3,"boss":1,"net":0,"health":-2,"stress":16,"family":0,"probe":9,"clean":-6,"offshore":0},"flag":"reported","unflag":null,"ending":null,"next":null},{"label":"花钱买回那些原件","text":"\n你托人去找写信的人，愿意出钱\"解决问题\"。一百三十七封里，有二十三个人愿意谈，一共花了一千七百万。剩下的一百一十四个人，有的要得更多，有的根本不谈，有的转手把\"有人来买\"这件事又举报了一次。你花了一千七百万，买来了二十三条新线索。\n","effects":{"money":-1700,"risk":26,"merit":0,"pop":-6,"boss":-5,"net":-5,"health":-5,"stress":25,"family":-3,"probe":27,"clean":-17,"offshore":0},"flag":"reported","unflag":null,"ending":null,"next":null},{"label":"把举报压下去，内部消化","text":"\n你让魏允把这批材料锁进铁皮柜，钥匙你自己拿着，一锁就是三年。三年里，那三十七张照片你一次都没敢看。第四年，柜子被打开，照片一张不少，还多了一百多张新的。你终于明白：压下去的举报不会消失，它们只会安静地等着，等一个更有耐心的人来打开柜子。\n","effects":{"money":0,"risk":18,"merit":-3,"pop":-3,"boss":2,"net":1,"health":-4,"stress":22,"family":-1,"probe":20,"clean":-12,"offshore":0},"flag":"reported","unflag":null,"ending":null,"next":null}]},{"id":"sg_036","title":"审计总署的十一人小组","text":"\n审计总署派来十一人，只查一样东西：近五年全省的政府投资项目管理。他们不谈话、不接受宴请、住在省城一家连锁酒店，早八点出门，晚九点回。第十天，他们调走了川平环线的全部合同附件，一共两万三千页。第十一天，他们请省里派一个人去\"介绍一下情况\"。省政府决定，派你去。\n","city":"省级","min_rank":7,"max_rank":10,"weight":5,"once":true,"need":{"min_money":0,"max_money":0,"min_risk":0,"min_probe":0,"min_year":10,"flag":null,"no_flag":null,"min_merit":0,"min_boss":0,"min_net":0,"min_pop":0},"tags":["审计","工程","巡视"],"options":[{"label":"全盘配合，有问必答","text":"\n你在那间小会议室里待了两天半，回答了一百七十三个问题，其中十一个问题你答不上来，你说：这个我需要回去核实。你回去核了，也如实回电。审计报告出来那天，川平有六个问题被点名，你分管领域里只有一个，而且是程序性的。审计组临走时跟你握了手，说：谢谢配合。\n","effects":{"money":0,"risk":-5,"merit":6,"pop":5,"boss":4,"net":1,"health":-3,"stress":16,"family":0,"probe":-15,"clean":5,"offshore":0},"flag":"inspected","unflag":null,"ending":null,"next":null},{"label":"只答知道的，其余推给下面","text":"\n你的标准答案是：具体由项目法人负责，我这边是宏观管理。这句话说了六十二遍。审计报告里有一句话：省级主管部门对重大项目监管缺位。这句话不重，但它像一根线头，一扯就是一串。三年后有人顺着这根线扯出了十一亿的违规资金，而线头的那一端，写着你的职务。\n","effects":{"money":0,"risk":15,"merit":-2,"pop":-3,"boss":1,"net":-2,"health":-3,"stress":18,"family":0,"probe":16,"clean":-9,"offshore":0},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"请审计组吃一顿工作餐","text":"\n你以个人名义请审计组的同志吃了一顿便饭，四菜一汤，人均三十七块，发票你自己留着。饭桌上你一句话没提工作。第二天，审计组把两个已经查到一半的问题，从\"重大\"改成了\"一般\"。你花二百五十九块，办成了八百万办不成的事。你后来常常想起这顿饭，想起时心里发凉。\n","effects":{"money":0,"risk":11,"merit":2,"pop":0,"boss":3,"net":4,"health":-1,"stress":13,"family":0,"probe":8,"clean":-7,"offshore":0},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"安排一个人替你去","text":"\n你以出差为由，让一位副厅长替你去\"介绍情况\"。他说了什么你不知道，签了什么字你也不知道。三个月后审计报告出来，他被问责，降了职。你在会上替他说话，说了三分钟。他散会后看了你一眼，那一眼里没有怨恨，只有一种让人难受的理解。\n","effects":{"money":0,"risk":17,"merit":-3,"pop":-4,"boss":2,"net":-7,"health":-2,"stress":19,"family":-1,"probe":16,"clean":-13,"offshore":0},"flag":null,"unflag":null,"ending":null,"next":null}]},{"min_rank":2,"max_rank":9,"tags":["房产"],"title":"开发商的「内部价」","text":"鑫岳机械的单聘仁悄悄给你留了南湖片区一套房，「内部价，您先住，钱以后再说」。合同在你抽屉里，一天比一天烫手。","options":[{"label":"退回，自己市场价买","text":"你婉拒，按市价另购。{P()}讪讪。后来那批房被查「定向输送」，你不在名单。","effects":{"money":-30,"risk":-2,"clean":5,"boss":1}},{"label":"收下「内部价」房","text":"你签了。市价与内价差97万，成了你账上的隐形资产。","effects":{"money":61,"risk":6,"probe":3,"clean":-6,"net":2},"hint":"房叔房姐"},{"label":"收下但付了部分款","text":"你付了首付，差价的口子留着。{P()}不爽，关系凉了半截。","effects":{"money":35,"risk":3,"probe":1,"clean":-3,"net":1}},{"label":"让家属代持","text":"你让妻子名义买下，价差60万由柳如烟补。手法隐，可代持曝光即是灭顶。","effects":{"money":107,"risk":5,"probe":4,"clean":-8,"family":2},"hint":"假离婚转移资产"}],"id":"gn2_001","city":"通用","weight":3,"once":false},{"min_rank":3,"max_rank":9,"tags":["工程"],"title":"道路的变更","text":"旧城改造的路线要改，东港港务的尤氏想让线从他地块旁过：「您改个几百米，我公司 valuation 翻倍。」","options":[{"label":"按原规划，不动","text":"你坚持原线。{P()}大骂，转头找别人。路如期通车，你被评「顶得住」。","effects":{"money":0,"risk":-3,"merit":6,"pop":3,"boss":2,"clean":5,"probe":-1}},{"label":"微改，收顾问费","text":"你改了三百米。孙绍祖送来129万「咨询」。改动不大，可痕迹留下了。","effects":{"money":74,"risk":7,"probe":4,"clean":-6,"net":2},"hint":"招投标串标"},{"label":"大改，收重谢","text":"你绕了大弯。彭万里的地涨了，给你129万。沿线百姓多走了十年冤枉路。","effects":{"money":160,"risk":9,"probe":5,"clean":-8,"pop":-8,"net":3},"hint":"群众联名信"},{"label":"上会论证","text":"你说「专家论证」。线没改，你没担责，{P()}也无话可说。","effects":{"risk":-1,"boss":1,"merit":-1,"clean":1,"stress":1}}],"id":"gn2_002","city":"通用","weight":3,"once":false},{"min_rank":3,"max_rank":9,"tags":["巡视"],"title":"巡视组的函","text":"省廉政总署来函，要你说明清溪村的产业园标准厂房一笔77万「咨询费」的去向。落款是那个出了名难缠的组长。","options":[{"label":"如实说明，附全部凭证","text":"你把合同、票流、会议纪要全附上。组长看了良久：「难得。」你因主动被记功。","effects":{"probe":-4,"risk":-3,"boss":-1,"clean":5,"stress":5,"merit":2},"hint":"巡视组发现"},{"label":"打太极，含糊其辞","text":"你句句在理，句句没料。组长笑了笑。你不晓得隔壁办公室已开口。","effects":{"probe":3,"risk":2,"stress":5,"clean":-2,"boss":1}},{"label":"托人打探组长喜好","text":"你让范统去摸底。消息摸到，可这动作本身被记录。聪明反被聪明误。","effects":{"probe":4,"risk":4,"clean":-3,"net":1,"stress":4},"hint":"同僚举报"},{"label":"连夜补台账","text":"你带人通宵补材料。天亮台账齐了，可补的痕迹太新，反而更可疑。","effects":{"probe":3,"risk":2,"clean":-3,"stress":8,"health":-3},"hint":"审计查出"}],"id":"gn2_003","city":"通用","weight":3,"once":false},{"min_rank":1,"max_rank":9,"tags":["下属"],"title":"秘书的婚事","text":"你的秘书卫若兰要结婚，女方家开口要滨江路一套婚房。詹光红着脸向你「请教路子」。你心里清楚他想要什么。","options":[{"label":"自掏腰包随礼，不掺事","text":"你包了红包，叮嘱他靠自己。{P()}敬你一杯，眼里是真的敬。","effects":{"money":-3,"family":2,"clean":3,"boss":1,"net":1}},{"label":"让开发商「意思意思」","text":"你一个电话，北苑实业给罗世豪「友情价」房，差价43万算你人情。柳如烟绑死在你这条船。","effects":{"money":40,"risk":5,"probe":3,"clean":-5,"net":4},"hint":"下属反水"},{"label":"介绍到正规单位","text":"你托关系给{P()}妻子找了份稳定工作。钱不多，情分长。","effects":{"net":2,"clean":2,"boss":1,"family":1}},{"label":"让他去跑腿办事收谢礼","text":"你让尤氏帮程日兴办事，谢礼13万归他。他感激，也学会了这套。","effects":{"money":13,"risk":4,"probe":2,"clean":-4,"net":3},"hint":"下属反水"}],"id":"gn2_004","city":"通用","weight":3,"once":false},{"min_rank":1,"max_rank":9,"tags":["酒局"],"title":"年终的饭局","text el":"敬而远之，饭吃一半便告辞","text":"你以「明天陪省里调研」起身。林副书记后来在常委会上提了你一句「稳得住」。只是温如玉那边的项目，你再想插手就难了。","effects":{"money":0,"risk":-3,"merit":2,"boss":3,"net":-1,"clean":3,"stress":2}},{"label":"收下文件袋","text":"你没说话，把袋子塞进公文包。此后唐三彩的工程一路绿灯，可你每次路过纪委那层楼都下意识加快脚步。","effects":{"money":34,"risk":4,"probe":2,"clean":-4,"net":3,"boss":2},"hint":"商人供出"},{"label":"只喝酒，不碰袋子","text":"你装醉，把话题引到书法上。钱没拿，场面圆了，领导觉得你会来事。","effects":{"money":0,"risk":-1,"boss":3,"net":2,"clean":1,"stress":-2}},{"label":"当场把钱摔在桌上","text":"你沉下脸：「您这是埋我。」满桌寂静。事后霍英东怀恨，半年后一封匿名信寄到了巡视组。","effects":{"money":0,"risk":2,"probe":3,"boss":-4,"net":-3,"clean":4,"stress":6},"hint":"同僚举报"}],"id":"gn2_214","city":"通用","weight":3,"once":false},{"min_rank":3,"max_rank":9,"tags":["巡视"],"title":"巡视组的函","text":"省廉政总署来函，要你说明云栖谷的冷链物流园一笔40万「咨询费」的去向。落款是那个出了名难缠的组长。","options":[{"label":"如实说明，附全部凭证","text":"你把合同、票流、会议纪要全附上。组长看了良久：「难得。」你因主动被记功。","effects":{"probe":-4,"risk":-3,"boss":-1,"clean":5,"stress":5,"merit":2},"hint":"巡视组发现"},{"label":"打太极，含糊其辞","text":"你句句在理，句句没料。组长笑了笑。你不晓得隔壁办公室已开口。","effects":{"probe":3,"risk":2,"stress":5,"clean":-2,"boss":1}},{"label":"托人打探组长喜好","text":"你让陆怀安去摸底。消息摸到，可这动作本身被记录。聪明反被聪明误。","effects":{"probe":4,"risk":4,"clean":-3,"net":1,"stress":4},"hint":"同僚举报"},{"label":"连夜补台账","text":"你带人通宵补材料。天亮台账齐了，可补的痕迹太新，反而更可疑。","effects":{"probe":3,"risk":2,"clean":-3,"stress":8,"health":-3},"hint":"审计查出"}],"id":"gn2_215","city":"通用","weight":3,"once":false},{"min_rank":2,"max_rank":9,"tags":["赌博"],"need":{"min_money":40},"title":"牌桌上的窟窿","text":"卜世仁组了个局，你手气好赢了36万，可范统输红了眼，欠了地下钱庄。他瞄着你：「您帮衬点？」","options":[{"label":"见好就收，再不赴局","text":"你起身离席。对方后来被债主堵门，咬出了一桌人，唯独没你。你庆幸。","effects":{"money":0,"risk":-2,"net":-1,"clean":2,"stress":-2}},{"label":"替对方平账，让他感恩","text":"你转了71万。他跪谢，成了你最牢的棋子，也成了最危险的炸弹。","effects":{"money":-96,"risk":5,"probe":3,"net":5,"clean":-5},"hint":"赌博欠债"},{"label":"自己也下场想翻本","text":"你尝到甜头，越陷越深。直到某夜你发现账对不上，冷汗湿透后背。","effects":{"money":74,"risk":7,"probe":4,"stress":10,"clean":-6,"health":-2},"hint":"大额交易报告"},{"label":"报警端了地下钱 :-2,"clean":-1,"stress":-1}},{"label":"写举报信揭对方问题","text":"你实名举报对方材料造假。王仁被查，你补位，却从此有了「刺头」名声。","effects":{"boss":-3,"net":-4,"merit":3,"risk":2,"probe":4,"clean":2},"hint":"审计查出"}],"id":"gn2_232","city":"通用","weight":3,"once":false},{"min_rank":1,"max_rank":9,"tags":["基层"],"title":"驻村的第一夜","text":"你被派去白鹭洲驻村。村部漏雨，床板硬。老支书唐三彩端来一碗杂粮：「书记，这儿穷，您将就。」","options":[{"label":"扎下来，挨家走访","text":"你用一个月走完全村。哪家几口人、几亩地，你都记在本上。年底你这村零返贫。","effects":{"merit":6,"pop":7,"stress":4,"clean":4,"boss":1,"probe":-1,"health":-2}},{"label":"走形式，拍完照就回城","text":"你待了半天，留了照。报表漂亮，可村还是那个村。你升了，良心亏了。","effects":{"boss":3,"merit":-1,"pop":-3,"clean":-2,"stress":-1}},{"label":"虚报产业套资金","text":"你让范统在表上多填产业，差价20万进了卡。迎检时大棚空空，你手心出汗。","effects":{"money":20,"risk":6,"probe":3,"clean":-6,"pop":-3},"hint":"群众联名信"},{"label":"自掏腰包修村路","text":"你拿了工资修了段路。村民骂你傻，可孩子上学不再蹚泥。你睡得踏实。","effects":{"money":-5,"family":-2,"clean":4,"merit":5,"pop":5}}],"id":"gn2_233","city":"通用","weight":3,"once":false},{"min_rank":1,"max_rank":9,"tags":["身心"],"title":"体检报告","text":"今年体检单红字多了几项：脂肪肝、血压、结节。医生语气平静：「要注意了。」你想起上次陪邹衍喝酒到吐。","options":[{"label":"戒了酒，每天晨跑","text":"你真戒了。半年人清瘦，会上思路清楚。妻子说你像变了个人。","effects":{"health":10,"stress":-4,"clean":1,"family":3}},{"label":"照喝不误，哪天算哪天","text":"你苦笑：「身不由己。」又一场酒局，吐在卫生间，镜子里的人你不认识。","effects":{"health":-6,"stress":4,"clean":-1,"risk":1},"hint":"酒局人命"},{"label":"请假去党校读书班","text":"你躲进党校三个月，清清静静读了点书。回来时竞争上岗名额差点没了。","effects":{"health":4,"stress":-6,"merit":2,"boss":-2,"clean":2}},{"label":"找名中医调理","text":"你托尤氏找了「御医」。方子贵，调理有效，可贾思齐借此说你迷信。","effects":{"health":5,"stress":-2,"money":-6,"net":2,"clean":-2,"risk":2},"hint":"迷信风水"}],"id":"gn2_234","city":"通用","weight":3,"once":false},{"min_rank":3,"max_rank":9,"tags":["审计"],"need":{"min_risk":12},"title":"审计的疑点","text":"审计组盯上你任内一笔54万的防洪堤经费，主审翻着凭证：「这笔，谁经手？」你手心微汗。","options":[{"label":"全面配合，调什么给什么","text":"你敞开账本。查出几笔不规范，但你无个人问题。主审写了「经得起查」。","effects":{"probe":-5,"risk":-3,"merit":5,"boss":2,"clean":5,"stress":4},"hint":"审计查出"},{"label":"让会计技术处理","text":"你暗示改数。冯紫英后来被查，会计 之一。他来探视时说：\"爸，我不怪你，我就是有点累。\"\n\n全部赃款依法追缴，另处罚金。城东那两块地已经开工，塔吊转起来的时候，你在里面已经过了第二个冬天。\n\n你在里面学会了一件事：包厢里那些拍着胸脯说\"有事找我\"的人，找起来比谁都难。倒是那个你一直看不上的小科员，托人给你捎过一包烟。\n\n他捎烟那天，你把烟分给了同监室一半。剩下那一半，你留着，一直没舍得抽。"},{"id":"END_FALL_PATROL","type":"落马","title":"巡视组的车没有鸣笛","grade":"D","key":"probe_full","reason":"巡视组发现","text":"巡视组来的时候很静。没有警笛，没有横幅，车就停在旧楼背面。他们在信访大厅坐了两天，接待了七十三个人，其中十九个说的是同一件事。\n\n十九个人，十九份笔录，指向同一个名字。\n\n你其实早有预感。进驻通知下发的第三天，你就让人把财务室那三个铁皮柜的锁换了新的。换锁这件事，后来被认定为\"对抗组织审查\"的证据之一——你说不清为什么偏偏在那时候换。\n\n十七个项目，九个中标公司注册不足半年。这些数字白纸黑字摆在桌上时，你忽然觉得很累，累得不想辩解。你只说了一句：\"程序我都是签了字的。\"\n\n是的，你都签了字。这就是最讽刺的地方：每一个环节都有你的签名，每一个签名都是合规的样子，只有结果不合规。\n\n你被移送起诉那天，办公楼门口的牌子被取下来重新漆过。新漆的味道很冲，有人说闻着头晕。\n\n妻子把城里的房子卖了，搬到老城区一处小户型。你母亲九十岁，至今以为你在外地挂职，家里人每月替你写一封很短的信，落款都写\"勿念\"。\n\n你在里面把十七个项目一个个想过去，想起的不是钱，是开工那天剪彩的剪刀——那把剪刀是金的，剪完就不知去向。\n\n很多事情就是这样：剪的时候金光闪闪，剪完就找不着了。"},{"id":"END_FALL_AUDIT","type":"落马","title":"第八年凭证排成一面墙","grade":"D","key":"probe_full","reason":"审计查出","text":"审计组那位女同志，把八年的凭证按月份码成一面墙。她说，假的东西最怕排队站好。\n\n她是对的。第七天，她把两张单据并排放在桌上：两家公司，同一台打印机，同一天开的票，连墨色深浅都一样。那一刻你就知道完了——不是因为技术多高明，是因为你太贪，八年间你连换台打印机的耐心都没有。\n\n专项资金一笔笔往下走：转拨、再转拨、最后落进一家没有资质的劳务公司。那家公司的实际控制人姓周，是你妻子的表弟，公司注册地在胡悉市一处民房，门牌号是贴上去的。\n\n庭审时法官问你对指控有无异议。你说：\"金额我认，但那些钱我一分没花。\"\n\n这倒是真的。钱一直在账上转，在亲戚名下趴着，你连一套房子都没敢真正过户到自己名下。你守着一堆数字过了八年，日子过得比很多清官都紧巴。\n\n妻子问过你：\"那我们图什么？\"\n\n你答不上来。\n\n判决生效后，全部违法所得及孳息依法追缴。你名下那辆开了十一年的旧车也一并拍卖了，拍了四万三。\n\n你在里面想起审计组那面墙——原来人这一生做的所有事，最后都会被按月份排好，摆在那里，等你回来看。"},{"id":"END_FALL_BURGLAR","type":"落马","title":"小偷撬开了纪检的门","grade":"C","key":"probe_full","reason":"家中被盗","text":"小偷本来只想拿柜子上那两瓶酒。\n\n他撬开主卧的衣柜，先掉出来的是一摞摞捆得整整齐齐的现金，塑料封条都还在；再往里，十二根金条，红布包着，压在一件你从没穿过的大衣下面。他坐在地板上愣了五分钟，然后掏出手机拍了一张照片。\n\n那张照片拍得很稳，角度、光线都对。办案人员后来说，比不少现场勘查照都清楚。\n\n案子从治安总署转到廉署，只用了四天。你家被依法搜查，衣柜、床箱、阳台的旧鱼缸、书柜后头的夹层，一共起获现金两千一百余万，金条十二根，名表七块。\n\n你在讯问室里反复说同一句话：\"我是不放心银行。\"\n\n不放心银行，却放心衣柜。这事后来在单位里被当成段子讲，讲了很久。\n\n妻子当场就崩溃了，是被人扶出去的。她从头到尾不知道衣柜里有东西——你连她都瞒了十一年。她说，早知道家里有这么多钱，这些年她就不用为了母亲那六万块手术费四处借。\n\n追缴那天，工作人员把金条一根根装进证物袋，编号、称重、拍照。你数着数着，忽然想起最小的那根，是女儿十岁那年你许诺要给她打的，说等她出嫁时当嫁妆。\n\n你忘了打。或者说，你记得，只是每次都觉得——下次吧。\n\n下次没有了。"},{"id":"END_FALL_FAMILY_SHOW","type":"落马","title":"第九张照片里的消防栓","grade":"D","key":"probe_full","reason":"家属炫富","text":"她发的第九张照片里，露出了车库墙上那个消防栓的编号。\n\n有个人把编号和房产公示图对上了，又把公示图和三年前那次土地出让的中标公告对上了，最后把中标公告里签约代表的名字，和你剪彩时站的位置对上了。\n\n那条帖子活了四十分钟就被删掉。四十分钟，足够截图的人截够三百次。\n\n核查只用了两个月。她名下的五套房产、两辆豪车、三十九个包，与你们家庭合法收入相差两千多万。她哭着说：\"别人都这么发，凭什么就我不行。\"\n\n凭什么？凭你的每一张照片，都是一份证据。\n\n你在里面算了算：她发的那些照片，一共四百多张。按图索骥，办案人员比你自己更清楚你家有多少东西。\n\n追缴、拍卖、腾退。房子一套套清空的时候，工人在主卧衣柜里发现了一整排没拆吊牌的衣服——她买的时候大概也只是想拍照。\n\n女儿从国外回来，把最后一个包还给了办案人员，说：\"这个我妈没背过，吊牌还在。\"\n\n你在会见时隔着玻璃看她，她笑了笑，说：\"爸，其实我早就觉得不太对。\"\n\n你说：\"怎么不早说？\"\n\n她沉默了很久：\"我不知道该怎么开口。\"\n\n那四十分钟的帖子，和四十年没说出口的话，最后都成了同一份卷宗里的页码。"},{"id":"END_FALL_VIRAL","type":"落马","title":"同一块表，两个会场","grade":"D","key":"probe_full","reason":"网络曝光","text":"视频画质很差，包厢的灯又红。可你的脸很清楚，尤其是你举杯那只手——腕上那块表，在灯下反了一道光。\n\n有人把那一帧截出来，放大，比对，报出型号和公价。又有人翻出你三年前在廉政会议上讲话的照片：你戴着一块塑料表，讲话稿第一行印着\"清清白白做人\"。\n\n两张图被并排做成一张，配文四个字：\"同一双手。\"\n\n你让人去删帖。删了一批，又冒出一批，像一个按不下去的浮球。你后来才明白，网络这东西不记仇，也不记事，它只是复制——而复制是拦不住的。\n\n舆情核查很快转为立案。那段视频只是引子，真正把你钉死的是包厢的订座记录：十一次，全部由三家企业轮流结账，金额合计四十七万。\n\n判决下来那天，网上又热闹了一阵。热度持续了三天，然后被别的事盖过去。\n\n你在里面的第三年，有个年轻管教偶然问起那块表。你说，那表是假的，是高仿，三千二。\n\n管教愣住了：\"那你还……\"\n\n\"戴着好看。\"你说。\n\n这才是整件事里最荒唐的部分：你为了一块三千二的假表，赔上了三十二年。\n\n而那张并排的图，现在还躺在某些人的收藏夹里，标题叫\"经典对比\"。"},{"id":"END_FALL_ACCIDENT","type":"落马","title":"那顶安全帽还是新的","grade":"F","key":"probe_full","reason":"事故牵出","text":"塌下来的那片脚手架砸穿了三层楼板。救援持续了三十一个小时，最后一名工人被抬出来时，安全帽还是新的，出厂标签都没撕。\n\n死的是四个人。最小的那个二十一岁，当天早上给家里发过一条消息，说\"下个月发工资寄回去\"。\n\n事故调查组翻\"安全检查台账\"，翻到第四本就停了：整本四十多页，签名是同一天写的、同一支笔、同一个方向。有人把它们一次写完，还按日期顺序排好。\n\n那个负责排顺序的年轻人哭着说：\"我是想着，排整齐一点，看着能真一点。\"\n\n账目随后被翻开：施工方没有资质，监理是挂靠的，验收记录是后来补的，而这一切的开关在你手里——那笔两百八十万，你收在自己母亲名下的卡上。\n\n你在留置室里第一次听说死了人的时候，说了句\"这么严重\"。不是装的，你是真不知道。你从来没去过那个工地，你只在效果图上见过它，效果图很漂亮，有喷泉。\n\n庭审那天，遇难者家属来了十一个人，全程没有人说话。宣判后，一个中年女人走到你面前，只问了一句：\"你那天在干什么？\"\n\n你答不上来。你在酒桌上，在给一个不重要的项目站台。\n\n四个人，三十一个小时，两百八十万。你后来每天都在心里乘除这些数字，怎么算都对不上。\n\n账，从来不是这么算的。"},{"id":"END_FALL_RIVAL","type":"落马","title":"他记了三年笔记的背面","grade":"D","key":"probe_full","reason":"同僚举报","text":"举报信是打印的，落款签了真名，还附了身份证号。\n\n你在班子会上说过一句话：\"有些人整天不琢磨事，专琢磨人。\"你说这话时，他正低头记笔记，笔尖顿了半秒，然后继续写，字迹一点没乱。\n\n三年里，你们在同一层楼办公，门口的绿植是同一批买的，甚至有两个月共用过一辆公车。他把你每一次会议的时间、每一次饭局的地点、每一个递过信封的人的名字，都记在那本笔记的背面。\n\n最后一页写着一行小字：\"我不是针对他。我只是记性好。\"\n\n材料核查结果：十九项，属实十六项。\n\n你在讯问室里反复问同一句话：\"他图什么？\"\n\n没人回答你。后来你自己想明白了——他不图什么。他只是每天看着你从他门口走过去，看你拎着别人送的茶叶，看你把本该公开的东西锁进抽屉，看了三年。\n\n换你，你也记。\n\n你的妻子在他升任之后去闹过一次，被保安请了出来。这事传得很快，传成了另一种版本，说你们两家早就有仇。其实没有，你们连一次像样的争执都没有过——这才是最冷的地方。\n\n判决生效后，你被带离法庭时，看见他坐在旁听席最后一排，笔记本摆在膝盖上，没有打开。\n\n你忽然很想看看他这次记了什么。你永远也不会知道。"},{"id":"END_FALL_SUBORDINATE","type":"落马","title":"那句出了事我担着","grade":"D","key":"probe_full","reason":"下属反水","text":"小刘跟了你九年。九年里，他替你提过袋子、挡过酒、抄过讲话稿，也在会上被你点名骂过三次。\n\n谈话那天他带了三样东西：一张你写的便签，上面是\"这个你先办，出了事我担着\"；一个U盘，里面是七年来他经手的全部账目备份；还有一本考勤簿，记着他每次替你加班到凌晨的日子。\n\n他说：\"我不是要害他。我就是想知道，万一出事，那句'我担着'到底担不担得住。\"\n\n答案是没有。\n\n你让他办的那些事，件件都有他的笔迹：代签的、代领的、代存的。你说\"出了事我担着\"，可白纸黑字上落的全是他的名字。你担的是权，他担的是责。\n\n庭审时他出庭作证。你看着他，想起九年前他刚来报到，穿着一件不太合身的西装，袖口长了一截。你说过要给他换个岗位，说了八年，一次也没办。\n\n宣判后，他在法院台阶上抽了半支烟，然后把烟掐了，说：\"我今年三十六，重新开始。\"\n\n你这边不是重新开始，是结算。全部赃款追缴，刑期从那天起算。\n\n你在里面收到过他托人带来的一句话，只有六个字：\"您保重，刘敬上。\"\n\n敬上。他还用敬上。你把那张纸看了很多遍，看到纸边起毛，最后夹在一本旧书里，书是你自己带进去的，叫《干部读本》。"},{"id":"END_FALL_BORDER","type":"落马","title":"闸机滴了一声，红灯亮了","grade":"D","key":"probe_full","reason":"边控拦截","text":"闸机\"滴\"了一声，红灯亮了。\n\n工作人员抬头看你一眼，又看屏幕，很客气地说：\"先生，请到旁边稍等。\"\n\n你把行李箱放在地上。箱子是新的，轮子上的标签都没撕，里面装的是三样东西：外币现金、几份伪造的身份材料，还有一张手写的行程——你写得太认真了，连中转城市的酒店名字都查了。\n\n小屋里没人说话，只有空调在响。二十分钟后有人进来，把一张纸推到你面前：\"请在这儿签字。\"\n\n你后来说，那是你这辈子签得最好看的一个名字。\n\n你本来是可以走成的。嫂子三天前就出去了，钱分五路走，你自己订的是第二天的航班。可你非要回去拿那本相册——里面有你父亲年轻时的照片，你母亲九十岁了，你怕以后再也见不着。\n\n就为了这一趟，晚了四个小时。\n\n这四个小时里，协查通报已经下发到了所有口岸。\n\n判决那天，你母亲托人带话进来，只有一句：\"人回来就好。\"\n\n你在监室里把这句话想了很久。人回来就好——是啊，人回来了，别的都没回来：钱出境了，嫂子不回来了，你的名字在通报名单里躺了三天，被两百多万人读过。\n\n境外那部分资产至今没能全部追回，有关部门还在走程序。你在里面算过：留在外面的那部分，够你嫂子活三辈子，够你妈活十辈子，也够你在这里面，一天天地把这笔账还完。"},{"id":"END_FALL_AML","type":"落马","title":"凌晨三点的一份报告","grade":"D","key":"probe_full","reason":"大额交易报告","text":"系统提示是在凌晨三点跳出来的。\n\n同一个账户，一夜间转进十四笔钱，每笔四十九万八，来自十四个不同的人，验证码填的是同一个手机号。三小时后，整笔转走。\n\n预警员把报告打出来，盯着那个手机号看了半天，说了句：\"这个人，好像也不用这么急吧。\"\n\n第二天早上八点，这份报告躺在移交清单的第一行，批注只有四个字：建议协查。\n\n你之所以这么急，是因为前一天晚上有人给你透了风。你慌了，一晚上打出去二十六个电话，让所有人\"先把钱归拢一下\"。\n\n这二十六个电话，就是二十六个证人。\n\n四十九万八——你记得这个数字是怎么来的：为了避开五十万的整数报送线。你以为自己很聪明。其实恰恰相反：正是这种整齐的、千篇一律的四十九万八，让整个链条一眼看上去就像一个人排的队。\n\n追缴进行得很快，因为钱全在账上。一共是三千七百万，分了四十一个账户，用了十一个身份证。你在讯问时说：\"我从来没想过要花。\"\n\n那你为什么拿？\n\n这个问题法官问了一次，你没答上来。后来在里面，你又想了很多次，还是没答上来。\n\n女儿最后一次来看你，隔着玻璃说了句：\"爸，我小时候你跟我说过，不要拿别人的东西。\"\n\n你说：\"我记得。\"\n\n\"那你还拿。\"\n\n你低下头。玻璃上有道划痕，正好横在你和她中间。"},{"id":"END_FALL_HOUSES","type":"落马","title":"十六套钥匙在我妈那儿","grade":"D","key":"probe_full","reason":"房叔房姐","text":"清单打了十九页。\n\n最多的那套在城东，一百八十平，登记在你大姐名下；最远的那套在邻市，一直空着，物业费交了六年；还有两套商铺，租给了一家奶茶店和一家洗车行，租金每月打进同一张卡。\n\n办案的同志念到第七页时停下来问：\"这些房子，你自己去看过几套？\"\n\n你想了想，说：\"三套。\"\n\n\"剩下的十六套呢？\"\n\n\"钥匙在我妈那儿。\"\n\n你母亲八十七岁，耳朵背，一辈子没出过川平省。她把十九串钥匙挂在一根铁丝上，围在腰上，夏天隔着衣服都能看出一圈形状。她说这是\"给儿子们攒下的\"。\n\n案发后，工作人员上门收缴钥匙。老太太不撒手，坐在地上哭了两个小时。最后是你大哥劝下来的。\n\n你在里面听说这事，整整三天没说话。\n\n十九套房产全部依法追缴、拍卖。拍卖那天，那套城东的房子流拍了一次，第二次降价成交，成交价比你当年买时还低——这些年你守着它们，一分没赚，还倒贴了六年的物业费。\n\n你在里面把这件事想了很多遍：你囤了一辈子的房子，最后一套都没住进去。你住过的最舒服的地方，是单位分的那套七十平的老房子，墙皮掉了一角，冬天暖气不热，可你在那儿睡得最踏实。\n\n那套房子后来被你换掉了。换的时候你还挺高兴。"},{"id":"END_FALL_GAMBLE","type":"落马","title":"我只要三天","grade":"F","key":"probe_full","reason":"赌博欠债","text":"第一晚你赢了四十万。你把筹码推回桌上，说：再来。\n\n第三晚你输了六百八十万。签单的时候手还是稳的，因为你脑子里已经有一张清单：哪个项目的尾款还没结，哪个老板欠你人情，哪笔账可以先挪三个月。\n\n你要的是三天。你以为三天够了。\n\n追债的人没等你三天。他们把一张打印纸塞进你家门禁缝里，上面只有金额和日期。第二天早上保洁捡起来交给物业，物业主任拍了照发给他表弟，他表弟在信访局上班。\n\n一共经过三只手，八个钟头。\n\n核查从那张纸开始，越查越深：为了还债，你挪用了两项专项资金，向五个老板\"借\"了钱（至今没还，也没打算还），还把一处安置房工程的尾款提前拨了出去。\n\n那个工程的回迁户，已经等了六年。\n\n庭审时法官问：\"知不知道挪用专项资金是什么性质？\"\n\n你说：\"知道。\"\n\n\"那为什么还动？\"\n\n你说：\"我当时想着，先借来周转，三天就补回去。\"\n\n三天。你用三天，换了十一年。\n\n你在里面认识一个因为赌博进来的年轻人，问他：\"你上桌的时候在想什么？\"\n\n他说：\"在想赢钱。\"\n\n\"赢了之后呢？\"\n\n\"再赢一点。\"\n\n你忽然明白，这辈子所有的\"就这一次\"，其实都是同一个句式。\n\n而那六个字——\"我先借来周转\"——是你这辈子说过最贵的一句话。"},{"id":"END_FALL_DIARY","type":"落马","title":"我记这些是为了不糊涂","grade":"F","key":"probe_full","reason":"日记曝光","text":"你记了十四年。\n\n一开始记的是工作：今天开了什么会，谁说了什么话，哪句话值得琢磨。后来开始记数字：某月某日，某，二十万，办。某月某日，某，一套，办。\n\n你记这些不是为了留证据，是为了不糊涂。你说过，人一糊涂，就要被人拿住。\n\n第十四年的最后一篇你写：\"今年收成不错。要收一收了。\"\n\n你确实收了一收——第二个月，你把这本日记从书柜第三层挪进了保险柜。挪的这一下，被家里的监控拍了个正着。\n\n那台监控还是你自己装的，说是防贼。\n\n十四本日记，两千一百多页，被逐页扫描、编号、制作成证据卷。里面的每一个数字都对得上银行流水，每一句话都够你喝一壶。庭审时，检察官念了其中三页，念完法庭里很安静。\n\n你的辩护人说，这些材料是个人隐私。法官说，违法所得的记录不受隐私权保护。\n\n你在里面听人讲过一句话：最了解你的不是组织，是你自己写下的字。\n\n追缴进行了两年多，连你在日记里记的一块表、两瓶酒都算进去了。你当年写下它们的时候，是带着一种满足感的——你记\"办\"这个字的时候，觉得自己很能。\n\n如今那些\"办\"字排在一起，一共是一千九百三十七个。\n\n判了之后，你把这句话在心里改了一遍：最能害你的，也不是别人，是你自己写下的字。"},{"id":"END_FALL_PETITION","type":"落马","title":"我这辈子等着","grade":"F","key":"probe_full","reason":"群众联名信","text":"联名信一共十一页，后面是四百三十七个名字。\n\n有人按手印时手抖，红印子按歪了，又补了一个；有两个名字是家里人代签的，因为本人已经不在了；还有一位老太太在自己名字后面写了六个字：\"我这辈子等着。\"\n\n信封是牛皮纸的，封口贴了张白纸条，上面写着\"请交到能管事的人手里\"。这封信在路上走了十一个月，经过七只手，落到廉署信访窗口时边角已经磨毛了。\n\n核查结果：反映问题基本属实。\n\n你在那个片区干了九年。九年里，安置补偿款被压低了两成，回迁房从六栋变成四栋，省下的那两栋地基卖给了开发商，开发商给你留了一套，登记在你小舅子名下。\n\n那四百三十七户，最久的等了十一年。有人租房子过年，有人在临时板房里娶了媳妇、生了孩子、又送走了老人。\n\n庭审那天来了很多人，法庭坐不下，外面站了一院子。宣判的时候没人喊，也没人哭，就是很安静地听着。\n\n判完，人群慢慢散了。有个老太太走到警车旁边，隔着窗子看了你一眼。她没说话，只是把手里的一张纸举起来——是那张回迁协议，纸都黄了。\n\n你在里面收到过一份材料，是让你签字确认的追缴清单。签完你问了一句：\"他们什么时候能住进去？\"\n\n没人答你。\n\n这笔账你还得清，那笔账你得一辈子背着。"},{"id":"END_FALL_UPSTREAM","type":"落马","title":"老大的名字在第七页","grade":"D","key":"probe_full","reason":"上级牵连","text":"老大出事那天，你正在主持一个会。\n\n会开到一半，秘书弯腰说了句什么。你说\"继续\"，然后讲了四十分钟，讲得比平时都好。散会时你还特意跟每个人握了手。\n\n当天晚上，你把家里所有纸质材料搬到卫生间，撕碎、冲水。冲到第三次，下水道堵了。你蹲在地上掏了半小时，掏出一坨湿透的纸浆，里面还能看清\"关于\"两个字。\n\n后来办案人员问你为什么不全烧了。你说：怕烟太大。\n\n这话说出来的时候，你自己都想笑——怕烟太大。你怕了半辈子的东西，最后怕的是烟。\n\n你在老大身上花过很多钱：三次\"探望\"，两次装修，一辆车，还有他外甥的那家公司。你以为这叫投资，其实这叫登记。\n\n账本在他那儿，也在专案组那儿。你送出去的每一笔，都有人记着；你收进来的每一笔，也都有人记着。你不过是一个中转站——上面来的水压到你这儿，你再往下流一点，自己截留一勺。\n\n勺不大，一共一千四百万。可专案组的卷宗里，你这一节占了七十二页。\n\n判了以后，你在里面见过老大一次，在转监的通道里，两个人擦肩而过。他没有看你，你也没有看他。\n\n你后来想起二十年前，你刚进机关，是他带你去食堂吃的第一顿饭，还替你付了三块五。\n\n那三块五，你一直没还。"},{"id":"END_FALL_ABROAD_KID","type":"落马","title":"爸，打钱的人名字怎么不一样","grade":"D","key":"probe_full","reason":"子女留学资金来源","text":"学费是分四笔汇出去的，四个汇款人，四个不同的姓。\n\n学校财务处的记录很干净：缴费及时，从不拖欠，账户信息三年没变。倒是孩子自己在邮件里问过一句：\"爸，怎么每次打钱的人名字都不一样？\"\n\n你回的是：\"公司财务，你别管。\"\n\n那封邮件被打印出来时，办案人员在旁边批了一行字：其子已知情可能。\n\n再往下翻，是孩子在境外买的那套公寓，首付八十万，签合同时他二十一岁，职业一栏填的是\"学生\"。\n\n你在讯问室里只坚持了一个说法：\"钱是我借的。\"\n\n借条呢？没有。利息呢？没谈。还款期限呢？没定。四年里一共两千三百万，没有一个字的借据。你把他保护得很好，好到他以为家里本来就很有钱。\n\n判决生效后，那套公寓被依法处置。孩子退了学，在一家餐馆后厨做工。他第一次来看你时，隔着玻璃说的第一句话是：\"爸，那房子是不是也没了？\"\n\n你说：\"没了。\"\n\n他点点头，说：\"哦。那也好，省得我每个月还要想这事儿。\"\n\n你笑了，笑着笑着眼泪下来了。\n\n你在里面给他写过一封信，写了七页，最后只寄出去一页，上面写着：别省着吃，别怕丢人，别撒谎。\n\n这三句话，你自己一条都没做到。\n\n追缴还在继续。你最大的遗憾不是钱没了，是你亲手把\"父亲\"这个身份，也一并花掉了。"},{"id":"END_FALL_FAKE_DIVORCE","type":"落马","title":"你现在跟我没关系了","grade":"D","key":"probe_full","reason":"假离婚转移资产","text":"离婚证是周二领的，两人都没请假。\n\n办完出来在门口站了一会儿，她说：\"晚上吃什么？\"你说：\"照旧。\"\n\n房子过户用了十一天。你们一直住在一起，钥匙没换，牙刷没动，连冰箱上那张超市小票都还是两个人的名字。\n\n办案人员问她：\"离婚之后，你们的关系有什么变化？\"\n\n她想了很久，说：\"没什么变化。就是每次吵架，他会多说一句——'你现在跟我没关系了，你别管'。\"\n\n这句话她记住了，也记住了日期。这句话后来成了她主动配合的一个理由。\n\n法院认定：以合法形式掩盖非法目的，相关财产系违法所得及其孳息，一并追缴。\n\n十一套房产、三个车位、两千一百万理财，全部执行。执行那天她站在门口，看着封条一张张贴上去，什么也没说。\n\n你在里面收到她的最后一封信，很短：\"我早就说过，房子够住就行。你不听。现在我们都够住了。\"\n\n追缴结束后，她租了一间四十平的老房子，自己住。你在里面算过：她搬进去的那间房子，月租两千二，是你们当年最便宜那套房子的物业费。\n\n你这一生办过最大的一笔\"划算生意\"，最后算下来：净亏一个家。\n\n还有一件事你始终没弄明白——那天办完离婚手续，你为什么会觉得轻松？你明明什么都没得到，只是把两个人之间的最后一纸关系也撕了。\n\n撕得比那些冲进下水道的文件还碎。"},{"id":"END_FALL_MEDREP","type":"落马","title":"维护成本表第七行","grade":"D","key":"probe_full","reason":"医药代表","text":"那位代表每次来都不空手。冬天带一盒润喉糖，夏天带一袋冰棍，说是\"给护士站的\"。\n\n她做的表格比院办的还规范：哪一科用了多少，哪个品规快到期，哪个主任快退休。她甚至提醒过你，某批耗材的注册证下个月要换，\"别在旧证上签字\"。\n\n案发后，办案人员在她电脑里找到一张表，表名叫\"维护成本\"。最后一列是\"产出比\"。\n\n你的名字在第七行，产出比那一栏填的是 1:9。\n\n九倍的回报。她那边记的是生意，你这边签的是生命。\n\n那几年，你们系统里进了三批设备，两批是\"参数量身定做\"的；耗材价格比邻近地区高出三成；有个科室承包给了一家公司，那家公司注册在胡悉市，法定代表人是她的表妹。\n\n患者不知道这些。他们只知道检查费涨了，药贵了，排队更久了。\n\n庭审时，检察官念了一份清单：某批次耗材共使用了两千三百例，涉及金额六百八十万，其中回扣九十万。\n\n两千三百个人，九十万。平均每个人，给你贡献了三百九十块。\n\n你在里面第一次真正想清楚这件事的时候，正在吃饭——白菜炖豆腐。你把碗放下了。\n\n追缴、判刑、行业禁入。你妹妹原来在医院做保洁，案发后第二天就辞职了，她说她受不了别人在背后指。\n\n你在里面给她写过信，没寄。\n\n那封信的第一句是：姐（她排行在你前面，你从小这么叫她），我犯的不是错，是罪。\n\n改了很多遍，最后只留下这两个字：姐，对不起。"},{"id":"END_FALL_BLACKMAIL","type":"落马","title":"我这行也有通胀","grade":"D","key":"probe_full","reason":"被敲诈反噬","text":"第一次他只要三十万。你给了。\n\n第二次他要一个标段的劳务分包。你也给了。\n\n第三次他开口要八百万，还说：\"您别嫌多，我这行也有通胀。\"\n\n你终于说了句硬话：\"你敢。\"\n\n三个月后，一叠材料出现在廉署信访窗口，附信三行：\"我说到做到。你们要是不管，我就发网上。\"\n\n信封上没有寄件人。邮戳是江百市城西那家邮局的，监控显示寄件人戴口罩、付现金、找零没要。\n\n你从来不知道他是怎么拿到那些东西的。可能是司机，可能是保洁，可能是某次酒局上你以为早就关掉的手机。你花了半辈子经营\"圈子\"，到头来，圈子里最不起眼的那一环，把你卖了。\n\n更可笑的是：你在被敲诈的那些年里，一次都没想过主动交代。你算过账——交代要进去，不交代要给钱，给钱至少还能在家睡觉。\n\n这个算式错在一个地方：给钱是永远填不满的。你不是在被勒索，你是在为一口枯井打水。\n\n最终查实的受贿金额是两千九百万，其中一千一百万流向了那个敲诈者。这笔钱也被依法追缴——只是追回来的可能性不大，人早跑了。\n\n你在里面听说过一句话：怕事的人最好拿捏。\n\n判了九年。你算了一下，一年三百六十天，正好抵他被敲诈的三年里的每一天。\n\n这么算，倒也公平。"},{"id":"END_FALL_LOAN","type":"落马","title":"规矩就是规矩","grade":"C","key":"probe_full","reason":"放贷翻脸","text":"你借出去的钱一共两千三百万，收回来的只有一千一百万。\n\n剩下的那些，欠条有、抵押有、连\"逾期每日千分之三\"的条款都写得清清楚楚。你说过：我这人最讲规矩。\n\n出事的是最后一笔。那个老板还不上，跪在你办公室门口磕头。你说：\"规矩就是规矩。\"\n\n第二天他就去举报了。材料里附了十九张转账截图，还有一段你在饭桌上说的话：\"钱放你那儿生息，比放银行强，银行还得查我。\"\n\n录音是他媳妇录的。她说她早就想录了。\n\n查下来，放贷的本金本身就是赃款。你用受贿的钱去放贷，用公权力去催收，用职务影响力去干预调解——这三条，每一条都够你受的。\n\n更讽刺的是：你自以为在\"理财\"。你跟妻子说过，这是\"让钱生钱，比存着安全\"。你甚至在笔记本上算过收益率，年化百分之十点八，你觉得这很专业。\n\n那些笔记后来也进了卷宗。\n\n判决时，法院认定放贷所得为违法所得孳息，一并追缴。追缴清单上有十一个人的名字，其中一个已经破产，一个下落不明。\n\n你在里面见过一个因为非法放贷进来的年轻人。他问你：\"哥，你这辈子最后悔什么？\"\n\n你说：\"最后悔把'规矩'这两个字挂在嘴边。\"\n\n\"为什么？\"\n\n\"因为说多了，就真以为自己有规矩了。\"\n\n追缴持续了三年。到第三年，你名下只剩下一个公积金账户，里面还有四万一千块，是当年工资里正常扣缴的部分。\n\n这四万一千块，是你这辈子唯一干净的钱。"},{"id":"END_FALL_WHISTLE","type":"落马","title":"他准备了两年的抽屉","grade":"D","key":"probe_full","reason":"内部举报人","text":"他准备了两年。\n\n第一年，他只是把不该由他签的字留了底。第二年，他开始记时间：谁的车几点进的地库，拎着什么，空手出来。\n\n他用的是一部旧手机，不联网，拍完就锁进抽屉。抽屉里还有一张纸，写着三十七个字：\"我知道说了会没工作。但不说，我每天上班都得先说服自己一遍。\"\n\n交材料那天他在门口站了二十分钟，最后是被保安请进去的——保安以为他是来办事的群众。\n\n你记得这个人。三年前，因为一份报告里的数据口径，你在会上批评过他，说他\"死脑筋、不懂政治\"。后来你把他调去了窗口。\n\n他走的那天没来跟你告别。\n\n材料一共四十七项，涉及金额两千一百万，时间跨度六年。证据形式包括：拍照、录音、Excel、以及一份他自己手写的日期对照表。\n\n那份对照表做得极工整，用了三种颜色。\n\n你在讯问时问过一句话：\"他图什么？他还是没能升上去啊。\"\n\n办案的同志说：\"他本来也没想升。\"\n\n这句话你在里面想了很久。你一辈子都在想怎么往上走，从来没想过——有些人只是想每天能安心上班。\n\n判决生效后，他被调回了原岗位。新来的领导在会上说了一句\"要坚持原则\"。\n\n你在里面听说这件事的时候，正在洗碗。水很凉，你洗了很久。\n\n那天晚上，你在笔记本上写了一句话：我这辈子，劝过很多人\"灵活一点\"。唯一一个不听的，最后活得最像个人。"},{"id":"END_FALL_MEDIA","type":"落马","title":"橘子摊摆了三个月","grade":"D","key":"probe_full","reason":"记者暗访","text":"那个记者在你们单位门口摆了三个月的水果摊。\n\n他卖橘子，一筐一筐的，从不缺斤少两。他跟保安混熟了，跟保洁混熟了，跟门口卖煎饼的也混熟了。他知道你几点上班、几点走、哪天带人回办公室、哪个老板的车不用通报。\n\n最后一次，他没摆摊。他在对面楼里架了一台机器，等了六个小时，拍到一个黑袋子从车上下来、进楼、四十分钟后空着手出来。\n\n片子播了十二分钟。前十一分钟是橘子摊。\n\n那十一分钟里，有你单位的门、有你的车、有你每天早晨固定买一份报纸的报亭，还有一个卖橘子的人说了句：\"这单位好，人多。\"\n\n然后是最后一分钟：黑袋子、背影、时间码。\n\n片子播出后你还在会上说\"这是断章取义\"。第二天，原始素材送到了廉署。\n\n查实：三年内接受同一批企业宴请二十六次，收受礼品礼金一百七十万，违规干预具体审批事项十一件。\n\n你在里面看过那段片子。你看了很多遍，每遍都停在第十一分钟——那时候你还不知道自己被拍了，正从车上下来，抬头看了看天。\n\n那天的天很好。\n\n你在想：如果那天抬头的时候，能多看两秒钟，会不会不一样？\n\n不会的。第二天你还是会进那栋楼，还是会接过下一个黑袋子。抬头看天这件事，只有当它成为证据的时候，才显得意味深长。\n\n追缴完毕。那家卖橘子的摊子撤了，有人说他后来去了邻市，还是卖水果。\n\n他这辈子大概卖过几十万斤橘子。只有那十一分钟，被几百万人看过。"},{"id":"END_FALL_TENDER","type":"落马","title":"三份报价相差五万三","grade":"D","key":"probe_full","reason":"招投标串标","text":"三家公司来投标，报价分别是四千八百二十一万六、四千八百二十三万一、四千八百二十六万九。\n\n招标文件出自同一家打印店，文件属性里的作者名是同一个人。更巧的是，三家的投标保证金来自同一家银行的同一个网点，前后相差十九分钟。\n\n评标那天，专家是从库里随机抽的。可抽出来的五个人里，有三个在过去一年内坐过同一辆考斯特，去过同一个温泉度假村。\n\n这些都不难查。难的是——这样的事，一共办了二十七次。\n\n二十七个项目，涉及金额十一亿三千万。你从中拿了多少？一千九百万。剩下的差价，进了那些公司的口袋，变成了偷工的钢筋、缩水的混凝土、提前一年开裂的路面。\n\n有个项目是座桥。通车第二年，桥面就出现了裂缝。养护队补了三次，去年干脆封了一半。\n\n你在被追缴时才知道：你拿走的一千九百万，大概相当于那座桥造价的百分之三。就是说，为了让那百分之三落进你的口袋，有九十七的钱，被修成了一座不能走的桥。\n\n这个算法是法官算出来的，不是你。你从来没这么算过。\n\n追缴了四年，只追回六成。剩下的部分，你妻子签了分期退赔协议，每个月从退休金里扣。\n\n她在协议上签字的时候手很稳。签完抬头问了一句：\"要扣到什么时候？\"\n\n办案的同志说：\"扣到还清为止。\"\n\n她点点头：\"那就好，有个日子。\"\n\n你在里面把二十七个项目一个个想过去，想起的不是钱。是开工那天，你剪彩用的那把剪刀——金色的，剪完就不见了。\n\n原来很多东西都是这样：剪开的时候金光闪闪，剪完之后，谁也不知道它去了哪儿。"},{"id":"END_FALL_GHOST","type":"落马","title":"王有志在编十一年","grade":"C","key":"probe_full","reason":"吃空饷","text":"名册上有个人叫\"王有志\"，在编十一年，工龄十一年，工资照发，社保照缴。\n\n单位里没人见过他。有人说他去外地了，有人说他\"长期病休\"，还有人说这个名字是当年为了凑编制随口编的。\n\n核查组去社保、去户籍、去银行跑了一圈。户籍有这个人，人是真的；社保有记录，缴了十一年；工资卡是真的，每月十五号到账，到账后三天内被人在另一台柜员机上取走。\n\n取款录像保存了七年。七年里，取钱的都是同一只手。\n\n那只手的主人是单位财务科的临时工，姓陈，一个月多拿八百块\"辛苦费\"。她供述时说：\"我以为这是单位的钱，又不是抢谁的。\"\n\n单位的钱就不是钱吗？\n\n十一年，一共是九十七万。这个数字不大，小到你在单位里甚至不觉得它是个事。可庭审那天，法官念出这个数字的时候，旁听席上有个人笑出了声——那是附近村的治保主任，他说：\"我们村一年的办公经费是三万。\"\n\n那一声笑，比任何指控都让你难受。\n\n你在里面算过：九十七万，够那个村子办公三十二年。\n\n追缴的时候，那只手的主人被追了八百块一个月，一共追了六万七。剩下的部分，从你的赃款里抵扣。\n\n你在最后陈述时说了一句话：\"我那时候觉得这是小事。\"\n\n法官说：\"所有大事，都是从小事开始的。\"\n\n这句话你记住了。你把它写在监室墙上的一张便条上，贴了很多年。\n\n后来你换监室，忘了撕下来。别人搬进去，大概会以为是上一个人留下的什么规矩。"},{"id":"END_FALL_TEMPLE","type":"落马","title":"你命里有贵人","grade":"C","key":"probe_full","reason":"迷信风水","text":"大门改过三次。\n\n第一次朝南，大师说犯冲，改成朝东。第二次朝东，说压不住，加了两尊石兽。第三次，石兽也压不住，于是在楼前挖了一个水池，说是\"聚财\"。\n\n水池花了三百八十万，用的是城建的零星工程经费。挖到一半挖出一根旧管线，又多花了七十万改线。\n\n新大门落成那天，你站在台阶上拍照，笑得很舒展。照片后来被做成展板，挂在廉政教育展的第三展厅，标题是\"形式主义与封建迷信\"。\n\n你在展板前站过一次。那是判了以后，被组织去接受教育。同行的十几个人都低头看地，只有你一直盯着照片里自己的脸。\n\n你那时候在想什么？你在想：真灵。\n\n你最后一次见大师，是风声最紧的那个星期。他说：\"别急，你命里有贵人。\"\n\n你信了。你甚至把这句话记进手机备忘录，标题是\"安心\"。\n\n这份备忘录后来也被打印出来，作为材料之一。办案人员念的时候，法庭里有人低声笑。\n\n你没有笑。你忽然明白，所谓\"贵人\"，其实就是你这些年巴结过的每一个人——而现在，他们谁也不是你的贵人。\n\n追缴范围里还包括一个特别的条目：大师收取的\"法事费\"二百一十万，依法予以追缴。那位大师在另案中被以诈骗罪起诉，他在讯问中说了一句实话：\"我哪知道什么风水，我就是看人下菜碟。\"\n\n看人下菜碟。这四个字，比你听过的任何一句批评都准。\n\n你在里面养成了个习惯：每天睡前把手头的东西摆整齐。不是为了风水，是因为——摆整齐了，第二天找起来方便。\n\n这是你唯一一次，按常识办事。"},{"id":"END_FALL_DRUNK","type":"落马","title":"酒量就是态度","grade":"F","key":"probe_full","reason":"酒局人命","text":"那天是给老李接风。他刚调来，不善饮，第一杯就说了\"我喝不了\"。\n\n你说：\"到了这个桌上，酒量就是态度。\"\n\n第七杯是他自己端起来的。第九杯是你端给他的。散场时他还能走，还能笑，还能跟人握手。\n\n凌晨三点，家属打来电话。凌晨三点四十，酒店的监控被要求\"例行覆盖\"。早上七点，有人送来一份协议，说签了就给一百二十万。\n\n家属没签。他们把那份协议复印了十一张，一家一家地送。\n\n核查随之展开。查出来的不只是那一晚：你三年里违规接受宴请四十三次，酒后批办事项十九件，涉及金额一千六百万。那些在酒桌上随口答应的事，第二天都变成了会议纪要——你以为酒话不作数，其实酒话最作数，因为所有人都记得。\n\n老李的妻子在法庭上只说了一段话。她说：\"他不是不能喝，他是不敢不喝。他在前一单位因为不喝酒，被晾了六年。他换了单位，是想着换个活法。\"\n\n你听见这句话的时候，忽然想起自己年轻时也被人灌过。你也吐过，也跪在厕所里哭过。\n\n你后来是怎么变成那个劝酒的人的？你想不起来从哪一天开始的。这就是最可怕的地方：没有哪一天。是慢慢变的。\n\n判决那天，老李的女儿也来了，十九岁，穿着一身黑。宣判以后她走到你面前，说：\"我不要你赔钱。我要你以后每天想一遍那天晚上。\"\n\n你在里面做到了。十年了，一天没落下。\n\n追缴完毕，附带民事赔偿另行执行。你每个月能拿到的劳动报酬是两百多块，全部用于履行赔偿。\n\n你在里面算过：按这个速度，赔完需要一百四十七年。\n\n那就一百四十七年。你也只能这么还了。"},{"id":"END_FALL_ESCAPE_FAIL","type":"落马","title":"哥，我早就想掉头了","grade":"F","key":"probe_full","reason":"外逃被截","text":"你带了三样东西：一个装现金的背包，一本假名证件，还有一张手写的路线图，背面写着\"别走高速，走老国道\"。\n\n司机是你表弟。他一路上没说话，只开了一次车窗，说有点闷。\n\n检查站的灯很亮。有人敲了敲车窗：\"请下车，例行检查。\"\n\n你后来一直想不通那二十分钟里到底错在哪一步：是背包太鼓？是手抖？还是那张路线图——你写得太认真了，连休息站的名字都标上了，反倒不像出门旅游的人。\n\n车被扣下时，表弟终于说了句话：\"哥，我早就想掉头了。\"\n\n你没接话。你知道他说的是实话，从出城第二个路口他就想掉头了，是他媳妇在电话里哭，才让他一直往前开。\n\n被截回后，核查迅速铺开。你在被控制前三天已经让妻子把境外账户里的钱转去了别处——但境外那一侧的合作方并不认账，钱到现在也没追回来一分。\n\n境内这部分，一共查实四千一百万，全部追缴。妻子因为协助转移资产，另案处理，判了三年，缓刑四年。\n\n你在里面最常想起的一幕，不是检查站，是出发那天清晨——你出门前，回头看了一眼自家阳台。晾衣绳上挂着孙女的小袜子，橙色，一只大一只小。\n\n你本来想说\"过几天就回来\"。\n\n你没说，因为你心里知道不会回来了。\n\n现在你每天都在里面。日子很慢，慢到你终于有时间把那句话补上。\n\n你补了一遍又一遍，从来没有一次说完过。\n\n外逃失败这个结局，最难受的地方不是没跑掉，是——你差一点就跑掉了，而那\"差一点\"，要用你剩下的全部时间去想。"},{"id":"END_FALL_EXTRADITE","type":"落马","title":"窗帘是米黄色的","grade":"F","key":"probe_full","reason":"境外遣返","text":"遣返那天风很大。被带上车前你回头看了一眼——那间租了三年的公寓，窗帘是自己买的，米黄色，说是\"看着像家\"。\n\n三年里你没学会几句当地话，倒是学会了一个词，意思是\"等\"。你每天都在等：等消息、等身份、等哪天真的不用再躲。\n\n你最怕的不是警察，是信箱。信箱一响，你心跳就快半拍。后来你干脆不去开，让信堆着，堆到塞不进去。\n\n遣返程序走了十四个月。这十四个月里，你搬了四次家，换了两个假名，打过五份零工——洗碗、搬货、给人看店、送餐、还有一次在农场摘果子。摘果子那活儿最苦，一天下来腰直不起来，可你在那儿待得最久，因为农场给现金，不问身份。\n\n押解的同志后来问你：\"这些年，最难受的是什么？\"\n\n你说：\"不是怕。是每天早上醒来，第一件事是想起自己在哪儿，然后要花好几秒钟才反应过来——哦，我在这儿。\"\n\n\"第二件事呢？\"\n\n\"想不起来今天是几号。\"\n\n回国后，全部违法所得依法追缴，境外部分经由协作程序持续追讨。你在看守所里第一次吃到热馒头的时候，眼泪掉进了碗里。\n\n那馒头很普通，食堂蒸的，有点碱味。\n\n你在国外的第三年，有一次在华人超市看见这种馒头，一袋四个，卖得比国内贵二十倍。你站那儿看了很久，没买。\n\n你当时想的是：等我回去再吃吧。\n\n现在回来了，一天两个。你吃得很慢。"},{"id":"END_FALL_RED","type":"落马","title":"十一年，零收益","grade":"F","key":"probe_full","reason":"红通落网","text":"抓到你的时候，你在一家仓库搬纸箱。六十一岁，头发全白，右手食指缺了一节——那年被切肉机伤的，没敢去医院。\n\n你住的地方十二平米。墙上有张地图，是十一年前买的，边角卷了，上面用铅笔圈过二十几个城市，最后圈住的那个，就是这间屋子。\n\n办案人员问你：\"这么多年，想过回来吗？\"\n\n你说：\"想过。每年都想。\"\n\n\"那为什么不回？\"\n\n\"一开始是不敢。后来……\"你停了很久，\"后来是不甘心。你想啊，都跑了这么远，要是就这么回去，那这些年算什么。\"\n\n你算出来的答案是：十一年，零收益。\n\n你带出去的钱，一共三千二百万。第一年被\"朋友\"骗走八百万，第二年为了办身份花掉六百万，第三年被人敲诈，第四年汇率亏了一截，第五年你生病，不敢去大医院。到第八年，账上还剩不到两百万。\n\n剩下的那些年，你靠给别人看店、送餐、摘果子活着。你算过，十一年你一共挣了大概四万块。\n\n四万块，三千二百万。这笔账，你在里面的第一个月算得清清楚楚。\n\n回国后，全部违法所得依法追缴，境外部分继续追讨。你的妻子在这十一年里没有改嫁，也没有再提过你。她把房子卖了，去过自己的日子。\n\n判决那天她来了，坐在最后一排。宣判后她没有上前，只是远远地点了一下头。\n\n你在里面想：那一个点头，大概就是这十一年你得到的全部。\n\n红色通缉令上的照片，是你四十九岁时拍的。那时候你刚提了副厅，头发还是黑的，脸上有点肉。\n\n现在那张照片还在，贴在公告栏上，;而你已经认不出自己了。\n\n这才是真正的落网——不是被抓，是终于看清了自己这十一年。"},{"id":"END_FALL_SELF_TURN","type":"落马","title":"谁先说谁是孙子","grade":"F","key":"probe_full","reason":"同案抢供","text":"你们约好谁都不说。\n\n还约好：万一真有人开口，先扛三个月，三个月里外面会想办法。你甚至把\"谁先说谁是孙子\"这句玩笑说了三遍，第三遍的时候两个人都笑了。\n\n第三十七天，他开口了。\n\n他说得比谁都快——因为先说的那个，才算\"主动交代\"。这个道理你们都懂，只是你以为，你会是那个先懂的人。\n\n笔录摆在你面前的时候，你一眼认出了他的笔迹。签名那三个字，最后一横照例往上挑，跟他签了二十年的字一模一样。\n\n你在心里把那句玩笑补完了：孙子就孙子吧，反正也没人认。\n\n他供出的是全套：资金怎么分、谁联系谁、哪笔进谁的账、你在其中起了什么作用、分了多少。他甚至记得你某次说的一句话：\"这个数，别贪，够花就行。\"\n\n够花就行——你一共分了两千六百万。他在里面说，你这句\"够花就行\"，他记了很多年，越想越不是滋味。\n\n你拒不认错，被认为不具有从宽情节。他被认定有坦白和重大立功表现，依法减轻处罚。\n\n两个人，同一件事，两份判决，差了六年。\n\n你在里面见过他一次。他在另一个监区，远远地点了个头。\n\n你后来听说他出去了，开了个小店，卖五金。\n\n你在里面算过：如果他当时不开口，两个人都得判十二年。他开了口，他六年，你十四年。\n\n这笔账怎么算都是他占了便宜。可你恨不起来——你恨的是那三十七天。那三十七天里你本来也可以开口的，你只是觉得，他不会。\n\n原来所有的同盟，都建立在一个假设上：对方比你更傻。\n\n而这一点，从来没成立过。"},{"id":"END_ESC_USA","type":"逃亡","title":"漂在美利坚","grade":"C","reason":null,"text":"你终于站在了那片自称自由的国土。可自由是别人的，你只有惶惶。语言不通，不敢就医，每月靠地下钱庄的残款过活。移民局的传票、使馆的约谈、同胞的冷眼，你成了异乡的幽灵。偶尔刷到家乡的山水，你会愣很久。这辈子，回不去了。"},{"id":"END_ESC_CAN","type":"逃亡","title":"温哥华的雪","grade":"C","reason":null,"text":"温哥华的雪很安静。你买了一栋小楼，把自己关在里面。邻居以为你是退休富商，没人知道你不敢接任何来自故国的电话。雪落了一季又一季，你数着日子，却数不到尽头。逃亡不是解脱，是另一种刑期。"},{"id":"END_ESC_AUS","type":"逃亡","title":"南半球的太阳","grade":"C","reason":null,"text":"南半球的太阳很烈，晒不化你心里的冰。你在澳洲买了座酒庄，雇人打理，自己从不露面。红通协查的消息一来，你就关店走人。你跑得过海关，跑不过自己的影子。"},{"id":"END_ESC_NZ","type":"逃亡","title":"新西兰的牧场","grade":"D","reason":null,"text":"你在新西兰买了一座牧场，假装自己是农场主。牛羊不认识你，你也不认识自己。当地华人圈传着你来历的版本越来越多，你只能越搬越远。孤独比追逃更先到。"},{"id":"END_ESC_SIN","type":"逃亡","title":"狮城的影子","grade":"C","reason":null,"text":"新加坡法治严明，你也算藏得稳。可这里处处要身份、要税单、要来源。你的钱说不清来历，每一天都提心吊胆。你在金沙酒店顶楼看烟花，想起故乡的年，眼眶一热。"},{"id":"END_ESC_THA","type":"逃亡","title":"湄南河的暂住","grade":"D","reason":null,"text":"你用一本假护照落地东南亚，租了河边的公寓。这里手续松、熟人多，可也最危险——有人专做遣返的生意。你学会了不在同一家店吃饭两次。安稳是假的，只是暂时。"},{"id":"END_ESC_CAUGHT","type":"逃亡","title":"边检那道红线","grade":"F","reason":null,"text":"你以为神不知鬼不觉，订了最偏的航班、最晚的班次。可边检的红灯亮起那一刻，你知道，全完了。随身查出的现金、多本护照、境外账户流水，一样没少。你连国门都没出，就成了典型。"},{"id":"END_ESC_PENURY","type":"逃亡","title":"刷盘子的余生","grade":"F","reason":null,"text":"你以为境外是天堂，可你根本没带够钱。黑中介吞了你的款，护照过期，身份全无。你最后在一家中餐馆的后厨刷盘子，手指泡得发白。当年前呼后拥的某领导，如今没人记得。这或许，就是最轻的判。"},{"id":"END_RET_CLEAN_HERO","type":"退休","title":"万民伞下","grade":"S","reason":null,"text":"你到点退休那天，门口挤满了人。当年你走访过的村子，派人送来一面旧伞，伞骨是竹的，写着几十个名字。你没贪过一分，也没亏过谁。退休后你在老家种菜、带孙子，偶尔上街有人喊老书记。这一生，清清白白，睡得安稳。这，才是真正的赢。"},{"id":"END_RET_POOR","type":"退休","title":"两袖清风","grade":"A","reason":null,"text":"你退了，口袋比脸干净。妻子抱怨了一辈子，可你心里有底。你在小区门口摆了张棋桌，和老伙计杀两盘。没人给你送礼，也没人查你。清贫，但不慌。人走茶凉，可凉得坦荡。"},{"id":"END_RET_LUCKY","type":"退休","title":"惊梦","grade":"C","reason":null,"text":"你贪了，却没被发现，安然退了休。可每个深夜，你都会惊醒，梦见敲门声。保险柜的钥匙你从不离身，体检报告你不敢细看。你赢了侥幸，输了一生安眠。账，没算清，只是还没到日子。"},{"id":"END_RET_RECHECK","type":"退休","title":"倒查二十年","grade":"D","reason":null,"text":"你退休第八年，倒查的风吹来。旧账被翻出，当年的袋子、当年的字，一样没少。你以为时间能抹平，时间只是把证据存了档。晚节不保，这四个字，你用一生写，最后一笔最重。"},{"id":"END_RET_ALONE","type":"退休","title":"空宅","grade":"C","reason":null,"text":"你退了，妻子早离，儿女不来。大宅子里只剩你和一台电视。你曾把家当跳板，最后家也没了。钱在卡里，人在空里。有些账，不用纪委算，日子就算给你看了。"},{"id":"END_RET_TEACH","type":"退休","title":"归田","grade":"A","reason":null,"text":"你回老家，在村小代了课。孩子们喊你老师，不喊职务。你讲自己半生见闻，只讲教训，不讲风光。平淡是真，这四个字你五十岁才懂，幸好还来得及。"},{"id":"END_RET_MEMOIR","type":"退休","title":"回忆录里的别人","grade":"B","reason":null,"text":"你写了本回忆录，把自己写成了清风明月、两袖功臣。印了五千册，送人无人读。只有你知道，哪些章节删了、哪些名字隐了。书里的人，不是你；真正的人，在廉署的卷里。"},{"id":"END_RET_REGRET","type":"退休","title":"办公室的那一夜","grade":"B","reason":null,"text":"退休那天，你在空办公室坐了整夜。墙上奖状还在，桌上的茶杯凉了。你想起第一次上任的清晨，意气风发。如今功过参半，你合上门，没有回头。这一局，算平手吧——只是你心里，清楚不是。"},{"id":"END_DIE_OVERWORK","type":"死亡","title":"会议室的最后","grade":"B","reason":null,"text":"你倒在了常委会的椅子上，手里还攥着那份没念完的报告。急救车来时，会散了。你太拼，也太怕停下来——一停，就要面对那些不敢想的事。积劳成疾，是褒义词，也是你不敢体检的借口。"},{"id":"END_DIE_SUICIDE","type":"死亡","title":"天台的风","grade":"F","reason":null,"text":"压力堆到顶的那夜，你上了天台。风很大，你最后看了一眼这座你经营半生的城。你不是不怕死，是怕活着被揭穿。可死，也揭不穿你留下的账。风停了，灯还亮着。"},{"id":"END_DIE_CAR","type":"死亡","title":"刹车痕","grade":"D","reason":null,"text":"车祸很怪，刹车痕很长，像是有人犹豫了很久。调查说意外，可你知道不是。你碰过不该碰的人，拿过不该拿的钱，线太多，总有一根会断。车毁了，链条也断了，只是代价太大。"},{"id":"END_DIE_REVENGE","type":"死亡","title":"寻仇的人","grade":"F","reason":null,"text":"那个被你坑到家破人亡的人，找到了你。你曾以为权力能压下一切，包括怨。可压住的怨，会变成刀。你倒在血泊里时，终于明白：有些账，不是你躲得掉，是别人替你收。"},{"id":"END_DIE_SILENCE","type":"死亡","title":"多知道的人","grade":"F","reason":null,"text":"你知道的太多，也拿着太多人的把柄。某夜，一杯热茶放到你手边，你喝下去，再没醒。没有声音，没有挣扎。最干净的手段，往往最安静。你成了别人链条上最后一环。"},{"id":"END_DIE_ILLNESS","type":"死亡","title":"郁结成疾","grade":"D","reason":null,"text":"长期的紧张与失眠，把你熬垮了。肝硬化确诊那天，你反而松了口气——终于有个交代，不用再演。病房里没人送花，只有妻子守着。你笑着说：这病，早该来了。"},{"id":"END_DIE_PRISON","type":"死亡","title":"高墙内的了断","grade":"F","reason":null,"text":"入狱第三年，你在放风时一头撞向墙角。同监的都说你平时安静，没人料到。判决书写着死缓，你没等到那天。高墙里的了断，比高墙外的更安静。"},{"id":"END_DIE_PRISON_ILL","type":"死亡","title":"狱中病故","grade":"F","reason":null,"text":"你在狱中熬了十一年，高血压、糖尿病、心衰，一样样找上门。临终前你盯着天花板，想起当年那间亮着灯的办公室。医生说抢救无效，管教叹了口气。账，到底还是用命抵了。"},{"id":"END_UP_MINISTER","type":"升迁","title":"位极人臣","grade":"A","reason":null,"text":"你凭实绩与操守，一步步走到中枢。多年后回望，你经手的每一个项目都经得起查，你提的每一个人都站得稳。有人劝你灵活，你没听。到头来，你成了少数能全身而退的高位者。这路窄，但亮。"},{"id":"END_UP_STAR","type":"升迁","title":"政绩明星","grade":"A","reason":null,"text":"你被树为典型，全省巡回讲经验。镜头追着你，报表围着转。你做的实事是真的，可光环也真沉。你怕有一天光环成了靶子，于是更谨慎地走每一步。明星难当，你当得勉强，也当得干净。"},{"id":"END_UP_TIGER","type":"升迁","title":"爬到顶的大虎","grade":"D","reason":null,"text":"你爬到了别人够不着的位子，也把别人够不着的钱装进了兜。可位子越高，风越大。巡视组进驻那天，你还在主席台。通报念到你名字时，全场静得能听见笔尖。大老虎，终究进了笼。"},{"id":"END_UP_EXILE","type":"升迁","title":"明升暗贬","grade":"C","reason":null,"text":"一纸调令，你成了闲职。明面是升，实则是挪开。你懂，上面也懂。你在新岗位喝茶看报，偶尔想起从前的前呼后拥，苦笑。贬，不一定是坏事——至少，躲过了那阵风。"},{"id":"END_UP_TRADE","type":"升迁","title":"洗白的位置","grade":"C","reason":null,"text":"你用连年的政绩，把早年的旧账盖了过去，调任中枢。位置体面，账面却还在。你以为时间能淡，可审计的眼睛不老。你坐在更高的位子，也坐在更薄的冰上。"},{"id":"END_UP_LEGEND","type":"升迁","title":"能吏之名","grade":"A","reason":null,"text":"你在地方干出了名，百姓口口相传：那个敢拍板、不收礼的官。你升了，口碑留了下来。能吏难做，你做了半生。名字被人记住，不是因为钱，是因为事。这，值了。"},{"id":"END_SP_SURRENDER","type":"特殊","title":"走进那扇门","grade":"B","reason":null,"text":"你走进了廉署的大门，如实供述，退赃，检举。你失去自由，却留了家人。法庭上你说：早该来了。从宽处理的文书下来那天，妻子来探监，第一次没哭。你用一次坦诚，换了全家安稳。"},{"id":"END_SP_RETURN","type":"特殊","title":"全部退清","grade":"B","reason":null,"text":"你主动把收受的财物一笔笔退清，连本带利。调查认定你系主动交代、全额退缴，免予刑事处罚。你丢了职务，保了自由。走出大门，天很蓝。你说：这辈子，再不碰那根线。"},{"id":"END_SP_LIFE","type":"特殊","title":"无期","grade":"F","reason":null,"text":"无期徒刑。四个字，压垮了一生。你在高墙里学会叠被、扫地、数日子。放风时你总看天，天那么大，你却只有一方。账算到尽头，是无尽的灰。"},{"id":"END_SP_DEATH_REPRIEVE","type":"特殊","title":"死缓","grade":"F","reason":null,"text":"死刑，缓期二年执行。那两年，是你最清醒的日子。你每天想：如果重来，会不会不同。答案是会的——可重来没有。缓期之后，是漫长的无期。"},{"id":"END_SP_SENTENCE","type":"特殊","title":"十二年","grade":"D","reason":null,"text":"判处有期徒刑十二年。法槌落下，你听见自己的心跳。十二年，够一个孩子长大，够一座楼盖起又拆掉。你在里面学会了平静。出狱那天，没人接你，你也不怪。"},{"id":"END_SP_MONK","type":"特殊","title":"遁入空门","grade":"C","reason":null,"text":"你投案后，在一段静修里找到了皈依。你落发，名号换了一个，每天扫地、诵经、斋饭。香客不知你是谁，你也不想他们知道。前半生的账，用后半生的安静还。"},{"id":"END_SP_MAD","type":"特殊","title":"疗养院","grade":"F","reason":null,"text":"压力击垮了你的神经。你被送进疗养院，有时清醒，有时糊涂。你反复念着一串账号，没人听懂。医生说静养。可有些声音，关不掉。你赢了暂时的自由，输了整个人。"},{"id":"END_SP_WITNESS","type":"特殊","title":"污点证人","grade":"C","reason":null,"text":"你选择转为污点证人，主动检举了更大的网。你戴罪立功，刑期减了，自由也回来了大半。可名单上那些名字，从此与你绑在一起。你活着，活在了所有人的忌惮里。"}],"fallReasons":{"情妇举报":{"label":"被特定关系人举报","report":"经查，某某某严重违反廉洁纪律和生活纪律，长期与他人保持不正当关系，并利用职务便利为特定关系人在工程承揽、项目审批、门店经营等方面谋取利益，非法收受他人财物，数额特别巨大。某某某在组织初核期间与他人串供、补写借条、伪造证据，对抗组织审查，情节恶劣。另查明，某某某为掩盖违纪违法事实，多次借用他人名义持有房产、车位及理财账户，造成恶劣社会影响。经联邦廉政总署会议研究并报组织评定委员会批准，决定给予某某某开除处分，收缴其违纪违法所得，将其涉嫌犯罪问题移送人民监察院依法审查起诉。","scene":"她把那一叠东西交出去的那个下午，天在下雨。打印纸是普通 A4，边角被雨泡得发软，装订处还留着那股你说过太浓的香水味。袋子里是三样：十一张银行回单的复印件，一段两分十七秒的录音，还有一本你亲笔写的便签，抬头写着\"乖，等我\"。\n\n廉署的同志给她倒了杯热水，她说不渴。出门时雨停了，她在台阶上站了很久，把手机里的照片一张张删净，然后把那张用了四年的副卡掰成两段，扔进了不同方向的两个垃圾桶。"},"商人供出":{"label":"由行贿商人供述牵出","report":"经查，某某某利用职务便利，为多家企业在土地出让、工程招投标、资金拨付、资质审批等方面提供帮助，多次收受企业负责人所送现金、房产及干股，数额特别巨大。涉案企业负责人钱某在另案调查中如实供述行贿事实，并提交转账记录、往来账目、通信记录等关键证据，与某某某分管领域的异常审批轨迹相互印证。某某某在谈话初期否认收受财物，后在证据面前承认部分事实。经研究决定，给予某某某开除处分，收缴违纪违法所得，涉嫌犯罪问题移送人民监察院依法审查起诉。","scene":"钱广白在讯问室里说了七个小时。他说得很快，像在赶着把什么东西从自己身上卸下来：哪年哪月在哪个包厢，袋子里装的是现金还是卡，你当时说了句什么——他连你的口头禅都复述出来了。\n\n最后他抬头问了一句：\"我说清楚了，能不能算我配合？\"\n\n没人回答他。走廊尽头的窗子开着，风把桌上的笔录吹得哗哗响，他伸手按住，手指在纸上压出了一圈汗。"},"巡视组发现":{"label":"巡视组进驻期间发现","report":"巡视组进驻期间，通过个别谈话、查阅账册、走访项目现场，发现某某某任内主导的十七个项目中存在决策程序倒置、评标专家高度重合、资金流向异常等突出问题。其中九个项目的中标企业注册时间不足半年、注册资本与承接规模严重不匹配。经移送联邦廉政总署进一步核查，查明某某某通过上述安排非法收受财物，数额特别巨大。依据有关规定，决定给予某某某开除处分，收缴违纪违法所得，涉嫌犯罪问题移送司法机关依法处理。","scene":"巡视组的车停在旧楼背面，没有拉警笛，也没有贴任何标识。他们先在信访大厅坐了两天，又去了趟半拉子工程的现场，泥地里那块\"质量终身负责\"的石碑被荒草埋了一半，碑面上还留着你的题字。\n\n第四天，他们调走了财务科整整三个铁皮柜的凭证。搬柜子的是两个年轻人，动作很轻，怕惊动什么似的。科长站在楼梯口看了很久，回头给谁打了个电话，说了一句：\"来了，这次不像走走过场。\" "},"审计查出":{"label":"审计总署专项审计查出","report":"审计总署在年度预算执行审计中发现，某某某分管领域内多项专项资金存在层层转拨、最终流向无资质公司的情形，部分项目存在重复申报、虚列支出、以租代购等问题。审计延伸调查发现，相关公司在收到款项后短期内即出现大额提现和关联方划转，资金链条与某某某亲属及特定关系人存在交集。审计署依法将问题线索移送联邦廉政总署。经查，某某某对上述资金安排负有直接责任，并从中非法获利，数额巨大。经研究决定给予某某某开除处分，收缴全部违纪违法所得。","scene":"审计组那位三十出头的女同志，连着三晚睡在会议室。她把八年的凭证按月份码成一面墙，然后开始找\"同一天\"。\n\n她说，假的东西最怕排队站好。\n\n第七天傍晚，她把两张单据并排放在桌上，抬头看了带路的科长一眼：\"这两家公司，同一台打印机，同一天开的票，连墨色都一样。\"\n\n科长没说话，转身去关了窗。外面起风了，满墙的单据呼啦一下全动了。"},"家中被盗":{"label":"被盗案牵出巨额财产","report":"治安总署在侦办一起入户盗窃案件时，于追缴赃物过程中发现大量现金、金条、名表及高档礼品，经核查与某某某及其家庭合法收入明显不符，遂将线索移送联邦廉政总署。经查，某某某在多个岗位任职期间，利用职务便利收受他人财物，长期将现金及贵重物品存放于住所，逃避组织监督，数额特别巨大。另查明其存在隐瞒个人有关事项、违规持有多个他人名下账户等情形。经研究决定，给予某某某开除处分，收缴违纪违法所得，涉嫌犯罪问题移送人民监察院依法审查起诉。","scene":"小偷本来只想拿柜子上那两瓶酒。\n\n他撬开主卧的衣柜，先掉出来的是一摞摞捆得整整齐齐的现金，塑料封条还在，银行的名字都没撕。再往里，是十二根金条，用红布包着，压在一件你从没穿过的大衣下面。他坐在地板上愣了起码有五分钟，然后掏出手机，对着衣柜拍了一张照片。\n\n后来办案的同志说，那张照片拍得很稳，光圈、角度都对，比很多勘查照片都清楚。"},"家属炫富":{"label":"家属高消费引发核查","report":"网络及群众反映，某某某配偶、子女频繁购置高档房产、奢侈品及名贵车辆，多次在社交平台展示与家庭合法收入明显不符的消费行为。联邦廉政总署据此开展核查，查明某某某利用职务便利为多家企业谋取利益，非法收受财物，其家庭成员参与收受、代为持有并转移赃款，数额特别巨大。某某某还存在不按规定报告个人有关事项、纵容默许亲属利用其职权谋利等问题。经研究决定给予某某某开除处分，收缴违纪违法所得，涉嫌犯罪问题一并移送司法机关。","scene":"她发的第九张照片里，露出了车库墙上那个消防栓的编号。\n\n有个人把编号和房产公示图对上了，又把公示图和某次土地出让的中标公告对上了，最后把中标公告里那个签约代表的名字，和你去年剪彩时站的位置对上了。\n\n那条帖子活了四十分钟就被删了。四十分钟，够截图的人截够三百次。\n\n她后来把账号清空，头像换成一片海。海是真的，她在那里站了很久，风很大，头发全糊在脸上。"},"网络曝光":{"label":"网络舆情引发核查","report":"一段涉及某某某的视频在社交平台广泛传播，引发重大舆情。联邦廉政总署依舆情线索开展核查，查明视频内容属实：某某某于工作期间多次接受管理服务对象安排的宴请、旅游及娱乐活动，并在酒后发表与身份严重不符的言论。进一步查明，某某某利用职务便利为上述人员谋取利益，非法收受财物，数额巨大。某某某在事发后指使他人删除相关信息、统一口径，企图掩盖事实。经研究决定给予某某某开除处分，收缴违纪违法所得，涉嫌犯罪问题移送人民监察院依法审查起诉。","scene":"视频画质很差，包厢的灯光又红，可你的脸很清楚——尤其是你举杯时那只手，腕上那块表，表盘在灯下反了一道光。\n\n有人把那一帧截出来，放大，比对，报出了型号和公价。然后又有人翻出你三年前在廉政会议上讲话的照片，照片里你戴着一块塑料表，讲话稿上印着\"清清白白做人\"。\n\n两张图被并排做成一张，配文只有四个字：\"同一双手。\" "},"事故牵出":{"label":"重大事故倒查牵出","report":"某某某辖区内发生较大生产安全事故，造成人员伤亡和重大经济损失。事故调查中发现，该项目在未取得相应资质、未完成竣工验收的情况下违规开工、违规投入使用，安全检查记录存在大面积集中补签，监理单位与安全监管部门履职严重缺位。进一步查明，某某某在项目建设过程中收受施工方财物，违规干预工程发包和安全监管，对事故发生负有重要领导责任。经研究决定给予某某某开除处分，收缴违纪违法所得，涉嫌犯罪问题移送司法机关依法处理。","scene":"塌下来的那片脚手架砸穿了三层楼板。救援持续了三十一个小时，最后一名工人被抬出来的时候，安全帽还是新的，上面的出厂标签都没撕。\n\n事故调查组在会议室里翻\"安全检查台账\"，翻到第四本就停了：整本台账，四十多页，签名的笔迹是同一天的、同一支笔、同一个方向——有人把它们一次性写完，写完还按了日期顺序排好。\n\n那个负责排顺序的年轻人后来哭着说：\"我是想着，排整齐一点，看着能真一点。\" "},"同僚举报":{"label":"被同僚实名举报","report":"联邦廉政总署收到实名举报，反映某某某在干部选拔任用、项目审批、资金分配等方面为他人谋取利益并收受财物。举报材料附有详细时间、地点、金额及证人线索，经初步核实基本属实。经查，某某某利用职务便利，多次收受下属及管理服务对象钱款，数额巨大；同时存在跑官要官、在民主推荐中搞非组织活动等问题。某某某得知被举报后，多次打听举报人信息、在班子会上影射施压，造成恶劣影响。经研究决定给予某某某开除处分，收缴违纪违法所得，涉嫌犯罪问题移送人民监察院依法审查起诉。","scene":"举报信是打印的，落款处签了真名，还附了身份证号。\n\n你在班子会上说过一句话：\"有些人整天不琢磨事，专琢磨人。\"你说这话时，他正低头记笔记，笔尖在本子上顿了半秒，然后继续写，字迹一点没乱。\n\n三年里，你们在同一个楼层办公，门口的绿植是同一批买的。他把每一次会议时间、每一次饭局地点、每一个递过信封的人的名字，都记在那本笔记的背面。\n\n最后一页写着一行小字：\"我不是针对他。我只是记性好。\" "},"下属反水":{"label":"下属反水供述","report":"经查，某某某在任职期间，指使、授意下属工作人员违规办理审批事项、伪造会议记录、虚开发票套取资金，并在事后要求相关人员订立攻守同盟。涉案人员在接受组织谈话后如实交代了受某某某指使的具体过程，并交出了留存的指令便条、通话录音及备份账目。查明某某某非法收受财物数额特别巨大，且存在对抗组织审查、打击报复等情节。经研究决定给予某某某开除处分，收缴违纪违法所得，涉嫌犯罪问题移送人民监察院依法审查起诉。","scene":"小刘跟了你九年。九年里他替你提过袋子、挡过酒、抄过讲话稿，也被你在会上点名骂过三次。\n\n谈话那天他带了三样东西：一张你写在便签上的字条，一句\"这个你先办，出了事我担着\"；一个 U 盘，里面是七年来所有他经手的账目备份；还有一本考勤簿，上面记着他每次替你加班到凌晨的日子。\n\n他说：\"我不是要害他。我就是想知道，万一出事，那句'我担着'到底担不担得住。\"\n\n答案是没担住。"},"边控拦截":{"label":"出境时被边控拦截","report":"某某某在察觉被组织核查后，持因私护照企图从口岸出境。治安总署出入境管理部门依规对其实施边控，在查验环节将其拦下，当场查获未申报的大额现金、多本他人名下证件及出境后行程安排材料。经查，某某某在任期间利用职务便利非法收受财物，数额特别巨大，并通过他人名义在境外购置资产、转移资金，企图逃避查处。经研究决定给予某某某开除处分，收缴违纪违法所得，涉嫌犯罪问题移送人民监察院依法审查起诉。","scene":"闸机\"滴\"了一声，红灯亮了。\n\n工作人员抬头看了你一眼，又看了一眼屏幕，然后很客气地说：\"先生，请到旁边稍等。\"\n\n你把行李箱放在地上，那箱子是新买的，轮子上的标签都没撕。旁边那间小屋里没人说话，只有空调在响。二十分钟后，有人进来，把一张纸推到你面前，说：\"请在这儿签字。\"\n\n你握笔的时候手很稳。你后来说，那是你这辈子签得最好看的一个名字。"},"大额交易报告":{"label":"大额可疑交易报告","report":"金融机构依规报送的大额和可疑交易报告中，多笔资金呈现\"分散转入、集中转出\"\"短期内频繁往来后账户休眠\"等异常特征，交易对手与某某某存在密切关联。廉署会同有关部门开展协查，查明前述资金系某某某非法收受财物的流转环节，其通过多个他人账户层层划转，企图掩饰资金来源和性质，累计金额特别巨大。另查明某某某违规持有多个非本人名下账户。经研究决定给予某某某开除处分，收缴违纪违法所得，涉嫌犯罪问题移送人民监察院依法审查起诉。","scene":"系统提示是在凌晨三点跳出来的。\n\n那天夜里，同一个账户转进十四笔钱，四十九万八一笔，来自十四个不同的人，验证码填的都是同一个手机号。三小时后，钱整笔转走。\n\n预警员把报告打了出来，又点开那个手机号，看了半天，说：\"这个人，好像也不用这么急吧。\"\n\n第二天早上八点，这份报告躺在移交清单的第一行。清单上只有一句批注：建议协查。"},"房叔房姐":{"label":"多套房产引发核查","report":"群众举报反映某某某及其亲属名下登记有多处房产、车位及商铺，数量和价值明显超出家庭合法收入。经不动产登记部门协查与廉署核实，查明上述资产中相当部分系某某某利用职务便利为他人谋取利益后，由他人出资购买并登记于其亲属名下，某某某对此知情并实际支配，数额特别巨大。某某某还存在长期不如实报告个人有关事项、多次变更登记主体规避监督等问题。经研究决定给予某某某开除处分，收缴全部违纪违法所得及孳息，涉嫌犯罪问题移送人民监察院依法审查起诉。","scene":"清单打了十九页。\n\n最多的那套在城东，一百八十平，登记在你大姐名下；最远的那套在邻市，一直空着，物业费交了六年，一共欠了三次，都是同一个手机号催缴的。还有两套商铺，租给了一家奶茶店和一家洗车行，租金每月打进同一张卡。\n\n办案的同志念到第七页时停下来问：\"这些房子，你自己去看过几套？\"\n\n你想了想，说：\"三套。\"\n\n\"剩下的十六套呢？\"\n\n\"钥匙在我妈那儿。\" "},"赌博欠债":{"label":"赌博欠债引发连锁暴露","report":"经查，某某某多次赴境外参与赌博，短时间内巨额输赢，并因拖欠赌债被追讨。为偿还债务和继续赌博，某某某利用职务便利，通过虚构项目、套取公款、向管理服务对象索要钱款等方式筹集资金，数额特别巨大。相关追债人员在境内多次催讨，引发治安案件，导致问题暴露。另查明某某某存在违规出入娱乐场所、接受管理服务对象安排境外行程等问题。经研究决定给予某某某开除处分，收缴违纪违法所得，涉嫌犯罪问题移送人民监察院依法审查起诉。","scene":"第一晚你赢了四十万。你把筹码推回桌上，说再来。\n\n第三晚你输了六百八十万。签单的时候手还是稳的，因为你脑子里已经有一张清单：哪个项目的尾款还没结，哪个老板欠你人情，哪笔账可以先挪三个月。\n\n你要的是三天。你以为三天够了。\n\n追债的人没等你三天。他们把一张打印纸塞进你家门禁缝里，上面写着金额和日期。第二天早上，保洁阿姨捡起来，交给了物业；物业主任看了两眼，拍了张照，发给了他的表弟；他表弟在信访局上班。\n\n一共经过三只手，八个钟头。"},"日记曝光":{"label":"私人日记曝光","report":"在核查过程中，办案人员依法调取并固定了某某某长期记录的私人日记、账册及电子文档。上述材料详细记载了某某某收受财物的时间、地点、金额、请托事项及中间人，与银行流水、项目审批记录相互印证，形成完整证据链。经查，某某某利用职务便利非法收受财物，数额特别巨大，且长期自书记录，反映其主观明知、持续为之、毫无收敛。经研究决定给予某某某开除处分，收缴违纪违法所得，涉嫌犯罪问题移送人民监察院依法审查起诉。","scene":"你记了十四年。\n\n一开始你写的是工作：今天开了什么会，谁说了什么话，哪句话值得琢磨。后来开始记数字：某月某日，某，二十万，办。某月某日，某，一套，办。\n\n你记这些不是为了留证据，是为了不糊涂。你说过，人一糊涂就要被人拿住。\n\n第十四年的最后一篇，你写：\"今年收成不错。要收一收了。\"\n\n你确实是收了一收——第二个月，你把这本日记从书柜第三层挪到了保险柜里。挪的这一下，被家里的监控拍到了。"},"群众联名信":{"label":"群众联名信访","report":"联邦廉政总署收到数百名群众联名反映的信访材料，集中反映某某某在征地拆迁、安置补偿、低保评定等事项中优亲厚友、克扣截留、为开发商谋取不正当利益，导致群众长期无法回迁、补偿款被拖欠。经核查，反映问题基本属实。查明某某某收受开发商财物，违规调整规划、压低补偿标准，并指使基层干部阻挠群众正常信访，情节恶劣，影响极坏。经研究决定给予某某某开除处分，收缴违纪违法所得，涉嫌犯罪问题移送人民监察院依法审查起诉。","scene":"联名信一共十一页，后面是四百三十七个名字。\n\n有人按手印时手抖，红印子按歪了，又补了一个；有两个人的名字是家里人代签的，因为本人已经不在了；还有一位老太太在名字后面写了六个字：\"我这辈子等着。\"\n\n信封是用牛皮纸做的，封口处贴了一张白纸条，纸条上写着：\"请交到能管事的人手里。\"\n\n这封信在路上走了十一个月，经过七只手，最后落到廉署信访窗口的时候，边角已经磨毛了。"},"上级牵连":{"label":"被上级案件牵连","report":"在查办上级领导干部严重违纪违法案件过程中，发现某某某与该案存在密切利益关联。经查，某某某为谋求职务晋升和项目支持，多次向上级领导及其特定关系人输送利益，同时借上级领导的影响力，在辖区内为他人谋取不正当利益并收受财物，数额巨大。某某某在组织核查期间试图通过他人打探案情、串联说法。经研究决定给予某某某开除处分，收缴违纪违法所得，涉嫌犯罪问题移送人民监察院依法审查起诉。","scene":"老大出事的那天，你正在主持一个会。\n\n会开到一半，秘书进来，弯腰说了句什么。你说\"继续\"，然后讲了四十分钟，讲得比平时都好。散会时你特意跟每个人握了手。\n\n当天晚上你把家里所有的纸质材料都搬到卫生间，一张张撕，撕完冲水。冲到第三次的时候下水道堵了。你蹲在地上掏了半小时，掏出来一坨湿透的纸浆，里面还能看清\"关于\"两个字。\n\n后来办案人员问你为什么不全烧了。你说，怕烟太大。"},"子女留学资金来源":{"label":"子女境外就学资金来源","report":"有关部门在协查中发现，某某某子女在境外就读期间，学费、生活费及购房支出金额巨大，资金来源与其家庭合法收入严重不符。经查，上述资金系某某某利用职务便利为多家企业谋取利益后，通过多名管理服务对象境外汇款、代付学费等方式支付，累计数额特别巨大。某某某还存在不如实报告子女境外就学及资产情况等问题。经研究决定给予某某某开除处分，收缴违纪违法所得，涉嫌犯罪问题移送人民监察院依法审查起诉。","scene":"学费是分四笔汇出去的，四个汇款人，四个不同的姓。\n\n学校财务处的记录很干净：缴费及时，从不拖欠，账户信息三年没变。倒是孩子自己在邮件里问过一句：\"爸，怎么每次打钱的人名字都不一样？\"\n\n你回的是：\"公司财务，你别管。\"\n\n那封邮件被打印出来的时候，办案的同志在旁边批了一行字：\"其子已知情可能。\"\n\n再往下翻，是孩子在境外买的那套公寓，首付八十万，签合同时他二十一岁，职业一栏填的是\"学生\"。"},"假离婚转移资产":{"label":"虚假离婚转移资产","report":"经查，某某某为规避监督、转移赃款，与配偶协议办理离婚登记，将名下多处房产、存款及理财全部划归配偶名下，约定由本人承担全部\"债务\"，并继续保持共同生活。上述安排被认定为以合法形式掩盖非法目的。查明某某某在任期间利用职务便利非法收受财物，数额特别巨大，前述财产均系违法所得及其孳息。经研究决定给予某某某开除处分，依法追缴全部违法所得，涉嫌犯罪问题移送人民监察院依法审查起诉。","scene":"离婚证是周二领的，两人都没请假。\n\n办完出来你们在门口站了一会儿，她说：\"晚上吃什么？\"你说：\"照旧。\"\n\n房子过户用了十一天。你们一直住在一起，钥匙没换，牙刷没动，连冰箱上那张超市小票都还是两个人的名字。\n\n办案人员问她：\"离婚之后，你们的关系有什么变化？\"\n\n她想了很久，说：\"没什么变化。就是每次吵架，他会多说一句——'你现在跟我没关系了，你别管'。\"\n\n这句话她记住了，也记住了日期。"},"医药代表":{"label":"医药购销环节回扣","report":"经查，某某某在分管医疗卫生领域期间，利用职务便利，为多家医药企业及其代理人在药品采购、设备招标、耗材配送、科室承包等方面提供帮助，以\"顾问费\"\"讲课费\"\"推广费\"等名义收受回扣，数额巨大。相关费用以学术会议、虚假劳务等方式伪装入账，涉及多家医疗机构和多批次采购。另查明某某某违规干预医院人事安排，造成恶劣影响。经研究决定给予某某某开除处分，收缴违纪违法所得，涉嫌犯罪问题移送人民监察院依法审查起诉。","scene":"那位代表每次来都不空手。冬天带一盒润喉糖，夏天带一袋冰棍，说是\"给护士站的\"。\n\n她做的表格比院办的还规范：哪一科用了多少，哪个品规快到期了，哪个主任快退休了。她甚至提醒过你，某批耗材的注册证下个月要换，\"别在旧证上签字\"。\n\n案发后，办案人员在她电脑里找到一张表，表名是\"维护成本\"。表格最后一列是\"产出比\"。\n\n你的名字在第七行，产出比那一栏，填的是\"1:9\"。"},"被敲诈反噬":{"label":"遭敲诈勒索反噬","report":"经查，某某某在任期间收受他人财物，被社会人员掌握相关材料后多次遭敲诈勒索。某某某为掩盖违纪违法事实，未向组织报告，而是通过支付钱款、安排工程项目等方式\"摆平\"，进一步加重了违纪违法后果。后因索要金额不断加码，某某某无力满足，敲诈者将材料寄送有关部门，导致案发。经查实，某某某非法收受财物数额巨大，并存在以权谋私、向他人输送利益等加重情节。经研究决定给予某某某开除处分，收缴违纪违法所得，涉嫌犯罪问题移送人民监察院依法审查起诉。","scene":"第一次他只要三十万。你给了。\n\n第二次他要一个标段的劳务分包。你也给了。\n\n第三次他开口要八百万，还说：\"您别嫌多，我这行也有通胀。\"\n\n你终于说了句硬话：\"你敢。\"\n\n三个月后，一叠材料出现在廉署信访窗口，附信只有三行：\"我说到做到。你们要是不管，我就发网上。\"\n\n信封上没有寄件人。邮戳是江百市城西那家邮局的，监控显示寄件人戴了口罩，付的是现金，找零没要。"},"放贷翻脸":{"label":"违规放贷收不回翻脸","report":"经查，某某某将其非法收受的赃款及套取的公款以个人名义向多名企业主高息放贷，并借此索要好处、插手企业经营。其中多笔贷款逾期后，某某某利用职务便利施压催讨、冻结账户、干预司法调解，引发借贷人举报。经核查，前述放贷资金来源系违法所得，数额特别巨大，且某某某在企业经营、纠纷处理中多次滥用职权。经研究决定给予某某某开除处分，收缴违纪违法所得及孳息，涉嫌犯罪问题移送人民监察院依法审查起诉。","scene":"你借出去的钱，一共两千三百万。收得回来的一千一百万。\n\n剩下的那一千二百万，欠条有，抵押有，连\"按月付息、到期还本、逾期每日千分之三\"的条款都写得清清楚楚。你说过：我这人最讲规矩。\n\n出事的是最后一笔。那个老板还不上，跪在你办公室门口磕头。你说：\"规矩就是规矩。\"\n\n第二天他就去举报了。材料里附了十九张转账截图，还有一段你在饭桌上说的话：\"钱放你那儿生息，比放银行强，银行还得查我。\"\n\n录音是他媳妇录的，她说她早就想录了。"},"内部举报人":{"label":"内部举报人长期取证","report":"经查，某某某所在单位的内部工作人员在长期工作中掌握了某某某违纪违法的具体线索，经反复劝阻无效后，依法向联邦廉政总署实名举报，并提交了完整证据材料。查明某某某利用职务便利，在审批、发包、采购等环节为他人谋取利益，非法收受财物，数额特别巨大；同时对提出不同意见的工作人员打击报复、调离岗位。经研究决定给予某某某开除处分，收缴违纪违法所得，涉嫌犯罪问题移送人民监察院依法审查起诉。","scene":"他准备了两年。\n\n第一年，他只是把不该由他签的字留了底。第二年，他开始记时间：谁的车几点进的地库，拎着什么，空手出来。\n\n他用的是一部旧手机，不联网，拍完就锁进抽屉。抽屉里还有一张纸，写着三十七个字：\"我知道说了会没工作。但不说，我每天上班都得先说服自己一遍。\"\n\n交材料那天他在门口站了二十分钟，最后是被保安请进去的——保安以为他是来办事的群众。"},"记者暗访":{"label":"记者暗访调查","report":"媒体记者经长期暗访，取得某某某接受宴请、收受礼品、违规干预具体事项的音视频材料，并经多方交叉核实后公开报道，引发重大舆情。联邦廉政总署据此立案核查，查明某某某利用职务便利为相关企业谋取利益并收受财物，数额巨大，且在公开场合多次作出与事实不符的表态，欺骗公众。经研究决定给予某某某开除处分，收缴违纪违法所得，涉嫌犯罪问题移送人民监察院依法审查起诉。","scene":"那个记者在你们单位门口摆了三个月的水果摊。\n\n他卖的是橘子，一筐一筐的，从不缺斤少两。他跟保安混熟了，跟保洁混熟了，跟门口卖煎饼的也混熟了。他知道你几点上班，几点走，哪天带人回办公室，哪个老板的车牌号不用通报。\n\n最后一次，他没摆摊。他在对面楼里架了一台机器，等了六个小时，拍到一个黑袋子从车上下来，进了楼，四十分钟后空着手出来。\n\n片子播了十二分钟。前十一分钟是橘子摊。"},"招投标串标":{"label":"招投标串标被查","report":"经查，某某某在多个工程项目中，事先与特定企业串通，通过泄露标底、量身定制资格条件、安排陪标公司、操纵评标专家等方式，帮助其承揽项目，非法收受财物，数额特别巨大。涉案项目普遍存在报价异常接近、投标文件制作机器码相同、中标后层层转包等问题，造成财政资金重大损失和工程质量隐患。经研究决定给予某某某开除处分，收缴违纪违法所得，涉嫌犯罪问题移送人民监察院依法审查起诉。","scene":"三家公司来投标，报价分别是 4821.6 万、4823.1 万、4826.9 万。\n\n招标文件是同一家打印店出的，文件属性里的作者名是同一个人。更巧的是，三家公司的投标保证金，来自同一家银行的同一个网点，前后相差十九分钟。\n\n评标那天，专家是从库里随机抽的。可抽出来的五个人里，有三个在过去一年内坐过同一辆考斯特去过同一个温泉度假村。\n\n这些都不难查。难的是——这样的事，一共办了二十七次。"},"吃空饷":{"label":"在编不在岗吃空饷","report":"经查，某某某在分管领域内长期纵容并参与\"在编不在岗、虚报冒领\"行为，通过虚列人员、挂名领薪、冒领补贴等方式套取财政资金，其中部分资金被某某某个人占有使用。另查明某某某违规安排亲属及特定关系人进入下属单位\"挂名\"，长期不上班照领薪酬，群众反映强烈。经研究决定给予某某某开除处分，收缴违纪违法所得，涉嫌犯罪问题移送人民监察院依法审查起诉。","scene":"名册上有个人，叫\"王有志\"，在编十一年，工龄十一年，工资照发，社保照缴。\n\n单位里没人见过他。有人说他去外地了，有人说他\"长期病休\"，还有人说这个名字是当年为了凑编制随口编的。\n\n核查组去社保、去户籍、去银行跑了一圈。户籍有这个人，人是真的；社保有记录，缴了十一年；工资卡是真的，每月十五日到账，到账后三天内被人在另一台柜员机上取走。\n\n取款录像保存了七年。七年里，取钱的都是同一只手。"},"迷信风水":{"label":"迷信风水被曝光","report":"经查，某某某丧失理想信念，长期迷信所谓\"风水大师\"，在办公楼选址、大门朝向、办公室布局、干部任用等工作中听信所谓\"指点\"，造成公共资金浪费和不良社会影响；并多次由管理服务对象出资，赴外地\"求签问卦\"\"做法事\"，相关费用数额巨大。进一步查明，某某某利用职务便利为上述人员谋取利益，非法收受财物，数额巨大。经研究决定给予某某某开除处分，收缴违纪违法所得，涉嫌犯罪问题移送人民监察院依法审查起诉。","scene":"大门改过三次。\n\n第一次朝南，大师说犯冲，改成朝东。第二次朝东，说压不住，加了两尊石兽。第三次，石兽也压不住，于是在楼前挖了个水池，说是\"聚财\"。\n\n水池花了三百八十万，用的是城建的零星工程经费。挖到一半挖出一根旧管线，又多花了七十万改线。\n\n你最后一次见大师，是风声最紧的那个星期。他说：\"别急，你命里有贵人。\"\n\n你信了。你甚至把这句话记在了手机备忘录里，标题是\"安心\"。\n\n后来这份备忘录也被打印了出来，作为材料之一。"},"酒局人命":{"label":"违规酒局致人伤亡","report":"经查，某某某违规组织并参加用公款支付的宴请，席间强行劝酒，导致一名参加者酒后死亡。事发后，某某某指使在场人员统一口径、隐瞒饮酒事实，并动用公款向家属支付\"补偿\"，企图私了，情节恶劣。进一步查明，某某某长期违规接受管理服务对象宴请，并在酒后违规承诺、违规批办事项，非法收受财物数额巨大。经研究决定给予某某某开除处分，收缴违纪违法所得，涉嫌犯罪问题移送人民监察院依法审查起诉。","scene":"那天是给老李接风。他刚调来，不善饮，第一杯就说了\"我喝不了\"。\n\n你说：\"到了这个桌上，酒量就是态度。\"\n\n第七杯是他自己端起来的。第九杯是你端给他的。散场时他还能走，还能笑，还能跟人握手。\n\n凌晨三点，家属打来电话。凌晨三点四十，酒店的监控被要求\"例行覆盖\"。早上七点，有人送来一份协议，说签了就给一百二十万。\n\n家属没签。他们把那份协议复印了十一张，一家一家地送。"},"外逃被截":{"label":"外逃途中被截回","report":"经查，某某某在察觉被组织核查后，伪造身份材料、筹集外币现金，企图借道边境地区潜逃境外。治安总署依据协查通报，在某公路检查站将其截获，当场查获大量未申报现金、伪造证件及预先准备的出境路线图。查明某某某在任期间利用职务便利非法收受财物，数额特别巨大，并通过他人向境外转移资产，企图逃避法律追究。经研究决定给予某某某开除处分，收缴违纪违法所得，涉嫌犯罪问题移送人民监察院依法审查起诉。","scene":"你带了三样东西：一个装现金的背包，一本假名证件，还有一张手写的路线图，背面写着\"别走高速，走老国道\"。\n\n司机是你表弟，他一路上没说话，只开了一次车窗，说有点闷。\n\n检查站的灯很亮。有人敲了敲车窗，说：\"请下车，例行检查。\"\n\n你后来一直想不通那二十分钟里到底哪一步错了。是背包太鼓？是手抖？还是那张路线图——你写得太认真了，连休息站的名字都标上了，反倒不像出门旅游的人。\n\n车被扣下的时候，表弟终于说了句话：\"哥，我早就想掉头了。\" "},"境外遣返":{"label":"在境外被遣返","report":"某某某在案发前潜逃境外，持伪造材料非法居留。经有关部门依法开展协查与交涉，某某某被所在国主管机关认定为非法入境和非法居留，依法遣返。经查，某某某在任期间利用职务便利非法收受财物，数额特别巨大，并将大量赃款转移境外，在境外期间生活奢靡，同时多次试图通过他人打探案情、联系国内关系\"摆平\"。经研究决定给予某某某开除处分，收缴违纪违法所得，涉嫌犯罪问题移送人民监察院依法审查起诉。","scene":"遣返那天风很大。他被带上车前回头看了一眼——那间租了三年的公寓，窗帘是他自己买的，米黄色，说是\"看着像家\"。\n\n三年里他没学会几句当地话，倒是学会了一个词，意思是\"等\"。他每天都在等：等消息、等签证、等哪天真能不用再躲。\n\n押解的同志后来问他：\"这些年，最难受的是什么？\"\n\n他说：\"不是怕。是每天早上醒来，第一件事是想起自己在哪儿，然后要花好几秒钟才反应过来——哦，我在这儿。\"\n\n\"第二件事呢？\"\n\n\"想不起来今天是几号。\" "},"红通落网":{"label":"红色通缉后落网","report":"经查，某某某在任期间利用职务便利为他人谋取利益，非法收受财物，数额特别巨大。案发前，某某某潜逃境外并被列入红色通缉名单。经多年持续追逃，通过国际合作与执法协作，某某某在藏匿地被发现并抓获，随后被依法遣返回国接受审判。经查，其在境外期间隐瞒身份、频繁更换住所、靠打零工和他人接济维持生活，与出逃前的设想截然相反。经研究决定给予某某某开除处分，全部违法所得依法予以追缴，涉嫌犯罪问题移送人民监察院依法审查起诉。","scene":"抓到他的时候，他在一家仓库搬纸箱，六十一岁，头发全白了，右手食指缺了一节——是那年切肉机伤的，没敢去医院。\n\n他住的地方十二平米，墙上有张地图，是十一年前买的，边角卷了，上面用铅笔圈过二十几个城市，最后圈住的那个，就是这间屋子。\n\n办案人员问他：\"这么多年，想过回来吗？\"\n\n他说：\"想过。每年都想。\"\n\n\"那为什么不回？\"\n\n\"一开始是不敢。后来……\"他停了很久，\"后来是不甘心。你想啊，都跑了这么远，要是就这么回去，那这些年算什么。\"\n\n他最后算出来的答案是：十一年，零收益。"},"同案抢供":{"label":"同案人抢先供述","report":"经查，某某某与同案人共同实施违纪违法行为，在组织核查期间，某某某心存侥幸，拒不交代并试图通过串供、许诺利益等方式维持攻守同盟。同案人在接受谈话后率先如实供述，并提供了完整的资金往来、请托事项及分工安排，指证某某某在其中起主要作用、分得大部分赃款。综合证据，某某某非法收受财物数额特别巨大，在被组织核查期间对抗审查、拒不认错，不具有从宽情节。经研究决定给予某某某开除处分，收缴违纪违法所得，涉嫌犯罪问题移送人民监察院依法审查起诉。","scene":"你们约好谁都不说。\n\n还约好：万一真有人开口，先扛三个月，三个月里外面会想办法。你甚至把\"谁先说谁是孙子\"这句话开玩笑说了三遍，第三遍的时候两人都笑了。\n\n第三十七天，他开口了。\n\n他说得比谁都快——因为先说的那个，才算\"主动交代\"。这个道理你们都懂，只是你以为你会是那个先懂的人。\n\n笔录摆在你面前的时候，你一眼就认出了他的笔迹，签名那三个字，最后一横照例往上挑，跟他签了二十年的字一模一样。\n\n你在心里把那句玩笑补完了：孙子就孙子吧，反正也没人认。"}},"verdicts":{"死刑缓期":"本院审理认为，被告人利用职务便利为他人谋取利益，非法收受财物，数额特别巨大，情节特别严重，论罪应当判处死刑。鉴于其到案后如实供述、主动退缴部分赃款，对其判处死刑，缓期二年执行，剥夺政治权利终身，并处没收个人全部财产。","无期徒刑":"本院审理认为，被告人受贿数额特别巨大，使国家和人民利益遭受重大损失。鉴于其有坦白、部分退赃情节，判处无期徒刑，剥夺政治权利终身，并处没收个人全部财产。","有期徒刑十五年":"本院审理认为，被告人利用职务便利收受贿赂，数额巨大，情节严重。念其主动交代部分事实、退缴赃款，判处有期徒刑十五年，剥夺政治权利五年，并处没收个人财产。","有期徒刑十年":"本院审理认为，被告人数额巨大、情节较重，但有自首及退赃情节，依法从轻，判处有期徒刑十年，剥夺政治权利三年，并处罚金。","有期徒刑七年":"本院审理认为，被告人受贿数额较大，且能如实供述、积极退赃，判处有期徒刑七年，并处罚金。","有期徒刑三年缓刑":"本院审理认为，被告人犯罪数额较小，系从犯，且认罪认罚、退缴全部赃款，判处有期徒刑三年，缓刑四年，并处罚金。","免予刑事处罚":"本院审理认为，被告人情节显著轻微，案发后主动交代、全额退缴，免予刑事处罚，由主管部门给予党纪政务处分。"},"fallMap":{"情妇举报":"END_FALL_MISTRESS","商人供出":"END_FALL_TYCOON","巡视组发现":"END_FALL_PATROL","审计查出":"END_FALL_AUDIT","家中被盗":"END_FALL_BURGLAR","家属炫富":"END_FALL_FAMILY_SHOW","网络曝光":"END_FALL_VIRAL","事故牵出":"END_FALL_ACCIDENT","同僚举报":"END_FALL_RIVAL","下属反水":"END_FALL_SUBORDINATE","边控拦截":"END_FALL_BORDER","大额交易报告":"END_FALL_AML","房叔房姐":"END_FALL_HOUSES","赌博欠债":"END_FALL_GAMBLE","日记曝光":"END_FALL_DIARY","群众联名信":"END_FALL_PETITION","上级牵连":"END_FALL_UPSTREAM","子女留学资金来源":"END_FALL_ABROAD_KID","假离婚转移资产":"END_FALL_FAKE_DIVORCE","医药代表":"END_FALL_MEDREP","被敲诈反噬":"END_FALL_BLACKMAIL","放贷翻脸":"END_FALL_LOAN","内部举报人":"END_FALL_WHISTLE","记者暗访":"END_FALL_MEDIA","招投标串标":"END_FALL_TENDER","吃空饷":"END_FALL_GHOST","迷信风水":"END_FALL_TEMPLE","酒局人命":"END_FALL_DRUNK","外逃被截":"END_FALL_ESCAPE_FAIL","境外遣返":"END_FALL_EXTRADITE","红通落网":"END_FALL_RED","同案抢供":"END_FALL_SELF_TURN"},"maxTurns":72}</script>
<script>

const ENDMAP = {}; DATA.endings.forEach(e=>ENDMAP[e.id]=e);

let S=null;
function freshState(){return{surname:'',name:'',city:'',cityName:'',rank:1,money:0,risk:5,probe:0,merit:5,boss:5,net:5,pop:5,clean:10,stress:5,health:100,family:50,offshore:0,turns:0,done:{},flags:{},reasonW:{}};}

/* ---------- 屏1：取名 + 选城 ---------- */
function screenStart(){
  const c=DATA.cities;
  app().innerHTML=`
  <div class="topbar"><div class="title">浮沉录</div><div class="sub">宦海贪官模拟器 · 架空虚构</div></div>
  <div class="card">
    <div class="ev-title">第一章 · 赴任</div>
    <div class="ev-text">这是一部完全架空、纯属虚构的文字互动游戏，剧情借官场生态写人性，与现实无任何对应关系。你将以一名新科干部的视角，在宦海中沉浮——是清白立身，还是越界难收，全在你手。</div>
    <div class="lbl">你的姓氏（限两字内）</div>
    <input class="inp" id="sur" maxlength="2" placeholder="如：林 / 沈 / 陆">
    <div class="lbl">你的名字（限两字内）</div>
    <input class="inp" id="nm" maxlength="2" placeholder="如：知远 / 怀玉 / 守拙">
    <div class="lbl">选择赴任城市（10 城，7 城未开发）</div>
    <div class="citygrid" id="cg"></div>
    <button class="startbtn" id="go">走 马 上 任</button>
    <div class="note">提示：江百市油水大风险高；河冬市规矩严但稳；胡悉市穷，得先发育。</div>
  </div>`;
  const cg=$('#cg');
  c.forEach((ct,i)=>{
    const d=document.createElement('div');
    d.className='city'+(ct.locked?' locked':'');
    d.innerHTML=`<div class="cn">${esc(ct.name)}</div>`+(ct.locked?'':`<div class="ct">${esc(ct.tag)}</div><div class="cd">${esc(ct.desc)}</div>`)+(ct.locked?`<div class="cd"></div>`:'');
    if(!ct.locked){d.onclick=()=>{document.querySelectorAll('.city').forEach(x=>x.style.borderColor='');d.style.borderColor='var(--gold)';cg._sel=ct.id;cg._name=ct.name;};}
    cg.appendChild(d);
  });
  $('#go').onclick=()=>{
    const sur=$('#sur').value.trim(), nm=$('#nm').value.trim();
    if(!sur||!nm){alert('请先填写姓氏与名字（各限两字内）');return;}
    if(sur.length>2||nm.length>2){alert('姓、名均限两字内');return;}
    if(!cg._sel){alert('请选择一个可赴任的城市');return;}
    S=freshState();S.surname=sur;S.name=nm;S.city=cg._sel;S.cityName=cg._name;
    S.log=[];
    pushLog(`<b>赴任</b> 你以 ${esc(sur)}${esc(nm)} 之名，赴 ${esc(cg._name)} 上任，职级：${RANKS[0]}。`);
    screenGame(pickEvent());
  };
}

/* ---------- 事件抽取 ---------- */
function pickEvent(){
  const pool=[];
  for(const e of DATA.events){
    if(e.city!=='通用'&&e.city!==S.city) continue;
    if(S.rank<e.min_rank||S.rank>e.max_rank) continue;
    if(e.once&&S.done[e.id]) continue;
    const nd=e.need||{};
    if(nd.min_risk&&S.risk<nd.min_risk) continue;
    if(nd.min_money&&S.money<nd.min_money) continue;
    if(nd.min_probe&&S.probe<nd.min_probe) continue;
    if(nd.flag&&!S.flags[nd.flag]) continue;
    if(nd.max_risk&&S.risk>nd.max_risk) continue;
    pool.push(e);
  }
  if(!pool.length) return null;
  let tot=pool.reduce((a,e)=>a+(e.weight||1),0);
  let r=Math.random()*tot;
  for(const e of pool){r-=(e.weight||1); if(r<=0){ if(e.once)S.done[e.id]=true; return e;}}
  return pool[pool.length-1];
}

function applyEffects(ef,logIt){
  if(!ef) return;
  for(const k in ef){
    if(k==='flag'||k==='unflag'||k==='ending'||k==='escape'||k==='need_offshore') continue;
    if(typeof S[k]==='number'){ S[k]=clamp(S[k]+ef[k],-9999,9999); }
    else if(S[k]===undefined){ /* 忽略未知键 */ }
  }
  if(ef.offshore!==undefined) S.offshore=clamp(S.offshore+ef.offshore,-9999,9999);
  if(ef.flag) S.flags[ef.flag]=true;
  if(ef.unflag) delete S.flags[ef.unflag];
  if(ef.hint) S.reasonW[ef.hint]=(S.reasonW[ef.hint]||0)+Math.max(3,(ef.risk||0)+3);
}

function pushLog(html){S.log.push(html); if(S.log.length>120)S.log.shift();}

function shortEff(ef){
  if(!ef) return '';
  const m=[];
  if(ef.money) m.push((ef.money>0?'+':'')+ef.money+'万');
  if(ef.risk) m.push('风险'+(ef.risk>0?'+':'')+ef.risk);
  if(ef.probe) m.push('线索'+(ef.probe>0?'+':'')+ef.probe);
  if(ef.clean) m.push('清廉'+(ef.clean>0?'+':'')+ef.clean);
  if(ef.merit) m.push('政绩'+(ef.merit>0?'+':'')+ef.merit);
  return m.length?'（'+m.join('，')+'）':'';
}

/* ---------- 主游戏屏 ---------- */
function screenGame(ev){
  if(!ev){ // 无事件可抽 → 推进
    S.turns++; advanceRank(); const e2=pickEvent(); if(e2) return screenGame(e2);
    return screenGame(null);
  }
  const st=statBar();
  const opts=ev.options.map((o,i)=>`
    <button class="opt" data-i="${i}"><span class="ol">${'甲乙丙丁戊己庚辛'[i]||(i+1)}、${esc(o.label)}</span><span class="ot">${esc(o.text)}</span></button>`).join('');
  const free=DATA.freeActions.map(a=>`<span class="fbtn" data-f="${a.id}">${esc(a.label)}</span>`).join('');
  app().innerHTML=`
  <div class="topbar"><div class="title">${esc(S.surname)}${esc(S.name)}</div><div class="sub">${esc(S.cityName)} · ${RANKS[S.rank-1]} · 第${S.turns}年</div></div>
  ${st}
  <div class="card">
    <div class="ev-title">${esc(ev.title)}</div>
    <div class="ev-meta">${ev.city==='通用'?'随机公务':esc(ev.city)} · 标签：${(ev.tags||[]).map(t=>'#'+esc(t)).join(' ')}</div>
    <div class="ev-text">${esc(ev.text)}</div>
    ${opts}
    <div class="free"><div class="free-h">闲暇时，你还可以——</div>${free}</div>
  </div>
  <div class="log">${S.log.slice(-14).reverse().map(l=>'<div>· '+l+'</div>').join('')}</div>`;
  app().querySelectorAll('.opt').forEach(b=>b.onclick=()=>chooseOpt(ev,+b.dataset.i));
  app().querySelectorAll('.fbtn').forEach(b=>b.onclick=()=>doFree(b.dataset.f));
}

function chooseOpt(ev,i){
  const o=ev.options[i];
  applyEffects(o.effects,true);
  if(o.text) pushLog(`<b>${esc(o.label)}</b> ${esc(o.text)}`);
  else pushLog(`<b>${esc(o.label)}</b>`);
  if(o.hint&&o.effects) S.reasonW[o.hint]=(S.reasonW[o.hint]||0)+Math.max(3,(o.effects.risk||0)+3);
  // 直接触发结局
  if(o.escape){ return escapeFlow(o); }
  if(o.ending){ return showEnding(ENDMAP[o.ending], o.ending.startsWith('END_FALL')?topReason():null); }
  S.turns++; advanceRank();
  const e2=checkEnd()||pickEvent();
  if(typeof e2==='object'&&e2.end) return showEnding(e2.end,e2.reason,e2.verdict);
  if(e2===null) return retireEnding();
  screenGame(e2);
}

function doFree(fid){
  const a=DATA.freeActions.find(x=>x.id===fid);
  applyEffects(a.ef,true);
  pushLog(`<b>闲暇</b> ${esc(a.note)}${shortEff(a.ef)}`);
  S.turns++; advanceRank();
  const e2=checkEnd()||pickEvent();
  if(typeof e2==='object'&&e2.end) return showEnding(e2.end,e2.reason,e2.verdict);
  if(e2===null) return retireEnding();
  screenGame(e2);
}

function advanceRank(){
  const nr=Math.min(9,1+Math.floor(S.turns/6)+ (S.boss>=60?1:0) + (S.merit>=60?1:0));
  if(nr>S.rank){ S.rank=nr; pushLog(`<b>升迁</b> 你升任 ${RANKS[S.rank-1]}。`); }
  S.health=clamp(S.health,0,100); S.stress=clamp(S.stress,0,120);
  S.risk=clamp(S.risk,0,200); S.probe=clamp(S.probe,0,200);
}

function statBar(){
  const cells=[
    ['职级',RANKS[S.rank-1]],['家财',S.money+'万'],['压力',S.stress],['健康',S.health],
    ['清廉',S.clean],['政绩',S.merit],['人脉',S.net],['民望',S.pop],
  ];
  return `<div class="stats">`+cells.map(c=>`<div class="st"><div class="k">${c[0]}</div><div class="v">${esc(c[1])}</div></div>`).join('')+`</div>`;
}

/* ---------- 结局判定 ---------- */
function topReason(){
  let best=null,bv=-1; for(const c in S.reasonW){if(S.reasonW[c]>bv){bv=S.reasonW[c];best=c;}}
  if(!best){const ks=Object.keys(DATA.fallReasons);best=ks[Math.floor(Math.random()*ks.length)];}
  return best;
}
function pickVerdict(grade){
  const map={'S':'免予刑事处罚','A':'有期徒刑三年缓刑','B':'有期徒刑七年','C':'有期徒刑十年','D':'有期徒刑十五年','F':'无期徒刑'};
  return map[grade]||'有期徒刑十年';
}
function fallEnding(){
  const cause=topReason();
  const eid=DATA.fallMap[cause]||'END_FALL_PATROL';
  return {end:ENDMAP[eid],reason:DATA.fallReasons[cause],verdict:DATA.verdicts[pickVerdict(ENDMAP[eid].grade)]};
}
function checkEnd(){
  if(S.health<=0) return deathEnding();
  if(S.stress>=100&&Math.random()<0.55) return {end:ENDMAP['END_DIE_SUICIDE'],reason:null,verdict:''};
  const exposure=S.probe+S.risk*0.6;
  if(exposure>=100) return fallEnding();
  if(S.rank>=9&&S.risk<45&&S.probe<55) return promoteEnding();
  if(S.turns>=DATA.maxTurns) return retireEnding(); // 到点强制退休
  return null;
}
function promoteEnding(){
  let id;
  if(S.clean>=25&&S.money<60) id=['END_UP_MINISTER','END_UP_STAR','END_UP_LEGEND'][Math.floor(Math.random()*3)];
  else id=['END_UP_TIGER','END_UP_EXILE','END_UP_TRADE'][Math.floor(Math.random()*3)];
  return {end:ENDMAP[id],reason:null,verdict:''};
}
function retireEnding(){
  let id;
  if(S.clean>=25&&S.money<60) id='END_RET_CLEAN_HERO';
  else if(S.money>=120) id='END_RET_LUCKY';
  else if(S.family>=55) id=Math.random()<0.5?'END_RET_TEACH':'END_RET_POOR';
  else if(S.clean<0) id='END_RET_RECHECK';
  else id=['END_RET_REGRET','END_RET_MEMOIR','END_RET_ALONE'][Math.floor(Math.random()*3)];
  return {end:ENDMAP[id],reason:null,verdict:''};
}
function deathEnding(){
  let id='END_DIE_OVERWORK';
  if(S.stress>=90) id='END_DIE_SUICIDE';
  else if(S.flags&&S.flags.revenge) id='END_DIE_REVENGE';
  else id=['END_DIE_ILLNESS','END_DIE_CAR','END_DIE_SILENCE','END_DIE_PRISON_ILL'][Math.floor(Math.random()*4)];
  return {end:ENDMAP[id],reason:null,verdict:''};
}

function escapeFlow(opt){
  const need=opt.need_offshore||300;
  const have=S.offshore;
  app().innerHTML=`
  <div class="topbar"><div class="title">出逃</div><div class="sub">${esc(S.cityName)} · 风声已紧</div></div>
  <div class="card">
    <div class="ev-title">择地而遁</div>
    <div class="ev-text">${have>=need?'你早有布局，境外账户里有足够的钱。':'你慌乱中盘算，能带出去的钱并不算多。'}边检的灯像专门照你。选一个去处——</div>
    <div class="citygrid" id="cg2"></div>
    <div class="note">带出的资产：${have}万（门槛约${need}万）</div>
  </div>`;
  const cg2=$('#cg2');
  DATA.countries.forEach(c=>{
    const d=document.createElement('div');d.className='city';
    d.innerHTML=`<div class="cn">${esc(c.name)}</div>`;
    d.onclick=()=>{
      let eid;
      if(have<need){ eid=Math.random()<0.5?'END_ESC_CAUGHT':'END_ESC_PENURY'; }
      else eid=c.id;
      showEnding(ENDMAP[eid],null,'');
    };
    cg2.appendChild(d);
  });
}

function showEnding(end,reason,verdict){
  const g=(end.grade||'C');
  let extra='';
  if(reason){
    extra+=`<div class="res r"><b>【${esc(reason.label)}】</b>\n${esc(reason.report)}</div>`;
    if(reason.scene) extra+=`<div class="res b">${esc(reason.scene)}</div>`;
    if(verdict) extra+=`<div class="res g"><b>判决书</b>\n${esc(verdict)}</div>`;
  }
  app().innerHTML=`
  <div class="topbar"><div class="title">结局</div><div class="sub">${esc(S.cityName)} · 宦海浮沉 ${S.turns} 载</div></div>
  <div class="card center">
    <div class="end-title">${esc(end.title)}<span class="grade g-${g}">${g}级</span></div>
    <div style="margin:10px 0">${['落马','逃亡','退休','死亡','升迁','特殊'].map(t=>end.type===t?`<span class="tag" style="border-color:var(--gold);color:var(--gold)">${t}</span>`:`<span class="tag">${t}</span>`).join('')}</div>
    <div class="ev-text" style="text-align:justify;margin-top:6px">${esc(end.text)}</div>
    ${extra}
    <div class="note">你名叫 ${esc(S.surname)}${esc(S.name)}，终${RANKS[S.rank-1]}。家财 ${S.money}万，清廉 ${S.clean}，压力 ${S.stress}。</div>
    <button class="startbtn" onclick="screenStart()">重 开 一 局</button>
  </div>`;
  window.scrollTo(0,0);
}

screenStart();
</script>
