<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>浮沉录 · 宦海贪官模拟器</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--card2:#1c2330;--line:#2b3442;--gold:#c9a24b;--red:#c0392b;--green:#3aa86b;--blue:#4a90d9;--txt:#d7dde6;--dim:#8a94a3;--ink:#0d1117}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--txt);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.75;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:14px 14px 60px;min-height:100vh}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:6px 2px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.title{font-weight:700;color:var(--gold);letter-spacing:2px}
.sub{font-size:12px;color:var(--dim)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:12px 0}
.st{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:7px 8px}
.st .k{font-size:11px;color:var(--dim)}
.st .v{font-size:15px;font-weight:700;margin-top:1px}
.bar{height:5px;border-radius:3px;background:#243; margin-top:4px;overflow:hidden}
.bar>i{display:block;height:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px;margin:12px 0;box-shadow:0 2px 14px rgba(0,0,0,.25)}
.ev-title{font-size:18px;font-weight:700;color:var(--gold);margin-bottom:4px}
.ev-meta{font-size:12px;color:var(--dim);margin-bottom:10px}
.ev-text{font-size:15.5px;color:#e7ecf3;white-space:pre-wrap;text-align:justify}
.opt{display:block;width:100%;text-align:left;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:12px 13px;margin:9px 0;font-size:14.5px;cursor:pointer;transition:.12s}
.opt:hover{border-color:var(--gold);background:#222b3a;transform:translateY(-1px)}
.opt .ol{font-weight:700;color:#fff;display:block;margin-bottom:2px}
.opt .ot{color:#c4ccd6;font-size:13.5px}
.free{margin-top:14px;border-top:1px dashed var(--line);padding-top:10px}
.free-h{font-size:12px;color:var(--dim);margin-bottom:6px}
.fbtn{display:inline-block;background:transparent;border:1px solid var(--line);color:var(--blue);border-radius:20px;padding:5px 13px;margin:4px 5px 4px 0;font-size:13px;cursor:pointer}
.fbtn:hover{border-color:var(--blue);background:#16263a}
.log{background:#0a0e14;border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:14px;font-size:12.5px;color:var(--dim);max-height:230px;overflow:auto}
.log b{color:#b9c2cf}
.locked{opacity:.45;cursor:not-allowed!important;filter:grayscale(.6)}
.citygrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:8px}
.city{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px;cursor:pointer;transition:.12s}
.city:hover{border-color:var(--gold);background:#212a39}
.city .cn{font-size:17px;font-weight:700;color:#fff}
.city .ct{font-size:12px;color:var(--gold);margin:3px 0}
.city .cd{font-size:12.5px;color:var(--dim)}
.city.locked .cn::after{content:" 🔒";font-size:13px}
.city.locked .cd::before{content:"【未开发】 ";color:var(--red)}
.inp{width:100%;background:#0a0e14;border:1px solid var(--line);color:#fff;border-radius:9px;padding:11px 12px;font-size:16px;margin:7px 0}
.inp:focus{outline:none;border-color:var(--gold)}
.lbl{font-size:13px;color:var(--dim);margin-top:10px}
.startbtn{width:100%;background:linear-gradient(90deg,#c9a24b,#a07c2e);border:none;color:#1a1206;font-weight:800;font-size:17px;padding:14px;border-radius:11px;margin-top:16px;cursor:pointer;letter-spacing:3px}
.startbtn:active{transform:scale(.99)}
.end-title{font-size:24px;font-weight:800;letter-spacing:2px}
.grade{display:inline-block;padding:2px 11px;border-radius:14px;font-weight:800;font-size:13px;margin-left:8px}
.g-S{background:#1d3a24;color:#7ee2a0}.g-A{background:#1b3550;color:#7fb8ef}
.g-B{background:#3a3520;color:#e2cf7e}.g-C{background:#3a2f20;color:#e0b07e}
.g-D{background:#3a2020;color:#e28a7e}.g-F{background:#3a1212;color:#ef7e7e}
.tag{display:inline-block;background:#1c2330;border:1px solid var(--line);border-radius:12px;padding:2px 9px;font-size:12px;color:var(--dim);margin:2px 4px 2px 0}
.center{text-align:center}
.note{font-size:12.5px;color:var(--dim);margin-top:8px}
.res{background:#0a0e14;border-left:3px solid var(--gold);padding:11px 13px;border-radius:0 9px 9px 0;margin:10px 0;font-size:14px;white-space:pre-wrap;color:#dfe6ef}
.res.r{color:#ef9b9b;border-left-color:var(--red)}
.res.b{color:#9bd0ef;border-left-color:var(--blue)}
.res.g{color:#9befb6;border-left-color:var(--green)}
</style>
</head>

<script id="gamedata" type="application/json">{"ranks":["科员","副科","正科","副处","正处","副厅","正厅","副省","正省"],"cities":[{"id":"jiangbai","name":"江百市","locked":false,"tag":"经济第一·管控极严","desc":"港口与金融之城，全省最富。但省廉政总署派驻纪检组眼睛最亮，媒体发达、市民维权意识强。油水极大，风险也极高。"},{"id":"hedong","name":"河冬市","locked":false,"tag":"制度样板·风险最低","desc":"老工业基地转型中，流程规范、审计严格、信息公开全省第一。可下手处少，适合走政绩升迁的稳健路线。"},{"id":"huxi","name":"胡悉市","locked":false,"tag":"山高皇帝远·穷则先发育","desc":"全省最穷的山区市，监管落后。开局没油水，得先把经济做起来；一旦做起来，贪腐极难被发现，但爆雷极狠。"},{"id":"c1","name":"云麓市","locked":true},{"id":"c2","name":"临渊市","locked":true},{"id":"c3","name":"白沙市","locked":true},{"id":"c4","name":"南屏市","locked":true},{"id":"c5","name":"石渠市","locked":true},{"id":"c6","name":"青塘市","locked":true},{"id":"c7","name":"芦溪县","locked":true}],"countries":[{"name":"美利坚","id":"END_ESC_USA"},{"name":"加拿大","id":"END_ESC_CAN"},{"name":"澳大利亚","id":"END_ESC_AUS"},{"name":"新西兰","id":"END_ESC_NZ"},{"name":"新加坡","id":"END_ESC_SIN"},{"name":"东南亚某国","id":"END_ESC_THA"}],"freeActions":[{"id":"study","label":"读书修身","ef":{"clean":2,"health":1,"stress":-3,"merit":1},"note":"翻翻党纪读本，心静了些。"},{"id":"run","label":"晨跑健身","ef":{"health":3,"stress":-4},"note":"天没亮就绕着湖跑了五公里，汗出透了。"},{"id":"family","label":"陪家人吃饭","ef":{"family":4,"stress":-3},"note":"难得回家吃顿热饭，妻子话少了些。"},{"id":"banquet","label":"请客疏通","ef":{"net":4,"boss":2,"money":-8,"risk":2,"clean":-2},"hint":"同僚举报","note":"一桌下来花了八万，人情却欠下了。"},{"id":"inspect","label":"下基层暗访","ef":{"merit":3,"pop":3,"probe":-3,"stress":2},"note":"你不打招呼去了趟乡下，听见几句真话。"}],"events":[{"id":"jb_001","title":"棚户区的第一封信访件","text":"\n景元七年三月，你揣着组织关系介绍信到江百市云台区住建局报到。科长钱守义把你领到信访接待窗口后头的小板凳上，只说了一句：先听半个月，别说话。\n\n来的第一个人是旧城棚户区的周素芬，六十二岁，男人死在东港码头的吊机底下。她家三十七平方米的直管公房被量成了二十八平方米，少的那九平方米，正好卡在补偿档次的下沿。她把卷边的房产证和一沓泛黄的收据摊在你桌上，手一直抖，抖得搪瓷缸里的水一圈一圈往外荡。\n\n第三天，拆迁服务公司的胖子来窗口办事，顺手塞给你一个牛皮纸信封，说是\"一点心意\"，里面两张购物卡，各一千。科长在里屋咳了一声，没出来。\n","city":"江百市","min_rank":1,"max_rank":3,"weight":5,"once":true,"need":{"min_money":0,"max_money":0,"min_risk":0,"min_probe":0,"min_year":0,"flag":null,"no_flag":null,"min_merit":0,"min_boss":0,"min_net":0,"min_pop":0},"tags":["信访","城建"],"options":[{"label":"退卡，重新量面积","text":"\n你把卡塞回信封，直接塞进胖子的羽绒服口袋，说这东西我拿着烫手。\n\n你借了局里最破的一台测距仪，蹲在棚户区的积水里量了两遍，把九平方米量了回来。周素芬煮了一碗醪糟蛋端到窗口，蛋是裂的，糖放多了。\n\n科长钱守义在周一例会上没提这事，散会时才说：年轻人，手别伸错口袋。后来你才知道，那家拆迁服务公司，是区里一位副区长的妻弟开的。你退掉的不是两千块钱，是人家的面子。\n","effects":{"risk":-1,"merit":4,"pop":5,"boss":1,"stress":2,"probe":-1,"clean":3},"flag":"honest_path","unflag":null,"ending":null,"next":null},{"label":"收下卡，把件压一压","text":"\n你收了。两张卡塞在笔记本夹层里，后来给母亲换了台血压计。\n\n周素芬的件被你压在文件堆最底下，压了二十天。她再来问，窗口的姑娘照着口径说：系统里查不到，您再等等。\n\n她等到夏天，房子推平了。你站在现场办公室的遮阳棚下看挖掘机进场，她隔着警戒线喊了一嗓子，被两个协管员架走，鞋掉了一只。那台血压计母亲一直用到坏，坏的那天她还说，这东西真耐用。\n","effects":{"money":2,"risk":5,"probe":1,"merit":-1,"pop":-3,"stress":3,"clean":-4},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"卡不收，件推出去","text":"\n你把卡推回去，也把件推出去——写了张\"转规划科协办\"的便笺，盖了章，送进收发室。\n\n周素芬的件在三个科室之间转了四个月，最后以\"历史遗留、政策衔接中\"归档。她没多拿一分，你也没少拿一分。\n\n你在这个月里学会了江百市最要紧的一门手艺：不办坏事，也不办好事，只办程序上挑不出毛病的事。收发室老陈夸你，小同志，稳。\n","effects":{"risk":1,"merit":-1,"net":2,"boss":1,"stress":1},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"帮她多量九平方米","text":"\n你说，阿姨，这面积怕是量错了，我找人给你重测。\n\n你给胖子打了电话。胖子带着杆尺上门，把二十八平方米量成了四十六。多出来的部分你们对半，你到手一万二，卡是用表哥的身份证开的。\n\n周素芬多拿了十几万，当场给你跪下磕头。三个月后，同一栋楼的十九户联名举报\"同楼不同策\"，举报信一式三份，区纪委、市信访局、还有一家叫\"江百观察\"的自媒体。胖子消失了，测量报告上你的签名端端正正。\n","effects":{"money":12,"risk":12,"probe":4,"merit":-3,"pop":-2,"stress":6,"clean":-8},"flag":null,"unflag":null,"ending":null,"next":null}]},{"id":"jb_002","title":"科室里的两桌酒","text":"\n云台区住建局工程科，两个副科长。于振海，五十三，常务，说话慢，手里握着全局的签章本；邵一鸣，四十一，研究生学历，是分管副区长从市里带下来的，据说三年内要接班。\n\n两个人的酒局都定在同一周。于振海在临江渔港，订的是最便宜的包厢，来的人都是局里的老资格，喝的是四十一度的本地烧。邵一鸣在金融城三十六层的私房菜，来的都是区府办、财政、规划的年轻人，喝的是红酒，谈的是\"平台公司\"\"专项债\"。\n\n两桌都给你打了电话。于振海说：小同志，来坐坐。邵一鸣发的是微信：周末有空聊聊？你盯着手机屏，屏上是母亲问你回不回家吃饭。\n","city":"江百市","min_rank":1,"max_rank":3,"weight":4,"once":true,"need":{"min_money":0,"max_money":0,"min_risk":0,"min_probe":0,"min_year":0,"flag":null,"no_flag":null,"min_merit":0,"min_boss":0,"min_net":0,"min_pop":0},"tags":["同僚","酒局"],"options":[{"label":"两桌都不去，只干活","text":"\n你编了个理由：母亲住院。两桌都没去，第二天照常八点半到办公室，把压了半年的工程档案翻出来重新归档。\n\n于振海看了你一眼，没说什么，从此签章本照旧给你用。邵一鸣在走廊里遇见你，笑了一下，说年轻人要懂得经营自己。\n\n你失去了两个圈子，换来一样东西：科长在年底考核表上写了一句\"不拉帮结派\"。这句话后来救过你一次，也耽误过你两次。\n","effects":{"risk":-2,"merit":3,"net":-2,"boss":2,"stress":3,"clean":2},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"去于振海的便宜包厢","text":"\n你去了临江渔港。四十一度的烧酒下肚，于振海拍着你的肩膀说，局里就数你实诚。桌上的人开始讲段子，讲谁家老板送了什么，讲谁进去了。\n\n临走时于振海塞给你一条烟，说拿着抽。你推了两下，收了。烟是软包的，四十二块一包。\n\n从此工程科的签章本对你格外好使，材料报上去从不过夜。代价是邵一鸣那桌人再没叫过你，区府办的年轻人们建了个群，你不在里面。\n","effects":{"money":1,"risk":3,"net":4,"merit":1,"health":-2,"stress":2,"clean":-2},"flag":"has_faction","unflag":null,"ending":null,"next":null},{"label":"去邵一鸣的私房菜","text":"\n你去了金融城三十六层。桌上的人谈专项债、谈平台公司转型、谈\"三年内江百要再造一个临江新区\"，你听不懂，但记了满满两页笔记。\n\n邵一鸣很满意，散局时送你到电梯口，说以后材料直接发我。他没给你烟，也没给你钱，只给你一个词：视野。\n\n回程的出租车上，司机听你报的地名，说那楼里一套房顶你十年工资。你当晚失眠，第一次认真地算了一遍自己这辈子能挣多少钱。\n","effects":{"risk":2,"net":5,"merit":2,"boss":3,"stress":4,"clean":-1},"flag":"has_faction","unflag":null,"ending":null,"next":null},{"label":"两桌都去，还录了音","text":"\n你两桌都去了，同一晚上赶场，先烧酒后红酒，在洗手间吐了一次。\n\n于振海喝多了，拍着桌子讲区里某块地是怎么\"运作\"的，连经手人的名字都报了出来。你摸出手机，把录音键按了下去，录了十一分钟。\n\n这十一分钟你一直存在旧手机里，从没用过。它像一块烧红的炭，贴着你的肋骨放着。你知道这东西一旦拿出来，你保的是自己，毁的是别人，而江百市没有人会原谅一个留证据的人。\n","effects":{"money":2,"risk":8,"probe":2,"net":6,"merit":1,"health":-4,"stress":10,"clean":-6},"flag":"has_faction","unflag":null,"ending":null,"next":null}]},{"id":"jb_003","title":"一份要改的招商数据","text":"\n九月底，区里要报前三季度招商引资数据。实际到位资金三亿两千万，年初定的任务是十二亿。\n\n分管副区长把材料摔在桌上：这个数报上去，我在市里的会上还要不要坐？他没明说改，只说\"你们再核一核，口径要统一\"。\n\n科长钱守义把你叫进小屋，关上门，说：小同志，数字是死的，人是活的。你把三亿二改成一个能让领导过关的数，改法我不管，改完别留痕。\n\n办公室的空调嗡嗡响。窗外，临江新区的塔吊在暮色里缓慢转动，一座还没建成的写字楼已经挂出了招商广告。\n","city":"江百市","min_rank":1,"max_rank":3,"weight":4,"once":true,"need":{"min_money":0,"max_money":0,"min_risk":0,"min_probe":0,"min_year":0,"flag":null,"no_flag":null,"min_merit":0,"min_boss":0,"min_net":0,"min_pop":0},"tags":["招商"],"options":[{"label":"按实数报，附说明","text":"\n你把三亿二原样报了上去，另附一页说明：完成进度百分之二十七，主要缺口在两宗工业用地挂牌延迟。\n\n钱守义看都没看就签了字，签完说，你自己去送。副区长的办公室里，那份材料被推到桌角，压在一沓文件下面，压了三天。\n\n第四天市里开调度会，江百市八个区县，云台区的实际到位资金排倒数第二，但只有你一家交了情况说明。半年后市里搞数据核查，另外三个区被通报，云台区被点名表扬\"实事求是\"。\n","effects":{"risk":-1,"merit":5,"boss":-3,"net":1,"stress":6,"clean":4},"flag":"honest_path","unflag":null,"ending":null,"next":null},{"label":"按领导的意思改","text":"\n你把三亿二改成九亿六千八百万，把三家还在谈意向的企业写成\"已签约\"，把两宗刚摘牌的地写成\"开工在建\"。\n\n副区长在市里的会上做了典型发言，云台区的经验材料被印发全市。年底区里拿了招商引资先进，奖金发了两万，科长拿大头，你分到三千。\n\n庆功宴上，钱守义喝多了，举着杯子说，数字嘛，就是让人高兴的东西。你跟着笑了，笑得比谁都响。\n","effects":{"money":3,"risk":7,"probe":3,"merit":6,"boss":5,"stress":4,"clean":-6},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"改数，但把底稿留着","text":"\n你改了数，改得比谁都漂亮，还做了三套不同口径的表格，一套比一套好看。\n\n但你把最初那版三亿二的原始汇总表另存了一份，存在单位公用电脑的深层目录里，文件名叫\"2019旧模板勿删\"。没人会点开一个叫\"勿删\"的旧文件。\n\n这一手在江百市有个说法，叫\"埋桩\"。埋桩的人多半不是想当英雄，只是想在将来某一天，能证明自己当初是清醒的——尽管清醒的时候什么也没做。\n","effects":{"money":2,"risk":5,"merit":5,"boss":4,"net":2,"stress":7,"clean":-4},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"把原始表发给记者","text":"\n你用一个新注册的邮箱，把三亿二的原始汇总表和一个截图，发给了\"江百观察\"的爆料邮箱。\n\n三天后，一篇《云台区招商数据\"美颜\"记》在本地论坛刷屏，文章点名\"某科室内部人士提供\"。副区长在全区大会上拍了桌子，要求\"严查内鬼\"。\n\n调查组进驻了两周，查不出人，最后以\"工作作风不严谨\"结案。你在调查组面前做了三小时笔录，出来的时候腿是软的。没人知道是你，但从此以后，再没有人敢把要改的数字交给你。\n","effects":{"risk":14,"probe":3,"merit":2,"pop":4,"boss":-10,"net":-4,"stress":18,"clean":6},"flag":null,"unflag":null,"ending":null,"next":null}]},{"id":"jb_004","title":"一张要代签的签证单","text":"\n工程科的老赵，五十七岁，局里的活化石，经手的施工现场签证单能铺满一间会议室。\n\n那天下午五点半，办公室只剩你们俩。他甩过来一沓单子，最上面那张是云台区老旧小区管网改造的增量签证：增挖沟槽三百二十米，增加费用三万八千六百。他说，王科去省城开会了，你替他签一下，字写得像点。\n\n你翻了翻，现场照片是同一段沟槽，从四个角度拍的，看起来像四段。老赵把一支笔推过来，笔帽上牙印累累。\n\n他说：签个名，又不是你家的钱。\n","city":"江百市","min_rank":1,"max_rank":3,"weight":4,"once":true,"need":{"min_money":0,"max_money":0,"min_risk":0,"min_probe":0,"min_year":0,"flag":null,"no_flag":null,"min_merit":0,"min_boss":0,"min_net":0,"min_pop":0},"tags":["工程"],"options":[{"label":"不签，让他走流程","text":"\n你把笔推回去，说，代签是假的，我不签。老赵愣了两秒，笑了：年轻人，你这样在江百市混不下去。\n\n他收起单子走了。第二天王科回来，把那沓单子全签了，签得飞快。\n\n三年后审计署抽查老旧小区改造专项资金，那批签证单被抽中，三万八千六的那张查出来是重复计量。王科受了处分，老赵退休了。处理决定念到\"相关责任人\"的时候，念到了王科的名字，没有你的。\n","effects":{"risk":-3,"merit":3,"net":-2,"stress":4,"clean":4},"flag":"honest_path","unflag":null,"ending":null,"next":null},{"label":"签了，收两千辛苦费","text":"\n你签了，把\"王\"字的最后一笔拖得长长的，像他平时签的那样。\n\n老赵第二天塞给你一个信封，两千块，说是\"加班费\"。你拿它交了三个月的房租。\n\n那沓单子一共二十七张，你签了十九张。此后老赵见你就亲热，逢人讲你\"懂事、能处\"。你很快发现，工程科里\"懂事\"这个词，是用来称呼那些肯替别人把字签了的人。\n","effects":{"money":2,"risk":9,"probe":2,"net":3,"stress":6,"clean":-7},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"要他补个授权手续","text":"\n你说，赵哥，代签我不敢，但你要是让王科发个微信授权，我再签。\n\n老赵骂了一句，还是拨了电话。王科在省城开会的间隙回了个语音：小同志看着办，急。你把这条语音转成了文字，打印出来，夹在签证单后面。\n\n单子过了。三万八千六照付。手续齐全，责任分散。后来你明白，江百市最流行的一种生存方式，叫\"集体决策\"——把一个人的风险，摊薄成一屋子人的风险。\n","effects":{"risk":3,"merit":1,"net":3,"boss":1,"stress":3,"clean":-2},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"签，并留一份复印件","text":"\n你签了，签完说，赵哥，我留一份存档。老赵说随你。\n\n你把那沓单子全部复印，装进牛皮纸袋，锁进家里衣柜顶上的旧皮箱。皮箱里还有你的毕业证、母亲的病历和一只坏掉的表。\n\n你告诉自己这是自保。但自保的前提是：你已经做了需要被保的事。从那天起，那只皮箱每隔几个月就要打开一次，看看东西还在不在。这个动作后来持续了很多年。\n","effects":{"money":3,"risk":11,"probe":3,"net":4,"health":-2,"stress":12,"clean":-8},"flag":null,"unflag":null,"ending":null,"next":null}]},{"id":"jb_005","title":"评标室里的牛皮纸信封","text":"\n你第一次被派去当招标监督员，项目是云台区第二小学改扩建，控制价两千三百万。\n\n评标室在政务中心七楼，手机全部封存，门口坐着保安。五位专家从专家库里随机抽的，其中一位是市设计院的退休高工，姓滕，七十岁，戴助听器。\n\n上午十点，第一轮清标。休息时，滕工的牛皮纸信封滑到了地上，散出来一沓现金，厚厚的，用银行的纸条扎着。他弯腰去捡，手抖了两下，没捡起来。\n\n所有的人都看见了。所有的人都在看自己的文件。窗外的政务中心广场上，一群鸽子在啃一块被人踩过的面包。\n","city":"江百市","min_rank":1,"max_rank":3,"weight":4,"once":true,"need":{"min_money":0,"max_money":0,"min_risk":0,"min_probe":0,"min_year":0,"flag":null,"no_flag":null,"min_merit":0,"min_boss":0,"min_net":0,"min_pop":0},"tags":["工程","教育"],"options":[{"label":"当场报告，封存记录","text":"\n你说，滕工，您的东西掉了。然后你按了桌上的呼叫铃，请监督科的人进来。\n\n做了一份四页的现场记录，五位专家、两个监督员都签了字。滕工的评标资格当场取消，项目重新抽取专家，延后两周开标。\n\n两周后中标的是一家本地企业，报价比第一次低了一百四十万。教育局的人私下说你\"不懂事\"。那句\"不懂事\"后来跟了你很多年，像一枚不太体面的勋章。\n","effects":{"risk":-2,"merit":4,"pop":3,"boss":1,"net":-3,"stress":5,"clean":4},"flag":"honest_path","unflag":null,"ending":null,"next":null},{"label":"弯腰帮他捡起来","text":"\n你弯腰，把那沓钱捡起来，塞回信封，塞进他西装内袋，顺手替他拍了拍衣襟，像晚辈替长辈掸灰。\n\n他看了你一眼，没说话。评标结果出来，一家名不见经传的建安公司中标，报价只比控制价低了百分之零点三。\n\n散场时，地下车库，一个不认识的人塞给你一个同样的信封，说滕工让我谢谢你。里面三千。你拿着它，第一次明白：有些钱不是给你的，是买你闭嘴的。\n","effects":{"money":3,"risk":10,"probe":3,"net":2,"stress":7,"clean":-7},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"装作没看见，走开","text":"\n你去了一趟洗手间，在里面的隔间站了十分钟，盯着瓷砖上的水渍数数。\n\n回来的时候，地上的钱已经不见了，滕工在闭目养神，其他人还在翻标书。评标照常进行，中标结果无人质疑。\n\n你在监督记录上签了名，签得很工整。江百市的规矩里，有一种罪叫\"在场\"——你什么都没做，你只是没有在那一刻站起来。这份记录后来被调阅过，你的名字在上面。\n","effects":{"risk":5,"probe":1,"merit":-1,"net":1,"stress":6,"clean":-4},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"捡起来，顺手看标底","text":"\n你捡起信封，递过去的时候，指尖在里面的纸上捻了一下——那不是钱，是一张折了四折的纸，写着三家投标单位的报价排序和推荐意见。\n\n你把这张纸上的内容，在脑子里过了一遍。午休时你用公共电话亭的电话，拨了一个号码，只说了三个数字。\n\n三天后，中标结果与你说的那三个数字分毫不差。一个月后，你收到一条短信：卡里多了五万，密码是你生日。你盯着那条短信看了很久，然后删掉了它，删完又后悔没记下卡号。\n","effects":{"money":50,"risk":20,"probe":9,"net":3,"stress":14,"clean":-12},"flag":"took_first_bribe","unflag":null,"ending":null,"next":null}]},{"id":"jb_006","title":"老同学分到了纪检组","text":"\n大学同宿舍的沈亦青，毕业后考去了省廉政总署，这一轮被派驻江百市纪检组，任副处级纪检员。\n\n他到江百的第一周约你吃饭，地点选在旧城区一家苍蝇馆子，塑料凳，油腻的桌面，四十二块钱的鱼。他说这儿安全，没人认得我。\n\n他喝了两瓶啤酒，讲驻点以来的见闻：某局一个科长在办公室冰箱里藏了四十万，被突击检查查出来；某区的局长，开会讲廉洁讲了四十分钟，讲完自己都信了，散会当场被带走。\n\n临走他掏出三百块要买单，说这是规矩，不能让你请。他把钱包收回去的时候，你看见里面夹着一张工作证的边角。\n","city":"江百市","min_rank":1,"max_rank":4,"weight":4,"once":true,"need":{"min_money":0,"max_money":0,"min_risk":0,"min_probe":0,"min_year":0,"flag":null,"no_flag":null,"min_merit":0,"min_boss":0,"min_net":0,"min_pop":0},"tags":["同僚","上级"],"options":[{"label":"只叙旧，不谈公事","text":"\n你们吃完了那顿饭，聊了四年大学的事，聊谁离了婚、谁发了财、谁在朋友圈卖保险。\n\n他没问你的工作，你也没问他的案子。此后每年两三次，还是那家苍蝇馆子，还是四十二块钱的鱼。\n\n多年以后，你在电视上看到江百市的一个通报，念到一串名字。那天晚上你给沈亦青发了条消息，他回得很慢，只回了两个字：保重。你盯着那两个字，忽然很想回到那家馆子再吃一次鱼。\n","effects":{"risk":-2,"net":4,"stress":-3,"clean":3},"flag":"honest_path","unflag":null,"ending":null,"next":null},{"label":"借他打听内部消息","text":"\n酒过三巡，你状似随意地问：听说最近市里在查什么？沈亦青笑了一下，把话题岔开了。\n\n第二次你换了个问法，问的是某个老板的名字。沈亦青放下筷子，说：这个我不能说。但他说这句话之前，愣了零点五秒。\n\n你就靠这零点五秒，判断出那个老板已经进了一张名单。你连夜打电话通知了有关的人。三个月后那个人出境了，沈亦青调回了省城，再也没主动联系过你。\n","effects":{"risk":8,"probe":4,"net":5,"boss":2,"stress":9,"clean":-6},"flag":"has_faction","unflag":null,"ending":null,"next":null},{"label":"送他一份厚礼","text":"\n你用两个月工资买了两瓶酒和一条烟，塞进他车的后备厢。他发现了，当场黑了脸，把东西扔回你怀里，说：你这是害我。\n\n后来他还是收下了一盒茶叶，一百八十一盒的那种，他说这个价他还能睡得着。\n\n茶叶他喝了半年。半年里他给你讲了三件事：哪类举报信会被初核、哪种转账方式最容易被盯上、哪一级的\"谈话\"意味着还没立案。这三条，每一条都值那盒茶叶的一百倍。\n","effects":{"money":-4,"risk":4,"net":6,"boss":2,"stress":5,"clean":-3},"flag":"has_faction","unflag":null,"ending":null,"next":null},{"label":"从此疏远他","text":"\n你开始不回他的消息，借口忙，借口出差，借口孩子发烧。他发了三次，就不再发了。\n\n你告诉自己这是为了保护他，也保护自己。但真实的原因是：你怕。你怕坐在他对面的时候，自己会说了不该说的话，或者更糟——你会说了该说的话。\n\n多年以后你在一份卷宗的\"社会关系\"一栏里，看到自己的名字被写在他那一页。办案人员问你们的关系，你说：大学同学，很多年没联系了。这是实话。\n","effects":{"risk":-1,"net":-4,"stress":4,"clean":2},"flag":null,"unflag":null,"ending":null,"next":null}]},{"id":"jb_007","title":"中秋的一盒月饼","text":"\n中秋前三天，华泰置业的老板钱广白派人送来了礼。人是他的副总，年轻人，自称小钱总，话说得很客气：我们钱总说了，过节了，给科里的同志们添点月饼。\n\n八盒，每盒里四块月饼、两罐茶叶、一张卡片。卡片上印着\"花好月圆\"。\n\n你把盒子分给同事，自己留了一盒。回家拆开，月饼底下压着一个红色信封，厚约一指。你打开数了，两万，全是百元旧钞，捆得很松，像被很多人摸过。\n\n窗外，临江新区那一片新楼的灯次第亮起来，其中三栋是华泰盖的。你的妻子在厨房里问，谁送的月饼。\n","city":"江百市","min_rank":2,"max_rank":4,"weight":5,"once":true,"need":{"min_money":0,"max_money":0,"min_risk":0,"min_probe":0,"min_year":0,"flag":null,"no_flag":null,"min_merit":0,"min_boss":0,"min_net":0,"min_pop":0},"tags":["工程","家属"],"options":[{"label":"原样退回，书面报备","text":"\n第二天一早，你拎着八盒月饼去了华泰置业的前台，让对方签收，收条你留了底。回到单位，你在廉政台账上登了记，还写了一份三十字的说明。\n\n科里的人看你的眼神都变了，像看一个把牌桌掀了的人。钱广白没说什么，只在年底的企业家座谈会上，当着你的面对别人说：这位同志，我最敬重。\n\n这话在江百市的意思，是\"这位同志，我不碰\"。你因此少了很多机会，也少了很多麻烦。\n","effects":{"risk":-3,"merit":4,"boss":3,"pop":2,"net":-2,"stress":4,"probe":-2,"clean":5},"flag":"honest_path","unflag":null,"ending":null,"next":null},{"label":"收下，装作不知信封","text":"\n你把月饼吃了，茶叶给了父亲，两万块钱压在书柜最上层的《江百市志》里头，挖了个洞。\n\n你没有给华泰办过任何事，一次都没有。但从此以后，华泰的报建材料在你这里总是走得最快，因为你会下意识地把它们从一堆文件里先抽出来。\n\n这就是钱在江百市的真正用法：它不买一件事，它买一个人的手在某一秒钟的偏向。你后来数过，那两万块，一共让你的手偏了大概四十次。\n","effects":{"money":20,"risk":12,"probe":4,"net":3,"stress":8,"clean":-9},"flag":"took_first_bribe","unflag":null,"ending":null,"next":null},{"label":"退钱，留下月饼","text":"\n你打电话给小钱总，说月饼我收了，钱你们拿回去，下次别这样。\n\n小钱总在电话那头笑了，说哥，那点东西就是个心意，您别较真。第二天他还是来了，钱没拿走，换成了一张购物卡，三千，说是给孩子的。\n\n你留下了卡，退了钱，觉得自己守住了什么。实际上你守住的只是两万和三万之间的那条线——而这条线，每隔半年就会往后再挪一点，挪到你回头看不见为止。\n","effects":{"money":3,"risk":6,"probe":2,"net":3,"stress":5,"clean":-4},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"主动登门表示能办事","text":"\n你没等他们来找，自己去了华泰置业的会所——东港边上的\"潮江会\"，一进门就是一整面墙的江百市规划图。\n\n钱广白亲自给你倒茶。你说，钱总，工程科这边的事，我能帮上忙的地方您说话。你说这句话的时候，心跳得很平稳，平稳得让你自己害怕。\n\n他没当场给什么。一个月后，云台区一个学校项目的分包，落到了华泰指定的一家劳务公司。年底，你的银行卡里进了一笔八十万，摘要写的是\"还款\"。\n","effects":{"money":80,"risk":22,"probe":11,"net":6,"merit":2,"stress":13,"clean":-16},"flag":"company_x","unflag":null,"ending":null,"next":null}]},{"id":"jb_008","title":"副科考察前的匿名信","text":"\n提副科，组织考察。考察组在局里待了三天，找十七个人谈话。\n\n第二天下午，考察组收到了一封信。信是用打印的，署名\"一名有良知的同事\"，内容三条：一、你在棚改测量中收过拆迁户的好处；二、你在评标现场收受过专家财物；三、你生活作风有问题，与某企业女职员交往过密。\n\n三条里，有一条是真的，有两条是编的，还有一条半真半假。考察组组长把你叫进小会议室，桌上摆着那封信，纸还是热的——刚从打印机里出来不到半天。\n\n他说：你先看看，慢慢说。\n","city":"江百市","min_rank":2,"max_rank":3,"weight":5,"once":true,"need":{"min_money":0,"max_money":0,"min_risk":0,"min_probe":0,"min_year":1,"flag":null,"no_flag":null,"min_merit":0,"min_boss":0,"min_net":0,"min_pop":0},"tags":["人事","上级"],"options":[{"label":"逐条如实说明","text":"\n你一条一条说：拆迁户的钱我退了，有收条；评标现场我做了记录，有四人签字；女职员那条，是我大学同学，在售楼处上班，我们吃过两次饭。\n\n你说完，组长把材料收起来，说了一句：组织会核实。\n\n核实用了两个月，提拔晚了半年。半年后任命下来，你在公示名单上。同期被举报的另一位，因为说不清一笔钱，从此再没进入名单。\n","effects":{"risk":-4,"merit":4,"boss":4,"pop":2,"stress":8,"probe":-3,"clean":5},"flag":"honest_path","unflag":null,"ending":null,"next":null},{"label":"托人把信压下来","text":"\n你打电话给邵一鸣，他很爽快，说这种信一天八封，我让办公室先归个档。\n\n信确实归档了。考察组结论写的是\"未发现影响使用的问题\"。\n\n但压信的人从此知道了你的软肋。三年后邵一鸣出了事，在谈话室里，办案人员拿出一张纸，上面写着他交代的几十个名字，其中一个是你的。他在交代的时候，把当年的那封信也一并说了出来。\n","effects":{"risk":7,"probe":5,"net":5,"boss":3,"merit":2,"stress":9,"clean":-6},"flag":"has_faction","unflag":null,"ending":null,"next":null},{"label":"只否认，不解释","text":"\n你说：不属实。三个字，说得很稳。\n\n考察组又问了两遍，你还是这三个字。组长点点头，把纸收起来，什么都没记。\n\n提拔照常，公示期无异议。你以为沉默是最安全的姿态。很久以后你才知道，在谈话里，不解释等于承认——因为真正清白的人，会从口袋里掏出收条、记录、时间、地点、证人。而清白的人从不缺话说。\n","effects":{"risk":6,"probe":4,"merit":2,"boss":1,"stress":7,"clean":-5},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"反查是谁写的信","text":"\n你把信的措辞拿去比对，圈定了三个人。又托人在文印室查了三天前的打印记录，最后锁定了办公室的小郑——他也在这一批的名单上。\n\n你没举报他，只是把一份他经手的有问题的接待清单，\"不小心\"放在了考察组的必经之路上。\n\n小郑被刷下来了，你上了。多年以后，小郑在一次酒局上喝多了，隔着桌子对你说：那封信不是我写的。你端着杯子，没敢接话。\n","effects":{"risk":12,"probe":6,"net":4,"merit":3,"boss":2,"stress":14,"clean":-9},"flag":"has_faction","unflag":null,"ending":null,"next":null}]},{"id":"jb_009","title":"挂牌条件里的那句话","text":"\n升了正科，你进了云台区的土地出让联席会，负责起草出让方案。\n\n云台老淀粉厂地块，八十七亩，位置在临江新区的边上，隔着一条马路就是地铁三号线终点站。市里原本的意思是公开挂牌，价高者得。\n\n规划口的姚炳坤，五十六岁，在江百市规划系统待了三十年，人称\"姚百科\"。他把一份拟好的出让条件推到你面前：竞买人须具备一级开发资质、须在江百市连续纳税满三年、须缴纳诚信保证金五千万元。\n\n他没说这是给谁设的，只说：小兄弟，条件就是筛子，筛眼多大，由咱们定。\n\n你查了一下，全市符合这三条的企业，只有两家，其中一家叫华泰置业。\n","city":"江百市","min_rank":3,"max_rank":4,"weight":5,"once":true,"need":{"min_money":0,"max_money":0,"min_risk":0,"min_probe":0,"min_year":0,"flag":null,"no_flag":null,"min_merit":0,"min_boss":0,"min_net":0,"min_pop":0},"tags":["土地","城建"],"options":[{"label":"删条件，公开挂牌","text":"\n你把那三条里最要命的\"连续纳税满三年\"删了，把保证金降到两千万，理由是\"防止限制竞争\"。姚炳坤看了你一眼，没说话，在会上一句反对也没提。\n\n最后七家企业报名，华泰以每亩八百四十万的价格拿下，比底价高了百分之六十二。区里多收了三亿七千万。\n\n区长在会上表扬了土地出让\"程序规范、竞争充分\"。姚炳坤散会时拍拍你的肩：年轻人，你今天让区里多挣了三个多亿，也让有些人少挣了十个亿。你自己想想这个账。\n","effects":{"risk":-2,"merit":8,"pop":5,"boss":4,"net":-4,"stress":6,"probe":-2,"clean":5},"flag":"honest_path","unflag":null,"ending":null,"next":null},{"label":"照单全收，收八十万","text":"\n条件原样报了上去，会上没人细看，因为没人想细看。华泰底价拿地，每亩五百二十万。\n\n一个月后，姚炳坤约你在东港的渔船上吃了一顿饭，临走递给你一个纸袋，说：钱总让你拿着花。八十万，现金，装在两个鞋盒里。\n\n你把它存进了以岳母名义开的账户，分四次存，每次二十万。你算过，这笔钱相当于你十六年的工资。你也算过，这块地华泰少付了将近三个亿。你很快就不再算第二个数了。\n","effects":{"money":80,"risk":14,"probe":6,"net":4,"merit":3,"stress":10,"clean":-11},"flag":"took_first_bribe","unflag":null,"ending":null,"next":null},{"label":"只保留资质条款","text":"\n你删了\"纳税满三年\"，留下了\"一级资质\"和\"保证金三千万\"。这样筛完还剩四家，其中三家是本地企业。\n\n华泰赢了，但不是底价，溢价百分之十八。姚炳坤说你\"会办事，也留了余地\"。\n\n你拿了这个余地换来了两样东西：一是审计的时候条款站得住，二是华泰那边多少还欠你一份人情。在江百市，人情这种东西，只有在你既没有彻底得罪人、也没有彻底投靠人的时候才最值钱。\n","effects":{"money":20,"risk":7,"probe":3,"merit":5,"net":3,"boss":2,"stress":5,"clean":-5},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"设条件，还漏底价","text":"\n你不光把三条全留下了，还在挂牌前一天，把区里内部测算的底价区间，用一张没有落款的便笺，通过一个在银行上班的同学，转到了华泰投资部。\n\n华泰以底价上浮千分之五报价，一分不多花。地块成交后，钱广白在\"潮江会\"摆了一桌，只有你们两个人和一只炖了六个小时的甲鱼。\n\n他给你两百万，说：这单你立了大功。你端着酒杯的手很稳。从这一单开始，你不再是替别人写字的人，你成了能定价的人——包括给自己定价。\n","effects":{"money":200,"risk":24,"probe":13,"net":5,"merit":3,"stress":15,"clean":-18},"flag":"company_x","unflag":null,"ending":null,"next":null}]},{"id":"jb_010","title":"过江龙的三十亿","text":"\n江百市的招商指标年年加码。这一年区里分到的任务是：引进内资三十亿，外资一点二亿美元。\n\n来的是一家叫\"南岭联合体\"的外地资本，注册地在省外，背后是三个自然人，对外称做\"新能源材料产业园\"，总投资号称五十二亿。带队的叫万斯年，四十五岁，说话带一点南方口音，名片上印着七个社会职务。\n\n他要三样东西：一是八百亩工业用地，地价按基准价的七折；二是前三年税收\"地方留成部分全额奖励\"；三是区属平台公司跟他成立合资公司，区里出三亿，占股百分之二十，不参与经营，年化保底百分之八。\n\n第三个条件，写进了会议纪要的第九条。你一眼就看出，这是一笔借给他的钱，只是名字叫\"股权\"。\n","city":"江百市","min_rank":3,"max_rank":5,"weight":4,"once":true,"need":{"min_money":0,"max_money":0,"min_risk":0,"min_probe":0,"min_year":0,"flag":null,"no_flag":null,"min_merit":0,"min_boss":0,"min_net":0,"min_pop":0},"tags":["招商","金融"],"options":[{"label":"只给普惠政策","text":"\n你把三条全否了，只给了市里统一的那套普惠政策：设备补贴、人才公寓、审批代办。\n\n万斯年当场变了脸色，第二天就飞走了，据说去了隔壁省一个市，那边给了地、给了返税，还给了六个亿的产业基金。\n\n区里当年的招商任务只完成了百分之六十一，你在考核中被定为\"开拓意识不足\"。但两年后，那个隔壁市的产业园烂尾，三十亿的基金追不回来，一把手被免职。你的\"开拓意识不足\"，值六个亿。\n","effects":{"risk":-3,"merit":-2,"boss":-5,"pop":2,"stress":7,"clean":5},"flag":"honest_path","unflag":null,"ending":null,"next":null},{"label":"私下承诺税收返还","text":"\n你在会上不表态，会后单独跟万斯年谈：返税不能写，但可以按\"产业扶持资金\"的名义，从区里的专项资金里逐年安排，三年一个亿。\n\n他听懂了，也信了，因为江百市每一个区都是这么干的，只有写法不同。项目落地，当年区里完成了百分之一百四十的招商任务。\n\n第一年兑现了三千万。第二年财政紧张，兑现了一半。第三年万斯年拿着会议纪要来要钱，你调走了，接任的人不认账。他把那份纪要复印了三十份，寄给了省市两级纪委。\n","effects":{"money":150,"risk":17,"probe":9,"merit":8,"boss":5,"net":3,"stress":12,"clean":-13},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"走正规产业基金","text":"\n你坚持不搞保底，把三亿改成了区产业引导基金的市场化出资，同股同权，同进同退，还请了第三方机构做尽调。\n\n尽调报告有四百页，里面提到万斯年的另外两家公司有未决诉讼。你把这一条报给了区长，区长说知道了。项目还是签了，只是区里出的一亿五，变成了跟投。\n\n两年后项目一期投产，税收两千万；三期停摆，基金浮亏百分之三十。审计来查，你的程序挑不出毛病，结论是\"市场风险\"。这四个字是江百市最贵的四个字。\n","effects":{"risk":3,"merit":6,"boss":3,"net":2,"stress":6,"clean":1},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"做假外资，套奖励分成","text":"\n你给万斯年出了个主意：把资金绕到境外注册一家壳公司，再以外资身份回来，就能同时拿外资奖励和内资补贴，两头吃，差额大概四千万。\n\n他照做了，你安排人把审批流程走得飞快，还替他协调了外汇进出的一家银行。四千万差价，你分了一千五百万，通过一家咨询公司走账，名目是\"跨境并购顾问费\"。\n\n这是你在江百市第一次碰到\"钱可以不在江百市\"这个概念。它像一扇门，推开就再也关不上。\n","effects":{"money":1500,"risk":28,"probe":16,"net":5,"merit":7,"boss":4,"stress":18,"clean":-20,"offshore":800},"flag":"company_x","unflag":null,"ending":null,"next":null}]},{"id":"jb_011","title":"棚改剩下的七户","text":"\n旧城棚户区改造三期，一共四百二十六户，签约四百一十九户，剩七户。\n\n这七户各有各的难处：一户是七十岁的老太太，儿子在服刑；一户是兄弟三个争一套祖屋，谁签谁挨骂；一户是开着小五金店的，要求按商业门面补偿；还有一户姓吴的中年男人，在楼顶插了面旗，说要\"跟房子共存亡\"。\n\n市里给的期限是四十五天，逾期启动\"依法征收\"。区里开了三次会，会上的共识是：不能因为他七户，耽误四百二十六户回迁。\n\n散会时，指挥部的老范拉住你，说：小兄弟，有些事，得晚上办。\n","city":"江百市","min_rank":3,"max_rank":5,"weight":4,"once":true,"need":{"min_money":0,"max_money":0,"min_risk":0,"min_probe":0,"min_year":0,"flag":null,"no_flag":null,"min_merit":0,"min_boss":0,"min_net":0,"min_pop":0},"tags":["城建","维稳","信访"],"options":[{"label":"逐户谈，加政策口子","text":"\n你带着两个人，一户一户谈了四十天。五金店的问题，你找到了一条\"住改商历史认定\"的旧政策，给它争取了商业补偿的百分之七十；兄弟三个的，你把他们请到居委会，谈了两个通宵；老太太的，你替她把签约委托书办了公证。\n\n吴家那户最难。最后一次你一个人上楼，在他家的客厅里坐到半夜，听他讲父亲怎么盖的这栋楼。第四十三天，他签了，签完说：我不是被你说服的，我是累了。\n\n项目如期交地，回迁房提前两个月封顶。\n","effects":{"risk":-3,"merit":9,"pop":12,"boss":2,"health":-4,"stress":12,"clean":5},"flag":"honest_path","unflag":null,"ending":null,"next":null},{"label":"找老范的服务队","text":"\n你没去，只说了句\"按程序推进\"。\n\n老范找来的\"服务队\"是八个年轻人，晚上十一点进场，戴白手套，抬人、搬东西、推墙。五金店的卷帘门被剪开，货架倒在雨里。吴家那户，人被拖下楼的时候摔断了两根肋骨。\n\n第二天早上，七户全部\"搬迁完毕\"。项目如期开工，你在总结会上被表扬\"敢打硬仗\"。\n\n三个月后，一段手机视频在本地论坛出现，拍摄角度是从对面楼的窗户。视频里没有你，只有八个戴白手套的人。但那份表扬文件上有你的名字。\n","effects":{"money":60,"risk":25,"probe":12,"merit":6,"pop":-16,"boss":4,"stress":15,"clean":-18},"flag":"accident","unflag":null,"ending":null,"next":null},{"label":"拖，等市里给新政策","text":"\n你把七户的材料全部报给市里，请求\"个案研究\"，然后开始拖。\n\n拖了半年。期间回迁户上访了六次，先在区里，后来去了市里。市里给了新的补偿口径，五金店按商业补偿的百分之六十算，其余六户在三个月内陆续签了。\n\n吴家最后也签了，因为周围已经没人了，夜里停水停电。项目延后七个月，区里被通报\"推进不力\"。回迁户多在外面租了七个月房，租金是他们自己出的。\n","effects":{"risk":4,"merit":-3,"pop":-4,"boss":-2,"net":2,"stress":8,"clean":1},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"动用治安力量夜拆","text":"\n你签字请了辖区治安队\"维持秩序\"，出动三十二人，两辆大巴，凌晨三点进场。\n\n你站在指挥部二楼的窗前看。灯打得很亮，人像被搬动的家具。老太太的轮椅从台阶上滚了下去，滚了三级。\n\n第二天七户清零，电视台来拍了\"棚改攻坚战告捷\"的画面。半年后，江百市搞扫黑除恶专项回头看，一名被抓的包工头为了立功，供出了当晚参与的三家公司和一个\"签字的领导\"。供词里有日期、有车牌号、还有一张你站在窗前的照片。\n","effects":{"money":100,"risk":32,"probe":18,"merit":5,"pop":-20,"boss":3,"stress":20,"clean":-22},"flag":"accident","unflag":null,"ending":null,"next":null}]},{"id":"jb_012","title":"白鹭洲的容积率","text":"\n白鹭洲是江百市最后一块成规模的滨江地，一千二百亩，中间有个三十亩的老湖，湖边有白鹭，地名就这么来的。\n\n控规里定的是容积率一点八，绿地率百分之三十五。华泰拿到地之后，三次打报告要求调整：一点八调到二点六，理由是\"保障房配建成本过高\"。\n\n专家评审会在市规划展览中心开，九位专家，七个是熟人。会上有人提出：湖边那一片是不是该留作公共绿地？主持会议的姚炳坤说，这个以后再研究。\n\n会后，华泰的项目总在停车场等你，说：我们钱总想请您吃个便饭，就这个周末。他递过来的不是名片，是一张户型图，二百八十平方米，楼层是二十二层，写着\"已预留\"。\n","city":"江百市","min_rank":3,"max_rank":5,"weight":4,"once":true,"need":{"min_money":0,"max_money":0,"min_risk":0,"min_probe":0,"min_year":0,"flag":null,"no_flag":null,"min_merit":0,"min_boss":0,"min_net":0,"min_pop":0},"tags":["土地","城建","环保"],"options":[{"label":"维持一点八不变","text":"\n你在评审会上念了控规原文，说没有重大公共利益理由，不宜调整。会议室冷了大概十秒钟。\n\n华泰转而申请了配建保障房的面积奖励，最后拿到一点九五。钱广白在企业家座谈会上讲：江百市的规矩，是真好使。\n\n三年后白鹭洲开盘，因为密度低、绿化好，成了江百市的标杆小区，二手房比周边贵百分之四十。市委书记去看了两次，每次都问：这是谁当年顶住的？有人说了你的名字。书记点点头，没说话。\n","effects":{"risk":-2,"merit":7,"pop":8,"boss":5,"net":-5,"stress":7,"clean":5},"flag":"honest_path","unflag":null,"ending":null,"next":null},{"label":"调到二点六，收三百万","text":"\n调整方案通过了，绿地率从百分之三十五降到百分之二十八，多出来的建筑面积能多卖将近十四亿。\n\n那套二百八十平方米的房子，登记在你表弟名下，合同价写成每平方米一万二，实际一分钱没付。三年后同小区同户型的成交价是每平方米八万六。这中间的差价，是三百零八万。\n\n你第一次知道，在江百市，受贿不一定用现金，用\"差价\"更体面，也更难查——毕竟房子是买的，只是买得便宜。你甚至敢在朋友圈发那片江景。\n","effects":{"money":300,"risk":20,"probe":10,"net":4,"merit":4,"stress":11,"clean":-15},"flag":"took_first_bribe","unflag":null,"ending":null,"next":null},{"label":"只调到二点二，绿地不动","text":"\n你砍了一刀：容积率给到二点二，但三十亩湖和周边五十米一律划进公共绿地，写进土地出让合同的补充条款，用地性质不得改变。\n\n华泰不高兴，但接受了，因为二点二已经够赚。钱广白送你两箱酒，你退了一箱，留了一箱，说这个价我能喝。\n\n后来这片绿地成了白鹭洲公园，每天早上有一群老人在那里打太极。你路过的时候看见过他们几次，你每次都在车里，隔着贴了膜的车窗。你不明白自己为什么不敢下去走走。\n","effects":{"money":80,"risk":9,"probe":4,"merit":6,"pop":6,"net":2,"stress":6,"clean":-6},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"调到三点零，连绿地一起改","text":"\n你不光给了三点零，还帮着把那三十亩湖的\"水域\"在图上改成了\"景观水体\"，把公共绿地挪到了地块最东侧的一块边角地，三面被高层围住，终年见不到太阳。\n\n华泰在这个项目上多赚了二十二个亿。钱广白给了你八百万，另加白鹭洲两套顶层复式，一千万的装修款另算。\n\n公示期有市民在规划局门口举牌，牌子上写着\"还我白鹭洲\"。举了三天，牌子被收走了。五年后那三十亩水面被填平，变成了一片下沉式商业广场，开业那天放了十五分钟的烟花。\n","effects":{"money":1800,"risk":34,"probe":20,"net":6,"merit":5,"pop":-14,"stress":19,"clean":-24},"flag":"company_x","unflag":null,"ending":null,"next":null}]},{"id":"jb_013","title":"钱广白的黑色塑料袋","text":"\n这是你在江百市的第四个年头。\"潮江会\"会所，二层叫\"观澜\"的包间，落地窗外就是东港码头，夜里能看见龙门吊的灯一盏一盏亮起来，像一排不肯熄灭的烟头。\n\n钱广白六十一岁，华泰置业的创始人，江百市本地人，起家时是给船厂拉沙石的。他不吃海鲜，只吃一盘炒粉。他给你倒了杯茶，讲了四十分钟自己的事：十六岁丧父，三十岁欠债，四十岁拿到第一块地，五十岁那年把送他进去的那个领导的名字，写在纸上烧了。\n\n然后他从脚边拎起一个黑色塑料袋，放到桌上。袋口没扎，散着口，能看见里面是一扎一扎的百元钞，新钞，银行的封条还在。\n\n他说：兄弟，这是两百万，白鹭洲的谢意。你要是觉得烫手，就当我没提过；你要是觉得不烫手，往后你我是一条船上的人。\n\n他起身去洗手间，把包间留给你，一个人，一袋钱，一窗灯火。\n","city":"江百市","min_rank":3,"max_rank":5,"weight":5,"once":true,"need":{"min_money":0,"max_money":0,"min_risk":0,"min_probe":0,"min_year":1,"flag":null,"no_flag":null,"min_merit":0,"min_boss":0,"min_net":0,"min_pop":0},"tags":["工程","土地","同僚"],"options":[{"label":"起身，把袋子推回去","text":"\n你说：钱总，这袋东西，您带回去。我从进这个门到出这个门，什么都没看见，您也什么都没提过。\n\n他的手在桌上停了两秒，然后笑起来，笑得很响：好，好。他拎起袋子走了，走的时候还帮你把门带上。\n\n此后华泰在云台区的报建，一律排在最后。别人给华泰开绿灯的时候，你按规矩办，办得比谁都慢。你以为这是代价。三年后华泰资金链断裂，钱广白被外地办案机关带走，第一批被叫去谈话的二十七个人里，没有你。\n","effects":{"risk":-6,"merit":6,"pop":4,"boss":5,"net":-6,"stress":14,"probe":-5,"clean":8},"flag":"honest_path","unflag":null,"ending":null,"next":null},{"label":"收下两百万","text":"\n你说：钱总，我拿着。就四个字，说完你听见自己的声音很陌生，像从别人喉咙里发出来的。\n\n钱广白从洗手间出来，看见袋子没了，什么都没问，只把那盘炒粉推到你面前：趁热吃。\n\n那两百万你分五个地方放：三十万现金锁在父母家的旧衣柜，七十万以表弟的名义存了三年定期，五十万买了黄金藏在阳台的花盆底下，三十万借给了一个做建材的朋友，剩下的二十万，你留在一张不记名的卡里，随身带着。\n\n从那天起，你夜里的睡眠分成两半：一半在床上，一半在那五个地方。\n","effects":{"money":200,"risk":18,"probe":9,"net":6,"merit":3,"health":-3,"stress":20,"family":-3,"clean":-18},"flag":"took_first_bribe","unflag":"honest_path","ending":null,"next":null},{"label":"只收三十万，写借条","text":"\n你从袋子里数出三十万，说：钱总，这三十万算我借的，我给您写个条子。剩下的您拿回去。\n\n你真的写了借条，写了日期，签了名，没写还款日期。钱广白把条子折好，收进西装内袋，说：这东西我留着，哪天你不认我这个大哥了，我拿出来。\n\n你以为借条是护身符。多年以后你才知道，在认定受贿的时候，借款只是一种说法；有没有还款能力、有没有还款意思、有没有请托事项，三样俱全，借条就是证据的一部分，而且是写得最清楚的那种。\n","effects":{"money":30,"risk":11,"probe":5,"net":4,"stress":12,"clean":-9},"flag":"took_first_bribe","unflag":null,"ending":null,"next":null},{"label":"收两百万，再要三百万","text":"\n你说：钱总，两百万我看不上。白鹭洲那个事，我担的是掉脑袋的风险，您给我这个数，是打发人。\n\n包间里安静了大概半分钟。钱广白看着你，忽然笑了：你比你前任有种。他打了个电话，三天后，你的境外汇款账户上多了一笔五百万，币种是境外货币，走的是一家\"咨询公司\"的贸易项下。\n\n你赢了这一局，赢得干脆利落。但你也从此在钱广白那里挂上了价——一个有价的人，就不再是被尊重的人，只是被计算的人。他给会计发了一条消息：这个人，按成本列支。\n","effects":{"money":500,"risk":30,"probe":18,"net":6,"merit":2,"stress":22,"clean":-24,"offshore":500},"flag":"took_first_bribe","unflag":"honest_path","ending":null,"next":null},{"label":"把袋子交给纪检组","text":"\n你把袋子拎出了会所，没回家，直接开车去了纪检组的驻地，把袋子放在值班室的桌上，做了一个两小时的笔录。\n\n钱广白第二天就被约谈了，但只谈了三天就出来了，因为他说这是\"玩笑\"，而你没有录音。\n\n此后你在江百市的名字后面，多了一个括号，括号里写着几个字，那几个字没人会当着你的面说，但每个人都懂。你被调去了档案室，管了四年档案。四年里你读了江百市三十年的旧卷宗，读到最后一页的时候，你终于明白了这座城市是怎么运转的。\n","effects":{"risk":-8,"merit":-5,"pop":6,"boss":-8,"net":-10,"stress":25,"probe":-8,"clean":10},"flag":"reported","unflag":null,"ending":null,"next":null}]},{"id":"jb_014","title":"两百万该放在哪里","text":"\n钱在手里，比在梦里烫。\n\n第一个来找你的是一个姓单的掮客，四十来岁，做\"艺术品投资\"的。他在你办公室坐下，说：领导，现金是不能久留的，江百的银行系统去年就上了大额监测，五十万以上自动上报。字画、玉石、老酒，这些东西不进系统，还能涨。\n\n第二个是你在银行当副行长的同学，他给你讲了一个词：结构化。\n\n第三个是你妻子。她没听懂你们在说什么，只是晚上在床上问了一句：家里哪来这么多钱？你说，借的。她翻了个身，说：哦。\n\n阳台上那几个花盆，你每天浇一次水，浇得比谁都勤。\n","city":"江百市","min_rank":3,"max_rank":5,"weight":4,"once":true,"need":{"min_money":20,"max_money":0,"min_risk":0,"min_probe":0,"min_year":0,"flag":"took_first_bribe","no_flag":null,"min_merit":0,"min_boss":0,"min_net":0,"min_pop":0},"tags":["金融","收藏","家属"],"options":[{"label":"全部退回，就此收手","text":"\n你把两百万原封不动地退了回去，找钱广白要了一张收条，收条上写\"代管款已归还\"。\n\n钱广白看你的眼神变了，像看一个突然下车的同路人。他说：兄弟，路还长。\n\n你在江百市的日子一下子清静了：没人请你吃饭，没人找你签字，也没人在半夜给你打电话。你的名字从十几个群里消失了。你每天按时下班，回家吃饭，体重增加了七斤。你妻子说，你最近睡得真死。\n","effects":{"money":-200,"risk":-14,"merit":3,"boss":2,"net":-5,"stress":-12,"family":5,"probe":-8,"clean":12},"flag":"reformed","unflag":"took_first_bribe","ending":null,"next":null},{"label":"分散存放，慢慢花","text":"\n你把钱分成十二份：四份存进四个亲戚的账户，三份埋在父母家的院子里（装在三个不锈钢饭盒里），两份买了黄金，一份买了保险，两份留作日常。\n\n你给自己定了规矩：一年最多花二十万，只花现金，不转账，不买车，不买房，不在朋友圈发任何照片。\n\n规矩定了三年，执行了三个月。第四个月你在东港的一家会所办了一张三十万的会员卡，因为钱广白说，不入会，谈不成事。卡是用你司机的身份证办的。\n","effects":{"money":20,"risk":12,"probe":6,"health":-3,"stress":15,"family":-5,"clean":-8},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"买字画，交给单掮客","text":"\n你拿一百二十万跟单掮客买了三幅\"名家\"作品：一幅山水、一幅花鸟、一幅字，每幅都附带一张鉴定证书和一个很长的流传故事。\n\n单掮客说：领导，这些东西，三年至少翻一番。他把画挂在你办公室的会客区，说是\"提升文化品位\"。\n\n两年后钱广白出事，办案人员查到单掮客，顺藤摸到了三幅画。专家鉴定结论是：三幅均为赝品，市场价合计不超过两万。你那一百二十万，成了行贿款，也成了笑话。\n","effects":{"money":30,"risk":20,"probe":12,"net":3,"stress":14,"clean":-12},"flag":"company_x","unflag":null,"ending":null,"next":null},{"label":"走境外的贸易通道","text":"\n你通过单掮客认识的一个\"国际贸易公司\"，把两百万以预付货款的名义分六笔汇出，再用一笔\"进口设备退款\"的名义，在一处境外账户上落了地。\n\n对账单寄到你办公室的时候，你盯着那串数字看了很久。钱还在，但已经不是钱了，是另一套语言写的东西，写在你看不懂的规则里。\n\n你打通了一条路，也交出了自己的把柄：那家贸易公司的实际控制人，从此知道了你所有的数字、所有的时间、所有的金额。在江百市，通道的代价不是手续费，是你把自己的命交给了修路的人。\n","effects":{"money":-20,"risk":16,"probe":10,"net":5,"stress":18,"clean":-14,"offshore":600},"flag":"offshore_ready","unflag":null,"ending":null,"next":null}]},{"id":"jb_015","title":"售楼处的苏小姐","text":"\n白鹭洲开盘那天，你在现场剪彩。仪式结束后，置业顾问苏小姐带你看了样板间。\n\n她二十七岁，本地人，学的是空乘，说话有分寸，笑起来左边有个梨涡。她给你讲户型、讲得房率、讲层高，讲到最后忽然停下来，说：领导，您自己住的话，我建议您看二十二层那套，我们钱总说那套不卖。\n\n后来你常去。她陪你喝茶，听你讲工作上的事，从不插嘴，只在你讲完的时候说一句\"您太累了\"。\n\n你妻子从你的衬衫领口闻到过一次香水味，问了一句。你说售楼处人太多，挤的。她\"嗯\"了一声，那天晚上她把你的衬衫单独洗了，泡了很久。\n","city":"江百市","min_rank":3,"max_rank":6,"weight":4,"once":true,"need":{"min_money":0,"max_money":0,"min_risk":0,"min_probe":0,"min_year":0,"flag":null,"no_flag":null,"min_merit":0,"min_boss":0,"min_net":0,"min_pop":0},"tags":["情妇","家属"],"options":[{"label":"到此为止，不再见面","text":"\n你把那套二十二层退了，也把苏小姐的微信删了。删之前你发了一条：小苏，我这个年纪不该再添麻烦，你好好的。\n\n她回了一个\"嗯\"，没再多说。三年后听说她去了省城，嫁了个做生意的，生了个女儿。\n\n你回家那天，妻子正在厨房炖汤。你站在门口看她的背影，看了很久。她回头问：站着干嘛？你说：看你炖汤。她说：神经病。那天你睡得很好。\n","effects":{"risk":-4,"family":6,"stress":-8,"clean":5},"flag":"honest_path","unflag":null,"ending":null,"next":null},{"label":"保持来往，给她买房","text":"\n你以\"朋友代持\"的名义，在临江新区给她买了一套八十九平方米的房子，首付一百二十万，你出的。月供你每月让司机送现金过去。\n\n你每周去两次，每次不超过两小时。你给自己算过：一年一百零四次，一年三百多万的风险，换来的是——你也不知道换来的是什么。大概是一个人肯听你把话说完。\n\n苏小姐后来又介绍了两个\"姐妹\"给你认识，说一起打牌热闹。她不知道，每多一个知道的人，你离出事就近一天。\n","effects":{"money":-120,"risk":22,"probe":11,"net":3,"family":-15,"stress":16,"clean":-16},"flag":"has_mistress","unflag":null,"ending":null,"next":null},{"label":"只喝茶，保持距离","text":"\n你们继续见面，但只在售楼处的会客区，隔着一张玻璃桌，桌上有监控，正对着大门。\n\n她给你泡茶，讲楼盘的趣事，讲客户里的奇葩。你听得很放松，这是你在江百市唯一不用算计的两个小时。\n\n你以为这叫\"发乎情止乎礼\"。直到有一天，纪检组找你谈话，问的第一个问题就是：你与苏某某是什么关系？你才明白，在别人眼里，隔一张玻璃桌和隔一张床，区别只在于几秒钟。\n","effects":{"risk":8,"probe":4,"family":-5,"stress":6,"clean":-4},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"安排她进关联企业","text":"\n你把她安排进华泰旗下的物业公司，做\"总经理助理\"，年薪六十万，实际不用上班。钱广白替你办了，办得干脆，还多给了她一部车。\n\n苏小姐从此成了你和钱广白之间的一条线：你的意思通过她传，好处通过她送，账也通过她走。你以为这叫\"隐蔽\"，纪委的说法叫\"特定关系人\"。\n\n特定的意思是：她收的每一分钱，都算在你头上；她说的每一句话，都能作为证言。你把一个愿意听你说话的人，变成了一本账。\n","effects":{"money":80,"risk":28,"probe":15,"net":4,"family":-18,"stress":19,"clean":-20},"flag":"has_mistress","unflag":null,"ending":null,"next":null}]},{"id":"jb_016","title":"高新区的十五条路","text":"\n高新区二期基础设施打包招标，十五条道路、两座泵站、一座跨线桥，标段拆成六个，总造价九亿四千万。\n\n开标前一周，你在工地临时办公室里，看见六家投标单位的人住在同一家酒店，同一层楼，早上一起吃自助餐。\n\n其中一个标段的报价单上，六家公司的清单子目，连错别字都一样——\"砼\"写成了\"仝\"，六份全错。这是江百市工程圈里最常见的破绽，也是最没人查的破绽。\n\n中建系统的老严来找你，说他们想拿两个标段，愿意\"表示表示\"。他带来的是一份名单，名单上写着另外五家公司的陪标费，每家二十万，一共一百万，都已经付了。\n\n他说：领导，这行就这样，谁也干净不了。\n","city":"江百市","min_rank":3,"max_rank":5,"weight":4,"once":true,"need":{"min_money":0,"max_money":0,"min_risk":0,"min_probe":0,"min_year":0,"flag":null,"no_flag":null,"min_merit":0,"min_boss":0,"min_net":0,"min_pop":0},"tags":["工程","交通"],"options":[{"label":"报监管部门，重新招标","text":"\n你把六份清单的错别字做了对比图，报给了市住建局的招投标监管部门，建议暂停开标。\n\n开标推迟两个月，六家企业被记入不良行为记录，其中三家被清出江百市市场一年。重新招标后，总造价降到八亿一千万，省了一亿三。\n\n你在总结会上被批评\"影响项目进度\"。十五个月后，这批路通车，跨线桥的支座用了国产件，比原设计省了七百万。通车剪彩那天，你没有收到请柬。\n","effects":{"risk":-3,"merit":8,"pop":6,"boss":-3,"net":-5,"stress":9,"probe":-3,"clean":6},"flag":"honest_path","unflag":null,"ending":null,"next":null},{"label":"照常开标，收两百万","text":"\n你什么都没做。六个标段按\"预定方案\"分了，老严拿了两个。\n\n一个月后，你收到两百万，装在四个茶叶罐里，罐子里是茶，茶下面压着现金。这个手法在江百市有个名字，叫\"茶水费\"，明码标价，一般是造价的百分之二。\n\n你后来在这十五条路上走过很多次，每一次都觉得车轮碾过的地方不太一样。通车三年后，其中一条路的路基下沉了四十公分，返工挖开的时候，发现垫层里全是建筑垃圾。\n","effects":{"money":200,"risk":19,"probe":10,"merit":4,"net":4,"stress":13,"clean":-15},"flag":"took_first_bribe","unflag":null,"ending":null,"next":null},{"label":"装糊涂，但留一份名单","text":"\n招标照常，钱你没收。但你把老严给的那份\"陪标费名单\"复印了一份，锁进办公室的文件柜，钥匙你随身带。\n\n你想的是：万一出事，这份名单能证明\"不是我组织的\"。\n\n开标三年后，这个项目的审计果然出了问题，办案人员找你谈话，你从柜子里拿出那份复印件，说：我当时就发现了，只是没报。\n\n他们翻了两页，问：既然发现了，为什么没报？你答不上来。沉默也是一种受贿，只是收的不是钱，是时间。\n","effects":{"risk":10,"probe":6,"net":2,"merit":2,"stress":11,"clean":-7},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"自己组局，吃掉三个标段","text":"\n你没接老严的钱，而是让他把陪标的那五家，换成你指定的五家——其中两家是你表弟的公司，一家是司机老婆名下的空壳。\n\n三个标段由这两家公司中标，再转包给真正的施工队，转包差价一千八百万。钱分三笔进来，走的是一个建材贸易公司的\"材料款\"。\n\n你从\"收钱的人\"变成了\"分钱的人\"。在江百市，这两个身份之间隔着的不是钱，是胆量。而你一旦分过钱，就再也回不到只收钱的位置了——因为知道你分过钱的人，从此可以指挥你。\n","effects":{"money":1800,"risk":33,"probe":19,"net":6,"merit":3,"stress":21,"clean":-26},"flag":"company_x","unflag":null,"ending":null,"next":null}]},{"id":"jb_017","title":"跑口记者的两个价","text":"\n《江百商报》跑城建口的记者姓谭，三十出头，常年一件冲锋衣，背包里装着三脚架。他在江百市跑口八年，手里有一份名单，名单上全是他自己整理的：哪块地的受让方跟哪个部门的人同名，哪家公司的注册地址跟某位领导的亲戚重合。\n\n他先来找你，是白鹭洲公示的第二天。他说：领导，有人给我们爆料，说白鹭洲的绿地指标有问题，我们想听听您的说法。\n\n你请他在楼下咖啡厅坐。聊了四十分钟，他把一个信封放在桌上，说这是\"车马费\"，三千。你还没说话，他又拿出第二个信封，说：如果您愿意，我们全年可以做\"战略合作\"，二十万，我们报社给您出个专版，顺便把爆料压下来。\n\n两个信封并排放着，像两扇门。\n","city":"江百市","min_rank":3,"max_rank":6,"weight":4,"once":true,"need":{"min_money":0,"max_money":0,"min_risk":0,"min_probe":0,"min_year":0,"flag":null,"no_flag":null,"min_merit":0,"min_boss":0,"min_net":0,"min_pop":0},"tags":["媒体","城建"],"options":[{"label":"不收，公开接受采访","text":"\n你把两个信封都推回去，说：小谭，你问什么，我答什么，但有一条，答错的你也要登。\n\n采访做了两个小时，他问了十七个问题，你答了十六个，一个你说\"这个要核实\"。第二天头版登了一篇四千字的稿子，标题是《白鹭洲：一块地的三次调整》。\n\n稿子登出来，市里开会研究了一次，绿地指标最终保住了三十亩。谭记者后来又来找过你几次，每次都是来问问题，不再带信封。他说：领导，您是我跑口八年，唯一一个敢让我登错误的人。\n","effects":{"risk":-4,"merit":6,"pop":10,"net":3,"boss":1,"stress":7,"probe":-4,"clean":6},"flag":"honest_path","unflag":null,"ending":null,"next":null},{"label":"收三千的车马费","text":"\n你收了三千那封，把第二封推了回去，说：合作的事我做不了主。\n\n他笑了笑，收回去了。稿子没登，因为\"事实还需核实\"。\n\n你以为这三千买的是稿子。其实它买的是他笔记本上的一行字：这个人可以谈。从那天起，你进了他的名单，名单的另一栏里，记着你的车牌号、你常去的会所、你家属开的车。这些都不是你告诉他的。\n","effects":{"money":3,"risk":9,"probe":5,"net":2,"stress":8,"clean":-6},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"签二十万的战略合作","text":"\n你签了。二十万走的是区里的宣传经费，名目是\"城市形象推广\"。\n\n那一年《江百商报》给你出了六个专版，标题一个比一个大：《一座新城的十年》《在江百看见未来》。爆料也确实压下去了，一共压了四篇。\n\n第五年，这家报社的社长因敲诈勒索被抓，办案人员在搜查时，从他的电脑里找到了一份\"合作单位明细表\"，表里二十七个单位的名称、金额、对接人，清清楚楚。你的名字在第十二行。\n","effects":{"money":-20,"risk":24,"probe":14,"merit":4,"boss":3,"stress":15,"clean":-16},"flag":"has_faction","unflag":null,"ending":null,"next":null},{"label":"反过来，请他挖对手","text":"\n你没收他的钱，也没付他的钱。你请他吃了三顿饭，每次都\"随口\"提起另外两个部门的事情：某块地的审批时间、某个老板的资金来源、某次会议谁迟到了四十分钟。\n\n他很聪明，第三顿饭之后就明白了。一个月后，《江百商报》连发三篇调查，全都指向你的竞争对手。那一年，你的对手在调整中出局，你上了一个台阶。\n\n你没花一分钱，但你把一个记者变成了你的刀。刀这种东西，握久了会割到手——这一点，是谭记者在第六年自己交代的，他说的时候，把三顿饭的时间地点都记得清清楚楚。\n","effects":{"risk":26,"probe":16,"net":6,"merit":5,"boss":4,"stress":18,"clean":-18},"flag":"has_faction","unflag":null,"ending":null,"next":null}]},{"id":"jb_018","title":"副处公示期的举报信","text":"\n提副处，公示期第五天。市纪委信访室收到一封实名举报信，落款是\"江百市市民 吴某某\"——棚户区那个在楼顶插过旗的吴姓男人。\n\n信里写了三件事：夜拆那晚你签的字；你表弟名下的那套白鹭洲房子；以及一张照片——你在\"潮江会\"门口，从钱广白手里接过一个黑色塑料袋，照片是从对面的停车场拍的，时间、地点、车牌都在。\n\n组织部的电话打到你们单位：请该同志就有关问题作出说明，明天上午九点，市纪委谈话室。\n\n你妻子帮你熨了明天要穿的白衬衫，问：明天是不是要开会？你说：是，一个重要的会。\n","city":"江百市","min_rank":3,"max_rank":5,"weight":5,"once":true,"need":{"min_money":0,"max_money":0,"min_risk":0,"min_probe":0,"min_year":1,"flag":null,"no_flag":null,"min_merit":0,"min_boss":0,"min_net":0,"min_pop":0},"tags":["人事","巡视","信访"],"options":[{"label":"如实说明，接受核查","text":"\n你去了。九点到下午两点，五小时，做了十一页笔录。\n\n你说：夜拆我签过字，这是我的错，程序上我负有责任；房子是我表弟买的，我借给他一百万，有借条有转账；那个袋子，是钱广白落下的，我第二天还给他了，会所有监控。\n\n三件事，你承认一件，澄清两件。核查用了五个月，提拔冻结。五个月后结论：前两件不构成违纪，第三件无法查证。\n\n你晚了半年上任。那半年你瘦了十四斤。\n","effects":{"risk":-12,"merit":3,"boss":3,"net":-4,"health":-5,"stress":20,"probe":-12,"clean":8},"flag":"reported","unflag":null,"ending":null,"next":null},{"label":"统一口径，拒不承认","text":"\n你连夜找了三个人：表弟、司机、会所的经理。三个人的说法在凌晨四点统一了：房子是表弟自己买的；袋子是茶叶；夜拆那晚你在医院陪母亲。\n\n谈话进行了三小时，你答得很顺，顺得像背过。办案人员问了最后一个问题：你母亲住哪个医院？你说了名字。他们又问：几号病房？你不知道。\n\n这个细节后来写进了初核报告：陈述存在矛盾。查证没有突破，但怀疑留下了。此后每一次有人被查，你的名字就会在内部系统里被检索一次。\n","effects":{"risk":14,"probe":12,"net":3,"stress":22,"clean":-10},"flag":"reported","unflag":null,"ending":null,"next":null},{"label":"托关系把信转成暂存","text":"\n你给邵一鸣打了电话，他现在已经到了市里。他没直接答应，只说：实名举报必须查，这是规矩，但我可以让他\"补充说明\"。\n\n吴某某被请去\"补充说明\"了三次，第三次之后，他签了一份\"因记忆有误，撤回部分内容\"的说明。\n\n信被降格为\"反映问题\"，转入督办。你的提拔没有被冻结。但吴某某把那份撤回说明的复印件，寄给了省里。省里的批件上有四个字：一并核查。\n","effects":{"money":-30,"risk":18,"probe":15,"net":5,"boss":4,"stress":17,"clean":-14},"flag":"has_faction","unflag":null,"ending":null,"next":null},{"label":"连夜退赃，主动说清","text":"\n谈话前一晚，你没睡。凌晨三点，你把表弟叫来，让他把那套房子挂出去，按原价退给华泰；又让妻子把家里所有的存折、卡、首饰列了一张单子。\n\n上午九点你准时到谈话室，第一句话是：我要主动交代问题。\n\n你交代了三笔，共一百八十万，全部退缴。组织认定为\"主动交代、积极配合\"，免予处分，调任非领导岗位。你在新岗位上待了两年零八个月，两年零八个月里，你每天中午都自己带饭。\n","effects":{"money":-180,"risk":-16,"merit":-4,"boss":-2,"net":-3,"health":-6,"stress":24,"family":-6,"probe":-15,"clean":14},"flag":"reformed","unflag":"took_first_bribe","ending":null,"next":null}]},{"id":"jb_019","title":"金融城的掮客","text":"\n江百市金融城，四十七栋楼，白天是玻璃，晚上是黑洞。\n\n区里要发一笔二十亿的城投债，主承销商的位置竞争激烈。来找你的不是银行，是一个叫郗敬的人——江百市金融圈的掮客，四十八岁，名片上印着\"资本顾问\"，办公室在金融城三十八层，一整面墙的书，从没见他翻过。\n\n他不要中标，他要的是\"协调\"：帮你把承销费率从千分之三谈到千分之八，多出来的五个千分点，一年就是一千万，五年五千万。他说：这五千万里，银行拿两千万，中介拿一千万，剩下两千万，领导您安排。\n\n他把一张纸推过来，纸上画了三条线，从区平台出发，绕了两道，回到一个境外账户。他说：江百市的钱，得从江百市外面走一圈再回来，这样才干净。\n","city":"江百市","min_rank":4,"max_rank":6,"weight":4,"once":true,"need":{"min_money":0,"max_money":0,"min_risk":0,"min_probe":0,"min_year":2,"flag":null,"no_flag":null,"min_merit":0,"min_boss":0,"min_net":0,"min_pop":0},"tags":["金融","城建"],"options":[{"label":"公开比选，锁死费率","text":"\n你把承销费率写进招标文件的硬性条款：不得超过千分之三，超限即为废标。五家机构来投，最后一家国有大行以千分之二点六中标。\n\n郗敬给你打过三次电话，第三次他说：领导，您这不是断人财路，是断自己的路。\n\n一年后，江百市的城投融资成本被省里作为典型通报，云台区的综合成本全市最低。省长在会上讲了一句话：江百市能干成事，是因为有些人不肯多花那几个点。\n","effects":{"risk":-3,"merit":9,"pop":6,"boss":6,"net":-6,"stress":8,"probe":-3,"clean":6},"flag":"honest_path","unflag":null,"ending":null,"next":null},{"label":"接受安排，拿八百万","text":"\n费率谈到千分之七点五，多出来的部分，通过三家\"财务顾问公司\"分流，郗敬负责洗白。你分到八百万，第一笔三百万到账那天，你在办公室坐到十一点，楼下的金融城亮了一半的灯。\n\n这钱来得比工程款干净：没有箱子，没有现金，没有塑料袋，只有一封邮件和一条短信。\n\n也正因为太干净，你在很长一段时间里真的相信它是\"顾问费\"。直到三年后，那三家顾问公司被查出是同一批人控制的空壳——在金融城，最危险的不是装钱的袋子，是那份印着英文的顾问协议。\n","effects":{"money":800,"risk":22,"probe":13,"net":5,"merit":4,"stress":14,"clean":-17},"flag":"company_x","unflag":null,"ending":null,"next":null},{"label":"让他做，自己不沾钱","text":"\n你同意了郗敬的方案，但讲明一条：我不要钱，我要政绩。多出来的费率，你拿出一部分，给我区里的两只产业基金做劣后。\n\n两只基金各五个亿，郗敬出了一点二亿。基金投了三家本地企业，其中一家三年后上市。\n\n你没拿一分钱，但你在金融圈的名声起来了：这个人懂行，也不贪。名声这种东西，在某些时候比钱更管用——它能让你在五年后，被一个更大的圈子接纳，也能让你在十年后，被人指着鼻子说：他当年可是一点没拿。\n","effects":{"risk":8,"probe":5,"merit":10,"boss":5,"net":7,"stress":9,"clean":-5},"flag":"has_faction","unflag":null,"ending":null,"next":null},{"label":"自己搭通道，拿两千万","text":"\n你嫌郗敬抽得太狠，干脆绕开他：让你妻子的表弟在境外注册了一家\"咨询公司\"，由它跟主承销商签顾问协议，一年两千万，签五年。\n\n第一年两千万到账，境外账户，币种是境外货币。你算了一下，比你前面十年拿的所有钱加起来还多一倍。\n\n你把郗敬踢出了局。被踢出局的人，是这个世界上最爱记账的人。第四年，一份举报材料出现在省廉政总署的信箱里，材料里附了那家境外公司的注册文件、股东名单、以及一张你妻子表弟在机场的照片。\n","effects":{"money":2000,"risk":32,"probe":20,"net":5,"merit":4,"family":-12,"stress":20,"clean":-24,"offshore":2000},"flag":"offshore_ready","unflag":null,"ending":null,"next":null}]},{"id":"jb_020","title":"东港来的外甥","text":"\n东港码头三期扩建，总投资六十八亿，是江百市这些年最大的单体项目，也是省里的重点项目。\n\n开标前一个月，省城下来一个年轻人，姓陆，三十二岁，说是\"陆厅长的外甥\"，在省城做工程。陆厅长分管交通，名字每周出现在本地新闻里。\n\n陆外甥不提钱，只提两件事：一、他带来的这家企业叫\"中衡建设\"，资质齐全；二、他希望\"公平竞争\"，不希望因为\"外地的\"被排挤。\n\n他每次来都带着省城的特产，一盒点心，不值钱。他走的时候，你办公室的沙发上总留着一份文件，全是这家企业的业绩材料。\n\n市长把你叫去，只说了一句：东港三期，你自己把握，但别给我惹麻烦。\n","city":"江百市","min_rank":4,"max_rank":6,"weight":5,"once":true,"need":{"min_money":0,"max_money":0,"min_risk":0,"min_probe":0,"min_year":2,"flag":null,"no_flag":null,"min_merit":0,"min_boss":0,"min_net":0,"min_pop":0},"tags":["工程","交通","上级"],"options":[{"label":"严格按评分办法","text":"\n你把评分办法细化到二十七项，其中\"类似工程业绩\"要求近五年内完成过两个十万吨级以上码头，中衡建设只有半个——一个是分包，不算。\n\n中衡出局。陆外甥来告别，还是带了一盒点心，说：领导，我回去跟我舅舅说，江百市的规矩硬。\n\n这话后来传到了省城。半年后，交通口的资金分配，江百市多拿了四点七亿。陆厅长在一次会上说：江百那个项目，我看了，做得干净。\n","effects":{"risk":-2,"merit":8,"pop":4,"boss":7,"net":-4,"stress":9,"probe":-2,"clean":6},"flag":"honest_path","unflag":null,"ending":null,"next":null},{"label":"让中衡中，收五百万","text":"\n你调整了评标办法，把\"类似工程业绩\"改成\"类似或相关工程业绩\"，并把年限从五年放宽到十年。中衡得分第一，中标。\n\n五百万分两次到账，一次三百万，一次两百万，走的是河北一家建材公司的\"材料款\"。\n\n你在东港三期的开工仪式上剪了彩，剪完和陆外甥握了手，合影登在报纸二版。你以为这是攀上了省城的人。两年后陆厅长被查，专案组手里第一个要核的，就是这张合影背后的评标办法修改记录。\n","effects":{"money":500,"risk":26,"probe":15,"net":6,"merit":4,"boss":3,"stress":16,"clean":-19},"flag":"boss_backed","unflag":null,"ending":null,"next":null},{"label":"给个分包，意思意思","text":"\n主体工程你没松口，但把三期的疏浚工程拆出来单独招标，标的额三亿二，中衡拿了。\n\n陆外甥很满意，说：领导，您会办事。他舅舅那边，从此对江百市多了三分好脸色。\n\n你没拿钱，只收了一块表，说是\"纪念表\"，价值十二万。你戴着它出席了三十多次会议，直到有一天，你在电视上看见另一个人戴了同一块表，那个人正在被宣判。\n","effects":{"money":12,"risk":14,"probe":8,"net":7,"boss":6,"stress":10,"clean":-9},"flag":"boss_backed","unflag":null,"ending":null,"next":null},{"label":"主动上门，拜陆厅长","text":"\n你借着省里开会的机会，直接去了陆厅长家里。你带了两盒茶叶，茶叶盒底下是两百万现金。\n\n陆厅长没看你，也没看你手里的东西，只说了一句：小同志，江百市的水很深，你悠着点。然后他让你把东西拿回去。\n\n你没拿回去，你把它放在了玄关。你出门的时候，听见里面传来一句：这个人的胆子，太大了。\n\n三年后陆厅长落马，交代材料里写着这么一句：江百市某同志曾于某年某月到我家中送现金两百万，被我当场拒绝并责令带回。你后来读到这句话的时候，手一直在抖。\n","effects":{"money":-200,"risk":30,"probe":22,"net":3,"boss":-6,"stress":25,"clean":-20},"flag":"boss_backed","unflag":null,"ending":null,"next":null}]},{"id":"jb_021","title":"青菱湖的两难","text":"\n青菱湖是江百市的水源地，湖面一万一千亩，湖东岸有七个村，种藕、养鱼、开农家乐。\n\n市里有两个方案。方案甲：环湖一公里划为生态红线，七个村整体搬迁，财政支出二十四亿，环评一次过。方案乙：湖东岸保留两个村做\"湖畔文旅\"，其余五村搬迁，同时引入一家企业做整体开发，投资三十亿，财政不出钱，但要在红线内建六万平方米的商业和酒店。\n\n环保局的老郑坚决反对乙方案，他把一份水质监测报告摔在桌上：青菱湖去年总磷超标零点三倍，再往里塞六万平方米的建筑，你们自己想后果。\n\n那家企业叫\"湖山文旅\"，实际控制人姓甘，是钱广白的合伙人。\n","city":"江百市","min_rank":4,"max_rank":6,"weight":4,"once":true,"need":{"min_money":0,"max_money":0,"min_risk":0,"min_probe":0,"min_year":2,"flag":null,"no_flag":null,"min_merit":0,"min_boss":0,"min_net":0,"min_pop":0},"tags":["环保","旅游","城建"],"options":[{"label":"坚持方案甲，整体搬迁","text":"\n你在市政府常务会上念了老郑的报告，说了三句话：水是不能谈判的；搬迁的钱可以分三年付；谁签的字，谁就要对十年后的江百市负责。\n\n方案甲通过，七个村三千一百户搬迁，用了两年。\n\n两年后青菱湖水质从四类升到三类，湖东岸的藕塘自己长回来了。市里少收了十四亿土地出让金，你在财政口的口碑跌到谷底。但每年夏天，你都能在城市供水报告上看到那一行字：达标率百分之百。\n","effects":{"risk":-3,"merit":8,"pop":12,"boss":3,"net":-5,"stress":12,"clean":6},"flag":"honest_path","unflag":null,"ending":null,"next":null},{"label":"推方案乙，收六百万","text":"\n方案乙通过，理由是\"以文旅反哺生态\"。六万平方米的商业和酒店，分三期建设，每期都办了\"临时用地\"手续。\n\n甘老板给了你六百万，外加青菱湖边一栋独栋，说是\"专家楼\"，可以用来\"静养\"。\n\n三年后，青菱湖蓝藻暴发，主城区停水三天，四十万人抢购瓶装水。自媒体把三年前的会议纪要和你的发言全部翻了出来，那句\"以文旅反哺生态\"，成了江百市那一年的年度笑话。\n","effects":{"money":600,"risk":30,"probe":18,"merit":3,"pop":-18,"net":4,"stress":18,"clean":-22},"flag":"accident","unflag":null,"ending":null,"next":null},{"label":"折中：保水，给政策不给地","text":"\n你否决了红线内建商业，但给了湖山文旅三样东西：环湖绿道的运营权十五年、七个村搬迁后旧村落的改造权、以及市属文旅平台跟它成立合资公司。\n\n甘老板算了一笔账，比建酒店赚得慢，但稳。项目做了四年，绿道修好了，旧村改成了民宿群，水质维持在三类。\n\n你既没得罪环保口，也没得罪企业。江百市管这叫\"会平衡\"。只是老郑退休那天跟你说了一句：你不是会平衡，你是两边都不敢真得罪。\n","effects":{"money":80,"risk":10,"probe":5,"merit":7,"pop":5,"net":4,"boss":3,"stress":8,"clean":-6},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"改水质数据，硬推方案乙","text":"\n你让监测站把两个断面从\"湖东\"挪到了\"湖心\"，把采样频次从每月一次改成每季度一次，还把一次超标的样本标注为\"异常值剔除\"。\n\n新报告很漂亮：连续两年稳定达标。方案乙全票通过，六万平方米全部落地，甘老板追加了三百万。\n\n第四年蓝藻暴发，停水三天。事故调查组调阅了原始监测记录，发现了被\"剔除\"的十一个样本。调查报告里有一句话：数据造假甚于污染本身。这句话后来印在了江百市的警示教育读本封面上。\n","effects":{"money":900,"risk":38,"probe":24,"merit":2,"pop":-22,"net":3,"stress":24,"clean":-28},"flag":"accident","unflag":null,"ending":null,"next":null}]},{"id":"jb_022","title":"班子里的一张空椅子","text":"\n市长卓秉文，五十六岁，本地人，做事慢，说话更慢，喜欢在会上一根一根地抽烟。常务副市长商立群，四十九岁，从省里空降，开了十七次调度会，每次都问三个问题：进度、资金、责任。\n\n两个人从不正面冲突，但江百市所有人都知道，市政府三楼的那部电梯，只能站一边的人。\n\n这一年市里要推\"临江新区扩容\"，涉及三个街道、四万人口、两万亩地。卓秉文主张稳妥，分片推进；商立群主张一次性整体征收，三年成型。\n\n常委会前一夜，卓秉文的秘书给你打电话：领导想听听你的意见。同一时间，商立群发来微信：明天你发言，讲实话。\n\n你手里有一份测算报告，报告说：整体征收需要资金一百四十亿，区财政三年内只能拿出五十六亿，缺口八十四亿。\n","city":"江百市","min_rank":4,"max_rank":6,"weight":5,"once":true,"need":{"min_money":0,"max_money":0,"min_risk":0,"min_probe":0,"min_year":2,"flag":null,"no_flag":null,"min_merit":0,"min_boss":0,"min_net":0,"min_pop":0},"tags":["同僚","上级","人事"],"options":[{"label":"照实讲八十四亿缺口","text":"\n你在会上念了那三个数字。会议室安静了很久，卓秉文慢慢把烟按灭了，说：这个数字，我头一回听见。\n\n商立群没说话，低头记笔记。\n\n方案最后改成\"先启动五千亩，滚动开发\"。三年后临江新区成型一半，没有留下一笔烂账。你在两边都不算自己人，但两边都不得不用你——因为江百市能算清这笔账的人，一只手数得过来。\n","effects":{"risk":-2,"merit":9,"pop":5,"boss":5,"net":-2,"stress":10,"clean":5},"flag":"honest_path","unflag":null,"ending":null,"next":null},{"label":"站商立群，押整体征收","text":"\n你说：临江新区要成，就得一次成，分片推等于给自己留退路，退路留多了就没有进路。\n\n商立群会后拍了拍你的肩膀，说了两个字：明白。\n\n整体征收启动，两年后资金链断了，五千亩地荒着长草，拆迁户在外面租了三年的房。商立群调回省里，走之前把你提了一级。你在新的位置上，天天看着窗外那片长草的地。\n","effects":{"risk":12,"merit":3,"pop":-8,"boss":8,"net":6,"stress":14,"clean":-6},"flag":"has_faction","unflag":null,"ending":null,"next":null},{"label":"两边都不得罪","text":"\n你发言讲了二十分钟，讲了意义、讲了机遇、讲了挑战、讲了要以人民为中心，唯独没讲那八十四亿。\n\n散会后卓秉文看了你一眼，那一眼你记了很多年。商立群也没再找过你。\n\n你在江百市活了下来，活得很体面，也活得很空。多年以后你总结自己的仕途，用了四个字：没有敌人。你没好意思说下半句：也没有人。\n","effects":{"risk":4,"merit":1,"net":3,"boss":2,"stress":7,"clean":-3},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"把报告同时给两个人","text":"\n你把测算报告做了两个版本，一份给卓秉文，一份给商立群，内容一样，只是封面不同。你以为这叫\"两头下注\"。\n\n第二天上午，两份报告同时出现在了市长的桌上——卓秉文把他的那份直接转给了商立群，附了一句：看看你的手下在干什么。\n\n从此你被彻底晾了四个月，四个月里没有一个人给你派活。第五个月，你被\"平调\"到了市供销社。供销社的院子里有一棵三十年的樟树，你在树下坐了很久很久。\n","effects":{"risk":16,"merit":-6,"boss":-12,"net":-8,"stress":20,"clean":-4},"flag":null,"unflag":null,"ending":null,"next":null}]},{"id":"jb_023","title":"区交通局长的位子","text":"\n云台区交通局局长的位置空出来了。三个候选人：副局长老甘，干了十二年副职，业务熟，脾气硬；区府办副主任小项，三十八岁，跟对了人；还有一个是你司机提过的\"朋友的朋友\"，姓柴，五十一岁，在市里一家路桥公司当副总，去年刚入党。\n\n老甘来找你，没带东西，带了一沓他这十二年的项目清单，一页一页给你讲，讲到最后一页的时候，声音有点抖。\n\n柴总没来，托人带了一句话：领导，我知道规矩，我按规矩办，规矩多少，您说。\n\n组织部的方案是你起草的。你写第一行字的时候，窗外在下雨，雨打在空调外机上，啪嗒啪嗒。\n","city":"江百市","min_rank":4,"max_rank":6,"weight":4,"once":true,"need":{"min_money":0,"max_money":0,"min_risk":0,"min_probe":0,"min_year":2,"flag":null,"no_flag":null,"min_merit":0,"min_boss":0,"min_net":0,"min_pop":0},"tags":["人事","交通"],"options":[{"label":"按实绩推荐老甘","text":"\n你在方案里只写事实：十二个项目，零事故，两次省级表彰，一次主动退回不该拿的补贴两万块。\n\n老甘上任那天喝了点酒，来敲你的门，站在门口鞠了个躬，没说话，转身走了。\n\n他在交通局长任上干了五年，五年里区里修的路，没有一条返工。他退休那天，全科室的人凑钱给他买了一个保温杯。你送了他一句话：老甘，你这辈子就值这个杯子。\n","effects":{"risk":-3,"merit":7,"pop":6,"boss":3,"net":2,"stress":6,"clean":5},"flag":"honest_path","unflag":null,"ending":null,"next":null},{"label":"推荐柴总，收三百万","text":"\n你在方案里加了一句\"需具有企业经营管理经历者优先\"，这一句话，把老甘和小项一起筛了出去。\n\n柴总上任，三百万分两次送来，一次是现金，一次是\"购房借款\"。\n\n他在任两年半，把区里十一条乡村公路全部包给了他原来那家公司，造价高出市场价百分之二十三。两年半后，一个包工头因为拿不到工程款，把一份报价对比表贴在了区政府门口。表上有柴总的签名，也有你签的\"同意\"。\n","effects":{"money":300,"risk":28,"probe":17,"net":5,"merit":2,"stress":17,"clean":-21},"flag":"company_x","unflag":null,"ending":null,"next":null},{"label":"推荐小项，换个人情","text":"\n你推荐了小项。不为钱，为他身后那个人——市里分管组织的副书记。\n\n小项上任后，第一件事就是把你推的那条断头路列入了年度计划。你在区里说话的分量，从此重了一分。\n\n你没收一分钱，但你做了一笔更大的交易：你把一个位置，换成了一个位置。在江百市，这种交易比收钱更难查，也更难脱身——因为收的钱可以退，送出的人情退不回来。\n","effects":{"risk":8,"probe":4,"net":8,"boss":6,"merit":4,"stress":8,"clean":-6},"flag":"has_faction","unflag":null,"ending":null,"next":null},{"label":"三个人都不推，卡住","text":"\n你把方案压了两个月，理由是要\"充分酝酿\"。三个人都来过，都空手来的，也都没说什么。\n\n两个月后，市里直接派了一个人下来，谁也没得罪。\n\n你以为这是最安全的做法。结果是你同时失去了三个人：老甘从此不跟你说话，小项的背后那个人记住了你，柴总把三百万送到了别人手上，而那个人上任后的第一把火，就是查你分管的一条路的招标。\n","effects":{"risk":10,"merit":-3,"boss":-6,"net":-5,"stress":12,"clean":-3},"flag":null,"unflag":null,"ending":null,"next":null}]},{"id":"jb_024","title":"纪检组的第一次谈话","text":"\n省廉政总署驻江百市纪检组的办公室在市府大院东侧一栋旧楼的三层，走廊很窄，墙上挂着一块牌子：谈话室。三个字，白底黑字。\n\n通知是电话打的，只说\"请来一趟，了解点情况\"，没说是什么事。\n\n你在门口等了十七分钟。进去的时候，屋里三个人：一个记录员，一个你不认识的年轻人，还有一个——沈亦青。他坐在靠窗的位置，手里拿着一个牛皮纸档案袋，看见你进来，点了下头，什么表情都没有。\n\n年轻人先说了三句话：今天请你来，是谈话，不是讯问；你要如实说明，也要对自己说的话负责；我们掌握了一些情况，但想先听你说。\n\n然后他打开档案袋，抽出第一页，那上面是你表弟的名字。\n","city":"江百市","min_rank":4,"max_rank":6,"weight":5,"once":true,"need":{"min_money":0,"max_money":0,"min_risk":20,"min_probe":0,"min_year":2,"flag":null,"no_flag":null,"min_merit":0,"min_boss":0,"min_net":0,"min_pop":0},"tags":["巡视","上级","家属"],"options":[{"label":"全部如实说明","text":"\n你说了两个小时，从第一笔两万，到最后一笔八百万，前前后后十一笔，时间、地点、经手人、钱的去向，你一件一件说。\n\n沈亦青一直没说话，只在你说到某一笔的时候，抬眼看了你一下。\n\n谈话结束时，年轻人说：今天谈的情况，我们会核实，你先回去，随叫随到。你走出那栋旧楼，外面的阳光很刺眼，你在台阶上站了很久，才发现自己出了一身汗。\n","effects":{"risk":-10,"merit":-5,"boss":-4,"net":-6,"health":-6,"stress":25,"family":-8,"probe":-10,"clean":12},"flag":"reformed","unflag":null,"ending":null,"next":null},{"label":"只认小的，瞒大的","text":"\n你承认了三笔小的：两万、三千、十二万，加起来不到十五万。你说：就这些，其余是误会。\n\n沈亦青终于开口了，问了一句：表弟名下的那套白鹭洲，首付款从哪来的？\n\n你说是借的。他又问：借条呢？你说在家里。他说：那我们明天去你家拿。\n\n那天晚上你一夜没睡，第二天早上七点，你把车开到了纪检组楼下——但你在车里坐了两个小时，最后还是开走了。\n","effects":{"risk":12,"probe":14,"health":-4,"stress":26,"clean":-12},"flag":"inspected","unflag":null,"ending":null,"next":null},{"label":"一问三不知，要求核实","text":"\n你说：这些情况我不掌握，请组织核实。这句话你重复了二十六遍，重复到记录员都写得手酸。\n\n两小时四十分钟，笔录只有三页。\n\n年轻人最后说：今天的谈话到此为止。他的语气很客气，客气得像在送客。\n\n你走出楼门的时候觉得赢了。但你没有注意到，沈亦青在你身后说了一句：这个人，不能再谈话了，走程序吧。走程序的意思是：他们不再需要你开口。\n","effects":{"risk":16,"probe":20,"net":-3,"stress":24,"clean":-15},"flag":"inspected","unflag":null,"ending":null,"next":null},{"label":"当场认一部分并退赃","text":"\n你打断他们：等一下，我要主动交代。\n\n你当场写了三页纸，交代了六笔，共一千零六十万，并当场打电话让妻子把家里能动的钱全部转到指定账户。三天内退缴了八百二十万。\n\n沈亦青送你去楼梯口，第一次叫了你的名字，只说了一句：你还来得及。\n\n从宽处理的建议写进了报告。你在半年后被降职，从副处降到了正科。降职那天，你在办公室收拾东西，发现抽屉里还留着刚来江百时那张退卡收条的复印件。\n","effects":{"money":-820,"risk":-18,"merit":-8,"boss":-5,"net":-6,"health":-8,"stress":28,"family":-10,"probe":-16,"clean":18},"flag":"reformed","unflag":"took_first_bribe","ending":null,"next":null}]},{"id":"hd_001","title":"走廊尽头那盏坏灯","text":"\n景元七年三月，你拎着一只人造革提包到铁西区政府办公楼报到。四楼走廊尽头有一盏灯坏了两年，没人报修——报修要走流程，流程要填单子，单子要三个人签字。\n政工科的甘秉文替你填完十三张表。他五十三岁，一级主任科员，抽屉里常年备着三样东西：印泥、回形针、速效救心丸。他告诉你三条：其一，河冬市规矩多，信息公开考核连续四年全省第一，你写的每一个字将来都可能被人调出来看；其二，工资条上的数字是死的，别指望别的；其三，别在走廊尽头那间屋门口停下，那是派驻纪检组，组长桑岐的眼睛比灯亮。\n中午你在机关食堂吃一碗四块五的炸酱面，隔壁桌两个人正争机床三厂安置方案里\"连续工龄\"该怎么算。下午，办公室主任把一份信访件推到你面前：北苑棚户区十七户联名反映，拆迁过渡费拖了七个月没发。纸边有油渍，像被人反复捏过。他说，按程序，你们科先拟办意见。\n","city":"河冬市","min_rank":1,"max_rank":2,"weight":5,"once":true,"need":{},"tags":["信访","人事"],"options":[{"label":"逐户核实，写清责任","text":"\n你花了四天，把十七户跑了十一户。机床三厂下岗的邵振山左手少了两根手指，他把七个月的过渡费单据按月份排好，用磁铁吸在铁皮门上。你核出责任卡在区财政与拆迁办之间的一份会签上：谁都签了\"拟同意\"，谁都没写日期。\n办件意见你写了整整三页，附一张责任链条图。甘秉文看完，把速效救心丸往桌上一放，说：你这样写，会得罪人。但半个月后，过渡费补发了，十七户凑了一面锦旗送到政务服务中心，被桑岐以\"不得悬挂\"为由收进库房。你的名字第一次出现在市里的《政务通报》上。\n","effects":{"money":0,"risk":-2,"merit":6,"pop":6,"boss":3,"net":1,"stress":3,"clean":3,"probe":0}},{"label":"拟个\"转请研处\"了事","text":"\n你照着旧例拟了八个字：\"转请相关单位研处。\"甘秉文盖了章，说这八个字是河冬市官场的保险柜——既不办错，也不办事。\n信访件在系统里流转了三轮，最后回到你手里，因为你是拟办人。邵振山来过两趟，第三次他没进门，站在院子里看那盏坏掉的灯。年底考核，你们科室\"办结率\"百分之百，\"满意率\"百分之三十一。没人追究，也没人记得。\n","effects":{"money":0,"risk":1,"merit":1,"pop":-2,"boss":0,"net":1,"stress":-2,"clean":-1}},{"label":"收下那张购物卡，压两天","text":"\n拆迁办副主任曲长发在食堂门口拦住你，塞过来一张超市购物卡，面值两千，还带着塑封的毛边。他说：小兄弟，压两天，我们正在协调，别让件在系统里跑起来，一跑就留痕。\n你把件在自己抽屉里放了两天。第三天系统自动预警\"超期未办\"，黄灯亮在你名下，全科室都能看见。曲长发第二天就把卡要回去了，说这玩意儿现在太扎眼。钱没落着，黄灯在你名下亮了整整半年。\n","effects":{"money":1,"risk":4,"merit":-1,"pop":-3,"boss":-1,"net":2,"stress":4,"clean":-4,"probe":1}},{"label":"把联名原件弄丢一份","text":"\n你按曲长发的暗示，把十七户的联名原件\"不慎\"混进待销毁的纸堆，只留了复印件，然后通知他们重新签字。邵振山那几户住在六十公里外的铸钢厂宿舍，赶不来。重新收上来的联名只剩九户，户数不够，件被退回补充材料。\n你以为自己很聪明。直到半年后，桑岐在廉政教育会上讲了一个案例：某单位干部遗失信访原件，被定为\"故意销毁证据\"。他没点名，但讲的时候看了你一眼。你的后背湿透了。\n","effects":{"money":3,"risk":8,"merit":-2,"pop":-6,"boss":-2,"net":1,"stress":6,"clean":-8,"probe":3}}]},{"id":"hd_002","title":"纪要改了十一遍","text":"\n铁西区要开机床三厂改制动员会，会议纪要归你写。你写了十一遍。\n第一遍，甘秉文划掉\"妥善安置\"，说这四个字没有主语，将来谁都能推。第二遍，划掉\"原则上\"，说原则上就是不办。第五遍，分管副区长骆先志在\"给予适当补偿\"后面加了一个括弧：\"补偿标准以区财政核定数为准\"。第八遍，桑岐在页边批了一行字：本纪要全文主动公开，请按公开稿标准写。\n第十一遍，你把全文从四千字压到一千二百字，每一个数字都标了出处。骆先志看完只说了一句：这稿子，将来查起来，我们谁都跑不掉，也谁都冤枉不了。\n下班前，鑫岳机械的老板段其昌在楼下等你，手里拎着一盒茶叶。他笑着说：纪要里那句\"优先录用原厂职工\"，能不能加个\"同等条件下\"？\n","city":"河冬市","min_rank":1,"max_rank":2,"weight":4,"once":true,"need":{},"tags":["人事","招商"],"options":[{"label":"一个字都不加","text":"\n你说纪要已经会签完毕，改一个字就要重新走流程、重新留痕。段其昌笑着把茶叶放在传达室，说：河冬市的人，真不好说话。\n三年后机床三厂安置收尾，一千一百三十七名下岗职工中，八百二十人重新上岗。审计报告里专门有一段写\"安置政策执行到位\"。那一年你在全区大会上念这份报告，念到\"八百二十\"时台下有人鼓掌。骆先志在主席台上，端着茶杯，没看你。\n","effects":{"money":0,"risk":-2,"merit":7,"pop":7,"boss":4,"net":0,"stress":3,"clean":3}},{"label":"加上\"同等条件下\"","text":"\n你加了六个字。六个字，让\"优先录用\"变成了一句废话——谁都可以在\"同等条件\"上做文章。段其昌的新公司后来招了三百人，其中原厂职工四十一人，都是三十五岁以下。\n茶叶你没拿，但段其昌记了你的人情。三个月后他托人给你带话：以后有事，说话。你在通讯录里存下他的号码，备注是\"鑫岳 段\"。\n","effects":{"money":2,"risk":3,"merit":2,"pop":-3,"boss":1,"net":4,"stress":1,"clean":-4}},{"label":"拿茶叶，加一句话","text":"\n你收了茶叶，回家打开发现盒子里除了茶叶还有两沓现金，四万。你一宿没睡，第二天把现金退了回去，只留下了茶叶。段其昌说：你这人，进退都有分寸，将来能上去。\n六个字你还是加了。后来审计抽查时，这六个字被红笔圈出来问过一次，你说这是会上集体研究的表述。会纪要上有骆先志的签字，问题就停在你这一层。\n","effects":{"money":2,"risk":5,"merit":1,"pop":-4,"boss":0,"net":5,"stress":5,"clean":-6,"family":-2}},{"label":"反向加码，写实责任","text":"\n你不但没加\"同等条件下\"，反而在纪要后附了一张《原厂职工录用比例承诺书》模板，要求新公司按季度报送录用台账，并向社会公开。\n段其昌当场变了脸色，说你这年轻人不懂人情。骆先志却把这份模板要了去，在全区改制企业推开。半年后，模板被省里收录进《改制工作指引》，你的名字排在注释栏里，小五号字。\n甘秉文说：小五号字，也是字。\n","effects":{"money":0,"risk":-3,"merit":9,"pop":8,"boss":5,"net":-1,"stress":4,"clean":4,"probe":-1}}]},{"id":"hd_003","title":"第三排座次","text":"\n全市老工业基地转型推进会在河冬宾馆三楼开。会务归你管，座次牌归你摆。\n常务副市长施存矩有个著名的规矩：座次表必须提前一天报他办公室，他要亲自核对。他的秘书说，施市长看座次表的时间，比看项目报告的时间长。有人说这是讲究程序，也有人说这是洁癖。\n开会前一小时，你发现两个问题：一是机床三厂老厂长焦长顺的名字排在第三排，按职务他该在第二排；二是新引进的鑫岳机械董事长被排到了企业席末位，而这家企业今年纳税排名全市第七。\n焦长顺已经坐在第三排了，他穿了一件洗得发白的中山装，胸前别着\"劳动模范\"的纪念章。段其昌站在会场门口，笑着看你手里的座次表。\n","city":"河冬市","min_rank":1,"max_rank":3,"weight":4,"once":true,"need":{},"tags":["人事","同僚"],"options":[{"label":"严格按职务排序","text":"\n你按职务序列重排，把焦长顺请到第二排。老厂长愣了一下，用手摸了摸那枚纪念章，坐得笔直。段其昌仍在企业席末位，全程低头看手机。\n施存矩最后核对时只说了一句：这个表，是对的。会后焦长顺在门口等你，塞给你一枚机床三厂建厂时的纪念徽章，说：小伙子，我在这张表上，被排错过十九年。\n","effects":{"money":0,"risk":-1,"merit":6,"pop":5,"boss":5,"net":2,"stress":2,"clean":3}},{"label":"给段其昌挪到前排","text":"\n你把鑫岳机械的席位挪到企业席第一排，理由是纳税排名。会务变更在系统里留了痕，三个人手机上弹出提示。\n段其昌在会上发了言，说要在铁西追加投资。施存矩打断他一次：纳税排名不是座次依据，下不为例。这句话被写进会议纪要，两年后成了别人质疑你\"重商轻工\"的引文。\n","effects":{"money":3,"risk":4,"merit":3,"pop":-2,"boss":-2,"net":5,"stress":3,"clean":-4}},{"label":"两边都不得罪","text":"\n你把焦长顺留在第三排，但加了一张\"特邀劳模\"的桌牌放在第一排侧位；把段其昌挪到企业席第二排。会务系统里，这两处变更走了\"临时调整\"流程，签的是你的名字。\n两人都没说什么。半个月后，市里通报会务规范化检查情况，你们单位因\"临时调整未提前报备\"被点名，扣分。扣分通报在网上公开，你母亲在老家看到了，打电话问你是不是犯了错误。\n","effects":{"money":1,"risk":2,"merit":2,"pop":0,"boss":0,"net":3,"stress":4,"clean":-2,"family":-1}},{"label":"把难题推给办公室","text":"\n你把座次表原样上报，附一句\"请领导审定\"。施存矩的秘书十分钟后回电话：你自己的职责，自己定。\n会还是开了，什么都没发生，什么都没改变。焦长顺在第三排坐了三小时，段其昌中途离场。你学会了河冬市最流行的四个字：报请审定。这四个字后来救过你，也坑过你。\n","effects":{"money":0,"risk":1,"merit":0,"pop":-1,"boss":-1,"net":0,"stress":-2,"clean":-1}}]},{"id":"hd_004","title":"一份信息公开申请","text":"\n政务服务中心转来一份信息公开申请。申请人是铸钢厂宿舍的退休工人，姓祁，七十一岁，要公开机床三厂改制时的资产评估报告全文，共四百三十七页。\n按《信息公开条例》，这份报告属于主动公开范围，但当年只公开了摘要。法务科的意见是：可以公开，但要脱敏。审计局的意见是：全文里有十二处数据口径与后来审计认定的口径不一致，公开会引起\"误解\"。\n甘秉文把申请单递给你时说了一句意味深长的话：在河冬市，公开是常态，不公开是例外。可例外这两个字，往往要活人去扛。\n法务科、审计局、改制办，三个章等着你去找。祁师傅本人坐在政务服务中心一楼的长椅上，等了两天。\n","city":"河冬市","min_rank":1,"max_rank":3,"weight":4,"once":true,"need":{},"tags":["信访","审计"],"options":[{"label":"全文公开，附口径说明","text":"\n你顶着审计局的压力全文公开，并附了一份三千字的《数据口径差异说明》，把十二处不一致逐条解释清楚。审计报告里的数字、评估报告里的数字、现在的数字，三列并排。\n网上骂了三天，第四天安静了。省里把这份《说明》转发全省，标题叫\"河冬市以公开促规范\"。祁师傅把打印出来的四百三十七页抱回家，说要一张一张贴在他的旧工具箱上。\n","effects":{"money":0,"risk":-4,"merit":10,"pop":9,"boss":6,"net":0,"stress":6,"clean":4,"probe":-2}},{"label":"只公开摘要，走脱敏","text":"\n你按法务科意见脱敏公开，删掉一百二十页。祁师傅申请行政复议，市法制办受理，你们单位败诉，被责令重新公开。\n败诉决定书在网上挂了三十天。你在全系统通报里被点名\"公开意识不强\"。桑岐找你谈话，只问了一句：你怕什么？你答不上来。\n","effects":{"money":0,"risk":3,"merit":-2,"pop":-4,"boss":-2,"net":0,"stress":5,"clean":-2,"probe":2}},{"label":"私下给祁师傅看原件","text":"\n你约祁师傅到档案室，把原件给他看了两个小时，不许拍照、不许外传，签了一份查阅登记。登记簿上你的名字在\"经办人\"一栏。\n他看完说：我懂了，机器当年确实不值那个钱。他撤回申请。可查阅登记簿是永久档案，五年后巡视组调阅时，问你为什么单独安排查阅。你解释不清\"善意\"和\"违规\"之间的距离。\n","effects":{"money":0,"risk":5,"merit":3,"pop":4,"boss":0,"net":1,"stress":5,"clean":-3,"probe":3}},{"label":"拖到法定期限最后一天","text":"\n你没有拒绝，也没有办理，把申请压到法定期限的最后一天才答复：\"需延期十五个工作日。\"\n祁师傅第三次来的时候带了铺盖。政务服务中心的一位年轻科员卜宪拍了照片发到内部工作群，被桑岐截屏。年底效能考核，你们科室倒数第一，你写了三千字检讨。\n","effects":{"money":0,"risk":2,"merit":-3,"pop":-5,"boss":-3,"net":0,"stress":3,"clean":-2,"probe":1}}]},{"id":"hd_005","title":"过渡费那七个月","text":"\n北苑棚户区改造进入第二年。七个月没发出的过渡费，终于补发了，但还差两户：一户是邵振山，一户是孤儿寡母的宋家。\n原因是\"产权存在争议\"。邵振山那间十四平米的平房，是他父亲一九七一年进厂时分的两间半中的一间，厂子改了六次名，房契上有三个单位的公章。宋家的房子更麻烦：丈夫死在铸钢厂事故里，房子登记在死者名下，没有继承公证。\n拆迁办主任曲长发说：这两户，谁碰谁倒霉，建议走\"司法途径\"。司法途径走完，最快十八个月。\n邵振山在信访大厅坐了一整天，不吵不闹，只重复一句：我不是要钱，我要一个说法。宋家的女人抱着孩子，孩子发着烧。\n","city":"河冬市","min_rank":2,"max_rank":3,"weight":4,"once":true,"need":{},"tags":["信访","城建","维稳"],"options":[{"label":"牵头开联席会，特事特办","text":"\n你把房管、法制、公证、拆迁办、街道五家请到一间屋里，开了六个小时。公证处当场受理继承公证，费用从区里的困难群众救助金里垫；邵振山的房契由档案馆出具《权属沿革证明》替代。\n两户在第十一天拿到钱。桑岐全程列席，一句没说，散会时在白板上写了两个字：留痕。后来这五家联席机制被写进区里制度，叫\"疑难产权联合会商\"。\n","effects":{"money":0,"risk":-3,"merit":9,"pop":10,"boss":5,"net":3,"stress":6,"clean":4,"probe":-1}},{"label":"先垫付，后补手续","text":"\n你从街道的应急资金里挪了六万，先给两户垫上，让他们签了《先行垫付协议》。宋家孩子住了院，邵振山拿着钱先给老母亲买了药。\n应急资金的使用要报备，你补了手续，但审计时这笔钱被认定为\"改变资金用途\"。虽然最后没处分，通报里有你。甘秉文说：办了好事，犯了规矩，这是最亏的一种。\n","effects":{"money":0,"risk":3,"merit":5,"pop":8,"boss":1,"net":2,"stress":6,"clean":0,"probe":1}},{"label":"按程序，走司法途径","text":"\n你把件转走，建议走司法途径。十一个月后，法院确认了宋家的继承权；邵振山的房契问题又多花了七个月。\n两户拿到了钱，一分不少，甚至多了利息。宋家的孩子落下了病根，邵振山的母亲在第九个月去世。你在结案报告上写：依法依规，程序完备。写完自己看了三遍，把\"完备\"两个字删了。\n","effects":{"money":0,"risk":-1,"merit":2,"pop":-4,"boss":2,"net":0,"stress":2,"clean":0}},{"label":"让曲长发去处理，收好处","text":"\n你把两户的件转给曲长发，并在电话里暗示他\"灵活一点\"。三天后，曲长发送来一个信封，五万，说是\"协调费\"。两户在两周内拿到钱，签了《自愿放弃部分补偿承诺书》，宋家少拿了四万二。\n邵振山签完字，看了你很久，什么也没说。这笔账记在审计局的疑点台账上，编号 039。台账是会滚动清理的，但从来不会消失。\n","effects":{"money":5,"risk":6,"merit":1,"pop":-6,"boss":0,"net":4,"stress":5,"clean":-8,"probe":3}}]},{"id":"hd_006","title":"三百八十一块的一顿饭","text":"\n段其昌请吃饭，地点在老运河边一家叫\"船厂食堂\"的小馆子，主打菜是铁锅炖鱼。\n他说得很随意：改制后新公司要上一个技改项目，需不需要环评、能评、能评是啥我都不懂，就想找个人问问。桌上还有两个人：区工信局的副科长，和一位自称\"省城来的专家\"。\n菜上了六道，鱼是野生的，酒是本地的。段其昌买单，三百八十一块。他掏钱的时候说了一句：河冬市的饭，真便宜。\n结账后，服务员递上一个纸袋，说\"老板落下的\"。你在厕所打开看了一眼：两条烟，一条是本地产的\"北苑\"，一条是外省的好烟。外面下着雨，老运河的水面上漂着一层油花。\n","city":"河冬市","min_rank":1,"max_rank":3,"weight":5,"once":true,"need":{},"tags":["招商","酒局"],"options":[{"label":"AA制，烟退回去","text":"\n你当场掏出一百二十七块放在桌上，说河冬市有规定，与管理服务对象吃饭要自付费用并报备。你把纸袋放回包厢，第二天在单位填了《人际交往事项报告表》。\n工信局那位副科长后来再没叫过你吃饭。段其昌却在三年后的一次项目评审会上说：这人我信得过，他从没占过我一分钱便宜。这句话，比一百二十七块值钱得多。\n","effects":{"money":0,"risk":-3,"merit":6,"pop":5,"boss":4,"net":1,"stress":2,"clean":4,"probe":-2}},{"label":"饭吃了，烟留下","text":"\n你付了自己的那一份，但把烟留下了——两条烟，市价一千二。你安慰自己，这不是钱，是烟。\n一个月后你才知道，那条外省好烟里夹着一张卡。卡你没用，塞在办公室抽屉的《规章制度汇编》里。两年后桑岐带队抽查办公用房和抽屉，问你这卡哪来的。你说：烟里夹的，我没用。他说：没用也是收了。\n","effects":{"money":1,"risk":5,"merit":1,"pop":-1,"boss":0,"net":3,"stress":5,"clean":-6,"probe":2}},{"label":"全收，以后好说话","text":"\n你把纸袋拎回了家。妻子苏蕙拆开，看见烟，又看见烟盒里的两万现金，问了一句：这是什么？你说：人情。\n她把钱收进衣柜最底层，从此再没提过。段其昌的技改项目后来一路绿灯，环评、能评、备案，七个工作日办完，创了纪录。纪录被登在《河冬日报》上，标题是：铁西速度。\n","effects":{"money":2,"risk":6,"merit":3,"pop":-3,"boss":1,"net":6,"stress":5,"clean":-8,"family":-3,"probe":3},"flag":"took_first_bribe"},{"label":"不去，把饭局报备","text":"\n你没去，改为在他办公室谈，全程开着门，两位同事在隔壁。谈完你把谈话内容记进工作台账，报给纪检组备案。\n段其昌有点下不来台，说你这人太\"端\"。可半年后，省里通报一起\"饭局腐败\"典型案例，同席的工信局那位副科长被诫勉谈话。你在通报里看到了\"船厂食堂\"四个字，手心出汗。\n","effects":{"money":0,"risk":-4,"merit":4,"pop":3,"boss":3,"net":-2,"stress":1,"clean":4,"probe":-2}}]},{"id":"hd_007","title":"留痕系统上线","text":"\n景元八年，全市上线\"政务留痕系统\"。所有审批、会签、电话交办、现场勘查，必须当日录入，系统自动留时间戳，任何人不得补录超过三日的内容。\n上线第一天，全楼炸了锅。有人发现，自己去年口头答应过的一件事，现在无处可藏；有人发现，自己从来没在电脑上留下过任何东西，等于从没干过活。\n甘秉文把你叫进档案室，反锁门，从抽屉里摸出一本手写台账。他说：系统好，但有些话不能进系统。比如领导口头交办的事，你录进去，是把领导架在火上；不录，将来出事是你一个人扛。他教了你四句\"安全表述\"：拟同意、按程序办理、请相关单位研处、另行专题研究。\n当天下午，系统里弹出第一条黄色预警：你名下有一件超过三日未录入。\n","city":"河冬市","min_rank":2,"max_rank":3,"weight":4,"once":true,"need":{},"tags":["审计","同僚"],"options":[{"label":"全录，包括口头交办","text":"\n你把每一条口头交办都原样录入，包括\"某领导电话要求加快\"这类内容。三个月内，全楼有九个人因为\"违规干预审批\"被系统预警，其中一个是分管副区长。\n你被孤立了整整半年，没人请你吃饭，开会没人坐你旁边。第八个月，施存矩在一次会上说：留痕不是给谁难堪，是保护所有人。此后规矩立住，你成了\"制度派\"的代表。\n","effects":{"money":0,"risk":-4,"merit":8,"pop":6,"boss":6,"net":-3,"stress":8,"clean":5,"probe":-3}},{"label":"用四句安全表述","text":"\n你学会了那四句话。系统里你的记录干净、漂亮、毫无破绽，也毫无内容。年底考核，你是全楼\"录入及时率\"第一名。\n三年后，一件旧事被翻出来：某项目审批时你只写了\"按程序办理\"，而正是这个\"程序\"出了纰漏。调查组问你当时有没有人打招呼，你说不记得了。他们说：系统里也没有。这既是你的护身符，也是你的墓志铭。\n","effects":{"money":0,"risk":1,"merit":3,"pop":0,"boss":2,"net":3,"stress":2,"clean":-2}},{"label":"帮领导代录，留自己名","text":"\n你替分管领导补录了十七条交办意见，全部落在自己的账号下。系统里，这些\"主动作为\"的记录成了你的功劳，也让领导对你另眼相看。\n半年后其中一条补录被抽查发现时间戳异常，你被诫勉。领导在会上说：这是个人行为，与组织无关。你第一次明白，代签字这种事，签字的人和风险是绑在一起的，功劳不是。\n","effects":{"money":2,"risk":6,"merit":2,"pop":-1,"boss":4,"net":4,"stress":6,"clean":-6,"probe":3}},{"label":"建一本私人台账","text":"\n你学甘秉文，用牛皮纸本子记了一本私人台账：谁、什么时候、交代了什么、有没有书面依据。本子锁在抽屉里，钥匙挂在身上。\n这本台账后来救了你两次，也差点害了你一次——第二次被调查时，调查组问：你既然记了，为什么当时不报告？你答：我以为记下来就够了。他们说：记下来是记仇，不是守规矩。\n","effects":{"money":0,"risk":2,"merit":2,"pop":0,"boss":1,"net":2,"stress":5,"clean":-2,"probe":1}}]},{"id":"hd_008","title":"审计局那个年轻人","text":"\n审计局企业审计科副科长阚思齐来对接机床三厂改制专项审计。她三十二岁，背一个旧帆布包，包上别着一枚\"铁西子弟\"的校徽——她父亲是铸钢厂的炉前工，工伤退的。\n她在你们会议室坐了三天，翻了两千一百份凭证。第三天下午，她抽出一张发票放在桌上：一张两万八千元的\"咨询服务费\"，开票方是\"河冬市正平企业管理咨询公司\"，开票日期是改制方案公示后的第三天。\n她说：这家公司注册在北苑棚户区的一间民房里，法人叫郝有粮，我查了，他同时在四家公司的监事名单上。这张发票的编号，和另外三张连号。\n她看着你，等你说话。窗外的雪下起来了，铁西的冬天来得早。\n","city":"河冬市","min_rank":2,"max_rank":3,"weight":5,"once":true,"need":{},"tags":["审计","工程"],"options":[{"label":"全力配合，查到底","text":"\n你调出全部合同和验收材料，陪她跑了七个部门。三天后查明：所谓咨询服务根本没有成果文件，两万八千元最终流向段其昌公司一名副总的个人账户。案子移送纪检组，两人被立案，钱被追回。\n阚思齐撤场那天，把那枚校徽摘下来放在你桌上，说：我爸说，铁西的机器停了，人不能停。这条线后来成了你最硬的护身符——审计局的人，从此认你的账。\n","effects":{"money":0,"risk":-4,"merit":10,"pop":7,"boss":6,"net":4,"stress":5,"clean":5,"probe":-3}},{"label":"请她高抬贵手","text":"\n你托人请阚思齐吃饭，被拒绝。你又托她的老领导梅寿山带话，说这张票是历史遗留，追下去影响改制大局。\n她把带话的内容原原本本记进了审计工作底稿，附在报告附件里。梅寿山把这件事告诉了桑岐。桑岐找你谈话，第一句是：你觉得审计局是你们家的？这件事在你档案里留了一个\"干预审计\"的注脚。\n","effects":{"money":3,"risk":7,"merit":0,"pop":-3,"boss":-2,"net":2,"stress":6,"clean":-7,"probe":5}},{"label":"补一份成果文件了事","text":"\n你让改制办连夜补了一份《咨询服务成果报告》，落款日期倒签到公示后第三天。阚思齐看了一眼纸的墨色和打印机型号，什么都没说，在底稿上写：\"成果文件系事后补充，日期倒签。\"\n审计报告的措辞很克制，但那行字留了下来。四年后巡视组翻开这份底稿，第一句就问：这个\"事后补充\"，是谁安排补的？\n","effects":{"money":4,"risk":6,"merit":1,"pop":-2,"boss":0,"net":3,"stress":5,"clean":-8,"probe":4}},{"label":"装不知道，只走流程","text":"\n你按程序出具了《情况说明》：该笔支出经原改制办集体研究，票据合规。你把责任推给\"集体\"和\"历史\"。\n说明被采纳，那张发票没有被深挖。阚思齐撤场时只说了一句：你比我想的会写字。三年后，\"正平咨询\"在同省的另一起案子里被连根拔起，供出一份名单。你的名字不在名单上，你的《情况说明》在卷宗里。\n","effects":{"money":2,"risk":5,"merit":2,"pop":-2,"boss":1,"net":2,"stress":4,"clean":-6,"probe":3}}]},{"id":"hd_009","title":"配件厂的资产评估","text":"\n河冬重工下属的第三配件厂要引入民营资本搞混改。厂子在铁西老工业区最深处，占地一百四十亩，账面净资产四千二百万，负债六千万，职工四百六十人，平均年龄四十七岁。\n两家评估机构出的数差了一千一百万：一家按\"持续经营\"评估，一家按\"现状变现\"评估。差额的关键在那一百四十亩地——按工业用地是每平米四百六，按规划调整后的商住用地是每平米两千三。规划调整这个文件，在区政府的抽屉里，还没上会。\n段其昌的鑫岳机械是唯一的意向方。他报出的受让价，正好是低的那一个数。焦长顺在职工代表大会上被问到这个问题时，只说了一句：我不知道。他鬓角的白头发比去年多了一倍。\n苗根生，厂工会主席，把一沓职工签名按在你的办公桌上，说：我们不反对混改，我们要求评估公开。\n","city":"河冬市","min_rank":3,"max_rank":4,"weight":5,"once":true,"need":{},"tags":["工程","招商","人事"],"options":[{"label":"双评估公开，重新挂牌","text":"\n你把两份评估报告和规划调整草案全部挂上产权交易平台，公开挂牌四十天，引入第二家意向方——一家省城的产业基金。\n最终成交价比最初报价高出两千三百万，职工安置条款写进合同：三年内不得裁员超过百分之十，社保不得断缴。苗根生在签约当天哭了，他后来说：我这辈子第一次看见合同这么厚。\n省国资委把这次混改列为\"阳光改制\"样板。你的名字出现在经验材料的第二作者位置。\n","effects":{"money":0,"risk":-3,"merit":11,"pop":9,"boss":6,"net":2,"stress":7,"clean":4,"probe":-2}},{"label":"按低价成交，换职工安置","text":"\n你让段其昌按低价拿下，但把职工安置条款钉死：四百六十人一个不裁，工资三年不降，社保全额接续，另设三百万元的技能培训基金。\n合同签了。段其昌赚了大钱，但你保住了四百六十个饭碗。职工代表给你送了一面锦旗，上面写着\"心里有工人\"。桑岐看了一眼锦旗说：锦旗救不了你，合同能。\n后来审计认定，低价成交的程序虽然合规，但\"未充分询价\"写进了问题清单。\n","effects":{"money":5,"risk":4,"merit":7,"pop":8,"boss":2,"net":4,"stress":6,"clean":-3,"probe":2}},{"label":"拖一拖，等规划落地","text":"\n你把评估暂停，理由是\"规划条件待明确\"，等区里的规划调整方案上会通过再说。这一拖就是七个月。\n七个月后土地性质确定，评估价上去了两千八百万。段其昌气得摔了电话。但四百六十名工人多领了七个月的待岗工资，厂里两个老师傅在这七个月里病逝，家属拿到的抚恤金按在册职工算。\n工人们说你拖延，救了他们；段其昌说你拖延，坑了他。两句话都对。\n","effects":{"money":3,"risk":3,"merit":5,"pop":5,"boss":3,"net":1,"stress":5,"clean":-1}},{"label":"低价成交，自己拿一份","text":"\n你按低价让鑫岳机械进场，条件是段其昌以\"咨询顾问费\"名义，分三年给你四十八万，第一年十六万，打到你在外省开的一张卡上——那张卡是你大学同学的名字。\n合同签得漂亮，职工安置条款也写满了。可第一年的十六万到账那天，你在老运河边走了两个小时。河冬市的贪，是慢火：不是一夜暴富，是每年十几万，十年一百多万，够你一辈子睡不好。\n","effects":{"money":16,"risk":7,"merit":4,"pop":1,"boss":2,"net":7,"stress":8,"clean":-10,"family":-2,"probe":4},"flag":"took_first_bribe"}]},{"id":"hd_010","title":"焦厂长的侄子","text":"\n焦长顺第一次进你的办公室，是早上七点四十。他手里拎着一个网兜，里面是两个保温桶。\n他说他侄子在南方打工，厂子倒了，回来了，四十岁，会开叉车，还有个二级技师证。他说：我不求你安排个干部，就求一个岗位，能在新公司开叉车就行，一个月三千八也行。他把网兜放在你桌上，说这是他老伴蒸的馒头。\n你查了一下：新公司的招聘方案里，叉车工岗位六个，报名一百七十三人，要走统一考试和公示。你要是打一个电话，考试排名可以把人往前挪，也可以把名额从六改成七。\n苗根生后来跟你说了一句：老头子一辈子没求过人，这次是给他弟弟托孤。\n","city":"河冬市","min_rank":3,"max_rank":4,"weight":4,"once":true,"need":{},"tags":["人事","同僚"],"options":[{"label":"一个电话都不打","text":"\n你把馒头分给科室的人吃了，一个电话没打。焦长顺的侄子参加统一考试，考了第一百零九名，没录上。\n三个月后，你在铁西的劳务市场看见他在给别人搬货。他认出了你，点点头，说：叔，我叔让我谢谢你，说你没骗他。\n你后来把这个岗位信息公开的项目推到全区，招聘全程录像、成绩当场公布。有一年，全市因为这个制度少了一千三百个电话。也有人说你六亲不认。\n","effects":{"money":0,"risk":-4,"merit":9,"pop":7,"boss":5,"net":-2,"stress":5,"clean":5,"probe":-3}},{"label":"加一个名额，走公示","text":"\n你让新公司把叉车工岗位从六个加到七个，理由是\"产能扩建需要\"。名额公开，程序照走，排名靠前的人自然录用。焦长顺的侄子考了第一百零九名，依然没录上。\n老厂长第二次来送馒头，说：算了，我不该开这个口。他走的时候，背比来的时候驼。\n你没有违规，但你也没有帮他。在河冬市，这种\"干净的失败\"每天发生几千次。\n","effects":{"money":0,"risk":0,"merit":3,"pop":2,"boss":2,"net":1,"stress":3,"clean":1}},{"label":"打一个电话，安排进去","text":"\n你给新公司的人力部长打了一个电话，说：老焦家的情况你了解，照顾一下，程序上别留话柄。\n十五天后，焦长顺的侄子以\"特殊技能人才\"名义入职，程序上补了一份《紧缺岗位说明》。工资三千八，开叉车。\n老厂长提着两瓶酒来谢你，你没收。三个月后，这份《紧缺岗位说明》被人复印了一份，寄到了纪检组。信里只有一句话：请查一查，第七个名额是谁加的。\n","effects":{"money":3,"risk":6,"merit":2,"pop":0,"boss":1,"net":6,"stress":5,"clean":-6,"probe":4}},{"label":"自己掏钱帮他过渡","text":"\n你没打招呼，但把焦长顺的侄子介绍到了区里另一家物流园，那家是公开招工，工资三千二。你自己掏了三个月的生活补助，一共六千块，让苏蕙送去，说是\"工会困难补助\"。\n苏蕙说：你一个月工资才多少。孩子下学期学费还没着落。\n焦长顺直到退休都不知道这六千块的来历。他只知道，你每周三下午会去老厂区转一圈，跟人聊天。\n","effects":{"money":-1,"risk":-2,"merit":5,"pop":6,"boss":2,"net":3,"stress":4,"family":-2,"clean":3}}]},{"id":"hd_011","title":"晚一天挂网","text":"\n铁西老工业区地下管网改造工程，三千二百万，全流程电子招标，从挂网到开标三十天。\n招标代理公司的老总甄有利在停车场拦住你。他说得很简单：晚一天挂网，就一天。\n你不明白一天值多少钱。他给你算：他的客户在省城，标书要从省城做，做完要盖章，盖章要法人签字，法人在外地。今天挂网，他来不及；明天挂网，他刚好赶得上。就这么一天。\n他说：不让你改评分办法，不让你泄露标底，不让你打招呼。就一天。他还说，河冬市最好的地方就是这儿——你们不收钱，你们收人情。\n系统上，挂网时间是你填的。系统不允许改，但允许\"因故顺延\"，顺延需要你写理由，理由会在网上公示。\n","city":"河冬市","min_rank":3,"max_rank":4,"weight":5,"once":true,"need":{},"tags":["工程","城建"],"options":[{"label":"一天也不顺延","text":"\n你按时挂网。甄有利的客户果然没赶上，弃标。中标的是一家本地企业，报价低了两百一十万。\n甄有利在电话里笑：你这个人，真是滴水不漏。挂断前他说：滴水不漏的人，在河冬市能升，但在别的地方活不了。\n两年后，本地那家企业承建的老运河南路管网，在大汛里没塌。塌的是隔壁区一段，那是另一批人的工程。\n","effects":{"money":0,"risk":-3,"merit":8,"pop":6,"boss":5,"net":-1,"stress":3,"clean":4,"probe":-2}},{"label":"顺延一天，写清理由","text":"\n你以\"招标文件补充说明需要澄清\"为由顺延一天，理由在网上公示了三十天。甄有利的客户赶上了，参加了投标，最后没中标——报价太高。\n公示期间有人打电话问为什么顺延，政务服务中心的卜宪接的电话，他调出了全部记录，答得滴水不漏。\n你以为这事过去了。一年后审计抽查招标项目，这份\"顺延\"被列为\"异常情形\"，虽然结论是\"程序合规\"，但材料归档永远多了一页。\n","effects":{"money":2,"risk":4,"merit":2,"pop":-1,"boss":0,"net":4,"stress":3,"clean":-5,"probe":2}},{"label":"顺延三天，收十二万","text":"\n你顺延了三天，理由是\"系统故障\"。三天后，甄有利的客户中标，报价只比次低标低了四万三。\n中秋节前，一个陌生号码给你发了个地址——铁西一家健身房的三号储物柜。你打开，里面是一个档案袋，十二万现金，全是旧票子。\n你把钱带回家，藏在书房的地板下。苏蕙问你怎么最近总锁书房，你说：我在写材料。\n","effects":{"money":12,"risk":7,"merit":2,"pop":-3,"boss":1,"net":6,"stress":7,"family":-3,"clean":-9,"probe":4},"flag":"took_first_bribe"},{"label":"举报他，把事做绝","text":"\n你没有顺延，同时把甄有利在停车场的谈话录音——你手机一直在兜里录着——报给了纪检组和公共资源交易中心。\n甄有利被列入不良行为记录，一年内不得进入河冬市公共资源交易市场。他在电话里骂了十分钟。\n半年后，市里通报：甄有利代理的七个项目存在串标嫌疑，移交治安总署。通报里没提你的名字，但全市招标代理圈子都知道，河冬市有个不好说话的年轻人。\n","effects":{"money":0,"risk":-4,"merit":10,"pop":5,"boss":6,"net":-4,"stress":7,"clean":6,"probe":-4}}]},{"id":"hd_012","title":"一个资质，十三条标准","text":"\n区里要组建\"政府投资工程预选承包商名录\"，说白了就是一张准入名单。上名录，能接三千万以下的政府工程；不上，只能给上名录的做分包。\n申请一百四十七家，名额四十个。评分标准十三条，全部量化：注册资本、纳税额、安全生产记录、社保缴纳人数、竣工面积、质量事故、劳资纠纷、信用评级……每一条都能打分，每一分都对应一份证明材料。\n问题在于：第十四条。前三名之外，评审委员会有十个\"酌情加分\"。这十个名额，是留给\"综合考虑企业贡献和本地化程度\"的。\n一家叫\"河冬宏基建设\"的公司排第四十三名，差零点八分。老板是本地人，姓奚，在铁西做了二十年。他来找你的时候，带来一份材料：他们公司有二百一十六名工人，其中一百四十人是机床三厂的下岗职工。\n","city":"河冬市","min_rank":3,"max_rank":4,"weight":4,"once":true,"need":{},"tags":["工程","人事"],"options":[{"label":"废除第十四条","text":"\n你起草了一份《关于取消酌情加分项的请示》，理由是\"自由裁量空间过大，与全流程电子化改革精神不符\"。请示在会上吵了两个小时，最后施存矩拍板：取消。\n宏基建设最终以第四十三名落选。奚老板在电话里沉默了很久，说：我服。\n此后河冬市的名录评审再没有\"酌情\"二字。省里来调研时说：你们把最容易出问题的口子，自己缝上了。\n","effects":{"money":0,"risk":-4,"merit":10,"pop":7,"boss":6,"net":-2,"stress":6,"clean":5,"probe":-3}},{"label":"把第十四条改成硬指标","text":"\n你把\"酌情加分\"改成可量化的三小条：吸纳本地下岗职工超过一百人的加二分、连续五年无劳资纠纷的加二分、在本市纳税满十年的加一分。\n宏基建设靠\"吸纳下岗职工一百四十人\"加了二分，以第四十一名挤进名录。奚老板送来一面锦旗。\n三年后，这三条硬指标被写进全省的指导意见。有人说你机灵，有人说你钻空子，但没人说你不干净。\n","effects":{"money":0,"risk":-1,"merit":8,"pop":8,"boss":4,"net":3,"stress":4,"clean":2}},{"label":"给一个酌情加分","text":"\n你在评审会上说了一句：宏基解决了我们一百四十个下岗职工，这个贡献，应该看得见。会纪要上，你的这句话被记了下来。\n十个酌情名额，宏基拿了一个。奚老板送了八万，用牛皮纸信封装着，说：这是给工人买年货的钱。\n你收了。年货确实买了，但发票开的是\"办公用品\"。这两张纸，一张在宏基的账上，一张在你们单位的账上，隔着一条街，将来会有人把它们对上。\n","effects":{"money":8,"risk":6,"merit":4,"pop":2,"boss":2,"net":6,"stress":6,"clean":-8,"probe":3},"flag":"took_first_bribe"},{"label":"把名额给排第四十名的","text":"\n你一个字没说，让评审按分数走。第四十名是一家外地企业，本地纳税记录为零，但它把标书做得完美无瑕。\n宏基落选，第二年裁了六十人。奚老板在老运河边喝多了，骂了半天，最后骂的是他自己：谁让我当年没给工人交社保。\n你看着那份完美的标书，忽然明白：制度筛掉的是不合格的人，也会筛掉别的东西。\n","effects":{"money":0,"risk":-2,"merit":5,"pop":-2,"boss":3,"net":0,"stress":3,"clean":2}}]},{"id":"hd_013","title":"开发区的税收返还","text":"\n开发区管委会招商局谈下一个项目：一家做风电轴承的民营企业，愿意把两条生产线放到铁西，投资三点二亿，达产后年税收四千万，用工三百二十人。\n对方开出的条件很平常：土地按基准价七折、厂房代建、前三年税收地方留成部分返还百分之六十。\n财政局算了一笔账：三年返还合计约五千四百万，而土地七折相当于让利一千八百万。加起来七千万，换三点二亿投资和三百二十个岗位。值不值，要看十年。\n问题是：这家企业的实际控制人，曾是段其昌公司的股东；而\"厂房代建\"这个活儿，按规矩要公开招标，但管委会有个惯例——代建方可以由企业推荐，理由是\"工艺适配\"。\n推荐名单上，写着一个名字：鑫岳建设。\n","city":"河冬市","min_rank":3,"max_rank":5,"weight":5,"once":true,"need":{},"tags":["招商","工程"],"options":[{"label":"代建也招标，返还设上限","text":"\n你砍掉了\"企业推荐代建方\"的惯例，改为带方案公开招标；税收返还上，把\"百分之六十\"改成\"以地方财力为上限、且以实际入库数为准\"，并加了一条：连续两年未达产，追回已返还资金。\n企业老板拍桌子，说你们河冬市的条件全省最硬。他最后还是签了。\n三年后，这家企业实际纳税五千一百万，超出预期；追回条款一次也没用过。你在招商总结会上说：我们不是让利，是算账。\n","effects":{"money":0,"risk":-2,"merit":11,"pop":8,"boss":6,"net":1,"stress":6,"clean":4,"probe":-2}},{"label":"照惯例办，签下来再说","text":"\n你签了。代建给了鑫岳建设，一点四亿的工程，利润按行规是百分之八到十二。税收返还照百分之六十写进协议。\n项目落地那天，剪彩，放炮，三百二十人进场。你在《河冬日报》的头版照片上笑得很开心。\n问题在第四年：企业产能只达到承诺的百分之六十一，税收返还却已经按协议付了四千二百万。财政局要追，法务说协议里没写\"未达产追回\"。你想起来了，那一款，是你自己删的。\n","effects":{"money":10,"risk":6,"merit":6,"pop":3,"boss":3,"net":6,"stress":6,"clean":-7,"probe":3}},{"label":"拖到下季度再议","text":"\n你把协议压了四十七天，理由是\"需报市法制办合法性审查\"。企业等不及，把其中一条生产线放到了邻省。\n最后签下来的只有一条线，投资一点四亿，用工一百四十人。招商指标没完成，开发区管委会在全市通报里排倒数第二。\n管委会主任在电梯里说：你守住了规矩，丢了三个亿。你没接话。三年后邻省那家企业出了安全事故，你才敢喘一口气。\n","effects":{"money":0,"risk":1,"merit":3,"pop":0,"boss":1,"net":-1,"stress":5,"clean":1}},{"label":"要干股，不入账","text":"\n你向企业提出一个\"变通\"：不给你现金，给你弟弟的公司一份\"市场顾问合同\"，三年一百二十万，按季支付。你弟弟开了家小广告公司，从没做过市场顾问。\n合同签了，钱按季到账。第一笔十万到账那天，你弟弟打电话问：哥，这钱我要交税吗？\n你说：交。你又补了一句：交了税，将来就说得清。但你知道，说不清的不是税，是那份合同从来没履行过——一份没履行的合同，是最难解释的东西。\n","effects":{"money":30,"risk":8,"merit":5,"pop":1,"boss":2,"net":8,"stress":9,"family":-4,"clean":-12,"probe":5},"flag":"took_first_bribe"}]},{"id":"hd_014","title":"工会主席的三个要求","text":"\n苗根生带着一份《职工安置方案职工方意见》来找你，三条要求，写在厂里打印室的旧纸上，纸边还有毛刺。\n第一条：工龄买断标准，按\"最后一年的实发工资\"算，不能按\"档案工资\"算——档案工资是九十年代的数，一千二；实发工资是三千九。这一条差出来的，是每个人两万六。\n第二条：内退人员的医保，要按\"退休人员\"标准缴纳到法定退休年龄，不能只缴五年。全厂内退二百一十人，这一条差七百多万。\n第三条：安置方案要经职工代表大会表决，表决要无记名，要现场公布票数。\n苗根生说：前两条你可以砍，第三条你砍了我就不走了。他坐在你的沙发上，脱了鞋，脚上是一双补过的袜子。\n","city":"河冬市","min_rank":3,"max_rank":5,"weight":4,"once":true,"need":{},"tags":["人事","信访"],"options":[{"label":"三条全保，写进方案","text":"\n你把三条全部写进方案，并在职工代表大会上亲自监督无记名表决。四百六十人，赞成四百三十一票。\n财政多掏了一千一百万。段其昌在签约前夜打电话骂了你四十分钟。第二天他还是签了。\n三年后，这批工人的上访率为零。省总工会来调研，苗根生把那份有毛边的意见书原件捐给了市档案馆，编号 07-13。档案馆的人说，这是他们收到的第一份职工文件。\n","effects":{"money":0,"risk":-3,"merit":10,"pop":11,"boss":5,"net":2,"stress":7,"clean":5,"probe":-2}},{"label":"保第三条，砍前两条","text":"\n你说服苗根生：钱的事没商量，但表决权这一条我给你钉死。最终方案里，工龄买断按档案工资与实发工资的中间值算，医保只缴八年。\n职工代表大会表决通过，赞成三百零二票。有人当场骂了娘。\n后来有二十七人上访，去了省城，被劝返。二十七人在名单上，每个人都有名字——河冬市的好处是，名单会留着；坏处也是。\n","effects":{"money":3,"risk":3,"merit":6,"pop":3,"boss":4,"net":3,"stress":5,"clean":-2,"probe":1}},{"label":"三条都砍，压住表决","text":"\n你砍掉全部三条，并把职代会改成\"职工代表团组长会议\"，人数从四百六十人变成三十一人，举手通过。\n安置方案当天通过，当晚就报了上去。苗根生当晚提交了辞职报告，工会的公章交到办公室，人再没露面。\n三年后，一百八十人联名上访，材料厚达七厘米，第一页就是那份被改掉的《职工方意见》。信访局的人说：这份材料写得比你们单位的报告还专业。\n","effects":{"money":15,"risk":8,"merit":3,"pop":-12,"boss":2,"net":4,"stress":8,"clean":-12,"probe":6},"flag":"accident"},{"label":"私下给苗根生塞钱封口","text":"\n你把五万块塞进苗根生的旧帆布包，说这是\"工会活动经费\"。他愣了三秒，把钱掏出来放在桌上，说：老苗这辈子就剩这点干净了，你别毁了它。\n他走了。第二天，这份方案还是被砍了两条，但不是你砍的——是会上集体研究的。你在纪要上签了字。\n苗根生退休后再没跟你说过话。五年后他在医院去世，消息是邵振山告诉你的。你去了殡仪馆，站在最后面。\n","effects":{"money":0,"risk":4,"merit":3,"pop":-5,"boss":1,"net":1,"stress":7,"clean":-5,"probe":2}}]},{"id":"hd_015","title":"博士带来的那套系统","text":"\n祁牧之，三十四岁，工学博士，从省里某研究院下来挂职，任区长助理，分管\"数字化转型\"。他背着一个双肩包，讲话时喜欢在白板上画框图。\n他提的方案很漂亮：把全区一百二十七项审批事项全部搬到网上，材料电子化，审批节点可视化，超时自动预警，办件数据向社会开放。他说，河冬市的制度是全川平最好的，可惜是\"纸上的制度\"，要用代码把它变成\"跑不起来的制度\"——想违规，系统不让你提交。\n方案推了两个月，卡住了。卡在三个地方：一是有些审批需要\"现场勘查记录\"，现场可以不写；二是\"容缺受理\"，容的缺可以无限补；三是\"特殊事项\"，这一栏是手动的，谁都能往里塞。\n三个口子，都是活人留的。祁牧之在会上说了一句：我终于知道为什么系统建不成了。\n","city":"河冬市","min_rank":3,"max_rank":5,"weight":4,"once":true,"need":{},"tags":["人事","上级"],"options":[{"label":"三个口子全堵上","text":"\n你陪祁牧之把三个口子全堵了：现场勘查必须上传带时间和定位的照片、容缺受理限定三项且七日内必须补齐、\"特殊事项\"需要分管领导双人电子签名并自动公开。\n阻力大到你想辞职。有十一位中层联名写信给施存矩，说这是\"折腾基层\"。施存矩把信转给你，批了四个字：继续推进。\n上线一年后，全区审批平均时限从二十一天降到六天，投诉量下降百分之七十三。系统被省里命名为\"河冬模式\"。祁牧之挂职期满回省城时，把那块白板留给了你。\n","effects":{"money":0,"risk":-4,"merit":12,"pop":9,"boss":7,"net":3,"stress":8,"clean":5,"probe":-4}},{"label":"堵两个，留一个","text":"\n你堵了现场勘查和容缺受理，留下了\"特殊事项\"这个手动口子，理由是\"改革不能太急，要给基层留弹性\"。\n弹性这个词，后来成了你的口头禅。凡是说不清的事，你都说：留点弹性。\n两年后，纪检组在\"特殊事项\"这一栏里查出六十三条异常办件，涉及十七家企业。你的签字在其中二十二条上。桑岐问你：弹性是谁的弹性？你说：是改革过程中的弹性。他说：现在过程结束了。\n","effects":{"money":6,"risk":6,"merit":7,"pop":2,"boss":3,"net":5,"stress":6,"clean":-7,"probe":4}},{"label":"拖到他挂职期满","text":"\n你什么也没做，只是把方案在会上一压再压，理由永远是\"需进一步论证\"。\n祁牧之挂职一年期满，回省城了。系统只上了一半：能公开的都上了，不能公开的都留在了线下。\n他走的那天给你发了一条消息：我知道你为难，但你要
