知道，你拖掉的不是一个系统，是你自己最好的两年。你把这条消息删了，又后悔了，可惜没有备份。\n","effects":{"money":2,"risk":2,"merit":3,"pop":0,"boss":2,"net":2,"stress":3,"clean":-2}},{"label":"借他的手清人","text":"\n你没有反对改革，反而力推——但你在系统里加了一个\"岗位权限重配\"模块，借数字化之名，把三个不听话的中层调离了关键岗位，换上你的人。\n祁牧之看出来了，他说：你在用我的系统做你的事。你笑而不答。\n一年后，系统上了，你的三条线也铺好了。可是那三个被调走的人里，有一个人的妻子在省纪委工作。两年后，一封举报信从省城寄到河冬，信封上没有寄件人。\n","effects":{"money":8,"risk":7,"merit":6,"pop":1,"boss":4,"net":9,"stress":7,"clean":-9,"probe":5},"flag":"has_faction"}]},{"id":"hd_016","title":"合格供应商名录","text":"\n河冬重工体系一年采购额十七亿，供应商两千三百家。集团新推\"合格供应商名录\"制度：不在名录上的，一律不得参与报价。\n进名录的门槛不高：三证齐全、两年内无重大质量事故、无失信记录、能提供三份同类业绩证明。门槛不高，但有名录就有淘汰——从两千三百家压缩到八百家的过程，就是两千三百家企业生死的过程。\n一家给铸钢厂供耐火材料的小厂，叫\"北苑耐火\"，老板姓霍，六十岁，做了三十年。他的厂子过不了\"同类业绩\"这一关——他要提供三份给\"同等规模企业\"的供货业绩，而河冬重工是本地唯一的大型钢铁企业，他不给重工供货，就没有业绩；不进名录，就不能给重工供货。\n霍老板在你办公室站了十分钟，说了三遍：这是先有鸡还是先有蛋呐。\n","city":"河冬市","min_rank":3,"max_rank":5,"weight":4,"once":true,"need":{},"tags":["工程","招商"],"options":[{"label":"改规则，加新设企业通道","text":"\n你推动名录制度增加一条\"历史供货企业过渡通道\"：连续供货五年以上的，可用历史合同替代业绩证明，但必须通过质量抽检和现场审核。\n北苑耐火进了名录，还带进来另外一百二十七家本地配套小厂。有人骂你开后门，你说这不是后门，是承认历史。\n三年后，这一百二十七家里的九十一家活了下来，本地配套率从百分之三十四升到百分之五十八。这个数字后来成了你最重要的政绩之一。\n","effects":{"money":0,"risk":-2,"merit":10,"pop":8,"boss":5,"net":4,"stress":5,"clean":3,"probe":-1}},{"label":"公事公办，让他自己想办法","text":"\n你说：制度就是制度，我不能为你一个人开口子。霍老板点点头，说：我懂，你是个好官。\n三个月后，北苑耐火倒闭，四十七名工人失业。霍老板把设备卖了，在厂门口坐了一整天。\n半年后，河冬重工的耐火材料采购价上涨了百分之十七——名录里剩下的那几家，开始默契报价。你这才明白，名录不仅仅筛掉了不合格的人。\n","effects":{"money":0,"risk":0,"merit":4,"pop":-3,"boss":3,"net":0,"stress":3,"clean":1}},{"label":"让霍老板挂靠大厂","text":"\n你给霍老板出了个主意：让一家大厂做\"业绩背书\"，北苑耐火以分包形式供货，签一份三方协议。协议是真的，供货是真的，只是台面上的名字换了。\n霍老板的厂子活了。作为感谢，他每年春节送两箱本地酒，酒里有没有别的东西，你从来不问。\n五年后，那家大厂被查，供出一批\"挂靠分包\"的名单。北苑耐火在名单第七行。调查组问你：这份三方协议，谁牵的线？\n","effects":{"money":6,"risk":6,"merit":5,"pop":3,"boss":2,"net":6,"stress":6,"clean":-8,"probe":4}},{"label":"拿名录做交易","text":"\n你找到段其昌：让鑫岳旗下的三家企业进名录，条件是每年按合同额的百分之一点五给你\"咨询费\"，一年大概四十万。\n三家企业都进了，材料做得天衣无缝。第一年四十万到账，你一分没花，全存在一张不记名的卡里。\n你安慰自己：河冬市的行情就这样，一年四十万，十年四百万，买不了别墅，只买得起半套房和一辈子的失眠。这就是河冬市的贪，慢火，小火，温水。\n","effects":{"money":40,"risk":8,"merit":4,"pop":0,"boss":2,"net":9,"stress":9,"family":-3,"clean":-13,"probe":5},"flag":"company_x"}]},{"id":"hd_017","title":"慢一天值多少钱","text":"\n政务服务中心的办件时限表挂在墙上最大那面墙：即办件一百二十三项，承诺件两百零六项，平均承诺时限五点四个工作日。这块牌子是全省第一的牌子。\n卜宪——那个爱较真的年轻科员——交给你一份统计：过去半年，有两百三十七件\"承诺件\"的实际办理时间恰好卡在承诺时限的最后一天，其中一百八十九件来自同一家企业：鑫岳建设。\n他说：这不是效率，这是节奏。卡在最后一天办完，既不违规，又能让竞争对手等不起。他还算了一笔账：一件施工许可晚五天，一个项目的财务成本是三十七万。\n他把表格推过来，眼睛发亮，像发现了定理。你说：你能证明吗？他说：能，但证明的过程需要调取后台操作日志，而调取日志需要分管领导批准。\n分管领导是你。\n","city":"河冬市","min_rank":3,"max_rank":5,"weight":4,"once":true,"need":{},"tags":["审计","同僚"],"options":[{"label":"批！查到底","text":"\n你批了。调查结果：鑫岳建设的一百八十九件里，有一百五十二件的受理时间被人为延后——材料接收单上的日期比实际送达日期晚了三到六天。操作者是窗口的两名聘用人员，指使人是鑫岳的办公室主任。\n两人被辞退，鑫岳被扣信用分十二分，一年内不得评优。段其昌打电话来骂，你把通话记录存进了工作台账。\n卜宪升了副科。他说：我没想到真能查。你说：在河冬市，查得动，这才是最值钱的东西。\n","effects":{"money":0,"risk":-4,"merit":9,"pop":7,"boss":6,"net":1,"stress":6,"clean":5,"probe":-3}},{"label":"改系统，随机分办","text":"\n你没有查旧账，而是改了流程：所有办件由系统随机分办给窗口，受理时间由系统自动抓取，人工不能修改。\n改革很成功。半年后，卡在最后一天的办件下降了百分之八十九。全省现场会在河冬开，你在会上讲了一小时，讲完自己都信了。\n只是那两百三十七件旧账，没人再提。卜宪把那份统计表锁进抽屉，锁了三年。\n","effects":{"money":0,"risk":-2,"merit":8,"pop":6,"boss":5,"net":1,"stress":4,"clean":3,"probe":-1}},{"label":"拖着不批","text":"\n你把卜宪的报告压在抽屉里，说\"影响营商环境，慎重\"。\n卜宪把报告抄送了一份给纪检组——这是他的权利，也是他的性格。桑岐拿着报告来找你，问：为什么压了十一天？\n你答不上来。最后鑫岳被诫勉谈话，你被批评教育，写了检查。卜宪在走廊上遇见你，低着头走过去了。他再没跟你交过心。\n","effects":{"money":4,"risk":5,"merit":2,"pop":-1,"boss":-1,"net":3,"stress":6,"clean":-6,"probe":3}},{"label":"把节奏卖个好价钱","text":"\n你把卜宪的报告拿给段其昌看——当然，抹掉了卜宪的名字。你说：这个东西，如果我批了，你一年要多付三千万的财务成本。\n段其昌看懂了。一个月后，你表弟的公司接到了鑫岳的\"信息化服务\"合同，一年六十万，连做三年。\n卜宪后来调走了，去了市审计局。你听到这个消息时，正在签一份文件，笔尖顿了一下，洇了一个墨点。\n","effects":{"money":60,"risk":8,"merit":3,"pop":-2,"boss":2,"net":8,"stress":9,"family":-4,"clean":-14,"probe":6},"flag":"company_x"}]},{"id":"hd_018","title":"老运河边的一桌人","text":"\n景元九年冬天，段其昌在老运河边的一家私房菜馆摆了一桌。来的七个人：你、焦长顺、苗根生、阚思齐、卜宪、开发区管委会的副主任、还有市工信局的一个处长。\n段其昌说这是\"铁西自己人的聚会\"，不谈工作。桌上确实没谈工作：聊的是当年铸钢厂的澡堂、机床三厂的班车、北苑的冰棍、以及谁的父亲在炉前晕倒过。\n酒过三巡，焦长顺忽然站起来说：我干了三十八年，厂子没了，我不恨谁，我就想问一句，当年那些机器，卖废铁卖了多少钱，能不能告诉我们？桌子上安静了十秒。\n段其昌笑着打圆场。散场时，他送你到门口，从大衣里掏出一个信封，说：过年了，给嫂子和孩子买点东西，八万，不多。他又补了一句：在河冬市，没人一次给你几百万，我们是一点一点来的，来得慢，去得也慢。\n","city":"河冬市","min_rank":3,"max_rank":5,"weight":5,"once":true,"need":{},"tags":["酒局","同僚","家属"],"options":[{"label":"当场退回去","text":"\n你把信封塞回他大衣口袋，说：老段，机器卖了多少钱，我明天去档案局查，查出来公开。\n他笑了笑，说：你这个人啊。第二天你真去了。机床三厂设备处置公开信息里，清清楚楚写着：废钢处置收入八百七十六万元，全额入集团账户。\n你把这份公开信息贴在政务服务中心的公告栏上。焦长顺站在公告栏前看了很久，回头对你说：够了。你成了这桌人里唯一一个被他称为\"同志\"的人。\n","effects":{"money":0,"risk":-4,"merit":9,"pop":9,"boss":6,"net":1,"stress":5,"clean":5,"probe":-3}},{"label":"收下，但只留一半","text":"\n你说：四万，多的拿回去。你自己也不知道这个\"一半\"是什么逻辑——像是在跟谁讨价还价，又像是在给自己留一条后路。\n段其昌把另外四万收了回去，笑得很意味深长。四万块，你给孩子报了个辅导班，剩下的存进了一个新开的账户。\n这个\"只收一半\"的习惯此后保持了六年。它救过你一次，也坑过你一次——因为它证明，你从来都知道那是错的。\n","effects":{"money":4,"risk":5,"merit":3,"pop":0,"boss":1,"net":7,"stress":7,"family":-2,"clean":-8,"probe":3},"flag":"took_first_bribe"},{"label":"全收，从此是自己人","text":"\n你把信封放进内兜，握了握他的手。从这一刻起，你是\"自己人\"了。\n此后三年，你收到的每一笔都不大：春节八万、中秋五万、生日三万、孩子升学十万、买房\"借款\"三十万。加起来不到一百万，不够在省城买一套房。\n可\"自己人\"三个字是有价格的。它意味着每一次会议上的一票、每一个名录里的一行、每一份说明里的一句话。你开始习惯在签字前停顿半秒。\n","effects":{"money":8,"risk":7,"merit":4,"pop":1,"boss":3,"net":10,"stress":8,"family":-3,"clean":-11,"probe":4},"flag":"has_faction"},{"label":"不收，但也不翻脸","text":"\n你把信封推回去，笑着说：老段，你这钱我收了，明天就要上系统报备，何必呢。\n他收了钱，脸上有三分尴尬、七分释然。此后你们还是往来，只是他再没送过钱，送的是信息：哪个项目要启动、哪个地块要调规、哪个领导要动。\n信息不算受贿，但信息比钱值钱。你靠着这些信息做对了三个决断，也做错了一个。做错的那个，五年后变成了审计报告里的一行字。\n","effects":{"money":0,"risk":2,"merit":6,"pop":3,"boss":4,"net":8,"stress":4,"clean":-2,"probe":1}}]},{"id":"hd_019","title":"北苑棚改的补偿口子","text":"\n北苑棚户区改造正式启动。四千二百户，二十七万平方米，其中一九七〇年代建的平房占六成，没有独立卫生间，一条街一个水龙头。\n补偿方案三选一：货币补偿每平米六千一、产权调换按一比一点二、异地安置到新河区的\"和畅家园\"。方案在网上公示三十天，收到意见两千一百条。\n争议的焦点在\"住改非\"——有人把临街的住房改成小卖部、理发店、修车铺，营业执照齐全，但土地性质是住宅。按政策，住宅补偿六千一；按商业，周边市场价两万三。北苑这样的\"住改非\"有三百一十六户，其中一百零二户是机床三厂和铸钢厂的下岗职工，他们靠这些小铺子活着。\n开发商——鑫岳置地——提出一个\"灵活认定\"的办法：只要街道出一份\"历史经营证明\"，就可以按商业的八折补偿。街道愿意出，出一份两百块。\n","city":"河冬市","min_rank":4,"max_rank":6,"weight":5,"once":true,"need":{},"tags":["城建","信访"],"options":[{"label":"统一标准，公开认定","text":"\n你顶住压力，把\"住改非\"认定标准统一为：以税务部门的连续纳税记录为准，满五年的按商业的七折，不满五年的按住宅。标准公开，名单公示，接受举报。\n三百一十六户里，一百七十四户认定通过。剩下的吵了三个月，最后都签了。\n拆迁用了十一个月，零上访、零强拆、零事故。省住建厅把北苑列为\"和谐拆迁\"示范项目。你在总结材料里写了一句后来被广泛引用的话：标准越硬，吵架越少。\n","effects":{"money":0,"risk":-3,"merit":11,"pop":10,"boss":6,"net":1,"stress":7,"clean":4,"probe":-2}},{"label":"让街道灵活认定","text":"\n你把认定权交给街道，只要求\"集体研究、留痕备查\"。街道一口气出了三百一十六份证明。\n三百一十六户全按商业八折补偿，多支出一亿七千万。开发商没吃亏——他们从容积率上找补回来了。\n半年后，政务服务中心的卜宪统计发现：三百一十六份证明里，有两百份的笔迹出自同一个人。他把统计交给了桑岐。桑岐问你：你知不知道？你说：我不知道。他说：不知道，也是一种知道。\n","effects":{"money":20,"risk":6,"merit":7,"pop":5,"boss":3,"net":6,"stress":6,"clean":-8,"probe":4}},{"label":"货币补偿上浮，换签约率","text":"\n你把货币补偿从六千一上浮到七千四，但只对三十天内签约的户——早签多得，晚签不得。这一招叫\"时间杠杆\"。\n九百多户在第一个月签约，剩下的观望了两个月，最后还是签了。整体成本比\"灵活认定\"低了六千万，还显得公平。\n唯一的问题是：那些真的不在家、生病住院、在外地打工赶不回来的户，回来时七千四已经没了。有个老太太拿着六千一的存单坐在拆迁办门口哭，说她只是去省城看了趟闺女。\n","effects":{"money":3,"risk":3,"merit":8,"pop":4,"boss":5,"net":3,"stress":5,"clean":-1}},{"label":"指定评估机构","text":"\n你在评估机构库里\"推荐\"了三家，都是本地的。评估费的行情是每户三百八，四千二百户，一百六十万。\n三家机构默契地按开发商想要的价格评。商业认定也好，住宅认定也好，数字都\"合理\"。一年后，其中一家机构的老板在邻市的案子里被抓，供出行贿名单，河冬市有三个名字。\n你在名单上排名靠后，因为你的钱最少——只有十八万。在河冬市，钱少是好事，也是笑话。\n","effects":{"money":18,"risk":8,"merit":5,"pop":2,"boss":2,"net":7,"stress":8,"family":-3,"clean":-12,"probe":6},"flag":"took_first_bribe"}]},{"id":"hd_020","title":"铸钢厂的红烟","text":"\n环保督察组进驻川平省，第一轮交办件里，河冬市有三件，其中一件指向铸钢厂：夜间偷排，红烟。\n铸钢厂是河冬重工的最后一块家底，在职一千一百人，负债率百分之八十九，去年亏了四千万。它的除尘设备是二〇〇一年装的，改造要投八千万，厂里拿不出，集团拿不出，市财政的环保专项资金今年只有三千万，还分给六个项目。\n环保局的意见是：立即停产整改。工信局的意见是：保就业。常务副市长施存矩在会上说了一句很\"河冬\"的话：程序上，停产整改的通知必须下；实际上，怎么停、停多久，你们拿方案。\n晚上十一点，你站在铸钢厂宿舍的楼顶，看见红烟从烟囱里冒出来，被风吹向老运河。楼下有一千一百户人家，窗户都开着。\n","city":"河冬市","min_rank":4,"max_rank":6,"weight":5,"once":true,"need":{},"tags":["环保","信访"],"options":[{"label":"真停产，政府兜底安置","text":"\n你下了停产整改通知，同时启动三件事：财政垫资一千二百万抢修除尘设施；一千一百名职工按\"阶段性停工\"发放生活费，社保不断缴；对接省城的钢铁企业，组织五百人劳务输出。\n停产四十七天，损失四千六百万。但督查组销号时给了\"整改到位\"的结论。\n一年后铸钢厂复产，红烟没了。工人少了三百人，是自然退休和自愿买断。邵振山在厂门口摆了个修车摊，生意不错。\n","effects":{"money":0,"risk":-4,"merit":11,"pop":10,"boss":7,"net":2,"stress":9,"health":-3,"clean":5,"probe":-4}},{"label":"限产，白天停晚上开","text":"\n你搞了个\"错峰生产\"：白天停，夜里开，理由是\"夜间气象扩散条件好\"。这个理由被环保局的年轻人当面嘲笑过，但没人能证伪。\n督查组白天来看，厂子是停的；夜里来，厂子在开，但一个月只来两次。\n红烟还在，只是少了。周边居民投诉量下降百分之四十。督查组销号了，结论是\"阶段性整改\"。你的报告写得像一篇论文，附了十八张图。\n","effects":{"money":5,"risk":5,"merit":5,"pop":-1,"boss":3,"net":4,"stress":7,"clean":-6,"probe":3}},{"label":"罚酒三杯，象征性罚款","text":"\n你按最低档罚了三十万，责令\"限期整改\"，整改期限给了六个月。铸钢厂交了罚款，写了整改方案，红烟照冒。\n半年后督查组\"回头看\"，红烟在无人机航拍里清清楚楚。这一次没有交办件了，直接问责：分管副区长被免职，你在问责名单第三位，被诫勉。\n你在诫勉谈话室里坐了两个小时，说了三十七遍\"我有责任\"。桑岐最后说：你现在说的每一句，都会记下来。\n","effects":{"money":8,"risk":8,"merit":-2,"pop":-8,"boss":-4,"net":3,"stress":10,"clean":-9,"probe":6}},{"label":"借环保关厂，帮段其昌拿地","text":"\n你以\"环保倒逼转型\"为由，推动铸钢厂整体关停搬迁，土地由政府收储后挂牌。挂牌条件里，有一条\"须具备钢铁行业运营经验\"——全河冬市符合这一条的企业，只有鑫岳。\n鑫岳以底价拿地，三千二百万，比周边商住用地便宜了六成。段其昌给你四十万，说是\"感谢\"。\n一千一百名职工的安置方案，你写得很漂亮。可纸上的方案和厂区里那台停了的高炉，是两回事。\n","effects":{"money":40,"risk":8,"merit":6,"pop":-6,"boss":3,"net":8,"stress":9,"clean":-14,"probe":6},"flag":"company_x"}]},{"id":"hd_021","title":"机床三厂往哪儿搬","text":"\n机床三厂要搬迁。三个选址方案摆在桌上。\n甲方案：迁往新河区的装备制造园，配套齐全，距市区二十八公里，职工通勤单程一小时二十分钟，四百六十人中预计有一百八十人不跟过去。\n乙方案：原地\"退二进三\"，保留五亩工业遗存做博物馆，其余改文创园区，由鑫岳置业整体运营，厂里只保留一个装配车间。\n丙方案：迁往青榆县的产业园，地价便宜，但要新建职工宿舍、学校、医院，总投资多一亿四千万，且青榆县没有产业工人。\n焦长顺坚决反对乙方案，说那是\"把厂子变成景点\"。他在论证会上放了一段录音：一九八七年，这个厂生产出本省第一台数控铣床，全场欢呼。录音放完，会议室里没人说话。\n鑫岳置业给乙方案准备了一份完整的规划图，图上那个\"工业博物馆\"很漂亮。\n","city":"河冬市","min_rank":4,"max_rank":6,"weight":4,"once":true,"need":{},"tags":["城建","工程","旅游"],"options":[{"label":"选甲方案，通勤补贴兜底","text":"\n你选了甲方案，同时争取到一笔通勤补贴：每人每月四百二十元，连发三年；另开通两条厂区专线。最终跟过去的职工是三百八十七人，比预计多了一倍。\n新厂区第一个月上缴利税就超过老厂全年。焦长顺退休那天，在新厂门口站了半小时，说：像样。\n工业遗存那一块，你没有交给开发商，而是由市里收储，做成了一个免费的机床博物馆。开馆那天，讲解员是邵振山。\n","effects":{"money":0,"risk":-2,"merit":10,"pop":9,"boss":6,"net":2,"stress":7,"clean":4,"probe":-2}},{"label":"选乙方案，附加硬条件","text":"\n你选了乙，但加了三条硬条件：保留一个真实运转的装配车间、安置原厂职工不少于两百人、工业博物馆永久免费开放且产权归市里。三条都写进土地出让合同，违约无偿收回。\n鑫岳置业接受了。文创园区开园那天很热闹，老机床被刷成了咖啡桌。\n焦长顺没来。他后来跟人说：那不是我的厂了，那是他们摆的姿势。但他孙子在那儿开了家书店，生意挺好。\n","effects":{"money":6,"risk":4,"merit":8,"pop":5,"boss":4,"net":6,"stress":5,"clean":-3,"probe":2}},{"label":"选丙方案，赌一把","text":"\n你选了丙，理由是\"带动青榆县脱贫\"。市里追加一亿四千万，新建宿舍、小学、卫生所。\n结果是灾难性的：青榆县招不到熟练工，一百九十人辞职，工厂产能只达到设计值的百分之五十二。两年后，市里又花了八千万把产能往回迁。\n审计报告里有一句话：决策缺乏产业配套论证，造成财政资金损失。这句话不长，跟了你一辈子。\n","effects":{"money":0,"risk":5,"merit":-3,"pop":-4,"boss":-3,"net":0,"stress":9,"clean":-1,"probe":3}},{"label":"选乙方案，拿干股","text":"\n你选了乙，没加任何硬条件。博物馆后来变成了售楼处，装配车间变成了健身房。\n你的回报是鑫岳置业\"项目合作\"里的五个点，通过你妻弟的公司代持，每年分红六十万左右，连拿五年。\n第三年分红到账那天，你路过铁西，看见老厂的围墙被拆了一半，墙上\"劳动光荣\"四个字还剩一半。你停了车，抽了半根烟，掐了。\n","effects":{"money":60,"risk":8,"merit":5,"pop":1,"boss":3,"net":9,"stress":9,"family":-5,"clean":-15,"probe":6},"flag":"has_faction"}]},{"id":"hd_022","title":"两亿产业基金的分配","text":"\n省里给河冬市批了一只老工业基地产业升级基金，规模两亿，市里配套一亿，共三亿。用途：支持传统企业技术改造、智能化改造、首台套应用。\n管理办法是你们自己起草的，核心三条：无偿资助不超过项目投资的百分之二十、单个项目不超过八百万、须经专家评审和网上公示。\n申报一百八十七个项目，符合条件的一百三十九个，资金只够支持六十个左右。\n麻烦在于：钱不够，规矩就变得格外重要，也格外碍事。段其昌的鑫岳机械报了三个项目，都符合申报条件，且评分排在前十——他们的材料确实做得最好，因为他们请了省城的咨询公司，一份标书八万。\n而北苑耐火、机床三厂那样的老厂，材料是会计手写的，错别字三个。\n","city":"河冬市","min_rank":4,"max_rank":6,"weight":5,"once":true,"need":{},"tags":["招商","金融","审计"],"options":[{"label":"设材料免费辅导，按分排序","text":"\n你从基金里挤出五十万，办了六期\"申报辅导班\"，请专家免费帮老厂改材料，并明确：评审只看项目本身，不看文本装帧。\n最终六十个项目中，老国企体系占了三十八个。鑫岳机械中了两个，因为它确实做得好。\n绩效评估报告两年后出来：这批项目带动技改投入十一亿，新增专利二百一十七项。省里追加了第二期基金。你在评估报告的致谢名单里，排在第九位。\n","effects":{"money":0,"risk":-3,"merit":12,"pop":8,"boss":7,"net":2,"stress":7,"clean":5,"probe":-3}},{"label":"照分排序，不管老厂","text":"\n你严格按专家评分排序，六十个项目里鑫岳系占了十一个（他们报了十四个）。老厂只中了九个。\n有人骂你扶持民营企业，有人骂你见死不救。你在会上说：基金不是救济金。\n两年后绩效评估：十一个鑫岳项目里，有四个实际投入不足申报额的百分之四十，资金被挪去还了贷款。审计报告里，这叫\"骗取财政资金\"，责任栏里写着\"主管部门审核不严\"。\n","effects":{"money":8,"risk":6,"merit":5,"pop":-2,"boss":2,"net":6,"stress":6,"clean":-7,"probe":4}},{"label":"切块给老厂，留口子","text":"\n你设了一个\"老工业基地专项\"子项，从三亿里切出八千万，专给老国企体系，评审标准单独制定。剩下的两亿二照常竞争。\n这个设计很聪明：既救了老厂，也留了竞争的空间。可\"单独制定标准\"这六个字，本身就是口子。\n一年后，八千万里有两千万被查出\"标准执行不一致\"。桑岐拿着审计报告问你：单独标准，是谁批的？你说：会上集体研究的。他说：会纪要上，是你起草的。\n","effects":{"money":10,"risk":6,"merit":8,"pop":6,"boss":3,"net":5,"stress":7,"clean":-6,"probe":4}},{"label":"设门槛，定向给鑫岳","text":"\n你在管理办法里加了一条\"申报企业上年纳税不得低于三百万元\"。这一条，淘汰了四十七家老厂——它们大多亏损——而鑫岳系的十四个项目全部保留。\n加这一条只用了十分钟。为了让它看起来合理，你让办公室补了一份\"借鉴外地经验\"的说明。\n三年后，这个\"三百万元纳税门槛\"被省审计总署写进报告，标题是：《以政策门槛变相定向输送利益》。报告里点了一个市：河冬。\n","effects":{"money":70,"risk":9,"merit":4,"pop":-3,"boss":2,"net":9,"stress":10,"clean":-16,"probe":8},"flag":"company_x"}]},{"id":"hd_023","title":"一个副处，三个名字","text":"\n区里空出一个副处职位：副区长，分管工业和改制。三个人选。\n第一个是老周，五十二岁，干了二十年正科，资历最老，处理信访有一套，缺点是学历低、不会写材料。焦长顺带着十几个老工人来为他说话。\n第二个是卜宪，三十一岁，那个调去审计局又调回来的年轻人，业务最扎实，缺点是得罪人太多，民主测评倒数。\n第三个是市里某位领导推荐的一位，从外单位平调，履历漂亮，谁也说不出缺点，因为谁也不了解他。\n组织部的考察组明天到。今天下午，那位市领导给你打了电话，说了一句：小同志，河冬的班子，要讲结构。\n晚上，老周敲了你办公室的门，手里拿着一个信封，说：这是我这些年的病历，不是别的。\n","city":"河冬市","min_rank":4,"max_rank":6,"weight":4,"once":true,"need":{},"tags":["人事","上级","换届"],"options":[{"label":"推动公开比选","text":"\n你向施存矩建议：三个岗位人选全部公开述职、现场答辩、评委打分、结果公示。施存矩同意了——在河冬市，这种建议是最不容易被拒绝的。\n答辩会上，老周讲了他处理过的四十七起信访，卜宪讲了三个数据模型，那位外调干部讲了二十分钟的宏观形势。\n最后老周上了。他上任第一件事，是给卜宪加了一个\"政策法规专员\"的虚职，但给了实权。他私下对你说：我这辈子欠你一次。\n","effects":{"money":0,"risk":-3,"merit":9,"pop":8,"boss":5,"net":4,"stress":6,"clean":4,"probe":-2}},{"label":"推老周，实至名归","text":"\n你在考察谈话时力荐老周，理由是他熟悉改制、工人信他。这个理由站得住，因为北苑棚改和机床三厂安置都是他一户户跑下来的。\n老周上了。三年后他退休，退休前把一本手写台账交给你，记着铁西每一户困难职工的名字和住址。他说：这个不能进系统，进系统就变成数据了，得有人记着。\n你把台账锁进柜子。锁了很久。\n","effects":{"money":0,"risk":-1,"merit":7,"pop":7,"boss":4,"net":5,"stress":4,"clean":2}},{"label":"顺水推舟，送市领导人情","text":"\n你在考察谈话里给了那位外调干部很高的评价，措辞讲究：视野开阔、经历复合、有利于优化班子结构。\n他上了。上任半年，把两个工程交给了同一家企业。半年后，市领导在一次会上专门提到你，说\"年轻干部要会用、敢用\"。\n一年后，那位外调干部被查出在原来的单位有经济问题。考察组回头翻谈话记录，你在上面签了字，写着\"未发现不良反映\"。\n","effects":{"money":15,"risk":7,"merit":3,"pop":-2,"boss":6,"net":7,"stress":6,"clean":-9,"probe":4},"flag":"boss_backed"},{"label":"推卜宪，赌一把","text":"\n你力推卜宪，理由是\"河冬市不能只有资历没有专业\"。反对声很大，有人说他\"不成熟\"。\n卜宪上了。上任后他干的第一件事是把全区的工程台账全部数字化、向社会公开，得罪了半条街的企业。有人举报他\"违规公开商业秘密\"。\n举报信查了三个月，结论是不实。但那三个月里，你每天晚上都睡不好。他后来跟你说：你为我挡了三个月，我记着。\n","effects":{"money":0,"risk":3,"merit":8,"pop":5,"boss":2,"net":6,"stress":8,"clean":3}}]},{"id":"hd_024","title":"经济责任审计的问询","text":"\n景元十一年，市审计局对你开展任期经济责任审计。审计组组长是梅寿山，五十九岁，明年退休；主审是阚思齐。\n审计通知书列了七个方面：重大经济决策、财政财务收支、国有资产管理、政府投资项目、对下属单位监管、廉洁从政、以前年度问题整改。\n问询会开了三天。第三天，阚思齐问了三个具体问题：\n一、某技改项目验收报告上的日期，比设备进场日期早了十九天，这个矛盾怎么解释。\n二、一笔一百八十万元的\"规划编制费\"，收款单位是省城一家研究院，但合同里没有成果交付条款。\n三、你任内推荐的十七家入库供应商中，有四家的注册地在同一层写字楼的同一间办公室。\n她说：这三个问题，我先问你，是想给你解释的机会。梅寿山在旁边喝茶，一句话没说。\n","city":"河冬市","min_rank":4,"max_rank":6,"weight":5,"once":true,"need":{},"tags":["审计","上级"],"options":[{"label":"如实说明，主动整改","text":"\n你承认了第一个问题是管理水平问题，验收流程有瑕疵；第二个问题是合同审查不严，已追回八十万；第三个问题是审查流于形式，四家企业已清退。\n审计报告里，这三条都写进去了，但结论是\"已整改\"。梅寿山在离场时破例说了句话：河冬市的干部，肯认错的少，肯改的更少。\n这份\"已整改\"的结论，五年后成了你最重要的护身符——因为审计报告会说话，而人不会一直帮你说话。\n","effects":{"money":0,"risk":-5,"merit":7,"pop":5,"boss":5,"net":1,"stress":7,"clean":4,"probe":-5},"flag":"reformed"},{"label":"解释，但不认错","text":"\n你把三个问题都解释成了\"客观原因\"：验收日期是笔误、规划编制服务具有过程性、写字楼里那四家公司是同一个会计代账。\n审计报告采纳了两条，第三条写进了\"需进一步关注事项\"。\n关注事项这个说法很温和，但它会跟着你，每一份审计报告都会提到它，直到有人把它翻出来。河冬市的账，从来不怕你不认，就怕你没改。\n","effects":{"money":0,"risk":4,"merit":3,"pop":0,"boss":2,"net":1,"stress":6,"clean":-3,"probe":3}},{"label":"找梅寿山通融","text":"\n你提了两瓶酒去梅寿山家，被他堵在楼道里。他说：小同志，我明年退休，我不想晚节不保，你也不想。\n第二天，审计报告里那三条一个字没少，还多了一条：被审计单位负责人试图向审计人员赠送礼品，已当场退回。\n这条被写进报告附件，同时抄送纪检组。你在全机关的廉政会上被不点名批评。甘秉文说：你这叫自投罗网。\n","effects":{"money":0,"risk":8,"merit":0,"pop":-2,"boss":-3,"net":0,"stress":9,"clean":-8,"probe":7}},{"label":"找人把问题抹掉","text":"\n你通过市里一位领导给审计局打了招呼，三条问题变成了\"建议关注\"，写入报告的附注，不上主文。\n报告出来了，干干净净。你在民主生活会上说：审计没发现重大问题。\n三年后，阚思齐调任省审计总署。她带走了自己的工作底稿——那是个人的，不是单位的。底稿里那四家公司注册在同一间办公室的查询结果，打印日期是景元十一年三月。\n","effects":{"money":12,"risk":8,"merit":5,"pop":0,"boss":4,"net":6,"stress":8,"clean":-12,"probe":7}}]},{"id":"hd_025","title":"最后一户不搬","text":"\n北苑棚改完成百分之九十九点七。只剩一户：老运河边的两间平房，户主叫祁望山，六十八岁，独居，无子女，是当年那批要公开机床三厂评估报告的退休工人的弟弟。\n他的要求不是钱。他说这两间房是他父亲一九五三年亲手盖的，梁上有他父亲写的字。他要\"原址保护\"，或者，要一套能看见老运河的房子。\n政策里没有\"原址保护\"这一项，安置房也没有\"看得见河\"这一说。开发商说，这一户卡住，整个二期三百二十户的回迁就要延后，每天的财务成本是十一万。\n施工队已经把围墙砌到了他家门口。挖掘机停在外面，一米二高的铲斗。\n他门口贴了一张纸，上面是他自己写的八个字：房屋私有，世代居住。\n","city":"河冬市","min_rank":4,"max_rank":6,"weight":4,"once":true,"need":{},"tags":["城建","信访","维稳"],"options":[{"label":"改规划，原址保留","text":"\n你连夜找规划部门改了二期方案，把这六百平米从\"拆除\"改成\"保留修缮\"，做成一个小小的\"老运河记忆馆\"，祁望山可以住在后面那间，前两间做展陈。\n方案修改要走程序、重新公示，多花了四十天、多花了一百二十万。\n开馆那天，祁望山把父亲写在梁上的字拓下来，装了框，放在门口。他给每个参观者讲一遍。他活到八十一岁，成了北苑最老的志愿者。\n","effects":{"money":0,"risk":-3,"merit":10,"pop":11,"boss":4,"net":2,"stress":8,"clean":5,"probe":-2}},{"label":"换一套看得见河的房子","text":"\n你把尚未分配的安置房里，唯一一套朝南、能看见老运河的，调剂给了祁望山——按政策，这是\"特殊困难群体优先分配\"，需要公示。\n公示三天，有人举报。你提供了全部材料，包括他无子女、独居、七十三岁仍在扫街的证明。举报不成立。\n他搬走了。搬走那天，他带走了梁上一块木片。房子拆了，那块木片挂在新区客厅的墙上。\n","effects":{"money":0,"risk":0,"merit":7,"pop":8,"boss":4,"net":1,"stress":5,"clean":2}},{"label":"依法申请强制执行","text":"\n你走完了全部程序：裁决、公告、限期、公证、强制。法院的裁定书是合法的，拆迁手续是齐全的。\n执行那天早上，祁望山坐在门口，没有抵抗。他的房子在四十分钟内变成废墟。\n三百二十户如期回迁，你在总结会上说：依法推进，无一事故。三年后，祁望山去世，邻居在他遗物里找到一本剪报，全是北苑拆迁的新闻。\n","effects":{"money":5,"risk":5,"merit":5,"pop":-8,"boss":4,"net":2,"stress":7,"clean":-4,"probe":3}},{"label":"让施工队去「做工作」","text":"\n你没有明文指示，只是在协调会上说了一句：二期不能再拖了，你们要想办法。\n第三天夜里，祁望山家门口来了四个人，砸了玻璃，泼了红漆。第四天，他签了字。\n三个月后，那四个人中的两个因为另一起案子被抓，供出了这起。供述里写着：是拆迁办让我们去的，拆迁办说是上面交代的。\n\"上面\"两个字在笔录里出现了十一次。调查组顺着这两个字，往上来。\n","effects":{"money":20,"risk":9,"merit":2,"pop":-14,"boss":1,"net":4,"stress":10,"clean":-15,"probe":9},"flag":"accident"}]},{"id":"hd_026","title":"老运河南路被堵了","text":"\n景元十二年四月，四百多名原机床三厂、铸钢厂的职工堵了老运河南路。起因是三件事撞在了一起：一是第二批工龄买断的标准降低了；二是医保补缴的政策变了，个人要承担百分之四十；三是传言说新厂要再裁三百人。\n人群里有老人、有妇女、有推着婴儿车的。有人拉了横幅，上面写着\"我们要吃饭\"。堵了六个小时，全城堵车。\n你在现场。有人认出了你，喊：那个戴眼镜的，就是他签的字！有人往你这边扔了一个矿泉水瓶，砸在肩上。\n治安总署的同志问你要不要清场。市里打电话问：媒体到了没有。段其昌发来一条消息：我这边可以出面\"做工作\"，一百人，每人三百。\n雨开始下。\n","city":"河冬市","min_rank":4,"max_rank":7,"weight":5,"once":true,"need":{},"tags":["维稳","信访","事故"],"options":[{"label":"走进人群，当场对话","text":"\n你没戴帽子，也没带保安，走进人群，站在最高的一级台阶上，说了四十分钟。你讲清楚了三件事：买断标准不会降、医保个人承担部分由财政和企业的结余资金冲抵、新厂三年内不裁员写进协议。\n有人骂，有人哭，有人递给你一份材料。你接了，编号登记。\n天黑前人群散了。第二天，你把承诺全部公开，附责任人、附时间表。三个月后，全部兑现。市里有人说你冒险，施存矩却说：河冬市的干部，该站在雨里。\n","effects":{"money":0,"risk":-3,"merit":11,"pop":12,"boss":7,"net":3,"stress":10,"health":-2,"clean":5,"probe":-3}},{"label":"请代表进来谈","text":"\n你请了十一名工人代表到会议室，邵振山是第一个进来的。谈了六个小时，谈出了一个\"三条意见\"：暂缓第二批买断、医保政策延后一年执行、新厂裁员须报区政府备案。\n代表们回去做工作，人群在晚上八点散了。\n这个方案让市里多花了两千三百万。有人说是妥协，你说是算账——真闹大了，停工一天的损失是四百万，还不算别的。\n","effects":{"money":0,"risk":-1,"merit":8,"pop":8,"boss":5,"net":4,"stress":7,"clean":2,"probe":-1}},{"label":"清场，事后处理","text":"\n你同意清场。治安总署依法处置，带走了七个人，其中两个是七十岁以上的老人。\n路通了，交通恢复了。但视频在网上流传，标题是\"河冬市清场记\"。省里的媒体来采访，市里发了一份通稿，通稿里\"依法处置\"出现了九次。\n三个月后，那七个人里的三个成了长期上访户，其中一个人连续上访了八年。八年里，你每次看到他，都会想起那天的雨。\n","effects":{"money":0,"risk":6,"merit":3,"pop":-12,"boss":3,"net":-2,"stress":8,"clean":-5,"probe":5}},{"label":"让段其昌出钱摆平","text":"\n你接受了段其昌的\"帮助\"：每人三百，四百人，十二万，由鑫岳以\"困难职工慰问金\"名义发放。当天下午人群散了一半，第二天全散。\n工人们拿到了钱，也记住了这个钱的来历——慰问名单上有每个人的名字和身份证号，一式三份。\n八年后，那份名单在一个案子的卷宗里被找到。卷宗的第一页写着：慰问资金来源及决策过程待查。\n","effects":{"money":25,"risk":8,"merit":4,"pop":-4,"boss":3,"net":7,"stress":8,"clean":-13,"probe":7},"flag":"accident"}]},{"id":"hd_027","title":"铸钢厂的那个夜班","text":"\n凌晨三点四十，铸钢厂二号车间发生钢水喷溅事故。三名夜班工人重伤，其中两人抢救无效死亡。死者中有一名二十九岁的合同工，孩子刚满八个月；另一名五十岁，再有两年退休。\n初步原因：中包车耐火层超期未更换，检修记录显示三个月前就该换，但车间主任说\"生产任务紧，再撑一个月\"。检修记录上有车间主任的签字，也有分管安全的副厂长签字。\n更麻烦的是：三个月前，市里的安全生产大检查来过，检查表上\"中包耐火层\"一栏，填的是\"正常\"。检查人是区应急管理局的两名工作人员，带队的是你分管的副局长。\n天亮时，死者家属已经到了厂门口。省里的调查组下午到。\n","city":"河冬市","min_rank":4,"max_rank":7,"weight":5,"once":true,"need":{},"tags":["事故","维稳","上级"],"options":[{"label":"如实上报，先赔后查","text":"\n你第一时间如实上报，不瞒报、不迟报，同时启动三件事：全额垫付医疗费、依法支付工伤保险并额外补偿、全厂停产安全整顿。\n在调查组面前，你拿出了那张写着\"正常\"的检查表，承认检查流于形式，并主动请求处分。\n你被记过。但你也是唯一一个在追责名单里主动举手的人。两年后，河冬市推行安全生产\"检查留痕+双人复核\"制度，依据就是这起事故。\n","effects":{"money":0,"risk":-3,"merit":6,"pop":7,"boss":5,"net":0,"stress":10,"health":-3,"clean":4,"probe":-3},"flag":"accident"},{"label":"先把家属安抚好","text":"\n你没先上报，而是先去了医院和殡仪馆。你在太平间门口站了两个小时，跟家属一起抽烟。赔偿标准你按最高档争取：每位死者一百三十八万，另安排一名家属进厂就业。\n家属签了协议。等省调查组到的时候，你已经把能做的都做了。\n调查组问：为什么事故报告迟报了六个小时？你说：我在处理善后。他们说：善后不是你的第一责任。这句话，写进了通报。\n","effects":{"money":0,"risk":4,"merit":5,"pop":5,"boss":2,"net":1,"stress":9,"clean":0,"probe":3},"flag":"accident"},{"label":"统一口径，说是违章操作","text":"\n你和厂里\"统一了口径\"：事故原因是操作工违反规程，未按规定测温。这个说法有依据——规程里确实有测温一条。\n死者已经不能辩解。调查报告写了\"主要原因为违章操作\"，附带一句\"企业设备管理存在薄弱环节\"。\n三年后，一名调离的安全员把真实的检修记录复印件寄给了省里。复印件上有\"再撑一个月\"的签字。调查重启，这一次，追责名单比上次长了三倍。\n","effects":{"money":10,"risk":8,"merit":1,"pop":-10,"boss":2,"net":4,"stress":10,"clean":-12,"probe":7},"flag":"accident"},{"label":"花钱买下所有人的沉默","text":"\n你让厂里出钱，给三名伤者、两名死者家属一共三百四十万，条件是签《不再追责承诺书》。你又给调查组的关键成员每人送了五万——不是现金，是\"专家咨询费\"。\n事故结论是\"设备意外\"，责任人被处理了两个最基层的。\n一年后，那名二十九岁死者的妻子开始上访。她只带一样东西：一张承诺书。她说：我就是想问问，我丈夫的命，值不值这三百四十万里的一行字。\n","effects":{"money":50,"risk":10,"merit":0,"pop":-16,"boss":2,"net":6,"stress":12,"health":-3,"clean":-18,"probe":10},"flag":"accident"}]},{"id":"hd_028","title":"信息公开第一的副作用","text":"\n河冬市连续五年信息公开考核全省第一。这本省城的《川平观察》记者来写一篇表扬稿，结果写出了一篇调查。\n记者叫燕南，三十出头，蹲了二十天。她做了三件事：\n一、把全市一百二十七个政府投资项目的公开信息逐条爬下来，比对合同金额和结算金额，发现三十一个项目结算超合同百分之二十以上，其中十一个超百分之五十。\n二、把这些项目的中标企业和\"合格供应商名录\"做了交叉比对，发现十九家企业的实际控制人有交叉持股关系。\n三、她申请公开这些项目的变更签证记录，得到答复：\"变更签证不属于主动公开范围，可依申请公开。\"\n她把稿件发给了市政府新闻办，附了一句话：如果你们能在七天内公开全部变更记录，我就按下不发。\n","city":"河冬市","min_rank":4,"max_rank":6,"weight":4,"once":true,"need":{},"tags":["媒体","工程","审计"],"options":[{"label":"全部公开，接受监督","text":"\n你推动全部一百二十七个项目的变更签证记录上网，包括那十一个超百分之五十的，附《超合同原因说明》。\n《川平观察》最后发的是一篇正面报道，标题是《一个老工业城市的透明实验》。报道里引用了你的话：公开不是因为我们干净，是因为我们想干净。\n此后三年，河冬市政府投资项目的平均结算超合同率从百分之三十一降到百分之九。这个数字，比一百个廉政标语都管用。\n","effects":{"money":0,"risk":-5,"merit":12,"pop":10,"boss":7,"net":1,"stress":8,"clean":5,"probe":-5}},{"label":"公开一半，留一半","text":"\n你公开了七十个项目的记录，剩下的五十四个以\"涉及商业秘密\"为由不予公开。\n燕南的文章发了，标题是《河冬的半张脸》。文章不激烈，但每一段都有数据。\n省里来函询问，市里回了一份说明。事情压下去了，但\"半张脸\"这三个字，成了河冬市一段时间里的外号。\n","effects":{"money":5,"risk":5,"merit":4,"pop":-3,"boss":2,"net":3,"stress":7,"clean":-6,"probe":3}},{"label":"公关，请她吃饭","text":"\n你请燕南吃饭，谈了三个小时，讲老工业基地的难处、讲工人、讲财政。她听得很认真，也确实被打动了。\n稿子没发。一个月后，她在另一家媒体发了一篇署名文章，第一句是：我曾被一位官员的三个小时说服，但我后来想明白了，我是被自己的善意说服的。\n那篇文章里没有河冬市的名字，但全市的人都知道写的是谁。\n","effects":{"money":3,"risk":6,"merit":2,"pop":-2,"boss":1,"net":4,"stress":7,"clean":-7,"probe":4}},{"label":"查她的消息来源","text":"\n你让办公室查是谁给她提供了数据。查出来是政务服务中心的卜宪——那些数据本来就是公开的，但他帮燕南写了爬虫脚本。\n卜宪被调离岗位，理由是\"未经许可向媒体提供工作协助\"。这个理由很河冬：没有一条违规，但人挪走了。\n半年后，卜宪辞职去了省城一家数据公司。三年后，他开发的项目公开分析平台被全省采用。发布会上，有人问他灵感从哪来，他说：从一个想查我的人那里。\n","effects":{"money":0,"risk":7,"merit":-1,"pop":-6,"boss":1,"net":-3,"stress":8,"clean":-9,"probe":6}}]},{"id":"hd_029","title":"省里来检查组","text":"\n省老工业基地振兴检查组来河冬，检查三年转型成效。检查方式：听汇报、看现场、查台账、随机走访十户居民。\n问题出在台账。三年十二项指标，完成了九项。没完成的三项是：战略性新兴产业占比（差四点二个百分点）、研发投入强度（差零点三个百分点）、单位 GDP 能耗下降（差百分之一点七）。\n办公室主任出了个主意：把统计口径\"优化\"一下。比如战略性新兴产业，把\"高端装备配套\"也算进去，占比就能达标；研发投入，把技改投入的一部分计入研发；能耗，把铸钢厂停产的四十七天算作全年。\n他说：这不是造假，这是口径调整，省里也有这么干的。\n第二天上午九点汇报。现在是晚上十一点，台账就在你桌上，上面已经贴好了便利贴，写着建议修改的数字。\n","city":"河冬市","min_rank":4,"max_rank":6,"weight":5,"once":true,"need":{},"tags":["上级","审计"],"options":[{"label":"照实报，附整改清单","text":"\n你把三项未完成指标原样报上去，每一项后面附一份《差距分析与整改时间表》，写明责任人、资金来源、年度节点。\n汇报时，检查组组长沉默了很久，最后说：我在六个市听汇报，只有你们报了没完成的。\n最后河冬市评价为\"扎实推进\"，不是\"优秀\"，但三年后的复核里，那三项指标全部达标。你的整改时间表被省里转发，标题叫《敢于报差距》。\n","effects":{"money":0,"risk":-4,"merit":11,"pop":6,"boss":7,"net":1,"stress":7,"clean":5,"probe":-4}},{"label":"改两个，留一个","text":"\n你改了战略性新兴产业和能耗两项，留下了研发投入——因为这一项省里有另外的核查渠道，容易被戳穿。\n检查组很满意，河冬市拿了\"优秀\"。评比结果在《川平日报》上登了半版。\n半年后，省统计局核查研发投入数据，发现全省十市里有四市口径不一致，要求整改。整改说明里，河冬市的研发投入被调减。这一调，把\"优秀\"调成了\"合格\"。\n","effects":{"money":0,"risk":4,"merit":6,"pop":1,"boss":4,"net":2,"stress":6,"clean":-4,"probe":3}},{"label":"全改，把台账做漂亮","text":"\n三项全改了。为了让数据自洽，办公室连夜改了六个关联表、补了三份会议纪要、造了两份\"专题研究\"的签到表。\n检查组没查出问题，河冬市被评为全省第一。施存矩在表彰会上说：数据会说话。\n两年后，一位调离的统计员把原始台账的扫描件留在了云盘上，忘了删。新来的统计员做同比分析时，发现两个版本相差百分之十七。\n","effects":{"money":8,"risk":7,"merit":7,"pop":2,"boss":6,"net":4,"stress":8,"clean":-10,"probe":6}},{"label":"安排走访路线","text":"\n数据你一项没改，但你\"精心安排\"了随机走访：十户里，六户是刚拿到回迁房钥匙的棚改户，两户是产业基金扶持企业的职工，两户是社区干部。\n走访很成功，有人当场掉眼泪，说感谢政府。记者拍了照片。\n检查组走了以后，燕南发来一条消息：那十户里，有七户是社区干部的亲属或邻居，你要不要解释一下？你没回。\n","effects":{"money":2,"risk":5,"merit":6,"pop":2,"boss":5,"net":3,"stress":6,"clean":-6,"probe":4}}]},{"id":"hd_030","title":"博士留下的那张盘","text":"\n祁牧之挂职期满，要回省城。临走前，他把一个信封塞给你，里面是一张光盘和一页纸。\n纸上写着三十七个字：我把全区三年的审批数据跑了一遍，异常办件一百四十三条，涉及十九家企业、十一名干部。我没有上报，因为我不确定谁可信。你决定。\n光盘里是一张表和一份说明。表上每一行都有办件编号、时间、操作账号、异常类型。异常类型有四种：受理时间被改、容缺超期未补、特殊事项无双人签名、同一 IP 提交多家企业材料。\n一百四十三条里，有九条的最终审批人是你。另外，有三十一条的操作账号，属于你现在最倚重的三个下属。\n祁牧之在楼下等你。他说：我明天上午的火车。\n","city":"河冬市","min_rank":4,"max_rank":7,"weight":5,"once":true,"need":{},"tags":["审计","上级","同僚"],"options":[{"label":"全部移交纪检组","text":"\n你当晚就把光盘交给了桑岐，包括涉及你自己的那九条。桑岐看了你很久，说：你知道这九条意味着什么。你说：意味着我要说清楚。\n核查历时五个月。九个办件里，七个是程序瑕疵，两个是下属冒用你的账号——你因此完善了电子签名的双因子认证。\n三名下属被处理，十九家企业被清理出名录。你受了\"领导责任\"的通报批评，但那份通报后面跟着一句：该同志主动提供线索，可从轻。\n","effects":{"money":0,"risk":-4,"merit":9,"pop":7,"boss":6,"net":-3,"stress":10,"clean":6,"probe":-6},"flag":"reformed"},{"label":"只查下属，不报自己","text":"\n你交出了光盘，但删掉了涉及自己的那九条。桑岐没发现，因为原始数据只有祁牧之那里有备份。\n三名下属被处理，其中一个是跟你八年的老部下，他在谈话室里说：我认，但我想知道，是我的账号，还是别人用我的账号？\n你说：是你的。他看了你三秒，说：好。\n半年后，他调去了邻市。三年后，一封举报信从邻市寄出，信封里是一份账号操作日志。\n","effects":{"money":5,"risk":6,"merit":5,"pop":2,"boss":4,"net":-2,"stress":8,"clean":-8,"probe":5}},{"label":"压下来，先内部整改","text":"\n你把光盘锁进柜子，用三个月时间悄悄整改：重设权限、修补系统漏洞、把三名下属调离关键岗位、让十九家企业主动退出名录。\n一百四十三条异常，就这样消失了，没有一个人被处理。表面上看，什么问题都没有。\n三年后，祁牧之在省里的一次会议上遇到你，只问了一句：那张盘，你看了吗？你说：看了。他说：那就好。他再没问过第二句，你也再没睡过整觉。\n","effects":{"money":8,"risk":5,"merit":6,"pop":1,"boss":4,"net":5,"stress":9,"clean":-9,"probe":4}},{"label":"销毁光盘，装作没来过","text":"\n你把光盘掰成两半，扔进了老运河。纸烧了，灰撒在马桶里冲走。\n祁牧之在火车上给你发消息：东西收到了吗？你回：收到了，谢谢。\n此后五年，你们再没联系。五年后，省里组织大数据比对，当年的数据从省平台的备份里被重新跑了一遍。数据是不会死的，它只是睡着了。\n","effects":{"money":15,"risk":9,"merit":3,"pop":-2,"boss":3,"net":6,"stress":11,"clean":-16,"probe":9}}]},{"id":"hx_001","title":"腊月二十八那一夜","text":"\n腊月二十八，县中学的钟老师带着十几个教师堵在政府门口，说工资拖了四个月，屋里娃的学费、老人的药钱全指着这一笔。财政局赖有财把账本摊在你桌上，一根手指头点着最后一行：全县可支配财力只剩三十八万，连机关食堂的菜钱都是赊的。他压低嗓子，说民政那笔冬令救济款还没发下去，先挪来顶一顶，等开春转移支付到了再补回去，账面走个\"往来\"，神不知鬼不觉。窗外雪下得密，钟老师的棉鞋湿透了，在雪地里一下一下地跺脚。赖有财把笔递过来，手很稳。\n","city":"胡悉市","min_rank":1,"max_rank":3,"weight":5,"once":true,"need":{"min_year":0},"tags":["财政","教育","信访"],"options":[{"label":"自掏腰包堵上缺口","text":"\n你从公积金里取出两万八，又跟老同学借了五千，腊月二十九把钱打进教师工资卡。钟老师在门口站了很久，说了一句\"谢谢领导\"，那语气让你脸上发烫。救济款原封不动发了下去，县里的账第一次没糊涂。赖有财在背后嘀咕：这口子一开，以后谁都来堵门。果然，开春之后来堵门的人多了三倍，只是他们手里拿的不再是欠条。\n","effects":{"money":-3,"risk":-2,"merit":8,"pop":12,"boss":1,"net":-2,"health":-1,"stress":6,"family":-3,"probe":-1,"clean":3},"flag":"honest_path","unflag":null,"ending":null,"next":null},{"label":"先挪救济款顶一顶","text":"\n救济款第二天变成了工资，账上记了一笔\"暂付\"，开春再说。教师们散了，门口安静了，雪地上只剩几串脚印。你看着那本账，忽然发现它其实一直是糊涂的，只是从前没人让你签字。赖有财替你把墨迹吹干，说领导英明。开春那笔账最后也没补上——它被更大的一笔盖住了，像雪盖住雪。\n","effects":{"money":5,"risk":3,"merit":5,"pop":-6,"boss":2,"net":2,"stress":4,"probe":2,"clean":-5},"flag":"took_first_bribe","unflag":null,"ending":null,"next":null},{"label":"发一半，剩下的打欠条","text":"\n每人先发两个月，剩余部分打了欠条，盖了财政的红章。钟老师捏着那张纸，问这纸能不能去供销社换米。你说能。其实你也不知道能不能。人群散得很慢，像雪化。欠条后来在县里流通了小半年，被人拿来抵过猪崽钱、学费和一次相亲的彩礼，直到纸张发软、字迹模糊。\n","effects":{"money":0,"risk":1,"merit":3,"pop":-2,"boss":1,"net":1,"stress":5,"clean":-1},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"连夜上省城哭穷","text":"\n你连夜翻山去省城，在财政厅走廊的长椅上等了两天两夜，见了两个处长，把乌蒙山的雪、教师的棉鞋和账本上那三十八万都讲了一遍，讲到第三遍时自己都动情了。最后多争取到六百万调度款。回程车上你睡得像死过去，醒来发现嘴角烂了一片。省城那位处长后来还记得你——记得你是个\"会哭的山区干部\"。\n","effects":{"money":0,"risk":-1,"merit":6,"pop":4,"boss":3,"net":2,"health":-3,"stress":9,"family":-2,"clean":1},"flag":null,"unflag":null,"ending":null,"next":null}]},{"id":"hx_002","title":"石门乡的那只羊","text":"\n第一次下乡，石门乡石门村的支书王有田杀了一只羊。羊炖在锅里的时候你还没觉出不对，直到看见灶台上扔着一只耳朵，耳标是黄的，上面印着扶贫项目的编号。院子里蹲着十几个看热闹的村民，谁也不说话，就看着你。王有田敬酒，说领导来了是村里的福气，这羊本来就病了，不吃也得出事。扶贫工作队的秦远坐在门槛上，脸涨得通红，筷子一直没动。山风从门缝里灌进来，锅里的油凝成一层白。\n","city":"胡悉市","min_rank":1,"max_rank":3,"weight":5,"once":true,"need":{"min_year":0},"tags":["扶贫","农业","酒局"],"options":[{"label":"当场掏钱，羊耳标收走","text":"\n你数出三百二十块拍在桌上，说按市价算，多的是羊耳朵的钱。院子里有人\"噗\"地笑了一声，又赶紧捂住嘴。王有田的脸僵了三秒，然后笑得更灿烂，转身就把剩下的羊汤分给了院里的老人。回城的路上，司机老罗小声提醒：领导，这十里八乡往后怕是不好办事了。果然，第二天你的办公室门口冷清得能听见风。\n","effects":{"money":-1,"risk":-2,"merit":4,"pop":7,"boss":0,"net":-4,"stress":4,"clean":3},"flag":"honest_path","unflag":null,"ending":null,"next":null},{"label":"吃了，还带走两条羊腿","text":"\n你吃了三大碗，夸王有田的手艺，临走时后备箱里多了两条羊腿和一小塑料桶自烤酒。王有田说这点土特产不值钱，领导别嫌弃。你在车上一路没说话，那桶酒晃荡的声音像某种心跳。回城后你把羊腿分给了隔壁的老局长，他心照不宣地收下，第二天就有人开始给你打电话，问石门乡那条路什么时候修。\n","effects":{"money":1,"risk":2,"merit":-1,"pop":-4,"net":4,"stress":3,"clean":-4},"flag":"took_first_bribe","unflag":null,"ending":null,"next":null},{"label":"吃了饭，回头补个手续","text":"\n你吃了，但让秦远经手，从工作队经费里按市价把羊钱补给村里，开了收据，一式三份。王有田捏着收据看了半天，说领导想得周到。收据后来被他贴在村务公开栏上，旁边还用手写了\"领导付了钱\"五个字。县里有人当笑话传，也有人在心里记住了你做事留痕。\n","effects":{"money":-1,"risk":1,"merit":3,"pop":3,"net":1,"stress":2,"clean":1},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"把秦远留下，自己先撤","text":"\n你把秦远留在村里蹲点，交代他\"把情况写清楚\"，自己吃完饭就回了城。车开出去三里地，你回头看了一眼，那孩子还站在院门口，手里端着半碗凉掉的羊汤。报告一周后交上来，五千字，署名秦远。会上有人夸这份材料扎实，你说是我指导的。秦远在角落里笑了一下，很轻。\n","effects":{"money":0,"risk":1,"merit":2,"pop":-1,"net":-1,"stress":-3,"clean":-2},"flag":null,"unflag":null,"ending":null,"next":null}]},{"id":"hx_003","title":"上访八年的周三爷","text":"\n信访大厅的角落里坐着个老头，自称周三爷，大名周广田，石门乡人。八年前他家四十亩林地被村集体\"流转\"给了矿上，合同上按了手印，可他自己说那手印是被人攥着手指头摁的。八年里他跑过县里三十七趟、市里九趟，材料摞起来一尺高，每一份都盖着\"已转办\"的蓝章，转到最后总回到石门乡。信访局长搓着手说这人精神上有点问题，建议纳入稳控。周三爷从怀里掏出一沓车票，都是硬座，最远的一张是省城。他抬头看你：我这辈子还能等到个说法不？\n","city":"胡悉市","min_rank":1,"max_rank":3,"weight":5,"once":true,"need":{"min_year":0},"tags":["信访","维稳","矿"],"options":[{"label":"立案复查，限期给说法","text":"\n你调了八年前的林地台账，发现那批林的承租人早在三年前就转包给了黑水河的矿老板赵德贵，一亩地的补偿款在账上写着\"已兑付\"，签领人一栏是王有田代签。你把材料摊在会上，满屋子没人接话。一个月后周三爷拿到了六万八千块，他跪在地上磕头，被你拽起来。散会后，信访局长在楼梯口点烟，说领导，这活儿以后不好干了。\n","effects":{"money":0,"risk":-3,"merit":7,"pop":11,"boss":-2,"net":-4,"stress":7,"probe":-2,"clean":4},"flag":"honest_path","unflag":null,"ending":null,"next":null},{"label":"签劝返，纳入稳控名单","text":"\n你签了字。周三爷被两个乡镇干部\"陪着\"回了村，从此每逢敏感日子，村口就多两个戴袖标的人坐在他家院里下棋，一坐一整天，管饭。材料继续在各级之间转，转到后来连编号都排到了三位数。年底维稳考核，你所在的县拿了先进，奖牌挂在会议室墙上，擦得很亮。\n","effects":{"money":0,"risk":4,"merit":3,"pop":-9,"boss":4,"net":2,"stress":5,"probe":5,"clean":-5},"flag":"hx_zhou_silenced","unflag":null,"ending":null,"next":null},{"label":"给两万块，换一纸息访","text":"\n从民政的困难补助里挤出两万块，让村里送到周家，条件是签一份息访承诺书。周三爷捏着笔犹豫了很久，最后签了，签完问：这钱算不算我那片林子的钱？没人回答他。他拿着钱给孙女买了台二手电脑，剩下的存了定期。承诺书复印了六份，分送各级信访部门。\n","effects":{"money":0,"risk":2,"merit":3,"pop":-2,"boss":3,"net":1,"stress":3,"probe":2,"clean":-3},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"送进精神病院","text":"\n你没说话，信访局长就懂了。一周后周三爷被送进了市郊的安宁医院，诊断书上写着\"偏执状态\"。他老婆每周来送一回衣服，隔着铁门哭。出院那天是第三年冬天，他白了头，见到人先笑，说我不告了，我真不告了。那份笑让整个走廊的人都低下了头。而你那年被评为维稳先进个人。\n","effects":{"money":0,"risk":9,"merit":1,"pop":-18,"boss":2,"net":1,"health":-2,"stress":9,"probe":14,"clean":-9},"flag":"hx_zhou_silenced","unflag":null,"ending":null,"next":null}]},{"id":"hx_004","title":"死了十七只扶贫羊","text":"\n省里的抽查组下周三到，石门乡报上来一件小事：扶贫到户的三十只基础母羊，死了十七只。王有田的解释是口蹄疫。可秦远在村里待了三天，回来说的话不一样——腊月里村民们把羊杀了过年，杀完把皮埋了，剩下十七张嘴等着你交代。按项目规定，死了的羊要拍照、要兽医出具证明、要逐级核销；按现实，明天早上八点前你得想出一个让抽查组笑着点头的说法。王有田在门口抽烟，说领导，要不咱从邻村借点？\n","city":"胡悉市","min_rank":1,"max_rank":3,"weight":4,"once":true,"need":{"min_year":0},"tags":["扶贫","农业","审计"],"options":[{"label":"如实上报，申请补栏","text":"\n你让秦远把十七张羊皮从土里挖出来，一只一只点数、拍照、编号，附了兽医站的诊断，如实报上去，同时申请下年度补栏。抽查组的组长翻着照片，问了一句：就你们一家这么报？你说不知道别人家怎么报。他没再说话，走时在车上记了一笔。年底脱贫考核，你的县被扣了两分。\n","effects":{"money":0,"risk":-2,"merit":5,"pop":6,"boss":-3,"net":-2,"stress":6,"clean":3},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"连夜借羊凑数验收","text":"\n三辆农用车连夜跑了四个村，借来二十一只羊，天亮前赶进石门村的圈里，耳标是现剪现挂的。抽查组数羊的时候，有只羊认生，跳出圈跑了二里地，被八个干部追回来，在评分表上写了个\"优\"。送还羊的时候，邻村的支书说：领导，下次还借啊。后来这四个村都学会了这一招，彼此借得很熟练。\n","effects":{"money":1,"risk":4,"merit":6,"pop":-1,"boss":3,"net":4,"stress":3,"clean":-5},"flag":"took_first_bribe","unflag":null,"ending":null,"next":null},{"label":"用工作队经费补买","text":"\n你没让村里出一分钱，从扶贫工作队的办公经费里挤出三万六，按市价重新买了十七只羊，一只只钉上耳标，交到原户主手里。买羊的票据贴在村务公开栏里，被风吹掉了一角。秦远问这算不算违规使用经费，你说算我头上。他愣了两秒，说那我也签个字。\n","effects":{"money":-2,"risk":1,"merit":4,"pop":5,"net":1,"stress":4,"clean":2},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"改项目，谎报转型升级","text":"\n你大笔一挥，把养羊项目改成\"林下土鸡养殖试点\"，理由是本地气候不适宜。材料写得花团锦簇，还配了三张从网上找的鸡照片，可惜其中一张的背景里有个海。抽查组的人盯着那张照片看了很久，最后什么也没说。半年后省里来检查\"林下经济\"，你在山上临时租了两百只鸡，租期一天。\n","effects":{"money":2,"risk":6,"merit":4,"pop":-3,"boss":1,"net":2,"stress":7,"probe":4,"clean":-6},"flag":null,"unflag":null,"ending":null,"next":null}]},{"id":"hx_005","title":"盘山公路的第一铲","text":"\n石门乡到黑水镇那十八公里路，县里争了六年，今年终于立项，造价一千二百万。开工前一天晚上，包工头马三炮摸到你宿舍，脚上还带着泥。他拎来一箱本地苞谷酒，酒箱底下压着一个牛皮纸信封，两万块，说是\"给领导买烟抽\"。他说他有六台挖掘机——后来你才知道那是租的，按天算钱。他拍着胸脯保证：路我修，质量您放心，就是这招标走个过场，您让我沾点。窗外，他的那台破皮卡正在漏机油。\n","city":"胡悉市","min_rank":1,"max_rank":3,"weight":5,"once":true,"need":{"min_year":0},"tags":["工程","交通","人事"],"options":[{"label":"退回去，走公开招标","text":"\n你把信封塞回他怀里，让他把酒也带走。招标那天来了七家，最后中标的是市里一家有资质的公司，比马三炮的报价高四十万。开工典礼上你在雪地里讲了二十分钟廉政，讲完自己都信了。散会后交通局长苗长水拍拍你的肩，说年轻人有前途。三个月后，那家公司的工地停工了——它在别县也中了三个标，人手根本不够。\n","effects":{"money":0,"risk":-3,"merit":5,"pop":5,"boss":2,"net":-4,"stress":5,"clean":4},"flag":"honest_path","unflag":null,"ending":null,"next":null},{"label":"收下信封","text":"\n信封在抽屉里躺了三天，第四天你把它存进了卡里。马三炮中标了，报价低得离谱，理由写在标书上：\"本地企业，让利乡梓\"。开工那天他放了三挂鞭，给你递了一把系着红布的铁锹。路修到第十公里的时候，混凝土标号开始说不清了，而你在会上替他说了句话：本土企业不容易，要多支持。\n","effects":{"money":2,"risk":3,"merit":2,"pop":-2,"net":3,"stress":5,"probe":2,"clean":-5},"flag":"took_first_bribe","unflag":null,"ending":null,"next":null},{"label":"收下，但把路盯死","text":"\n钱你收了，然后做了一件让马三炮没想到的事：你让秦远驻在工地上，每车砂石都要过磅记录，每公里取一组芯样。马三炮在工棚里骂了三天娘，第四天把该用的水泥用了。路修完那年冬天没裂，第二年也没裂。马三炮后来逢人就说：那领导收钱，可他真懂行，你糊弄不了。这话传到上级耳朵里，不知道算好话还是坏话。\n","effects":{"money":2,"risk":4,"merit":7,"pop":6,"net":3,"stress":7,"clean":-5},"flag":"took_first_bribe","unflag":null,"ending":null,"next":null},{"label":"推给交通局去定","text":"\n你把信封原样转给苗长水，说这事儿按程序办，我不插手。一个月后中标结果出来了，是苗长水小舅子的公司，报价比马三炮还高。你什么都没得到，也什么都没失去，只是从此苗长水见了你格外客气，逢年过节送两盒茶。路修到第七公里就塌了半幅，塌方那天苗长水正在省城开会，第一个电话打给了你。\n","effects":{"money":0,"risk":2,"merit":-1,"pop":-2,"net":2,"boss":-1,"stress":-2,"clean":-2},"flag":null,"unflag":null,"ending":null,"next":null}]},{"id":"hx_006","title":"水泥厂门口的白条","text":"\n县水泥厂三百多号人，欠薪十四个月。厂长劳一鸣把厂里那块临街的地抵押给了地下钱庄的苟老四，换了六百万，说是发工资，结果只发了半个月就没影了。工人拿厂里开的白条去小卖部买盐，小卖部起初收，后来不收了，说纸太多了。今天早上，四十多个工人把厂门堵了，有人抬着八十岁的老娘来，说这厂子是他爹那辈人一砖一瓦垒起来的。你站在厂门口，闻到空气里有一股陈年的灰。\n","city":"胡悉市","min_rank":1,"max_rank":3,"weight":4,"once":true,"need":{"min_year":0},"tags":["维稳","金融","城建"],"options":[{"label":"财政垫付，追查抵押","text":"\n你从有限的财力里硬挤出两百万，按人头先发三个月，同时请审计进厂查那笔抵押。查出来的东西比想象中难看：六百万里有二百二十万是\"咨询费\"，收款方是个成立才十一天的公司。劳一鸣被停职那天在办公室坐了一整夜，第二天把钥匙交了，说：我认，但那地不抵出去，厂子早断了气。工人们没闹了，可也没人来谢你。\n","effects":{"money":-2,"risk":-1,"merit":9,"pop":13,"boss":-2,"net":-3,"health":-1,"stress":8,"clean":4},"flag":"honest_path","unflag":null,"ending":null,"next":null},{"label":"让苟老四接盘改制","text":"\n你牵了线，苟老四的\"乌蒙小额贷\"以债权转股权的方式接了厂子，工人每人补发两个月，剩下的\"随厂里效益逐步解决\"。苟老四当晚请你吃了顿羊肉，走时塞了一张卡，说这点小意思，往后厂子还得靠领导照应。那张卡里有二十万。半年后厂子改成了商品混凝土搅拌站，工人剩了六十个，其余的拿着白条回家种地去了。\n","effects":{"money":20,"risk":4,"merit":4,"pop":-11,"boss":2,"net":5,"stress":5,"probe":3,"clean":-7},"flag":"took_first_bribe","unflag":null,"ending":null,"next":null},{"label":"分期打白条慢慢还","text":"\n你主持签了个三方协议：厂里每月从回款里拿出三成还欠薪，政府背书，两年还清。工人们排着队签字，签得很有秩序，像领粮。头三个月还了，第四个月回款被法院冻结，断了。第五个月又续上。两年变成了五年，五年里的白条换了三版，最后一批结清那天，最初闹事的那位工人已经不在了。\n","effects":{"money":0,"risk":1,"merit":3,"pop":2,"net":1,"stress":4,"clean":0},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"关厂，把地卖给开发商","text":"\n你把厂子关了，那块临街的地公开挂牌，最后被省城来的冯大川拿下，说是要建\"乌蒙山货交易中心\"。工人按工龄买断，最高的一万八，最少的三千二。挂牌那天程序无懈可击，连律师都夸规范。冯大川私下给了你八万块\"信息费\"。交易中心后来盖成了，一楼卖化肥，二楼空着，三楼养鸽子。\n","effects":{"money":8,"risk":5,"merit":6,"pop":-13,"boss":2,"net":3,"stress":6,"probe":4,"clean":-6},"flag":"took_first_bribe","unflag":null,"ending":null,"next":null}]},{"id":"hx_007","title":"老屋漏雨的那些天","text":"\n母亲在乌蒙山深处的老屋漏了一个月雨，堂屋的墙上长出一层黑毛。修一次顶要八千块。妻子苏婉在县中学教数学，晚上改完作业，把一张纸放在你面前：小满的择校费，一万二。你的存折上四万六千块，是两个人十几年攒下的，每一笔都是工资。同僚在酒桌上拍你的肩：先把自己的日子过好，才谈得上给老百姓办事，你看看人家谁不是这样。那天夜里雨还在下，你听见水盆里\"叮、叮\"的响。\n","city":"胡悉市","min_rank":1,"max_rank":3,"weight":4,"once":true,"need":{"min_year":0},"tags":["家属","同僚"],"options":[{"label":"自己掏钱，向亲戚借","text":"\n你取了两万，又跟两个舅舅各借了三千，请了村里一个泥瓦匠，用了七天把屋顶翻了。母亲在新瓦下睡了第一晚，说这下好了，雨再大也不怕。苏婉把择校费的事自己扛了，她接了两个班的晚自习，一个学期瘦了七斤。小满后来知道了，说妈你傻。苏婉说你爸更傻。\n","effects":{"money":-2,"risk":0,"merit":1,"pop":2,"family":7,"health":-1,"stress":5,"clean":3},"flag":"honest_path","unflag":null,"ending":null,"next":null},{"label":"让王有田安排人去修","text":"\n你只是随口在电话里提了一句老屋漏雨。三天后，一支七人的施工队开进了山，砖是村砖厂拉的，瓦是村集体的，工钱记在村里的\"公益事业\"账上。母亲站在新屋前手足无措，说这得花多少钱啊。你安慰她说没多少。那笔账最后变成了村里修水渠的一部分，报销单上写着\"水渠附属工程\"。\n","effects":{"money":1,"risk":2,"merit":0,"pop":-3,"net":3,"family":5,"stress":3,"clean":-4},"flag":"took_first_bribe","unflag":null,"ending":null,"next":null},{"label":"拖一拖，先修最漏那间","text":"\n你买了两卷油毡，自己开车回去铺了堂屋顶上的那一片。母亲很高兴，说这比瓦还管用。苏婉没说话，把择校费的单子收进抽屉里了。小满最后去了片区中学，每天骑车四十分钟。这件事在很多年后被你自己想起过很多次，每次想起来的细节都不一样，唯独那两卷油毡的味道始终没变。\n","effects":{"money":-1,"risk":0,"merit":0,"pop":0,"family":-3,"stress":4,"clean":0},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"找苟老四借三分利","text":"\n你去找了苟老四。他很客气，茶是好茶，话也好听，三万块当天到账，月息三分，不用抵押，不用签字，只要一句话。第一个月你还了息，第二个月也还了，第三个月开始有点吃力。苟老四说不着急，领导慢慢来。从那天起，你见到他就不太自在，而他见到你，总是笑得特别亲切。\n","effects":{"money":3,"risk":4,"merit":0,"pop":0,"net":2,"family":-2,"health":-2,"stress":9,"clean":-3},"flag":"hx_debt_gou","unflag":null,"ending":null,"next":null}]},{"id":"hx_008","title":"小秦那份八千字报告","text":"\n借调来的硕士秦远交了一份八千字的调研报告，说石门乡建档立卡户里，有四成是\"被脱贫\"：有人家里还住着危房，账本上却写着年收入一万三；有个寡妇的名字出现在三个不同的合作社分红表里，而她连合作社在哪都不知道。县委办的建议是压下来，理由很实在——年终考核下周就来，数据一改，全县的脱贫成绩单要重做。王有田在门外等着，说这娃不懂事，话讲得很难听。报告压在你手里，纸有点潮。\n","city":"胡悉市","min_rank":1,"max_rank":3,"weight":5,"once":true,"need":{"min_year":0},"tags":["扶贫","人事","同僚"],"options":[{"label":"力排众议，全乡重核","text":"\n你把报告印了四十份，摆在会桌上，一份一份发下去。会开了六个小时，中间摔了一个茶杯，摔的人是你。重核结果出来那天，石门乡退了一百七十六户，补了二百零三户，数据难看得没法看，年底考核被通报批评。省里却有个人记住了这份报告，三年后他提拔了你。秦远在离开前说：领导，我以后还敢写。\n","effects":{"money":0,"risk":-3,"merit":9,"pop":11,"boss":-4,"net":-4,"health":-1,"stress":9,"probe":-2,"clean":5},"flag":"honest_path","unflag":null,"ending":null,"next":null},{"label":"存档，把秦远调回去","text":"\n报告编号存档，锁进柜子。秦远两周后回了原单位，走那天没人送，只有司机老罗帮他搬了行李箱。他在楼梯口回头看了一眼办公楼，说这里好，就是字太多，纸太少。那份数据后来一直用到脱贫验收结束，直到有人把它做成图表挂在展厅里，配了说明：精准识别率百分之百。\n","effects":{"money":0,"risk":4,"merit":4,"pop":-7,"boss":4,"net":2,"stress":4,"probe":5,"clean":-6},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"删掉名字只报问题","text":"\n你让秦远删掉所有具体人名和数字，只留现象，改写成一份\"关于进一步提高识别精度的建议\"上报。报告发出去了，秦远保住了，问题也没被点破。省里的批复来了两页，措辞很温和。那份被删掉的原稿，秦远自己留了一份，装在一个牛皮纸袋里，压在宿舍的箱底。\n","effects":{"money":0,"risk":1,"merit":5,"pop":3,"boss":0,"net":2,"stress":5,"clean":0},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"把他调到身边当联络员","text":"\n你把秦远留在身边当联络员，说让他\"学学规矩\"。他学得很快，也写得越来越好，只是每份稿子末尾的\"存在问题\"一栏，字数越来越少。三年后他已经能替你在会上挡掉所有不好回答的提问。有一次喝多了，他忽然问：领导，我那时候写的那份报告，您还记得吗？你给他倒了杯茶，说喝茶。\n","effects":{"money":0,"risk":1,"merit":4,"pop":0,"net":6,"stress":3,"clean":-2},"flag":"hx_qin_aide","unflag":null,"ending":null,"next":null}]},{"id":"hx_009","title":"青龙峡的第一笔茶水费","text":"\n青龙峡是乌蒙山里一条二十里长的裂谷，水清得发黑，谷底有座没人说得清年代的石门，本地人管它叫\"老表门\"。省城来的冯大川，名片上印着\"大川文旅董事长\"，来考察了三趟，想拿三十年经营权，年租金八十万。旅游局的人私下说这价卖亏了，可县里欠着两亿的债，谁也不敢把人吓跑。第三趟临走那晚，在乌蒙宾馆吃完饭，冯大川的车开出十米又倒了回来，他从车窗递出一个牛皮纸袋，说领导这两年跑前跑后辛苦了，这是十万块\"考察费\"。纸袋沉甸甸的，压在你膝盖上。\n","city":"胡悉市","min_rank":2,"max_rank":4,"weight":5,"once":true,"need":{"min_year":1},"tags":["旅游","招商","工程"],"options":[{"label":"退回，公开挂牌竞价","text":"\n第二天你把纸袋原封退了回去，同时要求经营权必须公开挂牌。挂牌那天来了五家，冯大川最后以年租金一百九十二万拿下，多花了一百一十二万。他签字时笑了笑，说领导有原则，我服。县财政多了一笔稳定的进账，旅游局的人第一次在会上说你\"懂行\"。只是从那以后，冯大川再来乌蒙，从不主动给你打电话。\n","effects":{"money":0,"risk":-3,"merit":7,"pop":9,"boss":2,"net":-4,"stress":5,"clean":4},"flag":"honest_path","unflag":null,"ending":null,"next":null},{"label":"收下，经营权内定","text":"\n纸袋在你宿舍的柜子里放了四个小时，然后进了床头柜。经营权评审那天，专家打分表上有两栏是空的，你说按\"综合实力\"酌情给分。冯大川以八十二万中标。签完合同他请你在包厢里喝了酒，说领导以后去省城，随时找我。那笔钱你没敢动，一直到第二年才敢往卡里存。\n","effects":{"money":10,"risk":3,"merit":3,"pop":-5,"boss":1,"net":4,"stress":4,"probe":2,"clean":-6},"flag":"hx_feng_deal","unflag":null,"ending":null,"next":null},{"label":"收一半，租金往上顶","text":"\n你留下四万，把剩下的六万推回去，说这钱我收一部分当辛苦费，但租金得涨到一百五十万，不然我这关过不去。冯大川愣了一下，随即大笑，说痛快。合同签得很快。县里多收了七十万，你多收了四万。多年后你反复回想这个下午，觉得那大概是你一生中性价比最差的一笔买卖。\n","effects":{"money":4,"risk":3,"merit":6,"pop":2,"boss":2,"net":3,"stress":5,"clean":-5},"flag":"took_first_bribe","unflag":null,"ending":null,"next":null},{"label":"不要现金，要两成干股","text":"\n你把纸袋推回去，说钱我不拿，我要项目公司两成的干股，写在别人名下，你替我代持。冯大川盯了你足有十秒，然后伸出手指头：一成五，多了我睡不着。你们在餐巾纸上签了字，签完把纸烧了。那年你一分钱没拿到，但每隔三个月，会有人往一张不记名的卡里打一次钱，备注写着\"分红\"。\n","effects":{"money":0,"risk":5,"merit":4,"pop":-2,"net":5,"stress":7,"probe":3,"clean":-7},"flag":"hx_feng_shares","unflag":null,"ending":null,"next":null}]},{"id":"hx_010","title":"云顶小镇只有一条街","text":"\n\"云顶小镇\"这个名字是冯大川起的，规划图上有一座仿古街、一个温泉度假区、一片星空营地，投资六亿。现实是：批下来的第一期只有一条三百米的街。麻烦在征地——三百二十亩，两个村，一百四十七户，补偿一亩三万八。村民说这点钱在县城买不到半个卫生间。冯大川要\"净地交付\"，合同上写死了日期。王有田出了个主意：量地的时候尺子松一松，坟头不算、田埂不算，多出来的面积折算成\"工作经费\"，账上走得干净。他把这话讲得像在讲一件农活。\n","city":"胡悉市","min_rank":3,"max_rank":4,"weight":5,"once":true,"need":{"min_year":1},"tags":["土地","旅游","信访"],"options":[{"label":"实测张榜，一分不差","text":"\n你从市里借来两台GPS，请了第三方测绘，面积一分一厘张榜公示，还加了一条：青苗和坟头都算。补偿总额多出四百三十万，冯大川骂了半个月，工期拖了两个月。签字那天，一个老太太拉着你的袖子，说这回是实数了。公示栏前围了三层人，有人看，有人抄，有人只是想确认自己的名字确实在上面。\n","effects":{"money":0,"risk":-2,"merit":8,"pop":11,"boss":0,"net":-5,"stress":8,"clean":4},"flag":"honest_path","unflag":null,"ending":null,"next":null},{"label":"默许松尺子，分成","text":"\n你没点头，也没摇头。王有田就懂了。量地用了十一天，比原计划多出四十七亩，折合一百七十八万，其中六十万进了\"工作经费\"的口袋，你拿了三十万。签字户一个没闹，因为每户都多补了两千块封口费。云顶小镇的街如期开工，开工那天放了礼花，礼花的碎纸落在还没收割的稻田里，红得刺眼。\n","effects":{"money":30,"risk":4,"merit":5,"pop":-12,"boss":2,"net":4,"stress":4,"probe":4,"clean":-7},"flag":"hx_land_trick","unflag":null,"ending":null,"next":null},{"label":"涨到四万二，换签字","text":"\n你把补偿提到一亩四万二，差的部分从\"配套扶持资金\"里挪。签字的队伍排得老长，最后剩七户不签。你一户户上门，坐在人家的堂屋里喝水、抽烟、听他们讲地里的收成，讲到第七户时，那家的男人说：领导，你比前几个实在。他签了字，手有点抖。\n","effects":{"money":0,"risk":1,"merit":6,"pop":5,"boss":-1,"net":2,"stress":6,"clean":1},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"限时搬迁，逾期强推","text":"\n你下了死命令：十五天。第十一天，两台挖掘机开进了还在长稻子的田里，二十几个干部手挽手站在前面。一个老头躺在了铲斗前，被四个年轻人抬走了，他的鞋掉在田里，一直没人捡。当天晚上全部签完。项目如期开工，市里发来贺信。三年后那条街上有十一家铺子，其中九家卖同一种木雕。\n","effects":{"money":0,"risk":8,"merit":6,"pop":-20,"boss":4,"net":1,"health":-2,"stress":10,"probe":13,"clean":-9},"flag":"hx_force_demo","unflag":null,"ending":null,"next":null}]},{"id":"hx_011","title":"黑水河三号井","text":"\n赵德贵的黑水河三号井，矿权今年到期。这个人开着一辆满是泥点的旧越野，说话慢，笑起来眼睛眯成一条缝，全县都知道他有钱，也知道他的手续不全——越界开采了两年，林地批文是补的，复垦保证金欠着三百六十万。续期要过县里五道关，每一道都得有人签字。他约你在矿区的一间板房里见面，桌上摆着矿泉水箱，箱盖掀开，里面是分装好的现金，一袋一袋码得整整齐齐，八十万。他说：领导，这钱在山上没处花，您替我想想去处。\n","city":"胡悉市","min_rank":3,"max_rank":5,"weight":5,"once":true,"need":{"min_year":1},"tags":["矿","招商","环保"],"options":[{"label":"补齐手续再谈续期","text":"\n你让人把那箱水抬回了他车上，说先缴清复垦保证金、补上越界开采的处罚，再来谈续期。赵德贵在板房里站了很久，最后说：行。三个月后他交了罚款，补了手续，续了五年。县财政进账一千一百万，是当年最大的一笔非税收入。他在签字时说：领导，您这是要我老命。你说：是要你按规矩活着。\n","effects":{"money":0,"risk":-3,"merit":7,"pop":6,"boss":2,"net":-4,"stress":6,"clean":4},"flag":"honest_path","unflag":null,"ending":null,"next":null},{"label":"收下箱子，续期十年","text":"\n你没有让司机帮忙，自己把箱子搬进了后备箱，八十万，压得后轮塌了一指。续期批了十年，越界那一段在图纸上被巧妙地改成了\"历史采空区\"。赵德贵后来每年冬天送一次\"年货\"，从不空手。县里的财政收入报表好看了一截，没人问那一截是从哪来的。只有国土所一个老技术员，反复来问过三次图纸的事。\n","effects":{"money":80,"risk":5,"merit":3,"pop":-8,"boss":1,"net":5,"stress":6,"probe":4,"clean":-8},"flag":"hx_zhao_deal","unflag":null,"ending":null,"next":null},{"label":"收一半，续五年加整改","text":"\n你从箱子里拿走三十万，剩下的让他拿回去，条件是续期只给五年，且必须在两年内完成边坡治理和污水处理。赵德贵讨价还价了半天，最后答应了。整改做了，做得很粗糙，但至少山沟里的水不再泛白。那三十万你一直没敢花，放在一个旧行李箱里，跟几件不穿的棉衣放在一起。\n","effects":{"money":30,"risk":4,"merit":5,"pop":-2,"boss":1,"net":3,"stress":5,"clean":-6},"flag":"took_first_bribe","unflag":null,"ending":null,"next":null},{"label":"不要现金，要两成干股","text":"\n你说钱我不拿，我入股。赵德贵这回笑不出来了，他说领导您这不合规矩。你说那八十万也不合规矩。最后你们谈成：一成半，由他表弟代持，不进工商登记，每年\"分红\"两次，现金。第一年分了四十七万，第二年九十三万。你每次数钱都要去山上的板房，因为只有在那里你才觉得安全。\n","effects":{"money":0,"risk":5,"merit":2,"pop":-5,"net":6,"stress":9,"probe":4,"clean":-9},"flag":"hx_zhao_shares","unflag":null,"ending":null,"next":null}]},{"id":"hx_012","title":"八千万怎么分","text":"\n上面下来八千万——以工代赈四千二，产业扶持三千八，文件上的要求写得密密麻麻。六个县区的一把手这几天全在市里住着，宾馆的走廊里从早到晚都是人，见面只握手，不说话。赖有财熬了两个通宵做出三套方案，前两套规规矩矩，第三套的最后一行写着\"产业引导基金一千二百万\"，投向栏是空的。市委书记郝明山把三套方案推到你面前，说你来拿主意，然后端着保温杯走了，杯盖没拧紧。\n","city":"胡悉市","min_rank":3,"max_rank":5,"weight":5,"once":true,"need":{"min_year":1},"tags":["财政","扶贫","人事"],"options":[{"label":"全部按因素法分配公示","text":"\n你选了第一套，把分配公式、各县系数、测算过程全挂在政府网站上，公示七天。公示期间接到四十一个电话，三十九个是来问公式的，两个是来骂的。八个项目最终落到村里的路上和水渠上，老百姓未必知道八千万这个数字，但他们走的路不再陷车。六个县的一把手，有三个从此不再主动给你打电话。\n","effects":{"money":0,"risk":-3,"merit":10,"pop":10,"boss":-3,"net":-5,"stress":8,"clean":4},"flag":"honest_path","unflag":null,"ending":null,"next":null},{"label":"截留两千万进统筹池","text":"\n你选了第三套。一千二百万进了\"产业引导基金\"，另有八百万以\"市级配套\"名义留在市里，账做得极漂亮，每一笔都有会议纪要。基金成立的第一年投了三个项目，两个亏损，一个不知所终。你在基金管委会的名单上是副主任，签字的时候手很稳。那一年的春节，来给你拜年的人比往年多了整整一倍。\n","effects":{"money":120,"risk":5,"merit":5,"pop":-6,"boss":3,"net":6,"stress":6,"probe":5,"clean":-8},"flag":"hx_fund_pool","unflag":null,"ending":null,"next":null},{"label":"留五百万应急，其余照分","text":"\n你在第二套上加了一笔：市级预留五百万应急资金，用于灾后修复，使用需集体研究、事后公开。这五百万后来真的用在了黑水河的一次山洪上，修了两座便桥。剩下的七千五百万按原方案分下去，各方都没话说。赖有财松了口气，说这个方案最\"经得起看\"。\n","effects":{"money":0,"risk":1,"merit":6,"pop":4,"boss":1,"net":2,"stress":4,"clean":1},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"全部押在云顶小镇","text":"\n你说服了所有人，把八千万中的产业部分集中投到云顶小镇，理由是\"集中力量办大事\"。反对的人不少，但你拍了板。小镇的街修得很快，三百米，青石板，两侧是统一门头的铺面。开业那天来了两个旅游团和十一个领导。第二个旅游团是三个月后，第三个是第二年。星空营地建在了一个常年起雾的山坳里。\n","effects":{"money":60,"risk":7,"merit":8,"pop":1,"boss":3,"net":4,"stress":10,"probe":4,"clean":-4},"flag":"hx_all_in_town","unflag":null,"ending":null,"next":null}]},{"id":"hx_013","title":"幸福新村的楼梯","text":"\n幸福新村是省里挂号的扶贫安置点，六栋楼，四百零八户，明年六月要交钥匙。承建方是马三炮的乌蒙建设。今天他蹲在你办公室门口抽烟，抽完第三根才开口：楼梯间的混凝土标号，能不能从 C30 降到 C25？他说这话时的口气，跟问\"今天吃啥\"差不多。你算了一下，六栋楼的差价大约是一百二十万。他还补了一句：反正山上也没人会去测。窗外，搬迁户的名单正贴在墙上，第一行的名字你认识。\n","city":"胡悉市","min_rank":3,"max_rank":5,"weight":4,"once":true,"need":{"min_year":1},"tags":["工程","扶贫","城建"],"options":[{"label":"按图施工，取样送检","text":"\n你让他滚，然后安排第三方检测机构住进工地，每层楼随机取芯，检测费从你的办公经费里出。马三炮骂骂咧咧地照做了，工期晚了二十天，他在背后说你是\"书呆子\"。交房那天，有个搬迁户的小孩在楼梯上跳了两百下，说这楼梯不响。你站在楼下，第一次觉得这二十天值。\n","effects":{"money":-1,"risk":-3,"merit":7,"pop":9,"boss":1,"net":-4,"stress":6,"clean":4},"flag":"honest_path","unflag":null,"ending":null,"next":null},{"label":"默许降标号，差价对半","text":"\n你说了一句\"你自己看着办\"，然后就没再问过。标号降了，差价一百二十万，你拿了六十万，用塑料袋装着，放在老家竹林的化肥袋里。房子如期交付，外墙刷得雪白，在山坡上很显眼。省里的验收组看了样板间，说好。第一场大雨之后，三号楼的楼梯间开始渗水，没人往深处想。\n","effects":{"money":60,"risk":5,"merit":4,"pop":-7,"net":4,"stress":5,"probe":4,"clean":-8},"flag":"hx_low_grade","unflag":null,"ending":null,"next":null},{"label":"标号不动，别处可以省","text":"\n标号你咬死了不给动，但允许他把外墙涂料换成便宜的、把绿化换成本地树苗。省下来三十万，你一分没要。房子交付时外墙颜色比效果图浅了两个色号，绿化是两排柏树，长得慢。马三炮说领导你会算账。三年后那两排柏树倒是活了，成了小区里唯一的阴凉。\n","effects":{"money":0,"risk":2,"merit":5,"pop":4,"net":2,"stress":4,"clean":-1},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"降标号，钱去做面子工程","text":"\n你同意降标号，条件是差价里的四十万拿出来，把安置点到国道的三公里路修了，还要立一块大石头，刻\"幸福新村\"四个红字。路修好了，石头立起来了，上级来调研的车可以直接开到楼下，领导们很高兴，照片上了内参。而三号楼的楼梯，在第四年的一次地震里，先塌了。\n","effects":{"money":40,"risk":6,"merit":7,"pop":2,"boss":3,"net":3,"stress":7,"probe":5,"clean":-8},"flag":"hx_low_grade","unflag":null,"ending":null,"next":null}]},{"id":"hx_014","title":"老林场的三千方木头","text":"\n老林场一万四千亩，三十七名职工，平均工龄二十四年，最大的五十九，最小的也四十一。改制方案摆在桌上：资产评估报告认定成材林八百方，作价二百四十万，买受方是外地的\"顺源木业\"，工商登记上的法人是个二十出头的姑娘，背后站着苟老四。林业局的老技术员喝多了拉着你说：那林子我走了一辈子，少说也有三千方。第二天一早，老工人李守林抱着一台报废的伐木机坐在林场门口，谁劝都不下来，说这是他爹用过的家伙。\n","city":"胡悉市","min_rank":3,"max_rank":5,"weight":4,"once":true,"need":{"min_year":1},"tags":["农业","维稳","城建"],"options":[{"label":"重新评估，公开挂牌","text":"\n你请了省里的一家评估机构重做，结果出来了：三千一百方。重新挂牌，顺源木业退出，最终由两家联合以九百六十万接手，职工买断金从人均六万涨到十四万。李守林自己从伐木机上下来了，下来时膝盖响了一声，他笑着说这玩意儿早就该换了。三十七个人里有二十二个留在了新公司。\n","effects":{"money":0,"risk":-3,"merit":8,"pop":10,"boss":0,"net":-4,"stress":7,"clean":4},"flag":"honest_path","unflag":null,"ending":null,"next":null},{"label":"快刀斩乱麻，低价转让","text":"\n你催着办完了手续，八百方，二百四十万，一周内成交。其中九十万以\"中介服务费\"的名义转了一圈，最后进了你的口袋。职工买断金人均六万，签字的那天排着长队，没人说话。李守林是被两个人架走的，他怀里的伐木机摔在地上，链盘摔断了。三个月后，林子被剃了头，卡车昼夜往外运。\n","effects":{"money":90,"risk":5,"merit":3,"pop":-13,"net":5,"stress":6,"probe":5,"clean":-8},"flag":"hx_lin_deal","unflag":null,"ending":null,"next":null},{"label":"提价三成，买断金上浮","text":"\n你和苟老四谈了三次，把成交价抬到三百二十万，条件是职工买断金上浮到人均八万五，且新公司必须优先录用原职工。苟老四点着头答应，转头只录用了九个人，其余的干了一个月就被\"优化\"了。你后来知道这事，打电话过去，他说领导，企业有企业的难处。\n","effects":{"money":0,"risk":2,"merit":5,"pop":3,"net":2,"stress":5,"clean":-1},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"不卖，改国家森林公园","text":"\n你把改制方案压了下来，改报国家森林公园，跑省里跑了十一趟，磨了两年。批下来那天，林业局的老技术员哭了。可森林公园的配套资金要地方自筹，县里拿不出，栈道只修了三百米就停了，游客来了找不到厕所。职工工资继续欠着，只是这次欠得心安理得。李守林说：树保住了，人快饿死了。\n","effects":{"money":0,"risk":6,"merit":9,"pop":5,"boss":1,"net":-3,"health":-2,"stress":11,"clean":2},"flag":null,"unflag":null,"ending":null,"next":null}]},{"id":"hx_015","title":"省城来的宋副书记","text":"\n宋知微，省里派来挂职的副书记，四十三岁，短发，说话不带\"嗯\"。来了三个月，退回两次礼品、拒了四场饭局，还在一次例会上问过一句：\"这笔钱最后进了谁的口袋？\"会议室里安静了整整五秒。她分管审计和督察，正好压在你这条线上。今天她发消息请你喝茶，办公室里只有她一个人，茶是自带的，杯子是自己洗的。她说：乌蒙山我来了三个月，听到的都是好话，我想听听别的。\n","city":"胡悉市","min_rank":3,"max_rank":5,"weight":5,"once":true,"need":{"min_year":1},"tags":["上级","审计","同僚"],"options":[{"label":"和盘托出，请她支持重查","text":"\n你把石门乡的数据、幸福新村的标号、老林场的评估，一桩一桩摆出来，讲了两个小时。她只做笔记，不表态。三个月后，市里悄悄启动了三个专项审计，两个科级干部被处理，你的名字出现在\"主动配合\"那一栏。同僚们看你的眼神变了，饭局上的座位也变了——你被挪到了靠门的位置。\n","effects":{"money":0,"risk":-5,"merit":8,"pop":7,"boss":4,"net":-5,"stress":9,"probe":-8,"clean":5},"flag":"hx_song_ally","unflag":null,"ending":null,"next":null},{"label":"只讲成绩，滴水不漏","text":"\n你讲了四十分钟，全是数据、亮点、典型经验，语速平稳，连自己都佩服自己。她一直笑着听，偶尔点头，最后说：讲得真好。她没有再问第二个问题。那之后她对你很客气，客气得像对陌生人。一年后她挂职期满回省城，走之前连一顿饭都没吃。你在她那份评语上，只有一个\"稳\"字。\n","effects":{"money":0,"risk":2,"merit":4,"pop":0,"boss":2,"net":1,"stress":5,"clean":-2},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"托关系把她调走","text":"\n你花了二十万，托省城的关系，让她\"因工作需要\"提前结束挂职，改去另一个市。事情办得很干净，她走的时候甚至没察觉。你松了一口气。半年后，你在省里开会，看见她坐在主席台侧面的位置上，手里拿着一份材料，抬头正好看见你。她笑了一下，什么也没说。\n","effects":{"money":-20,"risk":6,"merit":3,"pop":-2,"boss":-2,"net":3,"stress":8,"probe":10,"clean":-7},"flag":"hx_song_gone","unflag":null,"ending":null,"next":null},{"label":"主动请她查自己的旧账","text":"\n你挑了两件已经过去、金额不大、证据还在自己手里的事，主动交了出去，请她立案核查。她很意外，查了两个月，结论是\"程序瑕疵，已整改\"。你在全市大会上做了检讨，脸丢尽了，但从此没人再怀疑你别的账。苏婉在电视上看到检讨，问你真的假的。你说：检讨是真的。\n","effects":{"money":0,"risk":-7,"merit":4,"pop":2,"boss":3,"net":-3,"family":-2,"stress":10,"probe":-12,"clean":3},"flag":"reformed","unflag":null,"ending":null,"next":null}]},{"id":"hx_016","title":"这笔钱放在哪里","text":"\n两年下来，你手里攒了一百来万。它先是装在铁皮饼干盒里塞在宿舍床下，后来你换了三个地方藏，每换一次就失眠三天——柜子返潮、墙里生虫、司机老罗无意间的一句\"您这锁有点松\"。存银行要实名，买房要写名字，苏婉已经问过两回\"你哪来这么多项目奖金\"。苟老四说可以帮忙\"理财\"，月息一分五，不要手续。母亲在电话里说，老屋后头那片竹林今年长得特别好。\n","city":"胡悉市","min_rank":3,"max_rank":5,"weight":4,"once":true,"need":{"min_money":50},"tags":["家属","金融","同僚"],"options":[{"label":"主动退回，数字清零","text":"\n你分三次把钱退了回去：一次通过廉政账户，一次当面退还，一次以\"项目返还款\"的名义打回财政。退到最后一笔时，你在办公室坐了一整夜，脑子里算的不是钱，是那几个知道内情的人。此后你睡得着了，但也开始怕另一件事——有人会认为你终于要咬人了。\n","effects":{"money":-100,"risk":-8,"merit":3,"pop":3,"boss":-2,"net":-3,"family":-5,"stress":9,"probe":-10,"clean":6},"flag":"reformed","unflag":"took_first_bribe","ending":null,"next":null},{"label":"埋进老屋后的竹林","text":"\n三个周末，你开车回山里，把钱装进两层塑料布和一只旧高压锅，埋在竹林第三棵楠竹下面，上面栽了一丛茶花。母亲问你种那花干什么，你说好看。此后每次下雨你都担心竹根积水，每次山洪消息你都心跳加速。那丛茶花长得很旺，第二年开了十一朵，母亲数着数着就哭了，说你爹最喜欢茶花。\n","effects":{"money":0,"risk":-3,"merit":0,"pop":0,"net":0,"family":-1,"stress":5,"probe":-4,"clean":-1},"flag":"hx_money_buried","unflag":null,"ending":null,"next":null},{"label":"交给苟老四去放贷","text":"\n你把八十万交给苟老四\"理财\"。第一个月利息准时，第二个月也是。第三个月他说有个矿上的老板周转不开，能不能再投五十万一起做。你犹豫了一夜，投了。半年后账面数字翻了一倍，你却更睡不着了——因为你知道，那张纸上的数字，随时可能变成一张欠条或一份口供。\n","effects":{"money":30,"risk":6,"merit":0,"pop":-1,"net":4,"health":-1,"stress":8,"clean":-5},"flag":"hx_debt_gou","unflag":null,"ending":null,"next":null},{"label":"用亲戚名义买铺面","text":"\n县城新开的建材市场有两间铺面，你用表弟的名字买下，合同、印章、钥匙全在他那里，口头约定租金四六分。第一年租金收了六万八，你分到四万。表弟从此见了你就笑，笑得越来越殷勤，殷勤到让你后悔。苏婉问起那两间铺子，你说帮亲戚看的。她说：哦。\n","effects":{"money":0,"risk":3,"merit":0,"pop":0,"net":2,"family":2,"stress":4,"clean":-4},"flag":"hx_proxy_assets","unflag":null,"ending":null,"next":null}]},{"id":"hx_017","title":"水泥厂拍卖那一下","text":"\n县水泥厂终究还是走到了拍卖这一步。评估价三千二百万，起拍价两千一百万，报名三家，其中两家的法人分别是苟老四的司机和表侄女——这件事全县都知道，只有卷宗里不知道。厂门口坐着二十几个老工人，手里举着\"我们要吃饭\"的纸牌，纸牌是用水泥袋改的。劳一鸣在办公室里收拾东西，把一盆养了十年的君子兰搬出来放在走廊上，说这盆花我不要了，留给厂里。拍卖槌举起来的那一刻，你在后排，看见那两家的代表连价都没举。\n","city":"胡悉市","min_rank":3,"max_rank":4,"weight":5,"once":true,"need":{"min_year":1},"tags":["城建","金融","维稳"],"options":[{"label":"暂停拍卖，重评重来","text":"\n你当场叫停，理由是竞买人关联关系存疑。重新评估、重新公告，职工安置方案作为前置条件写进文件里。第三轮拍卖成交价三千零五十万，安置金人均十一万。苟老四没来，让人送来一个花篮，卡片上写着\"贺\"。劳一鸣那盆君子兰后来一直摆在厂门口，没人浇水，居然活了两年。\n","effects":{"money":0,"risk":-3,"merit":8,"pop":11,"boss":0,"net":-5,"stress":8,"clean":4},"flag":"honest_path","unflag":null,"ending":null,"next":null},{"label":"内定，收一百五十万","text":"\n你没叫停。槌落下去，两千一百五十万，苟老四的表侄女举的牌。半个月后，一笔以\"工程咨询\"名义走账的一百五十万，分四次到了你指定的卡上。工人的安置金人均六万三，签字的队伍排到街上。那盆君子兰被扔在了垃圾堆旁边，第二天不见了。\n","effects":{"money":150,"risk":5,"merit":5,"pop":-12,"boss":2,"net":6,"stress":6,"probe":5,"clean":-8},"flag":"hx_lin_deal","unflag":null,"ending":null,"next":null},{"label":"照拍，但安置条款写死","text":"\n拍卖照常进行，你唯一做的是把职工安置写进成交确认书，作为附加条件，违约不办过户。成交价两千三百万，安置金人均八万，且新厂必须录用一百二十人。苟老四当面答应得爽快，三个月后录用了七十一个，剩下的按\"自愿离职\"处理，每人多给了两千块。\n","effects":{"money":0,"risk":2,"merit":6,"pop":5,"net":2,"stress":5,"clean":-1},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"找自己人代持接盘","text":"\n你让一个信得过的老同学出面，凑了一家公司参与竞买，你出六十万，占暗股，其余由苟老四垫。厂子最终落到了你们手里，账面合规。第一年分红六十万，第二年厂子被改成了商砼站，生意忽然好了起来——因为全县的路都在修。你每次路过那两根大水泥罐，都会下意识把车窗摇上。\n","effects":{"money":60,"risk":8,"merit":4,"pop":-8,"net":5,"stress":10,"probe":8,"clean":-10},"flag":"company_x","unflag":null,"ending":null,"next":null}]},{"id":"hx_018","title":"乌蒙建设挂牌那天","text":"\n马三炮的施工队变成了\"乌蒙建设有限公司\"，资质从三级升到二级，办公室从工棚搬进了县城新盖的写字楼十六层，门口摆着两尊石狮子，比县政府的还大。挂牌那天放了二十八挂鞭炮，红纸屑铺满了半条街，环卫工扫了两个钟头。典礼上他请了市里两个部门的一把手，还请了冯大川。酒过三巡，他把一份\"顾问协议\"推到你面前，五年，每年顾问费，另加百分之五的干股——不用你出面，工商登记上写他小舅子的名字。他说：领导，公司是你看着起来的。\n","city":"胡悉市","min_rank":3,"max_rank":4,"weight":5,"once":true,"need":{"min_year":2},"tags":["工程","同僚","招商"],"options":[{"label":"只到场，不签字","text":"\n你去了，讲了六分钟话，讲的是安全生产和工程质量，说完就走。协议留在桌上，马三炮追到楼梯口，你说老马，我人到了就是给你面子了，别的东西我拿不动。他愣在那儿，笑了笑，说领导还是那个领导。此后你给他批的每一个手续都合规，也因此慢了三分。\n","effects":{"money":0,"risk":-2,"merit":5,"pop":4,"net":-4,"stress":5,"clean":3},"flag":"honest_path","unflag":null,"ending":null,"next":null},{"label":"在协议上签了字","text":"\n你签了字，用的是一个买来的身份证上的名字。第一年\"顾问费\"四十万，分两次给，都是现金，装在一个装茶叶的铁盒里。第二年涨到六十万。马三炮从此在酒桌上介绍你时不叫职务，叫\"我们公司的大股东\"，每次都被你瞪回去，可他下次还这么说。\n","effects":{"money":40,"risk":4,"merit":3,"pop":-1,"net":5,"stress":6,"probe":3,"clean":-7},"flag":"company_x","unflag":null,"ending":null,"next":null},{"label":"留下车，退回股份","text":"\n股份你退了，但他送的那辆二手越野你留下，说是\"借来跑山路\"，一借就是三年。三年里这辆车跑了十一万公里，车身上永远有泥，后备箱里永远有一把铁锹。它替你挡过三次塌方，也载着你去过两次不该去的地方。后来它被拍卖，成交价四万二。\n","effects":{"money":0,"risk":3,"merit":3,"pop":0,"net":3,"stress":4,"clean":-4},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"把公司做成总包平台","text":"\n你说，光有个资质没用，要做就做成全县的总包平台，交通、水利、安置房、土地整理，凡政府投资项目，都由乌蒙建设统一承接，再分包出去。你替他调了三个懂行的人，还帮他拿下了第一笔银行授信。当年平台的流水做到三个亿，你拿了八十万。全县的工程从此只有一个入口，很省事，也很可怕。\n","effects":{"money":80,"risk":7,"merit":7,"pop":-4,"net":7,"stress":9,"probe":6,"clean":-9},"flag":"company_x","unflag":null,"ending":null,"next":null}]},{"id":"hx_019","title":"转了三手的通村路","text":"\n一百零五公里通村公路，中标价四千三百万，中标人乌蒙建设。半年后你在现场发现，干活的不是乌蒙建设，是四个\"项目部\"，再往下是七个\"班组\"，最底层的十几个人，带着两台搅拌机和一辆三轮车，住在桥洞下。抽成是这么分的：乌蒙建设留百分之八，项目部留百分之十五，班组再留百分之二十。到真正铺路这一层，钱只剩六成。现场的监理姓马，是马三炮的表弟，昨天还在开挖掘机。\n","city":"胡悉市","min_rank":4,"max_rank":6,"weight":5,"once":true,"need":{"min_year":2},"tags":["工程","交通","审计"],"options":[{"label":"全面停工，清退转包","text":"\n你下了停工令，清退所有转包队伍，重新招标三个标段，并把两家转包企业列入黑名单。工期拖了七个月，上级通报批评两次。路最终修完了，路面厚度达标，雨季过后没翻浆。马三炮来找过你一次，站在门口说：领导，你把我饭碗砸了。你说：我把你的碗砸了，把别人的命留下了。\n","effects":{"money":0,"risk":-4,"merit":8,"pop":9,"boss":-2,"net":-6,"health":-1,"stress":9,"clean":5},"flag":"honest_path","unflag":null,"ending":null,"next":null},{"label":"默认，每年拿分成","text":"\n你把报告锁进了抽屉，说了一句\"注意质量\"。此后每年腊月，会有人送来一个装酒的纸箱，箱子里是现金，一百二十万，一分不多一分不少，像发工资。路修完了，验收合格，通车典礼上剪了彩。两年后，其中十七公里开始龟裂，养护队的人说，这路像是没骨头。\n","effects":{"money":120,"risk":5,"merit":4,"pop":-9,"net":5,"stress":5,"probe":5,"clean":-8},"flag":"hx_subcontract_ok","unflag":null,"ending":null,"next":null},{"label":"允许一层分包，不许再转","text":"\n你定了条规矩：允许一层专业分包，禁止二次转包，每层都要备案，项目经理必须到岗打卡。规矩贴在工地门口，执行了三个月，之后打卡机坏了两次，再之后也就没人提了。但至少在那三个月里，路修得比前后任何一段都好。\n","effects":{"money":0,"risk":2,"merit":5,"pop":3,"net":2,"stress":5,"clean":-2},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"换上自己人当监理","text":"\n你没有清退转包，而是把监理换成了自己人，把每一层的抽成比例、每一张假发票、每一份假考勤都捏在了手里。这些东西后来成了你的护身符，也成了你的催命符。有一年你在酒桌上喝多了，对马三炮说了半句：\"老马，你那些东西，我一份都没丢。\"他的脸当场就白了。\n","effects":{"money":40,"risk":6,"merit":5,"pop":-3,"net":5,"stress":9,"probe":4,"clean":-8},"flag":"hx_hold_evidence","unflag":null,"ending":null,"next":null}]},{"id":"hx_020","title":"苟老四的钱池子","text":"\n乌蒙小额贷的门脸上写着\"服务三农、普惠金融\"，柜台后面贴着利率表。实际情况是：它在全县十一个乡镇吸了三千一百多户的存款，月息二分放出去，资金池八千万，其中六千多万投在了矿上和楼盘上。你自己的一百二十万也在里面。昨天，一封举报信到了公安局，说这是非法吸收公众存款。公安局长把信送到你桌上，说：领导，立不立案，您一句话。他说话的时候，眼睛看的是墙。\n","city":"胡悉市","min_rank":4,"max_rank":6,"weight":5,"once":true,"need":{"min_year":2},"tags":["金融","黑恶","维稳"],"options":[{"label":"立即立案，一起冻结","text":"\n你签了字，包括冻结自己那笔钱——那一栏你填得比谁都快。冻结当天，小额贷门口坐了两百多人，有人哭，有人笑，有人举着存折喊政府。处置了一年半，散户兑付了七成。你的钱一分没回来，但你在处置会上睡得着，说话也硬气。苟老四被判刑那天，隔着囚车看了你一眼，没说话。\n","effects":{"money":-120,"risk":-6,"merit":10,"pop":13,"boss":3,"net":-6,"stress":12,"probe":-10,"clean":6},"flag":"honest_path","unflag":null,"ending":null,"next":null},{"label":"压下来，让他慢慢退","text":"\n你把信压了，让公安以\"证据不足\"回复。苟老四请你喝了顿酒，说领导这恩我记一辈子。此后他用了两年慢慢收缩资金池，对外叫\"业务转型\"。第三年他跑了一部分，剩下的坑由三千一百户人家自己填。有个老太太把存折烧了，说烧了就不欠她的了。\n","effects":{"money":20,"risk":7,"merit":3,"pop":-16,"net":4,"stress":10,"probe":13,"clean":-9},"flag":"hx_gou_protect","unflag":null,"ending":null,"next":null},{"label":"给三个月，先清退散户","text":"\n你给了他三个月，条件是散户本金一分不少、优先清退，利息免谈。他照做了，清退了八成，剩下的转成了\"股权\"，白纸黑字写着\"自愿\"。三个月里他瘦了十五斤，清退完那天来给你磕了个头。你说别磕，磕了我更难办。\n","effects":{"money":0,"risk":3,"merit":5,"pop":5,"net":3,"stress":8,"probe":5,"clean":-3},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"先拿回本钱加三成","text":"\n你先把自己那一百二十万连本带利一百五十六万提出来，然后才\"同意研究立案\"。钱到账的第二天，你在办公室里坐了四个小时，抽了半包烟。第三天，公安立案，资金池里剩下不到两千万。处置的时候，有个老大爷问你：领导，我的钱呢？你说：在追。\n","effects":{"money":36,"risk":8,"merit":3,"pop":-14,"net":2,"health":-2,"stress":11,"probe":12,"clean":-10},"flag":"hx_gou_protect","unflag":null,"ending":null,"next":null}]},{"id":"hx_021","title":"凌晨三点的那个电话","text":"\n凌晨三点十七分，赵德贵打来电话，第一句是\"领导，出事了\"。黑水河三号井掘进面冒顶，三个人被困，两个已经没了，一个还有气。他压着嗓子说：要是报上去，矿要停半年，安全生产一票否决，您今年这一关就难过；要是不报，三十万变八十万，三家家属每家八十万，签协议，谁也不说。电话那头有风声，还有人在低声哭。窗外，乌蒙山的夜浓得像墨。\n","city":"胡悉市","min_rank":4,"max_rank":6,"weight":5,"once":true,"need":{"min_year":2},"tags":["事故","矿","维稳"],"options":[{"label":"立即上报，启动救援","text":"\n你打了三个电话：应急、卫生、公安。四点半，救援队上了山。最后一个人救出来了，活了，落下一条腿。事故调查组进驻两个月，矿停产整顿，赵德贵被罚了六百八十万，全县安全生产考核被一票否决，你的年度评优没了。赵德贵在矿部对你说了句：领导，我不怪你，我服你。那语气比骂人还难受。\n","effects":{"money":0,"risk":-5,"merit":6,"pop":10,"boss":-3,"net":-6,"health":-2,"stress":12,"probe":-8,"clean":6},"flag":"accident","unflag":null,"ending":null,"next":null},{"label":"压下来，私了","text":"\n你说了一句\"先救人，别声张\"。人没救出来，协议签了三家，每家八十万，用的是矿上的\"困难补助\"名义。尸体在县医院停了两天，死亡证明写的是\"突发疾病\"。矿工们照常下井，只是没人再走那条巷道。清明节那天，有家属在矿口烧纸，被劝走了。\n","effects":{"money":50,"risk":9,"merit":4,"pop":-15,"net":4,"health":-3,"stress":14,"probe":18,"clean":-11},"flag":"accident","unflag":null,"ending":null,"next":null},{"label":"报事故，不报死亡","text":"\n你让它以\"一般性冒顶事故、无人员伤亡\"的口径上报了，救援照做，矿停了十五天。两个人的名字没有出现在任何一份报表上，他们的工资发到了年底。多年后，那份\"无人员伤亡\"的文件被翻了出来，盖章的人是你，签字的人是你，字迹工整。\n","effects":{"money":20,"risk":6,"merit":5,"pop":-4,"net":3,"stress":10,"probe":10,"clean":-8},"flag":"accident","unflag":null,"ending":null,"next":null},{"label":"上报，但找个替身担责","text":"\n事故如实上报，但责任被精心地推给了一个刚来两个月、连操作规程都没背全的临时安全员。他被判了三年。判刑那天他二十七岁，家里刚盖了房。你在会后问自己：这和瞒报有什么区别？答案是：瞒报害的是死人，这个害的是活人。两个都害。\n","effects":{"money":0,"risk":7,"merit":6,"pop":-3,"boss":2,"net":4,"stress":11,"probe":11,"clean":-9},"flag":"accident","unflag":null,"ending":null,"next":null}]},{"id":"hx_022","title":"茶叶钱修了交易楼","text":"\n一千八百万产业扶持资金，文件上写的是\"乌蒙山茶叶与中药材基地\"，一百二十七个合作社的名字附在后面，每个名字后面都是活生生的人。而县里最缺的是一座\"乌蒙山货交易中心\"——效果图上有玻璃幕墙和一块一百二十平米的电子屏。财政局算过：专款专用查得严，但可以用\"合作社+基地+农户\"的名义绕一圈，钱从合作社过一道手，再回到项目公司。赖有财把这条路径画成图，画得像一张地铁线路图。\n","city":"胡悉市","min_rank":4,"max_rank":6,"weight":5,"once":true,"need":{"min_year":2},"tags":["扶贫","审计","城建"],"options":[{"label":"一分不动，全部到户","text":"\n钱按名册打进合作社账户，一户一卡，张榜公示，审计组来查了两轮，没挑出毛病。一百二十七个合作社里，最后成活了四十一个，其余的茶苗旱死了大半。交易中心没盖，县城最热闹的地方至今还是那个露天的牛市。可每到采茶季，收购商的卡车能排三里地。\n","effects":{"money":0,"risk":-4,"merit":9,"pop":11,"boss":-1,"net":-4,"stress":7,"clean":5},"flag":"honest_path","unflag":null,"ending":null,"next":null},{"label":"挪一千二百万搞工程","text":"\n钱绕了一圈，进了交易中心的账户，工程由乌蒙建设总承包。玻璃幕墙用了国产的，电子屏只买了六十平米。你从里面拿了一百八十万。楼盖起来了，成了县城最高的建筑，晚上亮灯，很气派。而那一百二十七个合作社，收到了一笔\"基地建设预付款\"，每人四百三十块，从此再无下文。\n","effects":{"money":180,"risk":5,"merit":6,"pop":-11,"net":5,"stress":6,"probe":6,"clean":-9},"flag":"hx_poverty_misuse","unflag":null,"ending":null,"next":null},{"label":"只挪四百万，其余到户","text":"\n你只挪了四百万，盖了一座小型的产地冷链库，理由是\"为茶叶服务\"，勉强说得通。剩下的一千四百万到了户。冷链库后来真的用上了，每年能存三十吨鲜叶。只是那四百万的账目，在审计的时候被问了三次，每次你都解释得通，但每次都要多喝两杯酒。\n","effects":{"money":20,"risk":3,"merit":6,"pop":3,"net":2,"stress":6,"clean":-4},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"全填云顶小镇的窟窿","text":"\n云顶小镇二期资金链断了，一千八百万全部填了进去，账面上写成\"产业配套基础设施建设\"。小镇多了一条街，多了一座仿古戏台，多的这两样在开业那天来了三个领导，此后无人问津。而你在这个窟窿旁边，又亲手挖了一个更大的。\n","effects":{"money":60,"risk":8,"merit":6,"pop":-13,"boss":2,"net":3,"stress":11,"probe":9,"clean":-10},"flag":"hx_poverty_misuse","unflag":null,"ending":null,"next":null}]},{"id":"hx_023","title":"那封实名举报信","text":"\n举报信是国土所的老技术员写的，七页纸，署名、按手印，附了三样东西：一张改过的矿区图纸，照片拍的是同一个边坡的两个年份，还有一沓转账记录的复印件——收款账户的名字，你看着很眼熟。信先到了市纪委，按流程转回县里\"核实\"，于是它现在躺在你手上。三条指控里，两条是真的，第三条要命。办公室里只有你一个人，门没关严，走廊上有脚步声。\n","city":"胡悉市","min_rank":4,"max_rank":6,"weight":5,"once":true,"need":{"min_year":2},"tags":["信访","审计","上级"],"options":[{"label":"原件上报，自己回避","text":"\n你把原件封好上报，同时书面申请回避。三个月里你被叫去谈话九次，每次都在同一间屋子里，桌上的茶永远是凉的。最后两条查实，你受了处分，降了半级。老技术员在走廊上遇见你，什么都没说，只是把帽子摘了。你后来听说，他退休那年买了台相机。\n","effects":{"money":0,"risk":-7,"merit":4,"pop":6,"boss":3,"net":-7,"health":-2,"stress":13,"probe":-12,"clean":6},"flag":"reported","unflag":null,"ending":null,"next":null},{"label":"销毁，把他调走","text":"\n信进了碎纸机，声音响了十一秒。一个月后，老技术员被\"充实基层\"，调到海拔一千九百米的一个土管所，每天爬四十分钟山路。他没闹，也没再写。三年后他中风了，半边身子不能动，手抖得连笔都握不住。而那七页纸的复印件，据说还有一份。\n","effects":{"money":0,"risk":8,"merit":3,"pop":-9,"boss":1,"net":3,"stress":10,"probe":15,"clean":-10},"flag":"reported","unflag":null,"ending":null,"next":null},{"label":"删掉致命一条再查","text":"\n你留下了前两条，删掉了第三条，然后\"主动\"启动核查，查实整改，通报批评，处理了两个无关紧要的人。市纪委对\"自查自纠\"表示肯定。老技术员收到一份整改回复，看了很久，把它夹进了那本《林业调查手册》里，一直夹着。\n","effects":{"money":0,"risk":4,"merit":6,"pop":2,"boss":2,"net":2,"stress":9,"probe":6,"clean":-6},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"花钱找他买断","text":"\n你让一个中间人送去六十万，条件是撤诉、销毁所有底稿、从此不再提。他把钱收下了，第二天就退了回来，说：我不是要钱，我是要个说法。你听完愣了很久，然后做了一件更蠢的事——你让人去查他儿子开的那个小店。\n","effects":{"money":-60,"risk":7,"merit":2,"pop":-4,"net":2,"stress":12,"probe":10,"clean":-9},"flag":"reported","unflag":null,"ending":null,"next":null}]},{"id":"hx_024","title":"周五下午的三十七户","text":"\n周五下午四点，消息上来：石门乡三十七户人，因为安置房分配不公和征地款没到账，凑了钱租了两辆中巴，明天一早进省城。带头的是个叫周庆生的年轻人，在省城打过八年工，认得路，也认得信访局的门。郝明山把一张纸推过来：你想办法。维稳经费可以动，账走\"专项\"，不设上限。窗外天色发灰，两辆中巴停在村口的晒谷场上，车灯已经修好了。\n","city":"胡悉市","min_rank":4,"max_rank":6,"weight":5,"once":true,"need":{"min_year":2},"tags":["信访","维稳","扶贫"],"options":[{"label":"不拦，派工作组下村","text":"\n你没派人拦车，而是带着工作组住进了石门乡，一住二十三天。安置房分配方案推倒重来，摇号全程录像；征地款一笔笔核，追回了被村里扣了两年的一百九十万。第二十三天，周庆生带着几个人来送了一面锦旗，上面的字是打印的。郝明山说你这事办得\"太实在\"，语气不太像夸。\n","effects":{"money":0,"risk":-5,"merit":8,"pop":11,"boss":-4,"net":-5,"health":-2,"stress":10,"probe":-7,"clean":6},"flag":"honest_path","unflag":null,"ending":null,"next":null},{"label":"全员拦截，五包一","text":"\n中巴在县界被拦下了。三十七户，每户配五个人\"包保\"，一百八十五个干部在山里守了六天六夜。周庆生被请去\"喝茶\"三天，回来后不再说话。事情没闹大，市里发了通报，说你处置得力。只是从此以后，石门乡的人见了干部就关门，连狗都不叫了。\n","effects":{"money":0,"risk":9,"merit":4,"pop":-19,"boss":5,"net":2,"health":-2,"stress":11,"probe":16,"clean":-10},"flag":"hx_stability_fund","unflag":null,"ending":null,"next":null},{"label":"拦下一半，解决一半","text":"\n你挑出十七户诉求最具体的，当场解决了十四个；剩下二十户被\"劝返\"，每人发了两百块误工费。周庆生不在被解决的那一半里。他后来又去过两趟省城，第三次你去信访大厅接他，他说：领导，我不去了，我认命。那年他三十一岁。\n","effects":{"money":0,"risk":4,"merit":5,"pop":2,"boss":3,"net":2,"stress":8,"probe":7,"clean":-5},"flag":null,"unflag":null,"ending":null,"next":null},{"label":"陪他们一起去省城","text":"\n你上了第一辆中巴，坐在倒数第二排，一路没人说话。到了省城，你陪他们进了信访局的门，又陪他们出来，当天下午在省城一个小旅馆里现场办公，解决了十九条诉求。省里的同志问你是谁，你说我是来接人的。回程车上，有个老太太塞给你两个煮鸡蛋，还是热的。\n","effects":{"money":0,"risk":-4,"merit":9,"pop":9,"boss":-3,"net":-3,"health":-2,"stress":13,"probe":-6,"clean":5},"flag":null,"unflag":null,"ending":null,"next":null}]},{"id":"gn_001","title":"办公室的喜糖","text":"\n新提的副科长周慕之要结婚，喜糖一早摆满了每个人的办公桌。他把请柬双手送到你桌上，腰弯得比平时深，说家里老爷子一直念叨您，您要是不来，我这酒席就白办了。\n你翻开请柬：城西万福楼，一桌四千八，二十八桌。茶水间里同事已经算开了：科里二十七个人，行情最少六百，去了还得上\"领导席\"，端着杯子坐满两个钟头。\n微妙的是，上周你刚把开发区那个小项目的验收签字权交到周慕之手上。有人半真半假地说，这喜糖吃着烫嘴。你看着桌上那盒糖，包装比去年科里任何一个人的都厚。\n","city":"通用","min_rank":1,"max_rank":4,"weight":4,"once":true,"need":{},"tags":["酒局","同僚"],"options":[{"label":"人到场，礼从简","text":"\n你去了，坐满十分钟，随了两百块，酒杯里是白开水。周慕之的父亲从主桌追出来要敬你，你笑着按住他肩膀说老周你今天该高兴，别管我。\n第二天科里传出话来，说你\"架子大\"。但那盒喜糖你分给了门房和保洁，他们反倒记住了你。项目验收照常走程序，没多一句话。\n周慕之后来见你总有点讪讪的，像是欠着什么，又像是松了口气。\n","effects":{"money":-2,"risk":-1,"merit":1,"pop":2,"net":-1,"stress":1,"clean":2}},{"label":"随个大礼，场面做足","text":"\n你包了六千，还让办公室以科室名义送了一幅装裱好的字。酒席上你坐主桌，被灌了七杯，散场时周慕之的父亲塞给你一个信封，说\"您太客气，这点茶钱您留着打车\"。\n信封里是两万。你捏了捏厚度，塞进内袋，回家路上在车里坐了很久，把信封掏出来看了三遍，最后锁进了抽屉最下面一格。\n","effects":{"money":20,"risk":5,"merit":0,"net":4,"health":-2,"stress":5,"clean":-6,"probe":1},"flag":"took_first_bribe"},{"label":"不去，让秘书把礼带到","text":"\n你没去，让办公室小郑带了两百块和一份贺词。小郑回来学舌：主桌空了一个位子，周科长脸上有光也有尴尬。\n这事的妙处在于谁也说不出你错在哪，坏处在于全科室都记住了你\"不给面子\"。三个月后科里民主测评，你\"亲和力\"一栏低了两分。\n那两分，后来在晋升名单上很贵。\n","effects":{"money":-2,"risk":0,"net":-3,"boss":-1,"stress":2,"clean":1}},{"label":"借喜宴把验收权做实","text":"\n你不但去了，还当场宣布：开发区那个项目，验收由周慕之牵头，出了成绩算他的。一桌人都鼓掌，有人说您这是给年轻人铺路。\n半个月后，项目的施工单位老板\"顺便\"来谢你，留下一张卡，说\"周科长年轻，还得您多把关\"。卡里八万。\n你帮别人铺了路，路费有人替你出了。\n","effects":{"money":80,"risk":9,"merit":2,"net":6,"stress":6,"clean":-10,"probe":3},"flag":"took_first_bribe"}]},{"id":"gn_002","title":"殡仪馆的队伍","text":"\n老领导杜明远的母亲走了。杜明远退了六年，人脉却还热着，殡仪馆门口的队伍从早上七点排到中午，花圈摆出去三十米，本市有点头脸的都来了。\n你在队伍里站着，前面是财政局的老马，后面是城建口一个你不认识的年轻人。老马回头小声说，老杜这回收的礼金，够买半套房。\n轮到你时，杜明远红着眼睛握住你的手，握了很久没说话。他儿子在旁边记账，钢笔尖在纸上顿了一下，等你报名字。\n你摸了摸口袋里准备好的信封，厚度是昨晚反复掂量过的。\n","city":"通用","min_rank":1,"max_rank":6,"weight":3,"once":true,"need":{},"tags":["酒局","上级","同僚"],"options":[{"label":"随常礼，帮忙守夜","text":"\n你随了两百，然后脱下外套，在灵堂帮着守了半宿。夜里三点，杜明远给你端来一碗热粥，说这些年，肯坐下来说话的没几个。\n半年后你那个卡在半路的调岗报告，被人从一堆材料里抽了出来，批了。批件上没人提过你的名字，但你知道那碗粥值多少钱。\n这世上最不划算又最划算的买卖，就是陪人熬一夜。\n","effects":{"money":-2,"risk":0,"net":6,"boss":4,"health":-3,"stress":4,"family":1,"clean":2}},{"label":"厚礼送到账房","text":"\n信封里是八万，你递过去时手很稳，报的单位和名字都很清楚。记账的年轻人抬头看了你一眼，把数字写得比别人大一号。\n杜明远没说什么，只是握你的手又紧了紧。三天后，市里几个老资格在茶楼喝茶，有人提到你，说这人\"懂事\"。\n\"懂事\"两个字传开了，你的礼金也进了别人的耳朵。账房那本册子，以后会在某个不合适的场合被翻出来。\n","effects":{"money":-80,"risk":6,"net":8,"boss":5,"stress":5,"clean":-4,"probe":2},"flag":"has_faction"},{"label":"人不到，礼也不到","text":"\n你那天在外地出差，发了唁电，礼金没随。回来后有人告诉你，杜明远的儿子在酒桌上说了句\"现在的人啊\"。\n这句话很轻，飘了半年，飘到你一次关键考察的桌面上。有人问：这个人，群众基础怎么样？\n你什么都没省下，也没得到什么。官场的账，欠着比还了更贵。\n","effects":{"risk":0,"net":-5,"boss":-3,"merit":0,"stress":2,"clean":0}}]},{"id":"gn_003","title":"二十年同学会","text":"\n大学同学毕业二十年聚会，组织者是你下铺的老费。老费这些年做建材，腰围和嗓门一起涨，在群里拍胸脯说全程他买单，谁也别掏钱。\n包厢设在金鼎阁三楼，来了十九个。当年睡你上铺的程一鸣现在是省报的记者，进门就笑着跟你握手，握完还多捏了一下。做工程的罗胖子迟到四十分钟，一进门就喊着要罚酒，说今天谁也不能提前走。\n酒过三巡，老费把主位让给你，说咱们班就你最有出息。罗胖子顺势把一杯酒推过来，说明年城东那块地，哥几个想跟你\"合作一把\"。\n程一鸣没说话，慢慢转着手里的杯子，杯沿上有个小小的红点在闪。\n","city":"通用","min_rank":2,"max_rank":7,"weight":4,"once":true,"need":{},"tags":["酒局","同僚","网络"],"options":[{"label":"只叙旧，不谈事","text":"\n你笑着把话头拨开，说今晚只准说当年谁追谁，谁也不许提工作。老费起哄，程一鸣笑得最响。\n散场时罗胖子有点讪讪的，你拍拍他肩膀说，生意上的事，明天去我办公室排队。第二天他真来了，拿着正规材料，走了正规流程。\n多年以后你才明白，那一晚你躲过的不是一杯酒，是一整条绳子。\n","effects":{"money":0,"risk":-2,"net":3,"pop":2,"health":-2,"stress":2,"clean":3}},{"label":"半醉半醒地应下","text":"\n你端起那杯酒，说\"回头再说\"。这四个字是官场里最便宜也最贵的承诺。\n一周后罗胖子带着方案上门，你没签字，但给了一个\"可以先干前期\"的口风。就这个口风，他拿去在银行贷了三千万。\n年底你收到一张卡，六十万，附言写着\"同学情谊，不必记账\"。你看着那行字，忽然想起老费当年帮你抄过的笔记。\n","effects":{"money":600,"risk":12,"net":5,"boss":1,"stress":8,"clean":-12,"probe":4},"flag":"took_first_bribe"},{"label":"把话挑明，当场翻脸","text":"\n你把酒杯放下来，说老罗，城东那块地明年公开挂牌，你要真有本事就去举牌，别在这桌上讲。包厢静了三秒，老费赶紧打圆场。\n程一鸣在桌下踢了你一脚，眼里带着笑意。后来那块地果然公开出让，罗胖子没中标，见了你绕着走。\n你成了一个\"不好说话\"的人。这三个字，日后救过你，也耽误过你。\n","effects":{"money":0,"risk":-3,"merit":3,"pop":4,"net":-4,"stress":5,"clean":5},"flag":"honest_path"},{"label":"借机把程一鸣拉成自己人","text":"\n你没接罗胖子的话，反倒端着杯子坐到程一鸣身边，聊了一晚上大学时的旧事。临走时你说，以后有什么想写的，先来找我。\n半年后，市里一篇关于开发区违规用地的稿子，被程一鸣压了三天才发，发出来时已经删掉了最要命的两段。\n你用一晚上的旧情，买了一条很细、但很结实的线。\n","effects":{"money":0,"risk":-1,"net":7,"pop":1,"stress":3,"clean":1},"flag":"media_friend"}]},{"id":"gn_004","title":"同乡会的会长","text":"\n本市的川平老乡会每年冬至聚一次，今年轮到你这一届牵头。做了二十多年建材生意的关五爷把一沓钱拍在桌上，说会长你来当，钱我们出，你只要把名字挂上。\n老乡会里三百多号人，有开超市的、跑运输的、包工地的，也有两个在市局当副职的。关五爷说得实在：有个当官的老乡挂名，大家办事心里有底。\n你翻了翻那本名册，一半是生意人，还有十来个名字后面画着圈。关五爷说，画圈的这十几个，今年都\"有点事要麻烦您\"。\n桌上的火锅咕嘟咕嘟冒着泡，热气里全是熟脸。\n","city":"通用","min_rank":2,"max_rank":6,"weight":3,"once":true,"need":{},"tags":["酒局","同僚","黑恶"],"options":[{"label":"不当会长，只交会费","text":"\n你把名字划掉，交了两千块会费，说会长得选个时间宽裕的，我这个位置不方便。关五爷笑了笑没勉强，转身把会长给了开连锁超市的姚胖子。\n冬至聚餐你去了，吃完就走。老乡们说你这人实诚，也有人说你这人\"端着\"。\n那十几个画圈的名字，后来再没找过你。你少了十几个麻烦，也少了十几个机会。\n","effects":{"money":-2,"risk":-2,"net":2,"pop":2,"stress":1,"clean":3}},{"label":"挂名收下辛苦费","text":"\n你当了会长，关五爷送来二十万\"活动经费\"，用牛皮纸袋装着，说这是规矩，历任都有。\n接下来一年，你替老乡们打了十七个电话：一个违章拆迁少赔了三万、一个运输车被扣了、一个工地的安全检查能不能缓两天。每一个电话都不算大，加起来却像一根根细线，把你缠进了一张网。\n年底关五爷又来了，这回的纸袋厚了一倍。\n","effects":{"money":200,"risk":10,"net":8,"boss":-1,"stress":7,"clean":-12,"probe":3},"flag":"has_faction"},{"label":"当会长，但只办合法的事","text":"\n你当了会长，但立了条规矩：老乡会的钱进公账，账目每季度贴在群里，谁也不许拿会费做生意。\n你替老乡办过几件事——一辆被误扣的货车、一个拖了三年的工伤认定——都是按规定该办的，只是没人替他们说话。\n关五爷有点失望，慢慢不来了。但第二年老乡会多了七十个人，都是冲着那本公开的账来的。\n","effects":{"money":0,"risk":-1,"merit":4,"pop":8,"net":4,"stress":4,"clean":4},"flag":"honest_path"}]},{"id":"gn_005","title":"节前的礼单","text":"\n中秋前一周，办公室小郑把一沓快递单放在你桌上，说这几天收发室有点挤。你随手翻了翻：海鲜券、茶叶、月饼券、一张健身卡，还有两张没有署名的购物卡。\n秘书老周进来送文件时扫了一眼，什么也没说，只是把茶杯往你手边推了推。\n你想起去年这个时候，隔壁处的一个副处长因为收了十二张卡被通报，金额一共四万八，处分是党内严重警告。四万八，在今年的行情里，只够两个老板的\"心意\"。\n手机响了，是本市做市政工程的正通建设老板胡保民，说想\"节前过来坐坐\"，车已经到楼下了。\n","city":"通用","min_rank":3,"max_rank":7,"weight":4,"once":true,"need":{},"tags":["酒局","工程"],"options":[{"label":"全部登记上交","text":"\n你把二十七件礼品一件件登记，连同那两张无主购物卡一起交到机关纪委，回执复印了一份留底。小郑拍照的手有点抖，说这样会不会太……\n会不会太什么，他没说出来。年底考核，你的\"廉洁自律\"一栏是满分，而那个满分在述职会上被人提了一句，语气很微妙。\n你交上去的不只是卡，也是一种态度：你不怕得罪人，别人也就开始防着你。\n","effects":{"money":0,"risk":-5,"merit":3,"net":-3,"boss":2,"stress":3,"clean":6,"probe":-2},"flag":"honest_path"},{"label":"只留卡，别的退回去","text":"\n你把海鲜券茶叶月饼都退了，只留下那两张没署名的购物卡，各两万。没署名，就意味着没人知道你收过，也意味着没人能证明你没收。\n胡保民的车在楼下等到六点半，你没见他，但第二天他发了条消息：祝您阖家团圆。\n那四万块你花得很省，一张给妻子买了首饰，一张自己留着。妻儿戴上首饰那天笑得很开心，你看着那笑，心里忽然有点虚。\n","effects":{"money":40,"risk":6,"family":3,"net":3,"stress":6,"clean":-8,"probe":2},"flag":"took_first_bribe"},{"label":"让胡保民上来坐坐","text":"\n你让老周把人带上来。胡保民进门先道歉，说节前打扰，然后从包里拿出一盒\"茶叶\"，盒底沉着三十万现金。\n他说得客气：今年市政那两个标段，我们想参与一下，规矩我们懂。你把茶叶盒推回去一半，说参与可以，走程序。他笑着把盒子又推了回来。\n那个下午办公室的空调一直响着，你出了不少汗。\n","effects":{"money":300,"risk":14,"net":6,"boss":1,"stress":10,"clean":-14,"probe":5},"flag":"company_x"},{"label":"把礼单贴在楼道里","text":"\n你让人把这一周的礼品登记造册，包括送礼人姓名、单位、物品，贴在机关大楼一楼的公示栏上，标题叫\"节前礼单\"。\n整个楼炸了锅。有人骂你出风头，有人连夜来把自己的东西取回去，还有三个处长整整一个月没跟你说话。\n第二年中秋，收发室空了。你成了全机关最不受欢迎的人，也成了唯一一个过节能睡安稳觉的人。\n","effects":{"money":0,"risk":-8,"merit":5,"pop":6,"net":-8,"boss":1,"stress":8,"clean":8,"probe":-4},"flag":"honest_path"}]},{"id":"gn_006","title":"酒桌上的一句话","text":"\n开发区二期推介会后，你被留下来陪外地来的客商吃饭。做物流园的卓盛集团老板陆延年五十出头，酒量极好，敬酒时总把杯沿压得比你低。\n喝到第八杯，他说要在本市投十二个亿，条件是\"拿地价格能不能参照隔壁老城那块\"。你脑子飞快转了一圈，那块地的底价你心里有数。\n陆延年给你斟满，说您一句话，我明天就把可研报告递上来。桌上六双眼睛都看着你，市里分管招商的副秘书长在旁边含笑不语，显然乐意让你来当这个\"一句话\"的人。\n酒很顺，话很滑，出口就收不回来了。\n","city":"通用","min_rank":3,"max_rank":7,"weight":4,"once":true,"need":{},"tags":["酒局","工程","招商"],"options":[{"label":"只能说走程序","text":"\n你说地价是集体决策，我一个人说了不算，明天让国土局把政策一条条给您讲清楚。陆延年愣了一下，随即大笑，说您这话我爱听，说明这地方规矩。\n他最终还是投了，只是土地走了公开挂牌，多花了六千万。市里有人说你\"不会来事\"，也有人在会上说，这个项目经得起查。\n三年后卓盛集团在全国出事，牵出一串人，唯独本市这一单，卷宗里干干净净。\n","effects":{"money":0,"risk":-4,"merit":8,"pop":4,"boss":4,"net":2,"stress":4,"clean":5}},{"label":"暗示底价收咨询费","text":"\n你没说数字，只说了句\"参考老城那块，上下浮动你们自己算\"。这句话在酒桌上值钱，在卷宗里也值钱。\n一个月后挂牌，卓盛以底价加一块钱拿地。陆延年送来一份\"产业咨询协议\"，咨询费两百万，签给了一家你表弟名下的公司。\n你在协议上签的字，笔迹鉴定那天，你想起的是那晚酒的温度。\n","effects":{"money":2000,"risk":18,"merit":3,"net":6,"stress":12,"clean":-18,"probe":8},"flag":"company_x"},{"label":"拖到明天，先不表态","text":"\n你举杯打太极，说这么大的事得回去研究，今天只喝酒。陆延年笑着不再追问，散场时却只跟你握了下手，没再提你名字。\n第二天你把这事原原本本报给了市长办公会，由集体定调。地价最终打了九折，属于政策允许范围。\n陆延年少赚了一点，市里少担了一点风险，你也少了两百万。这笔账，要到很久以后才算得清。\n","effects":{"money":0,"risk":-2,"merit":5,"boss":3,"net":0,"stress":3,"clean":3}},{"label":"当场拍板，做足政绩","text":"\n你借着酒劲一锤定音：地价按老城那块走，三个月内开工，一年内主体封顶，写进协议。全场鼓掌，副秘书长当场给你满上。\n项目成了你任内最大的招商成绩，开工仪式上市长亲自剪彩，你的名字上了省报。只是协议里那三条违约条款，后来一条都没被执行。\n政绩是块好布，盖得住很多东西——盖到盖不住的那天为止。\n","effects":{"money":0,"risk":8,"merit":12,"pop":6,"boss":6,"stress":8,"clean":-2,"probe":2}}]},{"id":"gn_007","title":"散场之后","text":"\n接待省里一个检查组，晚上按惯例安排了饭。组里年轻的处长谭越不合群，被同桌的人连着劝了十一杯，说小谭不喝就是看不起基层。\n你替他挡了三杯，剩下八杯他喝了。散场时他脸白得像纸，扶着墙说自己没事，让司机先走。\n凌晨两点，酒店打来电话：谭越在房间里呕吐后昏迷，送医抢救。你在赶去的路上，脑子里反复转的不是他的病情，而是明天检查组的报告还写不写、怎么写。\n急诊室走廊的灯惨白，几个陪过酒的人站在角落，谁也不看谁。\n","city":"通用","min_rank":2,"max_rank":7,"weight":3,"once":true,"need":{},"tags":["酒局","事故","上级"],"options":[{"label":"全力抢救，如实上报","text":"\n你打通了市中心医院最好的急诊通道，救人第一。天亮后你按规定向省里报了情况，没遮没掩，连谁劝的酒都写了。\n检查组的报告照常出，问题照常列，本市被通报了三项。谭越脱离危险后托人带了句话：谢谢。\n你的名字在省里挂了号——不是红名单，也不是黑名单，是一个\"说实话\"的记号。这种记号，用得上一次就够了。\n","effects":{"money":-30,"risk":2,"merit":-3,"pop":3,"boss":2,"net":2,"health":-2,"stress":12,"clean":4}},{"label":"压下消息谈成意外","text":"\n你连夜和酒店、医院、随行人员统一口径：谭越睡前喝了自带的酒，属个人行为。家属那边送去三十万\"慰问金\"，签了谅解说明。\n检查组的报告第二天照发，问题从十一项变成了四项。省里没人再提那晚的事，市里夸你会办事。\n只有谭越出院后再没来过本市，逢人便说这边酒太凶。你保住了一份报告，也丢了一个人的信任。\n","effects":{"money":-300,"risk":12,"merit":4,"boss":4,"net":3,"stress":15,"clean":-12,"probe":6},"flag":"accident"},{"label":"顺势借检查组压人","text":"\n你守了一夜，第二天当着检查组的面把本市陪酒劝酒的陋习批了一顿，还当场宣布公务接待一律上白水。这话传到省里，被当成\"作风整顿\"的典型。\n谭越是救回来了，检查报告却因为你这番表态写得更细——你把刀递给了别人，也顺手磨了磨刃。\n底下人背地里骂你翻脸比翻书快。\n","effects":{"money":-10,"risk":-1,"merit":6,"pop":5,"boss":3,"net":-5,"stress":10,"clean":3}}]},{"id":"gn_008","title":"代驾的那一脚","text":"\n从饭局出来已经十一点半，司机老陈被你放了假，你叫的代驾是个二十出头的小伙子，姓殷，说话轻声细语。\n车开出两条街，你靠在后座上闭眼，脑子里还在盘白天那个拆迁协调会。忽然一声闷响，车头猛地一顿。\n你睁开眼，看见一个人从车前盖上滚下去，躺在地上不动了。殷姓小伙手足无措，回头看你，眼里有种很直白的恐惧：他没钱，也没保险。\n路边的监控摄像头红灯一闪一闪。你身上有三两酒气，手机里有十七个未读消息，其中三条来自同一个老板。\n","city":"通用","min_rank":2,"max_rank":6,"weight":3,"once":true,"need":{},"tags":["事故","酒局","网络"],"options":[{"label":"先救人，报警，等处理","text":"\n你下车打了急救和报警电话，把人送上救护车，自己站在原地等交警。酒精检测结果是二十七，属于酒驾。\n拘留七天、暂扣驾照、全市通报。通报贴出来那天，你在办公室待到很晚。伤者是轻度骨折，康复后你前后赔了十二万，全是自己掏的。\n处分决定念到\"该同志主动救助伤者、如实说明情况\"时，会场上有人抬头看了你一眼。\n","effects":{"money":-120,"risk":6,"merit":-5,"pop":4,"boss":-3,"net":-2,"health":-3,"stress":16,"clean":2}},{"label":"让司机老陈来顶","text":"\n你给老陈打了电话。二十分钟后他赶到，穿着你的外套坐在驾驶座上，说车是他开的。老陈跟了你六年，儿子刚考上大学。\n保险公司赔了大半，你额外给了老陈五万。事情压了下去，没人知道后座上有人。\n只是从那天起，老陈在你面前说话总低着头，而你也开始不敢坐他开的车——你们俩都知道那件事，这就够了。\n","effects":{"money":-50,"risk":14,"net":1,"stress":14,"clean":-14,"probe":5},"flag":"driver_cover"},{"label":"先垫钱安抚住伤者","text":"\n你让在场的人先垫付医药费，又交代办公室主任去和家属谈，别提你，只谈钱。家属收了四十万，签了不追究的书面材料。\n交警那边按普通交通事故处理。监控录像三天后被例行覆盖。\n事情平了，但那个代驾小伙殷某后来找过你两次，第一次来道谢，第二次来借钱，第三次没来——有人看见他在网上发了一段含糊的话，配图是车牌子。\n","effects":{"money":-400,"risk":16,"stress":15,"clean":-16,"probe":8},"flag":"blackmailed"}]},{"id":"gn_009","title":"这杯你必须喝","text":"\n上级来调研的饭局上，分管副市长邹衍端着杯子走到你面前。他今年五十七，传闻还要再进一步，说话时喜欢拍人肩膀。\n邹市长说，小同志，我这杯你随意，我干了。桌上所有人都停下来看着你。你胃里刚做完检查，医生在报告上写了\"建议戒酒\"四个字。\n更麻烦的是，坐在邹市长旁边的，是本市做工程起家的女老板桑玉玲，她手里握着你们单位今年三个标段的预审资格。\n邹市长喝完，把杯口朝下亮了亮。桑玉玲笑着给你斟满，说咱们领导都干了，您不会不给面子吧。\n","city":"通用","min_rank":1,"max_rank":5,"weight":4,"once":true,"need":{},"tags":["酒局","上级"],"options":[{"label":"亮出病历，以茶代酒","text":"\n你把胃镜报告从包里掏出来，平摊在桌上，说邹市长，医生的话我不敢不听，这杯我用茶，心意全在。桌上静了两秒，邹衍哈哈一笑，说身体是革命本钱，喝茶的同志我欣赏。\n桑玉玲的笑淡了一点。那三个标段的预审，后来一个都没给她。\n你胃疼了三天，但那三天你睡得很好。有些面子丢了，是赚的。\n","effects":{"money":0,"risk":-2,"merit":2,"net":-2,"boss":-1,"health":3,"stress":4,"clean":4}},{"label":"干了，然后去洗手间","text":"\n你一饮而尽，然后去洗手间抠喉咙吐掉，回来又陪了两杯。桑玉玲全程笑意盈盈，散场时她\"顺路\"送你，说跟您这样的人打交道痛快。\n半个月后，一个标段的预审材料里少了三页关键业绩证明，是她补的。你假装没看见。\n你的胃出血了一次，住了六天院。医生问你喝了多少，你说记不清了——其实你记得很清楚，是三杯。\n","effects":{"money":150,"risk":10,"net":5,"boss":4,"health":-12,"stress":10,"clean":-10,"probe":3},"flag":"took_first_bribe"},{"label":"替领导挡下，再喝三杯","text":"\n你抢过邹市长的杯子说，领导这杯我替您喝，说完连干三杯。桌上叫好声一片，邹衍拍着你后背说了句\"好小子\"。\n那天你断片了，醒来在自家床上，妻子坐在床边不说话。邹衍记住了你，年底把你调进了他分口的重点办。\n你的胃变成了一块用旧了的抹布，但你的名字进了他的本子。这笔买卖贵不贵，要看他能走多远。\n","effects":{"money":0,"risk":3,"merit":4,"net":6,"boss":8,"health":-14,"stress":12,"family":-4,"clean":-2}}]},{"id":"gn_010","title":"一晚两桌席","text":"\n同一天晚上，两个饭局撞了。东边云来宾馆是本市老资格的土方老板佟大勇做东，请了市里管城建的副主任；西边金鼎阁是新来的新能源投资商，指名要见你，还托了省里一位老领导打了招呼。\n两边都说了\"您不到场，这顿饭就没意义\"。佟大勇跟了你十二年，去年你儿子出国他出了十万；新能源那边是省里点名要盯的项目。\n司机老陈在楼下等，问您先去哪边。手机里两个未接来电，一个是佟大勇，一个是省里那位老领导的秘书。\n雨下起来了，挡风玻璃上的水痕把路灯拉成一条条线。\n","city":"通用","min_rank":3,"max_rank":8,"weight":3,"once":true,"need":{},"tags":["酒局","上级","招商"],"options":[{"label":"两边各露十分钟","text":"\n你先去云来宾馆，端杯说了三句话，又把佟大勇拉到门口说了句\"城西那块地你得排队\"，然后赶去金鼎阁。新能源那边已经吃完主菜，你自罚三杯赔罪。\n两边都算给足了面子，两边也都看出了你在赶场。佟大勇后来跟人说，领导就是领导，忙。\n你保住了两个关系，也埋下了一个隐患：两边都知道，你谁也不想得罪。\n","effects":{"money":0,"risk":2,"net":4,"boss":2,"health":-4,"stress":8,"clean":-1}},{"label":"去省里点名的那桌","text":"\n你给佟大勇发了条消息说临时有会，转头去了金鼎阁。新能源项目谈得很顺，省里那位老领导第二天亲自给你打电话表扬。\n佟大勇回了个\"理解\"。但半个月后城西那块地的预审材料里，佟大勇的公司业绩被挑出两处硬伤，是他自己没弄好，也可以说是没人再替他说话。\n你在省里多了一分，在本市少了一个跟你十二年的老关系。\n","effects":{"money":0,"risk":0,"merit":6,"net":2,"boss":7,"stress":5,"clean":2}},{"label":"两桌都不去，回家吃饭","text":"\n你给两边各发了一条致歉，说身体不适，改日另行赔罪，然后关了手机，回家吃了妻子煮的一碗面。\n第二天佟大勇送来一箱药，新能源那边送来一份更厚的合作方案，谁也没翻脸。你反而发现，不去的时候，别人更急着把东西送到你面前。\n只是省里那位老领导从此没再给你打过电话。他没记恨，他只是忘了你。\n","effects":{"money":0,"risk":-2,"net":-1,"boss":-3,"family":6,"health":2,"stress":-6,"clean":3}},{"label":"让佟大勇去陪新能源","text":"\n你想了个\"妙招\"：把佟大勇叫到金鼎阁，介绍给新能源那边做土方合作。一桌变一桌，两边都满意。\n半年后，土方工程以高于市场价百分之三十的价格包给了佟大勇，新能源项目成本超了两千万。审计组进场那天，问的第一个问题就是：这个土方队是谁介绍的？\n你在酒桌上省下的那点时间，全赔进了会议室。\n","effects":{"money":500,"risk":20,"merit":4,"net":5,"stress":12,"clean":-16,"probe":9},"flag":"company_x"}]},{"id":"gn_011","title":"口袋里的红点","text":"\n饭吃到一半，做环保设备的女老板岑小满起身去洗手间，回来时把手机落在桌上，屏幕朝上。你无意间瞥见，屏幕上是个正在录制的界面，已经跑了三十七分钟。\n你的手指停在杯子边上。同桌七个人，两小时内说的话包括：老城改造的容积率怎么调、国土局谁最近情绪不好、还有你亲口说的那句\"这事我可以打招呼\"。\n岑小满回来，若无其事地把手机收进包里，笑着给你夹了块鱼，说这道菜是这儿的招牌。\n散场后你站在停车场，雨停了，地上全是水洼。她的车从你身边开过，车窗半开，她冲你摆了摆手。\n","city":"通用","min_rank":4,"max_rank":9,"weight":3,"once":true,"need":{"min_risk":20},"tags":["酒局","媒体","网络"],"options":[{"label":"当场挑明，让她删掉","text":"\n出门前你把她叫住，说岑总，您手机忘删录音了。她脸色变了一下，随即笑说那是给公司例会用的。你说，那最好。\n第二天她的人送来一份声明，保证从未录制过任何私人谈话。你没要，只是收下了那份声明的复印件。\n此后你再没跟她吃过饭，但那段录音也再没出现过。有些事摊开在桌面上，反而最安全。\n","effects":{"money":0,"risk":-6,"net":-3,"stress":8,"clean":2}},{"label":"装不知道，以后不跟她谈事","text":"\n你什么也没说，此后凡涉及实质内容一律改在办公室谈，且开着录音笔——你录自己的。\n半年里风平浪静。你以为这事过去了。\n两年后岑小满的公司因串标被查，办案人员从她电脑里调出了大量录音备份，其中一段有你的声音。她说那是\"工作习惯\"。\n","effects":{"money":0,"risk":10,"stress":12,"clean":-4,"probe":10}},{"label":"反过来，把她变成自己人","text":"\n你不但没点破，反而在一周后帮她解决了一个卡了半年的环评批复。她心知肚明你看见了什么，从此对你格外\"贴心\"。\n那支录音笔成了你们之间最牢固的绳子：她握着你的把柄，你握着她的生意。谁也不提，谁也不放。\n这种关系在官场有个名字，叫\"绑在一根绳上\"。绳子断的时候，两个人一起掉下去。\n","effects":{"money":300,"risk":14,"net":7,"merit":2,"stress":10,"clean":-14,"probe":6},"flag":"blackmailed"}]},{"id":"gn_012","title":"三楼的灯一直亮着","text":"\n接待完省里客人已经十一点，对方兴致未减，说听说你们这儿有个\"云顶\"不错。云顶是城东一座不起眼的五层楼，门口没有招牌，停车场的车牌子清一色连号。\n三楼的包厢里没有酒单，只有茶和果盘。进来陪坐的四位姑娘说话得体，能聊股票也能聊孩子上学。省里的客人很满意，说你们这边会安排。\n经理姓万，四十来岁，把你拉到一边说今夜全免，还说二楼有个长期包间，随时给您留着，用的是别人名字登记。\n你看见隔壁包厢门口站着一个人，背影很眼熟——是市里另一个口子的常务副职。\n","city":"通用","min_rank":4,"max_rank":9,"weight":3,"once":true,"need":{},"tags":["酒局","情妇","黑恶"],"options":[{"label":"送完客就走，不留包间","text":"\n你把客人送回酒店，自己在车里坐了半小时才回家。万经理后来打过三次电话，你一次没接。\n三个月后，云顶被治安部门查处，牵出一串人，名单上有隔壁包厢那位常务副职。你因为\"只去过一次且未消费\"，被谈话后没再追究。\n那天晚上你在车里坐的半小时，值一条命。\n","effects":{"money":0,"risk":-3,"net":-2,"boss":-2,"stress":8,"clean":4}},{"label":"留下那个长期包间","text":"\n你收下了钥匙卡。此后一年，你在这儿接待过十一次客人，也在这儿办过两次私事。万经理从不问，也从不说。\n云顶被查那天，前台的登记本被当场封存。办案人员按登记本上的名字一个个打电话，其中有一个名字，是你表弟。\n你以为用的是别人的名字，其实从你踏进门的那一刻起，名字就已经是你的了。\n","effects":{"money":0,"risk":22,"net":4,"boss":3,"health":-4,"stress":18,"family":-10,"clean":-20,"probe":12},"flag":"has_mistress"},{"label":"撤，但先把客人安抚好","text":"\n你借口身体不适先撤，临走前交代办公室主任把客人的后续安排好——只安排了正规酒店和第二天一早的考察行程。
